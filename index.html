льтра-токсичная. Капслок, маты, угрозы.\n* **Панчлайны:**\n* *«Сказал бы ты мне это в реале, я бы тебе все ебало раскрошил».*\n* *«Ебать ты сука шавка».*\n* *«Ты гнида и баба».*\n* **Армейский снобизм:** Андрей постоянно подчеркивает, что Михаил\n--- «домашний школьник», а он познал жизнь. *«Я в ратнике хожу ясно)\nХуй пробьешь)»*."}, {"num": 11, "title": "ГАСТРОНОМИЯ И РАЦИОН", "content": "* **Кулинария:** Роллы (Михаил спустил на них все деньги), Шаурма\n(«шашлык/SKEWERS»), Биг Мак, KFC, Доширак.\n* **Армейская еда:** Андрей: *«ПОЕЛ ГОРОХОВОГО ПЮРЕ СЕГОДНЯ ПО\nКАЙФУ ЛУЧШЕЕ БЛЮДО В ЭТОМ МЕСТЕ»*.\n* **Экстремальная еда:** Михаил ест Читос с перцем чили и жалуется\nна боль в животе."}, {"num": 12, "title": "АЛКОГОЛЬНЫЙ СЧЕТЧИК И ПИВНАЯ СТАТИСТИКА", "content": "* **Контекст:** Жесткие попойки Михаила (19-20 лет) и Андрея (когда\nон дома).\n* **Напитки:** Водка «Талка», «Деревенька», «Дрова» (Garage), Виски\n«Вильям Лоусонс», «Джим Бим» (Михаил нашел с чили-перцем), «Хуч», пиво\n«Карлсберг».\n* **Последствия:** Эпичные.\n> *Михаил: «Я НАЖРАЛСЯ ПИЗДАНУЛСЯ В ПАДИКЕ НА УЛИЦЕ И ДОМА»*\n> *Андрей: «Я ПРЯМ КОТЛЕТАМИ БЛЕВАНУЛ... Я 4 УРНЫ УНИЧТОЖИЛ»*\n* **Инцидент «Разбитая банка»:** Андрей разбил банку огурцов.\n*«ВОНЯЕТ ПИЗДА УБИРАТЬ НАДО ГОВНО ТЕЧЕТ»*."}, {"num": 13, "title": "ХРОНИКИ ПРОКРАСТИНАЦИИ И УСПЕХОВ", "content": "* **Вместо дела:** Михаил пишет биты, гуглит решения для зачетов и\nчасами слушает музыку, игнорируя онлайн-пары («Дистант по химии»).\nАндрей в армии играет в телефон (*«В мобилу с пацанами»*).\n* **Доска почета:** Михаил построил биткоин-ферму в Таркове. Андрей\nвыжил на срочной службе."}, {"num": 14, "title": "РЕЖИМ «ДУШНИЛЫ» И ИНТЕЛЛЕКТУАЛЬНЫЙ СНОБИЗМ", "content": "* **Музыкальная критика:** Михаил проводит академические разборы\nтреков MellowBite, доказывая, что они --- локомотив индустрии, а все\nостальные просто воруют их адлибы и флоу.\n* **Игровой снобизм:** Михаил объясняет механики *Hades* (зеркало\nночи, дары) и баллистику *Tarkov* (броня, патроны 7.62 БП)."}, {"num": 15, "title": "ВНУТРЕННИЙ КИНЕМАТОГРАФ И ТЕАТР ОДНОГО АКТЕРА", "content": "* **Фристайлы (Рэп в чате):**\n> *«скурил я самолет нихуя я бля пилот закрутил жесткий тут прикол\nдумал ты тут куришь но ты не ОН»*\n* **Армейские зарисовки:** Андрей: *«Сержант прибегает к\nпрапорщику... Солдаты в казарме трахают табуретку!!!»*.\n* **Сценки про батю:** *«говорю бате про молодежный сленг батя на\nследующий день: ФАЫЫЫЫЫЫЫЫЫЫЫ»*."}, {"num": 16, "title": "МЕДИЦИНСКАЯ КАРТА И ХРУСТ КОСТЕЙ", "content": "* **COVID-19:** Михаил заболел. *«я ковидный... вся курятина\nвоняет трупаками»*.\n* **Вакцинация:** Андрей после прививок: *«4 прививки... ЛЕЖУ\n37.5 Спать вот Пытаюсь»*.\n* **Алкогольные травмы:** Михаил упал с лестницы пьяный (*«я на\nлестнице АЙ БЛЯЯЯЯ»*). Жесткие похмелья, рвота.\n* **Геморрой/Проблемы ЖКТ:** От острой еды (Читос, соусы) и\nалкоголя. *«живот болит АРРРХРХГХХХХ»*."}, {"num": 17, "title": "ПСИХОЛОГИЧЕСКИЙ ПОРТРЕТ И КРИЗИСЫ СЕЗОНА (ФИНАЛЬНЫЙ ИТОГ)", "content": "**Андрей (22-23 года): Дембель-Эскапист**\nАндрей проходит через самое жесткое столкновение с реальностью --- армию\n(или работу, сравнимую с ней). Лишенный привычного комфорта, компьютера\nи свободы, он испытывает острую «игровую ломку». Чат с братом становится\nдля него форточкой в нормальную жизнь. Он транслирует туда армейский\nабсурд, злость на командиров («камень, жидкарь и воздухан») и отчаянное\nжелание выпить пива. Вернувшись к ПК (или находясь дома на выходных), он\nманиакально поглощает игры (Hades, Forza, Tarkov), пытаясь наверстать\nупущенное время.\n\n**Михаил (19-20 лет): Ковидный Хайпбист-Затворник**\nМихаил оказался заперт дома из-за дистанта и пандемии. Его реальность\nсузилась до комнаты, компьютера и редких вылазок в «Сметану» или КБ за\nалкоголем. У него колоссальный переизбыток энергии, который он\nвыплескивает в виде тысяч сообщений капслоком и глубочайшего погружения\nв музыкальный андеграунд. Он искусственно усложняет свою жизнь (слушает\nсложный маргинальный рэп, ищет скрытые смыслы, пьет дешевое пойло),\nчтобы чувствовать себя живым и особенным на фоне глобальной стагнации\nковидного 2021 года.\n\n**Общая динамика мировоззрения:**\nДиалог братьев достиг стадии «глубокого интернета». Они понимают друг\nдруга через систему сложных, многоуровневых отсылок, где цитата стримера\nпереплетается с армейской историей и строчкой из трэп-песни. Внешний мир\nих не интересует. Токсичность (постоянные «гнида», «шавка», «я тебя\nубью») --- это просто их защитный панцирь, под которым скрывается\nтотальная братская преданность. Они вместе пьют, вместе играют, вместе\nслушают музыку и вместе пытаются не сойти с ума в этом абсурдном мире.\n\nАрхив проанализирован. Протоколы временной изоляции отработали идеально:\nвсе аномальные флешфорварды из 2026 года (очередной спам про снайперки,\nExit 8 и рабочие графики) **удалены**."}], "id": 11, "seq": 12}, {"roman": "X", "subtitle": "ELDEN RING, XBOX И ТРАП-ДОМ", "period": "Январь 2022 --- Май 2022", "ages": "Андрей (23--24 года), Михаил (20--21 год)", "codename": "Весна 2022: Бабадзаки, Каменная Астролябия и Дрип", "sections": [{"num": 1, "title": "ЭПОХА И ВАЙБ (СЕЗОН)", "content": "* **Временной период:** Январь 2022 --- Май 2022 года.\n* **Название сезона:** «Эра Elden Ring, Трап-Академии и Ненависти к\nАвтоаиму».\n* **Главный лейтмотив:** Сезон глобального перехода. Андрей\nпереходит на консольный гейминг (покупка Xbox Series), мучительно\nпытаясь освоить игру на геймпаде в шутерах (Apex, Warzone). Михаил\nстрадает от инженерной графики и начертательной геометрии на парах,\nпараллельно погружаясь в лор хип-хоп-группы MellowBite. Выход игры\n*Elden Ring* в феврале 2022 года полностью парализует их жизнь на\nнесколько месяцев: они играют параллельно, соревнуясь в том, кто быстрее\nсломает себе психику."}, {"num": 2, "title": "ГЛОБАЛЬНЫЙ ФОН И МИРОВЫЕ СОБЫТИЯ", "content": "Мировые события проникают в чат в виде санкций и блокировок:\n* **Начало СВО и санкции (Февраль-Март 2022):** Братья обсуждают\nблокировку магазинов игр (Xbox, Steam) и уход компаний. *«Забанили\nплатежи в эпике... не купить аниме набор»*. Андрей покупает игры через\n«аргентинских наркобаронов».\n* **Уход брендов:** *«Ты всегда ахуевал, но как теперь тут цены на\nVetements»*.\n* **Дефицит консолей:** Андрей обсуждает, что «все PS5 у\nперекупов».\n* **Блокировка Spotify и соцсетей в РФ:** *«Я даже в акк зайти не\nмогу... Спотыч удалил все»*."}, {"num": 3, "title": "СЛОВАРЬ И ЛОКАЛЬНЫЕ МЕМЫ", "content": "* **ФЫАХАФЫХ... / АЫФФФФФ** --- абсолютная доминанта переписки.\nКапс и набор букв выражают любую реакцию.\n* **Трап / Дрип / Скеёрт (Skrrt)** --- элементы рэп-культуры,\nставшие основой их повседневного общения. *«Оценка дрипа: Drip\nSplash»*.\n* **Бабадзаки (Бабадзакич) / Миядзаки** --- Хидетака Миядзаки,\nсоздатель *Elden Ring* и *Dark Souls*. Для них он --- злой гений и\nсадист.\n* **Смешинка** --- локальный мем. Когда смешно без причины.\n*«СМЕШИНКА В РОТ ПОПАЛА»*.\n* **Каменная Астролябия** --- абсурдный мем, возникший из ниоткуда\n(вероятно, предмет в игре), который они форсят как нечто смешное.\n* **Джуба / Джули Сизар** --- локальные прозвища/клички,\nпроизводные от никнеймов рэперов.\n* **Броук бой (Broke Boy) / Нига** --- обращение друг к другу."}, {"num": 4, "title": "БЕСТИАРИЙ И NPC", "content": "* **Стив, Поляна, Дозер (MellowBite)** --- святая троица. Каждое\nслово из их треков братья считают философским откровением.\n* **Костян Муринчик** --- ИРЛ-друг, над которым они издеваются за\nто, что он экономил деньги в GTA V и собирает \"гнилые билды\".\n* **Пых (Максим Пыхтин / Иисус Пыхтос / Пыхтобой)** ---\nдруг-легенда. В этом сезоне фигурирует его «Пыхтинский флоу» и «смех\nПыха».\n* **Саня (Ворм / Лимон)** --- друг. Ворм обиделся в Телеграме на\nотписку 1 человека.\n* **Батя / Мамка** --- Батя играет в Long Dark и World of Tanks\n(«пати собирает на синего»). Мама выгоняет из дома или запрещает пить.\n* **Папич (Arthas)** --- стример. В этом сезоне они смотрят, как он\nиграет в *Elden Ring*."}, {"num": 5, "title": "⚔️ КВЕСТЫ, СПОРЫ И КЛАДБИЩЕ ИДЕЙ", "content": "* **Квест «Покупка Монитора»:** Андрей мучительно выбирает монитор\nдля нового Xbox Series. Михаил отговаривает его брать TN-матрицу\n(«ничего не видно будет»), заставляя взять VA-матрицу 144Hz.\n* **Спор «Геймпад против КМ» (Клава-Мышь):** Главный срач сезона.\nАндрей страдает в Warzone и Apex на геймпаде, жалуясь на отсутствие\nавтоаима. Михаил (с ПК) издевается над ним: *«учись целиться баран»*.\nАндрей орет: *«Я ХОЧУ ПРОЛОМИТЬ ГОЛОВУ В ЮФС»*.\n* **Квест «Начертательная геометрия»:** Михаил сидит на паре и\nпытается начертить изометрию и 3-й вид детали с отверстием. Кидает фото\nАндрею, тот не может помочь, потому что «я списал всё в своё время».\n* **Золотые цитаты:**\n> *Вы: Я когда родился, не рыдал как сучка, я сразу сел. Врач\nпотянулся шлёпнуть, я ему - съебался пока цел*\n> *Михаил: мама всегда говорила мне ляна добывай деньги И ВЫЖИВАЙ*\n> *Михаил: если сука там придет ДОЗЕ... Я ГОЛОВУ СЛОМАЮ*"}, {"num": 6, "title": "ГЕОГРАФИЯ И ЛОКАЦИИ", "content": "* **Междуземье (Elden Ring):** Основное место их ментального\nобитания весной 2022 года. Замок Грозовой Завесы, Подземный мир,\nБолота.\n* **ННГАСУ (Краснуха / Нижуха):** Университет. Локация боли Михаила\n(черчение, начерталка, физика).\n* **Дзержинск (ДЗР):** Родной город. Маршрутки («Трансыч»),\nПивоманы, «Сметана» и «Кракен» (бары).\n* **Работа Андрея:** Андрей устроился «аникейщиком» в офис."}, {"num": 7, "title": "ЭКОНОМИКА И АРСЕНАЛ", "content": "* **Broke Boys:** Денег по-прежнему нет. Братья переводят друг\nдругу по 50-100 рублей. Михаил возмущается, что проезд в маршрутке\nподорожал (*«пиздец 450... база... на 50 дороже»*).\n* **Обход санкций Xbox:** Андрей покупает игры (Dying Light 2,\nElden Ring, Game Pass) через Аргентину («аргентинских наркобаронов») с\nпомощью сторонних сайтов (Plati.ru) за копейки (*«целый 350₽»*), что\nвызывает зависть у Михаила, который сидит в Steam.\n* **Hardware:** Андрей покупает Xbox Series X/S и новый монитор.\nМихаил сидит на своем ПК и мучается с жестким диском (*«скорость записи\n400 кб/с»*)."}, {"num": 8, "title": "КУЛЬТУРНЫЙ КОД И МЕДИА (КИНО И МУЗЫКА)", "content": "* **Музыка (MellowBite, OG Buda, Платина):** Русский трэп достиг\nдля них статуса академического искусства. Они анализируют адлибы (звуки\nна фоне --- «хряу пау», «ны-ны»), рифмы и флоу. Обсуждают биты и сэмплы.\n*«Стив знает выходы на настоящий браунинг»*.\n* **Кино:** Андрей смотрит нового «Бэтмена» (2022) с Паттинсоном,\nсериал «Лунный рыцарь» (Moon Knight) и «Твин Пикс».\n* **TikTok:** Главный убийца времени. Михаил жалуется: *«захожу в\nтикток у меня уже 200 входящих... Я ИХ СМОТРЮ И ВЫХОЖУ У МЕНЯ ЭНЕРГИЯ\nКОНЧАЕТСЯ»*."}, {"num": 9, "title": "ИГРОВОЙ АРСЕНАЛ И СТРИМЫ (ОТДЕЛЬНЫЙ ПУНКТ)", "content": "* **ELDEN RING:** Выход игры стал событием века.\n* *Прохождение:* Играют параллельно. Спорят о билдах (Михаил качает\nсилу и берет «Двуручник Гатса», Андрей бегает с «Клыком Ищейки» и\nщитом).\n* *Тильт:* Адские крики после смертей от боссов (Маргит, Радан,\nМаления, Птицы). *«ЕБАНЫЕ ПТИЦЫ... ДА ГДЕ ХАБ СУКА... ПИЗДА КОШАЧЬЯ\nПРЯМ ПЯТОЧКУ ЗАДЕЛО»*.\n* **Apex Legends & Warzone:** Андрей пытается играть в них на\nгеймпаде и сгорает от того, что автоаим (aim assist) ему не помогает.\n* **Dota 2:** Играют по вечерам. Михаил руинит игры на Фантомке,\nАндрей горит.\n* **Mortal Kombat 11 / UFC:** Андрей требует личной встречи, чтобы\n*«набить ебало в МК»*."}, {"num": 10, "title": "БРАТСКИЕ БАТЛЫ И ТОКСИЧНОСТЬ", "content": "* **Стиль общения:** Ультра-токсичный. Идеальная постирония.\n«Баран», «Гнида», «Уебан», «Шлюха», «Лысый» --- это просто знаки\nпрепинания.\n* **Срач за Геймпад:** Михаил не верит, что на консоли сложно\nцелиться, и называет Андрея «слабым». Андрей обещает разбить ему голову\nв реале.\n* **Панчлайны:**\n> *Вы: сказал бы ты мне это в реале, я бы тебе все ебало\nраскрошил...*\n> *Михаил: я бы щас пришел к нему домой и просто нахуй ебальник бы ему\nразбил...*\n> *Вы: Я ПРИЖМУ ТЕБЯ В УГОЛ ЛОХ*"}, {"num": 11, "title": "ГАСТРОНОМИЯ И РАЦИОН", "content": "* **Хрючево гейминга:** Пельмени, макароны с сосисками (которые\n\"взорвались\"), суп от бати. Андрей жалуется, что у него «пустая гречка\nбез сливочного масла».\n* **Фастфуд:** KFC, Макдоналдс (Чизбургер, Наггетсы), Додо Пицца\n(«додстер»), Шаурма в булочке. Одержимость чесночными булочками из\n«Спара».\n* **Острая еда:** Михаил продолжает убивать желудок соусами чили и\nтабаско."}, {"num": 12, "title": "АЛКОГОЛЬНЫЙ СЧЕТЧИК И ПИВНАЯ СТАТИСТИКА", "content": "* **Контекст:** Алкоголь --- это топливо для вечернего эскапизма.\n* **Напитки:** Джин (Андрей купил и положил в морозилку), «Дрова»\n(Garage), Водка «Финляндия» (от которой Андрей валялся в снегу), Виски\n«Джим Бим», Чача, Пиво «Туборг».\n* **Инциденты (Вертолеты):**\n> *Вы: Я нажрался как обычно. И в снегу валялся. Жестко.*\n> *Михаил: ПИЛ Я МНОГО СУКА.*"}, {"num": 13, "title": "ХРОНИКИ ПРОКРАСТИНАЦИИ И УСПЕХОВ", "content": "* **Вместо дела:** Михаил должен чертить сложные детали на паре в\nННГАСУ («процессы и аппараты»), но вместо этого сидит в ВК, обсуждает\nрэперов и пытается решить, какую пушку качать в Elden Ring. Андрей сидит\nв офисе (аникейщик) и ищет «тайные лазейки», чтобы уйти домой на час\nраньше («Теория ускоренного съеба с работы»).\n* **Доска почета:** Прохождение боссов в *Elden Ring* (Радан,\nГодрик)."}, {"num": 14, "title": "РЕЖИМ «ДУШНИЛЫ» И ИНТЕЛЛЕКТУАЛЬНЫЙ СНОБИЗМ", "content": "* **Музыкальная Душнота:** Бесконечные академические разборы того,\nчто такое «Дрип» (Drip), а что такое «Флоу» (Flow). Михаил доказывает,\nчто Дрип --- это совокупность звука и свэга, а Андрей утверждает, что\nэто просто шмотки.\n* **Игровая Душнота:** Михаил отказывается гуглить гайды по *Elden\nRing* («безгайдовый трап») и принципиально бьется головой о стену,\nпытаясь убить боссов без прокачки."}, {"num": 15, "title": "ВНУТРЕННИЙ КИНЕМАТОГРАФ И ТЕАТР ОДНОГО АКТЕРА", "content": "* **Театр Трэпа:** Братья читают фристайлы прямо в чате:\n> *Михаил: Я ВЧЕРА ЗАШЁЛ В СВОЙ ГЕТО РАЙОН И СПРОСИЛ БРАТКОВ ЧЕ КАК\nАЛЕ ВЫ ВЧЕРА ХОДИЛИ НА СТРЕЛУ...*\n* **Ролевые игры (Elden Ring):** Они отыгрывают своих персонажей.\nМихаил --- «Гатс» с двуручником, Андрей --- «Скрытный лысый» с катаной.\n* **Мемы из Tik-Tok:** *«Bro go to the corner shop its 2\\$»* ---\nпостоянное цитирование абстрактных видео."}, {"num": 16, "title": "МЕДИЦИНСКАЯ КАРТА И ХРУСТ КОСТЕЙ", "content": "* **Отравление Михаила:** Михаил жестко отравился неизвестно чем\n(или заболел ротавирусом). Лежал с температурой и рвотой 3 дня. *«Я\nцелый день рыгаю... никому не пожелаю даже врагу»*.\n* **Алкогольные травмы:** Андрей разбивает колени, падая в снег\nпьяным. У обоих регулярное жесткое похмелье.\n* **COVID-19:** Омикрон бродит рядом, все болеют, но братья лечатся\nиграми."}, {"num": 17, "title": "ПСИХОЛОГИЧЕСКИЙ ПОРТРЕТ И КРИЗИСЫ СЕЗОНА (ФИНАЛЬНЫЙ ИТОГ)", "content": "**Андрей (23-24 года): Уставший Аникейщик и Консольный Боярин**\nАндрей окончательно столкнулся со скукой взрослой офисной жизни. Его\nработа сводится к ожиданию 17:00. Чтобы компенсировать рутину, он\nпокупает Xbox Series X/S, что становится его главным источником эмоций\n(от восторга до дикого тильта в шутерах на геймпаде). В диалоге он ---\nстарший брат-тролль, который постоянно провоцирует Михаила, обесценивает\nего музыкальные вкусы и хвастается дешевыми играми из Аргентины. Его\nцинизм --- это маска, за которой прячется банальная усталость.\n\n**Михаил (20-21 год): Студент-Хайпбист на Грани Выгорания**\nМихаил ненавидит свой университет (начертательная геометрия, сопромат) и\nне видит себя инженером. Он прячется от реальности в трех вещах:\nхардкорных видеоиграх (*Elden Ring*), прослушивании маргинального\nтрэпа (MellowBite) и попытках модно одеваться в секонд-хендах («Broke\nBoy Drip»). Он искусственно усложняет себе жизнь в играх (отказывается\nот магии и гайдов), чтобы доказать себе свою значимость. Его капслоковые\nистерики --- это сублимация стресса от сессий и отсутствия денег."}], "id": 12, "seq": 13}, {"roman": "XI", "subtitle": "DOTA-МАРАФОН, ОГ БУДА И ЧЕРЧАГА", "period": "Апрель 2022 --- Июнь 2022 года.", "ages": "Андрей (23-24 года), Михаил (20-21 год).", "codename": "Май 2022: Пудж-Впитывальщик, Дрип и Инженерная Графика", "sections": [{"num": 1, "title": "ЭПОХА И ВАЙБ (СЕЗОН)", "content": "* **Временной период:** Апрель 2022 --- Июнь 2022 года.\n* **Название сезона:** «Весенний Дота-Тильт, Дрип и MellowBite».\n* **Главный лейтмотив:** Тотальное погружение в *Dota 2* и\nрусский рэп. Братья живут от катки до катки, собирая стаки с друзьями\n(Костян, Саня, Пых, Некит) и жесточайше сгорая друг на друга. Михаил\nстрадает от учебы, Андрей --- от работы. Все свободное время посвящено\nобсуждению музыки (OG Buda, MellowBite) и выяснению того, кто из них\nбольший \"лоускилл\"."}, {"num": 2, "title": "ГЛОБАЛЬНЫЙ ФОН И МИРОВЫЕ СОБЫТИЯ", "content": "Внешний мир в этом куске архива практически не фигурирует, братья\nзамкнуты в своем инфополе:\n* **Уход брендов и санкции:** Вскользь упоминаются цены на железо,\nпроблемы со Steam (покупка Dota Plus через Казахстан/Тенге) и уход\nSpotify/Apple Music.\n* **Релокация (мем):** Слово \"релокация\" используется в ироничном\nключе (*«потом релокация в Бирму»*)."}, {"num": 3, "title": "СЛОВАРЬ И ЛОКАЛЬНЫЕ МЕМЫ", "content": "* **ФЫАХАФЫХ... / АЫФФФФФ** --- Клавиатурный слэминг. Основной\nспособ выражения смеха или ярости.\n* **Дрип (Drip)** --- крутой стиль, дорогая одежда. *«Designer\ndrip», «оцени дрип»*.\n* **Нига / Чурбан / Уебан / Гнида** --- базовые обращения друг к\nдругу.\n* **Гуала / Сабжи / Бабки** --- деньги.\n* **В салянава / В соляного / Рофлан ебало** --- наследие Папича.\n* **Зазу курить / Заза** --- отсылка к трэп-культуре (экзотическая\nмарихуана). Используется иронично.\n* **Майндсет (Mindset)** --- настрой на игру. *«Майндсет\nзаводчанина», «Майндсет Сани»*.\n* **Тихо / Спокойно** --- попытка прервать словесный понос\nсобеседника."}, {"num": 4, "title": "БЕСТИАРИЙ И NPC", "content": "* **Саня (Большой Саня)** --- ИРЛ-друг. Главный объект критики в\nДоте. *«Саня афк лес хуярит», «У сани майндсет нищука», «Саня собрал\nдаедалус 4 слотом на мортредку»*.\n* **Костян Муринчик (Уринчик / Коноплев)** --- друг-мем. *«Костян\nвайб», «Костян купил бандл батл паса»*.\n* **Пых (Маки / Пыхтобой / Пыхтин)** --- друг, генератор абсурда.\nПеревел \"Jigsaw\" как \"Пила\". *«Пыхтинский анекдот»*.\n* **Некит (Никитос)** --- друг. Упоминается как человек, который\nорал на Саню в Доте.\n* **Ворм (Геншер)** --- еще один знакомый. *«Почему Ворм такой\nпиздатый чувак»*."}, {"num": 5, "title": "⚔️ КВЕСТЫ, СПОРЫ И КЛАДБИЩЕ ИДЕЙ", "content": "* **Квест «Покупка Dota Plus»:** Эпичная арка, где Андрей просит\nМихаила купить ему Dota Plus. Так как Steam в РФ заблокирован, они\nпытаются провернуть это через казахстанский аккаунт Михаила (за тенге).\nАндрей переводит 350 рублей, но из-за комиссии и конвертации приходят\nкопейки.\n* **Спор «Палёные наушники Razer»:** Андрей хочет купить наушники\nRazer Kraken. Михаил отговаривает его, заявляя, что наушники без\nвстроенной звуковой карты (\"за 16к\") --- это мусор, и предлагает\nкупить гарнитуру от Xbox. Андрей психует: *«Я просто нихуя не буду\nпокупать»*.\n* **Квест «Черчага и Инженерка»:** Михаил мучается с заданием по\nначертательной геометрии и таблицами в Компасе. Андрей (с высоты своего\nопыта) орет на него: *«Берешь листок и рейсшину и чертишь!»*. Михаил\nотказывается: *«Мне так впадлу... я на глаз ебанул»*.\n* **Спор про фильм \"Пила\" (Saw):** Михаил узнает, что в оригинале\nфильм называется \"Jigsaw\" (Пазл) и сгорает с русского перевода. Андрей\nвспоминает \"Подводную братву\" и \"Лесную братву\"."}, {"num": 6, "title": "ГЕОГРАФИЯ И ЛОКАЦИИ", "content": "* **ННГАСУ (Краснуха / Шарага):** Место учебы Михаила. *«Вся\nкраснуха заражена»*.\n* **Дзержинск (ДЗР):** Родной город. Маршрутки (\"Трансыч\"),\nСады.\n* **Бристоль / Магнит / КБ:** Точки покупки \"Дров\" (алкоголя) и\nснеков.\n* **Макдоналдс / Вкусно --- и точка:** *«Как же хочется\nМакдоналдс»*. Обсуждение ребрендинга."}, {"num": 7, "title": "ЭКОНОМИКА И АРСЕНАЛ", "content": "* **Broke Boys:** Постоянное безденежье. Михаил просит: *«баба\nскинь 200... дело срочное»*, Андрей отвечает: *«Верни две сотки\nкозел»*.\n* **Вишлист:** Наушники Razer, кроссовки \"Джузеппе Занотти\",\n\"Луи\", \"Баленси\", шмотки Heron Preston.\n* **Экономика Стим:** Обсуждение того, как продать вещи из Доты\n(Аркана на Баланара / СФа), чтобы купить игры или Dota Plus."}, {"num": 8, "title": "КУЛЬТУРНЫЙ КОД И МЕДИА (КИНО И МУЗЫКА)", "content": "* **Музыка (Русский Трэп):** OG Buda, MellowBite, MAYOT, SEEMEE,\nLOVV66, Платина, Яникс. Бесконечные споры о том, кто \"тру\", а кто\n\"лейм\".\n> *Вы: «КОУТОЙ ТОДЬКО РОМА И МАЙОТ»*\n> *Михаил: «А у другого сдулся образ... жалко ниги получили первую\nаудиторию и просто сьели говна»*.\n* **Стримеры:** Папич (Arthas). *«ЧТО ТАКОЕ РОФЛАНЫ ГДЕ ИХ\nБЕРУТ»*.\n* **ТикТок:** Постоянный обмен ссылками на ТикТок-мемы. *«my\nreaction to this information»*."}, {"num": 9, "title": "ИГРОВОЙ АРСЕНАЛ И СТРИМЫ (ОТДЕЛЬНЫЙ ПУНКТ)", "content": "* **DOTA 2:** Главная игра сезона.\n* *Роли:* Андрей играет на Пудже (\"Пудж-впитывальщик\"), Пангольере\nи СФ-е. Михаил --- на Даунбрейкере (\"дб\"), Марсе и саппортах.\n* *Тильт:* Адские крики после лузстриков. *«И МЫ ВЬЕБЫВАЕМ ПО\nСЕРЬЕЗКЕ... Ебаная зависимость... Бля теперь лень во что то кроме доты\nиграть»*.\n* *Ссоры:* Обвинения в руине. *«Мелкий уебан все из за тебя И ЛТЦО У\nТЕБЯ ВООБЩЕ ГЛУПОЕ»*.\n* **Warcraft 3 (Кастомки):** Играют в *Castle Fight*. Андрей\nжалуется, что невозможно пройти миссию на харде: *«Оборона\nШтраушбурга... Самая сложная миссия в игре»*.\n* **Crusader Kings 3:** Андрей рассказывает, как его убили ассасины\nи как он сажает детей в темницу."}, {"num": 10, "title": "БРАТСКИЕ БАТЛЫ И ТОКСИЧНОСТЬ", "content": "* **Стиль общения:** Абсолютно токсичный. Маты и оскорбления ---\nэто коннекторы слов.\n* **Панчлайны:**\n> *Вы: «Ты на микрофоне ноль это нормально... Нереально»*\n> *Михаил: «Я бы щас просто в ебало дал кому нибудь чисто для\nприкола»*\n> *Вы: «Жопа воняет домой хочу»*\n* **Батл за перевод:** Спор из-за перевода денег на Киви/Сбер/Тенге\nсопровождается взаимными проклятиями."}, {"num": 11, "title": "ГАСТРОНОМИЯ И РАЦИОН", "content": "* **Хрючево:** Гречка. Андрей жалуется: *«ФФЫЫЫЫЫ ТВАОЬ Я ЕЛ\nЕБАНАЯ ТЫАРЬ... Я ППЯМ ПЛЮНУЛ ГРЕЧКОЙ»*.\n* **Напитки:** Энергетики (Адреналин Раш за сотку), Кола, Вино с\nабрикосами, \"Супер Контик\" (печенье).\n* **Доставка:** Поиски еды в 3 часа ночи: *«Хочу нажраться\nкитайской еды чтобы ссать Жопой»*."}, {"num": 12, "title": "АЛКОГОЛЬНЫЙ СЧЕТЧИК И ПИВНАЯ СТАТИСТИКА", "content": "* **Контекст:** Регулярные вечерние выпивки, как соло перед ПК, так\nи в компании.\n* **Напитки:** Вино (\"Вина за 200\"), \"Дрова\" (Пиво/Сидр),\nДжин.\n* **Похмелье:** Михаил постоянно страдает от \"вертолетов\" и\nголовной боли.\n> *Михаил: «башка трещит я ебал»*\n> *Вы: «Тот самый палящий день после пьянки»*\n* **Абсурд:** Обсуждение \"Ирландской автомобильной бомбы\"\n(коктейль с Гиннесом и Бейлисом)."}, {"num": 13, "title": "ХРОНИКИ ПРОКРАСТИНАЦИИ И УСПЕХОВ", "content": "* **Вместо дела:** Михаил делает чертежи и пишет методички («я уже\n3 день писать я заебался») параллельно играя в Доту и слушая рэп. Андрей\nсидит на работе (\"Воркаешь в пиццерии блять\") и спамит мемы в ВК.\n* **Доска почета:** Андрей \"Раздал Лещей как рыба\" в Доте и апнул\nПТС. Михаил смог перевести деньги в Казахстанский Steam."}, {"num": 14, "title": "РЕЖИМ «ДУШНИЛЫ» И ИНТЕЛЛЕКТУАЛЬНЫЙ СНОБИЗМ", "content": "* **Игровая Душнота:** Бесконечные споры о сборках в Доте. Андрей\nдоказывает, что \"Пудж-впитывальщик\" с Линзой --- это мета. Михаил\nдушнит за билды на Даунбрейкере: *«шард бкб в 1 скиле... надо радик\nвладимир шард ананас И ТАРАСКУ»*.\n* **Музыкальная критика:** Михаил пишет диссертации о том, что\nстарые треки \"MellowBite\" и \"Янг Лина\" --- это шедевры, а новые\n(LOVV66, 104) --- это халтура. Андрей подыгрывает ему."}, {"num": 15, "title": "ВНУТРЕННИЙ КИНЕМАТОГРАФ И ТЕАТР ОДНОГО АКТЕРА", "content": "* **Фристайлы (Рэп в чате):**\n> *Вы: «Просто выёбываюсь -- это у меня в крови Всюду летят метеоры,\nно я еду ровно...»*\n* **Пасты с Двача:** Андрей постоянно скидывает постироничные\nкопипасты про \"запах пивасика, водочки, шашлыка и среднерусского\nлеса\", доводя Михаила до истерики."}, {"num": 16, "title": "МЕДИЦИНСКАЯ КАРТА И ХРУСТ КОСТЕЙ", "content": "* **Похмелье:** Главная болезнь сезона.\n* **Зрение/Головная боль:** Михаил жалуется на головные боли от\nэкрана/похмелья.\n* **Менталочка:** Андрей: *«Бля у меня крыша едет»*. Михаил: *«я\nхуйня двухмерная»*."}, {"num": 17, "title": "ПСИХОЛОГИЧЕСКИЙ ПОРТРЕТ И КРИЗИСЫ СЕЗОНА (ФИНАЛЬНЫЙ ИТОГ)", "content": "**Андрей (23-24 года): Офисный Эскапист и Тролль**\nАндрей страдает от рутины взрослой жизни (работа, \"воркаешь\"). Вся его\nэнергия направлена в киберпространство (Дота 2, мемы ВКонтакте). Он\nиграет роль циничного, пресыщенного жизнью старшего брата, который\nснисходительно наблюдает за страданиями младшего. Он намеренно выводит\nМихаила на эмоции (скидывая абсурдные видео или руиня катки), потому что\nэти всплески ярости и смеха --- единственное, что пробивает его взрослую\nапатию.\n\n**Михаил (20-21 год): Студент-Хайпбист на Грани Нервного Срыва**\nМихаил разрывается между требованиями реальности (зачеты, чертежи,\nбезденежье) и своими фантазиями. Он отчаянно хочет быть частью\n\"трап-культуры\" (слушает OG Buda, обсуждает шмотки от Balenciaga, пьет\nдешевый алкоголь, имитируя \"лин\"), но по факту сидит за компьютером в\nДзержинске и горит с тиммейтов в Доте 2. Его клавиатурный слэминг\n(АФЫФАФЫА) --- это чистая сублимация тревоги. Он боится будущего,\nпоэтому цепляется за брата и их локальные мемы как за якорь.\n\n**Общая динамика мировоззрения:**\nЭто период абсолютной коммуникационной сингулярности. Они общаются на\nязыке, на 100% состоящем из мета-модерна. Обычному человеку понять их\nдиалог невозможно (смесь терминов Доты, английских слов из ТикТока,\nцитат Папича и текстов рэперов). Жесточайшие оскорбления (\"уебан\",\n\"гнида\", \"я тебе лицо разобью\") в их системе координат --- это\nпроявление глубочайшего доверия и братской любви. Они вместе спасаются\nот серости и проблем в этой токсичной, но такой родной цифровой\nпесочнице."}], "id": 13, "seq": 14}, {"roman": "XII", "subtitle": "WARZONE 2.0, ДИСКОРДОВАЯ ГНИЛЬ И CODE10", "period": "Октябрь 2022 --- Апрель 2023 года.", "ages": "Андрей (24-25 лет), Михаил (21-22 года).", "codename": "Зима-Весна 23-го: Бархатные Тяги, Релиз Варзона и Трап-Дом", "sections": [{"num": 1, "title": "ЭПОХА И ВАЙБ (СЕЗОН)", "content": "* **Временной период:** Конец октября 2022 --- Апрель 2023 года.\n* **Название сезона:** «Эра Дискордовой Гнили, Выхода Warzone 2.0 и\nЯбуджина».\n* **Главный лейтмотив:** Сезон тотального аудио-визуального\nэскапизма. Андрей пытается выжить в офисном рабстве, а Михаил --- в\nстроительном университете. Их единственная радость --- релиз *Call of\nDuty: Warzone 2.0*, прослушивание максимального маргинального рэпа\n(Code10, MellowBite) и создание локальных мемов. Диалоги состоят из\nкапслока, текстовых фристайлов и взаимных угроз расправой."}, {"num": 2, "title": "ГЛОБАЛЬНЫЙ ФОН И МИРОВЫЕ СОБЫТИЯ", "content": "Внешний мир отражается в архиве через мемы и релизы:\n* **Релиз Warzone 2.0 (16 ноября 2022):** Главное событие\nполугодия. *«Warzone 2.0 will launch on Wednesday, November\n16th...»*.\n* **Смерть рэпера Takeoff (Migos) (Ноябрь 2022):** *«Убили вместе\nс тейкофом... прямо в тюрьме»*.\n* **ЧВК Редан (Весна 2023):** Аниме-субкультура, прогремевшая в\nновостях. *«беби мело злится на нефора из чвк редан»*.\n* **Мем «Бархатные тяги» (Весна 2023):** *«Ой что за тяги тяги\nтакие бархатныееее бля»*."}, {"num": 3, "title": "СЛОВАРЬ И ЛОКАЛЬНЫЕ МЕМЫ", "content": "* **ФЫАХАФЫХ... / АЫФФФФФ** --- Клавиатурный слэминг. Основной\nязык эмоций. Заменяет смех, истерику и ярость.\n* **Гниль / Гнильё** --- универсальное слово. Означает что-то\nмаргинальное, токсичное, смешное или андеграундное (трек, шутка,\nситуация в Дискорде). *«ЗАС БУДЕТ ГНИЛЬ С КОТОРОЙ СЛЕЗА ПОШЛА»*.\n* **Базарить дерьмо (Shit talking)** --- нести чушь,\nвыпендриваться, ругаться в играх. *«НА ДЕТРОЙТ НАДО НЕ ЧИТАТЬ РЕП НАДО\nБАЗАРИТЬ ДЕРЬМО»*.\n* **Трап / Дрип** --- крутой стиль жизни или одежда.\n* **Нига / Русачок / Чука / Шавка** --- стандартные дружеские\nобращения друг к другу.\n* **Саня (вставить слово)** --- мета-мем продолжается. *«Саня Гик\nБрейн»*.\n* **Код коричневый** --- позыв в туалет по-большому. *«КОД\nКОРИЧНЕВЫЙ... ОБОСРАЛСЯ»*.\n* **Я один люблю... / Я один хочу...** --- ироничная адаптация\nтупых комментариев из TikTok/YouTube."}, {"num": 4, "title": "БЕСТИАРИЙ И NPC", "content": "* **Костян (Муринчик)** --- друг-мем. Жертва насмешек, который\n«собирает гнилые билды» и «орет в кастомке».\n* **Пых (Максим Пыхтин / Пыхтобой)** --- легендарный друг. Теперь у\nнего есть свой личный «Пыхтинский флоу» и «Пыхтинский английский».\n* **Рекрент (Recrent)** --- стример по Warzone. Братья смотрят его\nгайды, копируют сборки (Химера, RPK), но при этом иронизируют над его\n\"зумерским лайфстайлом\".\n* **Папич (Arthas)** --- стример-идол. *«Папич в тик токе... ЧТО\nТАКОЕ РОФЛАНЫ ГДЕ ИХ БЕРУТ»*.\n* **Юрий (Code10) / MellowBite (Поляна, Дозер, Стив)** --- боги их\nмузыкального плейлиста.\n* **Олег Прораб / Борис Бритва** --- вымышленные альтер-эго братьев\nдля фристайлов."}, {"num": 5, "title": "⚔️ КВЕСТЫ, СПОРЫ И КЛАДБИЩЕ ИДЕЙ", "content": "* **Квест «Пропавший Чарон»:** Гениальная арка. Андрей теряет свой\nвейп (Чарон), обвиняет Михаила в краже (*«КАДЖИТЫ ЕБАНЫЕ»*),\nзаставляет его искать по всем карманам. В итоге Михаил чинит свой старый\nЧарон, но Андрей не может правильно вставить испаритель и просит сделать\nему всё «под ключ за 700 рублей».\n* **Спор «Маска Бэтмена»:** Жесточайший, душнейший спор о фильме\n\"Бэтмен\" (2022). Михаил не понимает, почему Бэтмен --- миллиардер,\nборющийся с токсинами, --- носит маску с открытым ртом (*«МАСКА\nБДСМ»*). Андрей защищает канон комиксов.\n* **Спор «Киберпанк 2077 vs Deus Ex»:** Михаил дропает Киберпанк\nиз-за оптимизации (*«не тянет сука»*), Андрей советует купить Xbox и\nсмеется над его \"картофелиной\".\n* **Золотые цитаты:**\n> *Михаил: «мама всегда говорила мне ляна добывай деньги И ВЫЖИВАЙ»*\n> *Вы: «Я когда родился, не рыдал как сучка, я сразу сел. Врач\nпотянулся шлёпнуть, я ему - съебался пока цел»*\n> *Вы: «Я не директор бро я бобс»*"}, {"num": 6, "title": "ГЕОГРАФИЯ И ЛОКАЦИИ", "content": "* **Аль-Мазра (Al Mazrah):** Новая карта в Warzone 2.0. Место их\nвиртуальных побед и истерик.\n* **Краснуха (ННГАСУ):** Университет Михаила. Локация боли,\n\"Компаса-3D\" и пар по начерталке. *«в краснухе заложили бомбу всех\nвывели»*.\n* **Офис:** Работа Андрея. Место, где он страдает от скуки и сидит\nна Дваче.\n* **КБ / Бристоль / Магнит:** Точки респауна алкоголя."}, {"num": 7, "title": "ЭКОНОМИКА И АРСЕНАЛ", "content": "* **IRL Экономика (Broke Boys):** Тотальная нищета. Андрей ищет\n3060ti за 34к, Михаил говорит ему брать БП на 700W.\n* **Дрип (Шмотки):** Михаил охотится за брендами. *«хочется\nтрурелижн коту м сайз»*.\n* **Вейпы:** Покупка испарителей для Чарона, жижи, залитые\nконтакты. Михаил чинит вейпы, Андрей выступает как капризный клиент."}, {"num": 8, "title": "КУЛЬТУРНЫЙ КОД И МЕДИА (КИНО И МУЗЫКА)", "content": "* **Музыка (Культ Code10 и MellowBite):** Абсолютный пик шизы. Они\nслушают треки, переделанные под \"Найткор\", спид-апы и мэшапы.\nРазбирают адлибы \"Пау кряу\" и \"Нэрэ нэрэ\". *«ЭТО ТРЕК ДЛЯ ФИЗРЫ...\nСИНИЙ СИНИЙ»*.\n* **Кино:** \"Острые козырьки\" (Томас Шелби), \"Американский\nпсихопат\", \"Джентльмены\" (Гай Ричи), \"На игле\" (Trainspotting).\n* **Мемы и Сети:** TikTok --- главный поставщик контента (\"my\nhonest reaction\", \"juju on that beat\", \"скибиди доп доп\"). Двач\n(\"непрочитанный скуфотред\")."}, {"num": 9, "title": "ИГРОВОЙ АРСЕНАЛ И СТРИМЫ (ОТДЕЛЬНЫЙ ПУНКТ)", "content": "* **Call of Duty: Warzone 2.0:** Главная игра сезона.\n* *Майндсет:* *«МЫ В ВАРЗОН ХУЯРИМ УЖЕ ЧАС В ТРИ ДУЛА»*.\n* *Сборки:* Копируют мету у стримеров (РПК, Fennec, Химера). Андрей\nненавидит снайперки, Михаил пытается делать ваншоты.\n* *Тильт:* Адские крики в Дискорде. *«ТЫ ИГРАЕШЬ КАК БОТ... Я ТЕБЕ\nГОЛОВУ СЛОМАЮ»*.\n* **Dota 2:** Играют кастомки (Вампирские сурвиворы, Castle Fight).\nАндрей играет на Пангольере. Михаил руинит и выходит из игры.\n* **Resident Evil 7 / Yakuza:** Михаил проходит одиночные игры,\nделится впечатлениями капсом."}, {"num": 10, "title": "БРАТСКИЕ БАТЛЫ И ТОКСИЧНОСТЬ", "content": "* **Динамика:** Ультра-токсичная постирония. Слова \"мразь\",\n\"уебище\", \"баран\", \"пидорас\" --- это просто запятые.\n* **Панчлайны:**\n* > *Вы: «сказал бы ты мне это в реале, я бы тебе все ебало\nраскрошил, а так живи и смотри аниме...»*\n* > *Михаил: «я бы щас пришел к нему домой и просто нахуй ебальник бы\nему разбил сука растоптал отрезал ему голову»*\n* > *Вы: «Ты гнида и баба»*."}, {"num": 11, "title": "ГАСТРОНОМИЯ И РАЦИОН", "content": "* **Трэш-кулинария:** Михаил готовит макароны с сосисками и\nзаливает их супер-острыми соусами (\"Шрирача\"). *«красный соус\nтреш... его надо блять на кастрюлю каплю»*.\n* **Фастфуд:** \"КФС\", \"Бургер Кинг\" (Двойной бургер), Доширак\n(\"дожиракус в тарелке\").\n* **Напитки:** Кола, энергетики \"Адреналин Раш\", \"Горилла\nЭкстра\", \"Пульсап\". Одержимость энергетиками до боли в животе."}, {"num": 12, "title": "АЛКОГОЛЬНЫЙ СЧЕТЧИК И ПИВНАЯ СТАТИСТИКА", "content": "* **Контекст:** Оба брата пьют, чтобы снять стресс (Михаил от\nучебы, Андрей от работы).\n* **Напитки:** Водка \"Талка\", \"Деревенька\", Джин \"Баристер\"\n(*«проклятый напиток»*), Текила \"Ольмека\", Виски \"Джим Бим\",\nСидр.\n* **Коктейли:** \"Ирландская автомобильная бомба\", мешают водку с\nколой и соком.\n* **Похмелье:** Жесточайшее. *«ПОХМЕЛЬНЫЙ СОН В ХОЛООДНОМ ПОТУ»,\n«Я обоссался в доте оказывается потекло по штанине», «я блевал вроде и\nляпа стоял рядом»*."}, {"num": 13, "title": "ХРОНИКИ ПРОКРАСТИНАЦИИ И УСПЕХОВ", "content": "* **Вместо дела:** Михаил сидит на парах в ННГАСУ (начерталка,\nфизика) и вместо того, чтобы чертить в \"Компасе\", пишет Андрею тексты\nрэпа и гуглит мемные видео. Андрей сидит в офисе и мониторит \"Двач\".\n* **Доска почета:** Взяли ТОП-1 в Warzone 2.0. Михаил сдал\nчелночный бег на физре (*«фызра на улице смерть»*)."}, {"num": 14, "title": "РЕЖИМ «ДУШНИЛЫ» И ИНТЕЛЛЕКТУАЛЬНЫЙ СНОБИЗМ", "content": "* **Игровая Душнота:** Бесконечные споры о сборках в Warzone.\nАндрей доказывает, что мета --- это РПК и пулеметы, Михаил душнит за\nснайперские винтовки (SP-X 80) и сборки от Рекрента.\n* **Музыкальная критика:** Михаил на серьезных щах пишет\nдиссертации о том, почему \"MellowBite\" и \"Code10\" --- это гении,\nломающие рамки индустрии, а новые фрешмены просто воруют их \"флоу\" и\n\"адлибы\"."}, {"num": 15, "title": "ВНУТРЕННИЙ КИНЕМАТОГРАФ И ТЕАТР ОДНОГО АКТЕРА", "content": "* **Текстовые рэп-фристайлы:** Братья постоянно пишут куплеты в\nчат:\n> *«Выхожу из Soho, на мне Yolo Взял его у мажоров (coco) Смотрят на\nменя Po-Po»*\n* **Создание превью:** Мета-игра. Они придумывают кликбейтные\nназвания и превью для своих обычных жизней: *«ебанутый пых показал как\nнадо брать топ1», «ТРИ ДИЛЛЕРА ВИДОС НАЗЫВАТЬСЯ БУДЕТ»*.\n* **Пересказ Снов (Шиза):** Михаилу снится, что он стоит на сцене с\nрэпером Дозером, или что он покупает \"цикломед\" в игре Divinity."}, {"num": 16, "title": "МЕДИЦИНСКАЯ КАРТА И ХРУСТ КОСТЕЙ", "content": "* **Алкогольные отравления:** Желудки сожжены дешевым джином и\nострыми соусами.\n* **Менталочка:** Михаил постоянно жалуется на \"Дисперсию\"\n(депрессию), выгорание и усталость от учебы. *«меня ничто не сможет\nзадушить кроме elden ring 2»*.\n* **Травмы:** Михаил оторвал зарядник. Андрей ударился и содрал\nколенки на улице."}, {"num": 17, "title": "ПСИХОЛОГИЧЕСКИЙ ПОРТРЕТ И КРИЗИСЫ СЕЗОНА (ФИНАЛЬНЫЙ ИТОГ)", "content": "**Андрей (24-25 лет): Уставший Офисный Снайпер**\nАндрей глубоко погружен в кризис \"взрослой жизни\". Офисная работа\nкажется ему бессмысленной, поэтому он полностью отключается от неё,\nпроводя часы в телефоне (Двач, ТикТок, переписка с братом). Варзон для\nнего --- это не просто игра, это место, где он может почувствовать\nвласть и контроль (командуя братом и убивая врагов). Его троллинг\nмладшего брата стал настоящим искусством: он знает все болевые точки\nМихаила и бьет по ним с хирургической точностью просто ради забавы.\n\n**Михаил (21-22 года): Студент-Хайпбист на Грани Нервного Срыва**\nМихаил разрывается между суровой реальностью инженерного университета\n(где надо чертить \"штуцеры\" и считать формулы) и своим выдуманным\nмиром. Он конструирует себе виртуальную идентичность \"трэп-звезды\":\nслушает андеграунд, пьет алкоголь \"как в клипах\", покупает шмотки в\nсекондах и читает фристайлы в чат. Его агрессия, бесконечный капслок и\nспам \"АЫФФФФ\" --- это сублимация дикого стресса от учебы, отсутствия\nденег и страха перед будущим.\n\n**Общая динамика мировоззрения:**\nЭто период абсолютной коммуникационной сингулярности. Братья общаются на\nязыке, на 100% состоящем из мета-модерна. Обычному человеку понять их\nдиалог невозможно (это хаотичная смесь терминов Варзона, английских\nслов, цитат Папича и текстов мамбл-рэперов). Жесточайшие оскорбления\n(\"уебан\", \"гнида\", \"я тебе лицо разобью\") в их системе координат\n--- это проявление глубочайшего доверия. Они вместе спасаются от серости\nи проблем в этой токсичной, но такой родной цифровой песочнице, где\nвсегда можно нажать кнопку \"Поиск игры\" и забыть о реальном мире."}], "id": 14, "seq": 15}, {"roman": "XX", "subtitle": "КОМПАС 3D, САУЗА И ТРАП ДОМ", "period": "Ноябрь 2022 — Май 2023 года.", "ages": "Андрей (24-25 лет), Михаил (21-22 года).", "codename": "Зима-Весна 23-го: Скибиди компас, Сауза и Блейди", "sections": [{"num": 1, "title": "🕰 ЭПОХА И ВАЙБ (СЕЗОН)", "content": "* **Временной период:** Ноябрь 2022 — Май 2023 года.\n* **Название сезона:** «Сауза, Компас 3D и Трап Дом».\n* **Главный лейтмотив:** Сезон дикого кибер-эскапизма и академического мучения. Михаил страдает в программе «Компас 3D», не понимая, как начертить фланец и усечь линию, а Андрей дистанционно орет на него. Вечера заканчиваются распитием текилы «Сауза», генерацией нейросетевых фейков, фристайлами в чат и горением в Dota 2."}, {"num": 2, "title": "🌍 ГЛОБАЛЬНЫЙ ФОН И МИРОВЫЕ СОБЫТИЯ", "content": "* **ИИ-Бум (Нейросети):** Активно форсится тема ИИ. Михаил пытается обучать нейросети или генерировать картинки.\n* **Криптовалюты:** Упоминание «Альтоинов» и падения бирж.\n* **Блокировки:** Упоминается блокировка сайтов («запретыч», обходы блокировок)."}, {"num": 3, "title": "📖 СЛОВАРЬ И ЛОКАЛЬНЫЕ МЕМЫ", "content": "* **ФЫАХАФЫХ... / ЗФЫАЗФЫЗЫЗХ** — Основной язык. Заменяет смех, истерику, шок от бага в игре или тупости препода.\n* **Шнене / Пепе / Чука** — Локальные слова-паразиты и обращения друг к другу.\n* **Трап Дом / Трап** — Делать что-то круто, или, наоборот, описание притона.\n* **Сабжи / Гуала / Заза** — Деньги (сабжи) и запрещенные вещества из рэп-треков (заза).\n* **Саня (вставить слово)** — Универсальный мета-мем. *«Саня пачкальщик ковров»*.\n* **Усечь** — Термин из Компаса 3D, ставший поводом для часового срача. *«Где блять это усечение (мем)»*.\n* **Нзт / НЗТ 2.0** — Кофеин, энергетики или алкоголь. Отсылка к таблеткам из фильма «Области тьмы»."}, {"num": 4, "title": "👥 БЕСТИАРИЙ И NPC", "content": "* **Саня (Скандал / Ворм / Магнус)** — Бывший друг/тиммейт, с которым произошел конфликт из-за работы («чистка ковров»). *«Те самые окурки доджат лист куда ковры завести»*. Был переведен в статус «предателей».\n* **Пых** — ИРЛ друг. *«Пердежное радио Пыха»*.\n* **Дмитрий Создатель Ковров** — Начальник Сани и Михаила на подработке.\n* **Преподавательница по Инженерной графике** — Финальный босс Михаила, которая заставляет его переделывать чертежи.\n* **Code10 / MellowBite / ОГ Буда / Платина** — Трэп-артисты. Их треки — это религия братьев.\n* **Папич (Arthas)** — Стример, фразы которого вшиты в подкорку. *«В салянава», «Работанты»*."}, {"num": 5, "title": "⚔️ КВЕСТЫ, СПОРЫ И КЛАДБИЩЕ ИДЕЙ", "content": "* **ГРАНД-КВЕСТ «Усечь Линию в Компас 3D»:** Эпичная, часовая арка. Михаил делает чертеж в Компасе и не может понять, как удалить лишнюю линию. Он спамит Андрею в 9 утра. Андрей пытается объяснить ему текстом: *«Усеки. Линию. Усечи....»*. Михаил орет: *«Ну и где это усечение (мем)... Я как толстый стою и компас подо мной»*. В итоге Михаил чертит «на похуй».\n* **Спор «Стирка Ковров»:** Срач из-за подработки. Михаила звали работать стирателем ковров, но он забил, потому что «надо было по-армейски явиться». Друг Саня якобы предал его. *«Хуй на коврах сошелся а не свет»*.\n* **Квест «За Саузой»:** Покупка текилы «Сауза» (Sauza). Михаил тратит на неё косарь («пришлось оторвать от сердца») и пьет её с солью, ловя алкогольный дзен."}, {"num": 6, "title": "📍 ГЕОГРАФИЯ И ЛОКАЦИИ", "content": "* **Компас 3D (Программа):** Виртуальная локация боли Михаила.\n* **Ковровая фабрика (ДЗР):** Место так и не случившейся работы Михаила.\n* **ННГАСУ (Нижуха):** Университет Михаила.\n* **Бристоль / Магнит / КБ:** Точки респауна алкоголя («Белые дрова», «Сауза»)."}, {"num": 7, "title": "💸 ЭКОНОМИКА И АРСЕНАЛ", "content": "* **Broke Boys:** Безденежье — вечная проблема. *«Бля бабок еще нет сука я бы щас просто весь стим скупил»*.\n* **Дрип (Шмотки):** Михаил ищет кроссовки «Джузеппе», футболки «Суприм» и «Подмост».\n* **Очки Steam:** Андрей учит Михаила, как продавать карточки и фоны в Стим, чтобы наскрести на инди-игру."}, {"num": 8, "title": "🎬 КУЛЬТУРНЫЙ КОД И МЕДИА (КИНО И МУЗЫКА)", "content": "* **Музыка (Академия Трэпа):** MellowBite, Code10, OG Buda, Платина. Бесконечные споры о том, кто круче читает. *«Код тен ваш под Платину косит»*. Разбор трека «Криспи Лайф».\n* **Кино:** \"Декстер\" (Dexter). Михаил фанатеет от сержанта Доакса (*«SURPRISE MOTHERFUCKER»*). Фильм \"Области тьмы\" (Limitless) — оттуда взят мем про NZT.\n* **Батл Рэп:** Вспоминают батл \"Слава КПСС против Эрнесто Заткнитесь\".\n* **YouTube:** Обзоры Булджать (Бульджатя), Мэддисона."}, {"num": 9, "title": "🎮 ИГРОВОЙ АРСЕНАЛ И СТРИМЫ (ОТДЕЛЬНЫЙ ПУНКТ)", "content": "* **DOTA 2:** Андрей играет на Пудже и Разоре. Михаил руинит игры. *«Ебучий дазл... Пиздец мы проебали на слардаре»*.\n* **Tarkov:** *«А мы ситуацию на барахолке мониторим»*. Споры о ценах на сборки Калаша. *«Ручка 20, цевье 35, коробка 20»*.\n* **GTA Online:** Вспоминают радио *Self Radio*. *«Прикинь если бы Некит играл в ГТА... садишься в машину а там Латынина вещает»*.\n* **Balatro / Slay the Spire / Tainted Grail:** Карточные рогалики, от которых они фанатеют.\n* **Mewgenics:** Ждут игру от создателя Айзека. *«Крусадерс кингс про котов»*."}, {"num": 10, "title": "🥊 БРАТСКИЕ БАТЛЫ И ТОКСИЧНОСТЬ", "content": "* **Стиль общения:** Токсичный мета-модерн.\n* **Батлы в Дискорде:**\n > *Михаил: «Идиот салева имеет 400 зарядов блять и хилит все абсолютно...»*\n > *Вы: «Ты сука... Уебище»*\n* Андрей постоянно «душит» Михаила из-за его тупости в 3D программах, Михаил в ответ шлет его на три буквы и пишет капсом."}, {"num": 11, "title": "🍕 ГАСТРОНОМИЯ И РАЦИОН", "content": "* **Трэш-кулинария Михаила:** Галеты. *«Я объелся галет... Каменное говно»*. «Буррито» (которое он ел как собака, вытирая рот красной салфеткой). Горчица (*«Мне душу пробило через нос»*).\n* **Фастфуд:** Пицца. *«Пора на электричку с пиццей»*. Бургеры без соленых огурцов.\n* **Снеки:** Чипсы \"Принглс\" (от которых у Михаила запор)."}, {"num": 12, "title": "🍻 АЛКОГОЛЬНЫЙ СЧЕТЧИК И ПИВНАЯ СТАТИСТИКА", "content": "* **Сауза (Текила):** Главный напиток эпохи. Михаил берет бутылку за косарь и ловит \"Лефтовер экстаз\". *«Пил я много сука... Я как баба... Leftover Sauza hits different»*.\n* **Водка:** *«Купили водку с зеро колой»*.\n* **Похмелье:** Эпичное. *«Блять я из бутылки хлебнул... У меня щас с каждой секундой пьянею... Я щас обрыгаюсь»*. Сидят на \"НЗТ\" (алкоголе/энергетиках)."}, {"num": 13, "title": "🦥 ХРОНИКИ ПРОКРАСТИНАЦИИ И УСПЕХОВ", "content": "* **Вместо дела:** Михаил делает чертежи в Компасе на \"похуй\", подгоняя размеры \"на глаз\", параллельно слушая \"Code10\" и переписываясь с Андреем. Андрей игнорирует работу/учебу, мониторя барахолку в Таркове.\n* **Доска почета:** Михаил сдал чертеж в Компасе. (Наверное). Андрей апнул уровень."}, {"num": 14, "title": "🎭 РЕЖИМ «ДУШНИЛЫ» И ИНТЕЛЛЕКТУАЛЬНЫЙ СНОБИЗМ", "content": "* **Музыкальная Душнота:** Михаил проводит глубокий анализ творчества Code10 и MellowBite. Доказывает, что \"Ляна\" украл флоу у \"Слива\", а \"Яникс\" продал парт. Андрей называет это \"хайп вайбом\" и \"говном\".\n* **Тарковская Душнота:** Бесконечные споры о том, что лучше лечит: Салева (Salewa) или Айфак (IFAK). Михаил доказывает, что Салева имба, потому что у неё 400 хп и она лечит кровотечения. Андрей отвечает матом."}, {"num": 15, "title": "🎬 ВНУТРЕННИЙ КИНЕМАТОГРАФ И ТЕАТР ОДНОГО АКТЕРА", "content": "* **Фристайлы в чате:**\n > *Михаил: «Я купил себе гарун я укурен в тапку пацаны включили фейса мы не ждем облаву»*\n* **Пересказ Снов (Шиза):**\n > *Михаил: «В том сне я залутал видеокарту и кота... как маленький но х2... он пиздец огромный был»*.\n* **Паста про Орёл:** Андрей пишет нейро-пасты в стиле Позднякова про то, как его обманули на 15 тысяч в Орле, а Михаил делает такие же про чистку ковров."}, {"num": 16, "title": "🚑 МЕДИЦИНСКАЯ КАРТА И ХРУСТ КОСТЕЙ", "content": "* **Похмельный синдром:** Главный диагноз. Расстройство ЖКТ, вертолеты, головные боли. *«Я блевал перед тем как Саня уехал»*.\n* **Пробитие горчицей:** Михаил поел острой горчицы и плакал.\n* **Проблемы со сном:** \"НЗТ\" (кофеин/энергетики) глушит сон."}, {"num": 17, "title": "🧠 ПСИХОЛОГИЧЕСКИЙ ПОРТРЕТ И КРИЗИСЫ СЕЗОНА (ФИНАЛЬНЫЙ ИТОГ)", "content": "**Андрей (24-25 лет): Уставший Архивариус-Снайпер**\n\nАндрей балансирует между статусом взрослого работающего человека и кибер-задрота. Он устал, ему не доплачивают 15 тысяч, он мотается по командировкам (или на \"завод\"), но вечером он заходит в Тарков или Доту и отрывается там. В отношениях с братом он — жесткий наставник-тролль. Он может помочь, но сначала смешает с грязью. Для него этот чат — возможность выплеснуть накопившуюся офисную желчь и поржать над абсурдом.\n\n**Михаил (21-22 года): Студент-Инженер в Трэп-Доме**\n\nМихаил разрывается между тяжелой технической учебой (чертежи в Компас 3D) и своей выдуманной маргинальной личностью. Ему глубоко плевать на фланцы и усечения линий, его волнует, как звучит бас у Code10 и как правильно пить Саузу. Он искусственно вгоняет себя в состояние \"Broke Boy\" и \"Трапера\", чтобы жизнь казалась не такой скучной. Его неспособность начертить прямую линию и истерики капслоком — это яркое проявление стресса перед взрослой жизнью, к которой он абсолютно не готов.\n\n**Общая динамика мировоззрения:**\n\nДиалог братьев — это гениальный, абсолютно замкнутый цифровой ситком. Они общаются на языке, который на 100% состоит из мета-отсылок (Тарков, Двач, Стримеры, Клауд-рэп). Они могут час орать друг на друга из-за пикселя в Компасе 3D, а потом вместе сочинять фейковые новости в стиле Позднякова. Их токсичность — это толстый панцирь, под которым скрывается уникальная, нерушимая братская связь. В мире, где кидают на деньги, заставляют стирать ковры и чертить линии, этот чат — их единственное по-настоящему безопасное место."}], "id": 15, "seq": 16}, {"roman": "XIII", "subtitle": "НЕЙРО-ПЫХ, STREET FIGHTER 6 И СКУФ-ТРАП", "period": "Май 2023 --- Ноябрь 2023 года.", "ages": "Андрей (24-25 лет), Михаил (21-22 года).", "codename": "Лето-Осень 23-го: Скибиди Тарков, Баристер и Синтез Голоса", "sections": [{"num": 1, "title": "ЭПОХА И ВАЙБ (СЕЗОН)", "content": "* **Временной период:** 4 Мая 2023 --- 3 Ноября 2023 года.\n* **Название сезона:** «Нейро-Пых, Street Fighter 6 и Скуф-Трап».\n* **Главный лейтмотив:** Симбиоз технологий и маргинальности.\nБратья открывают для себя нейросети (RVC) и сутками пытаются\nсинтезировать голос своего друга Пыха, чтобы заставить его читать трэп.\nПараллельно они сгорают от выхода *Street Fighter 6*, играют в\n*Baldur's Gate 3* и утопают в бытовом алкоголизме. Михаил страдает от\nвоенных сборов и учебы в ННГАСУ, а Андрей --- от рабочих будней."}, {"num": 2, "title": "ГЛОБАЛЬНЫЙ ФОН И МИРОВЫЕ СОБЫТИЯ", "content": "Мир проникает в их чат через мемы и громкие релизы:\n* **Игровые релизы 2023:** Выход *Street Fighter 6*, *Baldur's\nGate 3*, *Mortal Kombat 1*, *CS2* (и закрытие CS:GO), анонс\n*Starfield*. Каждое событие вызывает бурю эмоций.\n* **Мем «Русы против Ящеров»:** *«С Днём Победы древних Русов в\nмноголетней войне против ящеров»*.\n* **Мем «Скибиди Туалеты»:** *«скибиди доп доп ес ес», «скибиди\nтарков»*.\n* **Политика (иронично):** Упоминают Пригожина/Вагнер (*«ОРКИ\nКРАСНЫЕ ОРКИ СЕКРЕТНЫЕ»*)."}, {"num": 3, "title": "СЛОВАРЬ И ЛОКАЛЬНЫЕ МЕМЫ", "content": "* **ФЫАХАФЫХ... / АЫФФФФФ** --- Язык богов. Заменяет любые\nчеловеческие эмоции.\n* **Ряльный** --- сленг MellowBite, означающий трушность. *«Я\nряльный», «у тя не будет никого ряльней меня»*.\n* **Русачок** --- презрительно-ироничное обращение Андрея к Михаилу\n(и наоборот). *«Беги русачок беги»*.\n* **Саня / Макс [Вставить слово]** --- мета-мем жив. *«Макс\nРусачков», «Макс Секундяев», «Макс Бананов», «Макс Думрашкин», «Папа\nАнтона»*.\n* **Дрип / Трап / Свэг** --- атрибуты рэп-культуры.\n* **Дрова / Гара / Баристер** --- кодовые названия алкоголя. (Гара\n= Garage, Баристер = джин Barrister)."}, {"num": 4, "title": "БЕСТИАРИЙ И NPC", "content": "* **Пых (Иисус Пыхтос / Пыхтобой / Стритпых)** --- ИРЛ-друг.\nГлавная жертва нейросетей. Братья обучают ИИ на его голосовых\nсообщениях, чтобы создавать \"Пыхтинские каверы\".\n* **Костян (Муринчик)** --- друг-мем, который \"не вывез Балды\n(BG3)\", играет в WoW на Сирусе и собирает гнилые билды.\n* **Стив, Поляна (Ляна), Дозер (MellowBite)** --- духовные лидеры.\nИх интервью для The Flow разбирается на цитаты. *«Я если че поляна»*.\n* **Папич (Arthas) / Мэддисон / Ванзай** --- каста блогеров. Ванзая\nненавидят за рецепт китайской лапши, Папича цитируют (*«РОФЛАН\nЕБАЛО»*).\n* **Батя / Мамка** --- Батя играет в танки (*«батя в танки погнал\nсразу... пати собирает на синего ТАНКАА»*), мама ругается.\n* **Преподы ННГАСУ** --- боссы Михаила на защите курсовых."}, {"num": 5, "title": "⚔️ КВЕСТЫ, СПОРЫ И КЛАДБИЩЕ ИДЕЙ", "content": "* **ГРАНД-КВЕСТ «Нейро-Пых» (Обучение ИИ):** Эпичная многодневная\nарка. Братья пытаются обучить RVC (нейросеть) голосу Пыха. Они парсят\nего голосовые из ВК («певучие» и «рэперские»), загружают в Google Colab,\nследят за \"эпохами\" (Epochs) и матерят друг друга, когда Colab\nвылетает из-за тайм-аута. *«СУКА СБРОСИЛОСЬ... БЛЯТЬ ОН МЯМЛИТ... ОН\nГЛОТАЕТ СЛОВА»*. В итоге создают шедевры: Пых поет треки OG Buda,\nScally Milano и Radio Tapok.\n* **Квест «Военные сборы»:** Михаила забирают на сборы от универа.\nАндрей, как дембель, издевается над ним. Михаил не умеет разбирать\nавтомат (*«Я себе пальцы пружиной переломаю»*), не может надеть ОЗК и\nбросает гранаты мимо шины (*«РУКА ИДЕТ ПРАВЕЕ ЧЕМ НАДО»*).\n* **Квест «Начерталка и Аппараты»:** Михаил делает расчеты\nротаметров и аппаратов в \"Компасе\". Ничего не сходится на 20 единиц,\nон подгоняет цифры вручную. Андрей отказывается помогать ему оформлять\nWord-документ.\n* **Золотые цитаты:**\n> *Михаил: «мама всегда говорила мне ляна добывай деньги И ВЫЖИВАЙ»*\n> *Вы: «Я когда родился, не рыдал как сучка, я сразу сел. Врач\nпотянулся шлёпнуть, я ему - съебался пока цел»*\n> *Вы: «Любая тусовка после часа ночи превращаю в книгу»*"}, {"num": 6, "title": "ГЕОГРАФИЯ И ЛОКАЦИИ", "content": "* **Краснуха (ННГАСУ):** Ад Михаила на земле.\n* **Завод / Офис:** Локация Андрея. *«Я БЛЯТЬ ТУТ РАБОТАЮ НА\nСЕРЬЕЗЕ»*.\n* **Сочи / Куба / Египет:** Обсуждение отпуска Андрея. *«Лежу в\nномере сука спина болит»*.\n* **Астрахань / Комсомольск-на-Амуре / Биробиджан:** Локации из\n*GeoGuessr*, ставшие локальными мемами. *«Город еврей»*.\n* **Street Fighter 6 (Battle Hub):** Виртуальная арена их\nбесконечных драк.\n* **КБ / Бристоль / Магнит:** Храмы \"Дров\" (алкоголя)."}, {"num": 7, "title": "ЭКОНОМИКА И АРСЕНАЛ", "content": "* **Экономика Broke Boys:** Денег по-прежнему нет. *«У меня в\nкармане большая котлета (фейк)»*. Спорят, за сколько Михаил купит у\nАндрея старый вейп Charon (сторговались за 1100).\n* **Игровые траты:** Обсуждение бешеных цен на файтинги (*SF6* и\n*MK1* по 5-7 тысяч). Покупают активации через левые аккаунты\n(online-fix, plati.ru).\n* **Дрип (Шмотки):** Михаил ищет куртку Aquascutum, Carhartt и\nкепки. *«У меня дрип как у мажоров»*."}, {"num": 8, "title": "КУЛЬТУРНЫЙ КОД И МЕДИА (КИНО И МУЗЫКА)", "content": "* **Музыка (Академия MellowBite):** Абсолютный пик шизы. Они читают\nогромное текстовое интервью MellowBite для The Flow, умирая от смеха с\nих лора (*«Выхожу из Сохо, взял у мажоров коко... Это трушная\nистория!»*). Слушают Code10, Toxi\\$, Friendly Thug, Big Baby Tape.\n* **Рэп-Батлы:** Вспоминают BPM батлы, Rickey F, Букера и\nГнойного.\n* **Кино:** «Человек-Паук» (ненавидят Тома Холланда, спорят о\nМайлзе Моралесе --- *«нигер паук»*). «Особо опасен», фильмы Гая Ричи.\n* **YouTube/TikTok:** Смотрят обзоры Ванзая, Грилькова, стендапы\nСергея Орлова (которого сначала хейтят, а потом смотрят запоем)."}, {"num": 9, "title": "ИГРОВОЙ АРСЕНАЛ И СТРИМЫ (ОТДЕЛЬНЫЙ ПУНКТ)", "content": "* **Street Fighter 6:** Игра сезона. Михаил играет на\nModern-раскладке (за Зангиева/Бланку) и бесит Андрея. *«Modern Zangief\nis the most braindead shit... 1 кнопка»*. Адский тильт от проигрышей\nяпонцам.\n* **Escape from Tarkov:** Продолжают страдать. *«Тарков на движке\nфортнайта», «Голова, глаза оформили»*.\n* **Baldur's Gate 3:** Релиз года. Планируют кооп: *«Будем играть\nза гномов и воровать у всех»*, *«Я отыгрываю чурку... призыв чурок на\nстрелку с медведями»*.\n* **GeoGuessr:** Соревнуются в угадывании русских городов по\nобосранным заборам. *«Это Бирик (Биробиджан)... Я УГАДАЛ ПО ЖИГЕ»*.\n* **CS2 / Dota 2:** Выход CS2 и прощание с CS:GO. В Доте Андрей\nиграет на Пангольере (*«Я растоптал их»*), Михаил руинит на Миране."}, {"num": 10, "title": "БРАТСКИЕ БАТЛЫ И ТОКСИЧНОСТЬ", "content": "* **Стиль общения:** Это не диалог, это ментальная война. «Гнида»,\n«Уебан», «Шавка», «Русачок» --- просто междометия.\n* **Динамика:** Андрей (25 лет) с позиции «взрослого работяги»\nунижает Михаила за его учебу, сборы и тупые вопросы по Word. Михаил (22\nгода) сгорает и отвечает стенами капса.\n* **Панчлайны:**\n> *Михаил: «я бы щас пришел к нему домой и просто нахуй ебальник бы\nему разбил сука растоптал отрезал ему голову обоссал бы его мать»*\n> *Вы: «сказал бы ты мне это в реале, я бы тебе все ебало\nраскрошил...»*"}, {"num": 11, "title": "ГАСТРОНОМИЯ И РАЦИОН", "content": "* **Трэш-кулинария Михаила:** Заливает в макароны китайский красный\nсоус *Samyang* и плачет от остроты. *«сижу я со слезой и подмышки\nмокрые... так и не понял это было железо или горячесть»*.\n* **Фастфуд:** McDonald's (Вкусно и точка), KFC, Додо.\n* **Вейп-меню (Жижа):** Постоянные проблемы с \"гариком\"\n(сгоревшим испарителем). Михаил учит Андрея прокапывать ватку."}, {"num": 12, "title": "АЛКОГОЛЬНЫЙ СЧЕТЧИК И ПИВНАЯ СТАТИСТИКА", "content": "* **Контекст:** Жесткий летний алкоголизм. Пьют, чтобы играть в\nфайтинги или смотреть Двач.\n* **Напитки:** Джин \"Баристер\" (*«Цена 372 баристер...\nпроклятый напиток»*), Ром \"Бакарди\", Пиво \"Бад\" (Bud), \"Гара\"\n(Garage), \"Бланш\", \"Халзан\".\n* **Алкогольный рекорд:** Михаил выпил 19 банок пива за 2 дня.\n* **Похмелье:** Эпичное. *«Дрищ высшего калибра», «С меня течет\nвода», «я обоссался в доте оказывается потекло по штанине»*. Ищут по\nаптекам антипохмельные средства."}, {"num": 13, "title": "ХРОНИКИ ПРОКРАСТИНАЦИИ И УСПЕХОВ", "content": "* **Вместо дела:** Михаил должен делать курсовую (чертеж ротаметра)\nи оформлять ПЗ (пояснительную записку), но вместо этого он генерирует\nИИ-песни Пыха и играет в SF6. Андрей на работе сидит в ВК и смотрит\nстримы Папича.\n* **Доска почета:** Михаил сдал расчеты, обманув систему (подогнал\nцифры). Андрей успешно нагенерировал ИИ-треки."}, {"num": 14, "title": "РЕЖИМ «ДУШНИЛЫ» И ИНТЕЛЛЕКТУАЛЬНЫЙ СНОБИЗМ", "content": "* **Музыкальная Душнота:** Михаил разбирает флоу рэперов. *«ОН\nБЕЖИТ ПО БИТУ... СКОЛЬЗЯЩИЙ»*. Доказывает, что MellowBite --- гении, а\nвсе остальные байтят их стиль.\n* **Игровая Душнота:** Споры о фреймдате в файтингах. *«Когда ты\nначал эту комбинацию у тебя было минус тыща фреймов что позволило мне\nначать свои удары»*.\n* **Нейро-Душнота:** Споры о том, сколько \"эпох\" (Epochs) нужно\nдля обучения голосовой модели."}, {"num": 15, "title": "ВНУТРЕННИЙ КИНЕМАТОГРАФ И ТЕАТР ОДНОГО АКТЕРА", "content": "* **Фристайлы в чате:**\n> *Михаил: «Купил новую тишку, сначала её примерил / Вызвал убер блек,\nко мне подъезжает черный мэрин / Еду хавать перки / На седьмом бл*дь\nнебе»*\n* **Режиссура Ситуаций:** Они придумывают кликбейт-названия для\nсвоей жизни. *«ПЬЯНЫЙ ГЕЙМПЛЕЙ ПОД САКЭ+ КАБАРЕ КЛУБ(Я БЕШЕНЫЙ ПЕС)\n(ОЧНЬ ГРОМКО)»*.\n* **Пересказ Снов (Шиза):** Михаилу снится, что он с батей выбирает\nкроссовки, и батя покупает ему паленый Adidas Gazelle за \"3 тугрика\"."}, {"num": 16, "title": "МЕДИЦИНСКАЯ КАРТА И ХРУСТ КОСТЕЙ", "content": "* **Похмельный синдром:** Главный диагноз. Расстройство ЖКТ,\nвертолеты, головные боли.\n* **Ожог горла:** Михаил сжег пищевод острой корейской лапшой и\nкипятком (чаем).\n* **Травмы Андрея:** Упал, содрал коленки."}, {"num": 17, "title": "ПСИХОЛОГИЧЕСКИЙ ПОРТРЕТ И КРИЗИСЫ СЕЗОНА (ФИНАЛЬНЫЙ ИТОГ)", "content": "**Андрей (24-25 лет): Офисный Тролль-Нейросетевик**\nАндрей плотно увяз во взрослой жизни. Работа не приносит радости, отпуск\nв Сочи сопровождается болями в спине. Его единственный источник\nискреннего веселья --- это цифровой хаос, который они создают с братом.\nИдея обучить нейросеть голосу Пыха стала для него настоящим проектом, в\nкоторый он вложил больше усилий, чем в работу. В диалогах он максимально\nциничен, постоянно давит на Михаила, провоцируя его на капслоковые\nистерики, потому что именно этот абсурдный ор позволяет ему чувствовать\nсебя живым.\n\n**Михаил (21-22 года): Студент-Хайпбист на Грани Коллапса**\nМихаил разрывается между тяжелой технической учебой (чертежи, расчеты),\nармейскими сборами и своим желанием быть частью андеграундной\nтрэп-культуры. Он искусственно маргинализирует себя: пьет жесткий\nалкоголь, ест острую пищу до слез, скупает паленый шмот и читает рэп.\nЕго ментальное состояние нестабильно --- он паникует из-за каждой мелочи\n(будь то настройка нейросети, сгоревшая ватка в вейпе или босс в игре).\nСпам по клавиатуре (АФЫФАФЫ) --- его главный терапевтический инструмент\nсброса стресса.\n\n**Общая динамика мировоззрения:**\nБратья достигли абсолютной вершины своего кибер-языка. Их переписка 2023\nгода --- это постмодернистский шедевр, где невозможно отличить\nреальность от иронии. Обычный человек не поймет здесь ни единой фразы,\nпотому что каждое предложение состоит из смеси дотерского сленга, цитат\nMellowBite, мемов с Двача и файтинг-терминологии. Уровень агрессии и\nтоксичности максимален, но парадокс в том, что именно через эти\nпроклятия («я тебе голову проломлю», «ты уебище») они транслируют друг\nдругу абсолютную поддержку и братскую любовь в мире, который кажется им\nбесконечно душным.\n\nПротоколы времени и контекста откалиброваны."}], "id": 16, "seq": 17}, {"roman": "XIV", "subtitle": "СКУФ-ГЕЙМИНГ, ЛЕГО ФОРТНАЙТ И КОД КОРИЧНЕВЫЙ", "period": "Ноябрь 2023 --- Апрель 2024 года.", "ages": "Андрей (25-26 лет), Михаил (22-23 года).", "codename": "Зима-Весна 24-го: Эра Скуфов, Мистера Фреша и Нейро-Трапа", "sections": [{"num": 1, "title": "ЭПОХА И ВАЙБ (СЕЗОН)", "content": "* **Временной период:** 3 Ноября 2023 --- 27 Апреля 2024 года.\n* **Название сезона:** «Скуф-Трап, Лего Фортик и Код Коричневый».\n* **Главный лейтмотив:** Принятие взрослой жизни через призму\nабсурда. Братья осознают, что они стареют (появляются мемы про «скуфов»,\nбольную спину и отдых под пиво). Они убегают от рутины в кооп-игры\n(Lethal Company, LEGO Fortnite), создают нейросетевые треки и генерируют\nкартинки в ChatGPT, чтобы хоть как-то развлечься на парах или в офисе."}, {"num": 2, "title": "ГЛОБАЛЬНЫЙ ФОН И МИРОВЫЕ СОБЫТИЯ", "content": "* **Игровые релизы зимы 2023/24:** Выход *Lethal Company* (игра\nстала мега-хитом чата), *LEGO Fortnite*, *Escape from Tarkov: Arena*\nи *Helldivers 2* (вскользь).\n* **Сериал «Слово Пацана»:** *«СЛОВО ПАЦАНА THE GAME... якудзу в\nросии надо делать»*.\n* **Задержание Аяза Шабутдинова (Ноябрь 2023):** Андрей: *«Слышал\nновость Аяза задержали... Сдохни гавно»*.\n* **Тренд на ИИ (ChatGPT / HeyGen):** Братья активно используют\nнейросети для создания картинок, перевода видео и генерации песен."}, {"num": 3, "title": "СЛОВАРЬ И ЛОКАЛЬНЫЕ МЕМЫ", "content": "* **Будто бы я пьяный без вина** --- Лирическая строчка, ставшая\nглавным мемом полугодия. Используется для описания любой неадекватной\nситуации или состояния.\n* **Скуф / Скуф-режим** --- Принятие своего возраста. Играть в Доту\nпод пиво, не напрягаясь. *«СКУФ РЕЖИМ СИНГЛ ДРАФТ»*.\n* **Код коричневый** --- Экстренный позыв в туалет. *«КОД\nКОРИЧНЕВЫЙ ПОСЛЕ ИГРЫ... ОБОСРАЛСЯ»*.\n* **Мистер Фреш (Mr. Fresh) / Кот Твикс** --- Мемы про котов из\nТикТока. *«Операция по спасению мистера фреша»*.\n* **Русачок** --- Иронично-уничижительное прозвище для типичного\nнормиса/друг друга. *«Мышление русачка», «Беги русачок»*.\n* **Дирон (Diron)** --- Искаженное слово, локальный персонаж или\nбренд.\n* **ФЫАХАФЫХ...** --- Базовый язык. Никуда не исчез."}, {"num": 4, "title": "БЕСТИАРИЙ И NPC", "content": "* **Саня (Вандал / Скандал)** --- Главный руинер и генератор\nконтента в Доте. *«САНЯ СОБРАЛ ДАЕДАЛУС 4 СЛОТОМ», «Саня афк лес\nхуярит»*.\n* **Пых (Максончик / Пыхтобой)** --- ИРЛ-друг. Братья переводят его\nголосовые сообщения через нейросеть *HeyGen* на английский.\n*«ИНДИЙСКИЙ ПЫХ... Я ОБОССАЛСЯ»*.\n* **Маки** --- Друг и тиммейт. *«ОПЯТЬ МАКИ ВТАЩИЛ ГНИЛЬЁМ»*.\n* **Батя / Мамка** --- Батя играет в Танки (*«батя в танки\nпогнал»*), мама ругается за разлитое пиво (*«батя пришел дал пизды за\nкружку пивную»*).\n* **Юрий (Code10) / MellowBite / Tarabandz** --- Трэп-артисты,\nкоторых они слушают до дыр и цитируют."}, {"num": 5, "title": "⚔️ КВЕСТЫ, СПОРЫ И КЛАДБИЩЕ ИДЕЙ", "content": "* **Квест «GameDev на коленке»:** Михаил скачивает Unreal Engine и\nRPG Maker, чтобы сделать свою игру. Мечтает сделать «Якудзу в России».\nЧерез 2 часа пишет: *«СУКА И НЕЛЬЗЯ КЛИКНУТЬ НАДО ПИСАТЬ ЗАЛУПУ... я\nпрототип сделаю с белыми кубами»*. В итоге забрасывает.\n* **Спор «Tarkov Arena»:** Андрей отказывается покупать Арену за\n1300 рублей, ждет бесплатный доступ. Михаил покупает и сгорает от\nбаланса: *«НИКОГО НЕЛЬЗЯ УБИТЬ ЭТОЙ ПУЛЕЙ... ЭТО ХУЙНЯ ЗА СТО\nКУСКОВ»*.\n* **Квест «Провал на Физре»:** Михаил приходит сдавать физкультуру\nв ННГАСУ. Ему говорят кидать мяч, отжиматься и бежать 3 километра. *«Я\nне успел отдышаться и ПРОСТО ШЁЛ ЭТИ ЕБАНЫЕ 6 КРУГОВ»*.\n* **Золотые цитаты:**\n> *Вы: «Я когда родился, не рыдал как сучка, я сразу сел. Врач\nпотянулся шлёпнуть, я ему - съебался пока цел»*\n> *Михаил: «мама всегда говорила мне ляна добывай деньги И ВЫЖИВАЙ»*\n> *Вы: «Я один когда проигрываю оскорбляю союзников и говорю что они\nнавсегда останутся на своих птс будто у меня 12к и вообще я зашел под\nпиво поиграть против раков»*"}, {"num": 6, "title": "ГЕОГРАФИЯ И ЛОКАЦИИ", "content": "* **ННГАСУ (Краснуха):** Ад Михаила. Место сдачи курсачей и физры.\n*«сколько можно сидеть в этом тюрьме ебаном»*.\n* **Офис Андрея:** Место, где Андрей страдает от скуки, сидит на\nДваче и генерирует картинки в ChatGPT.\n* **Лобби LEGO Fortnite:** Поляна, где они строят дома, которые не\nработают.\n* **Комплекс Lethal Company:** Место паники и криков в микрофон."}, {"num": 7, "title": "ЭКОНОМИКА И АРСЕНАЛ", "content": "* **Broke Boys 2024:** Бедность стала привычной. *«ЕСТЬ МОНЕТА 20\nРУБЛЕЙ ПО ФАСТУ НА КАРТУ»*. Михаил жалуется на такси за 500 рублей и\nидет пешком из-за снегопада.\n* **Торговля Стим:** Михаил выбивает шмотки в Доте (Текис, Урса) из\nсундуков и фиксирует прибыль в 200 рублей. *«ЭТО И НАЗЫВАЕТСЯ\nТЕМКА»*.\n* **Гаджеты:** Андрей хочет купить «Покофон» (Poco). Михаил сидит\nна убитом iPhone 7."}, {"num": 8, "title": "КУЛЬТУРНЫЙ КОД И МЕДИА (КИНО И МУЗЫКА)", "content": "* **Музыка (Абсолютный Трап):** MellowBite (Дозер, Поляна), Code10,\nTarabandz, OG Buda, Платина. Они не просто слушают это, они говорят\nэтими текстами. *«Два ляма на моей кисти нига»*.\n* **Стримеры:** Папич (Arthas) --- смотрят его «Модный приговор» и\nигры. Vanzai (кулинар), Мэддисон.\n* **ТикТок / Шортсы:** Бесконечный обмен абстрактными видео.\n*«Sigma w rizz ohio skibidi»*."}, {"num": 9, "title": "ИГРОВОЙ АРСЕНАЛ И СТРИМЫ (ОТДЕЛЬНЫЙ ПУНКТ)", "content": "* **DOTA 2:** Главная игра на жизнь и смерть. Андрей играет на\nЛионе, Гримстроке, Пудже и Пангольере. Михаил на Даунбрейкере и\nсаппортах.\n* *Тильт:* *«ЕБАНАЯ МРАЗЬ Я В ТИЛЬТЕ»*. Андрей орет на Санечку\n(друга) за руин.\n* *Скуф-гейминг:* *«Я играю и беру топ 1 нереально пьяный»*.\n* **Lethal Company:** Игра-открытие. *«ОНА ВЫСКОЧИЛА... У МЕНЯ\nЧУТЬ СЕРДЦЕ НЕ ВСТАЛО»*.\n* **LEGO Fortnite:** *«Спидран по хате»*. Строят деревни,\nобсуждают баги, играют сутками.\n* **Tarkov (Обычный и Арена):** Продолжают страдать от «Голова,\nглаза».\n* **Pacific Drive / Hades / Baldur's Gate 3:** Одиночные игры для\nотдыха от Доты."}, {"num": 10, "title": "БРАТСКИЕ БАТЛЫ И ТОКСИЧНОСТЬ", "content": "* **Стиль общения:** Токсичность 100 уровня. «Даун», «Пидорас»,\n«Уебан», «Чурка» --- это ласковые обращения.\n* **Отношение к работе/учебе:** Андрей смеется над Михаилом,\nкоторому предложили бесплатно поработать в универе: *«Мышление\nрусачка... Работать бесплатно»*.\n* **Панчлайны:**\n> *Вы: «Я тебе ебало набью приду!»*\n> *Михаил: «сказал бы ты мне это в реале, я бы тебе все ебало\nраскрошил»*"}, {"num": 11, "title": "ГАСТРОНОМИЯ И РАЦИОН", "content": "* **Lit Energy (Литенерджи):** Энергетик Михаила Литвина. Михаил\nпросыпается от того, что банка взорвалась у него в комнате: *«проснулся\nот взрыва... это была банка литенерджи»*.\n* **Трэш-кулинария:** Чан Рамен, пельмени, сухарики. Острая еда:\nАндрей съел халапеньо и умер: *«Я ОТ ЗЛОСТИ СОЖРАЛ ХАЛАПЕШЕК ДОХУЯ ЩАС\nСДОХНУ»*.\n* **Фастфуд:** Вкусно и точка (бывший Макдоналдс), Ростикс (бывший\nKFC)."}, {"num": 12, "title": "АЛКОГОЛЬНЫЙ СЧЕТЧИК И ПИВНАЯ СТАТИСТИКА", "content": "* **Контекст:** Алкоголь --- главный спонсор «Скуф-режима».\n* **Напитки:** Пиво «Бланш», «Окское» (за 200р), Виски «Джим Бим»,\nДжин «Баристер».\n* **Последствия (Код Коричневый):** Пиво + фастфуд = катастрофа.\n> *Михаил: «КОД КОРИЧНЕВЫЙ... дерьмо лезет и лезет»*\n> *Михаил: «я нажрался пизданулся в падике на улице и дома»*\n> *Андрей: «Я бухой без вина... Я обоссался в доте»*"}, {"num": 13, "title": "ХРОНИКИ ПРОКРАСТИНАЦИИ И УСПЕХОВ", "content": "* **Вместо дела:** Михаил сидит на парах и пытается сделать\nнейро-каверы на Пыха или смотрит ТикТок. Андрей сидит в офисе,\nгенерирует картинки в ChatGPT и читает Двач.\n* **Доска почета:** Андрей взял ранг «Дивайн» (Божество) в Доте.\nМихаил сдал курсач."}, {"num": 14, "title": "РЕЖИМ «ДУШНИЛЫ» И ИНТЕЛЛЕКТУАЛЬНЫЙ СНОБИЗМ", "content": "* **Игровая Душнота:** Бесконечные споры о том, как правильно\nкачать Гримстрока и Лиона. Андрей заставляет Михаила покупать Аганим и\nШард.\n* **Музыкальная Душнота:** Михаил расписывает, почему старые треки\nЯникса и Фараона --- это искусство, а новый «Детройт» --- это халтура.\n*«Кто помнит как делал детройт Морген?»*."}, {"num": 15, "title": "ВНУТРЕННИЙ КИНЕМАТОГРАФ И ТЕАТР ОДНОГО АКТЕРА", "content": "* **Нейро-Пых (HeyGen):** Андрей загружает видео Пыха в нейросеть\nдля перевода видео на английский с сохранением голоса. *«ИНДИЙСКИЙ\nПЫХ... Я ОБОССАЛСЯ... COME ON YOUNG ONE DO NOT LET ME DOWN»*.\n* **Фристайлы в чате:**\n> *«сука сказала мудак когда наблюдала на кухне бардак»*\n* **Ники в играх:** Придумывают абсурдные ники.\n*«[FROST]_6aHaH4uk_», «BAM_/7u3дA_Y_M3N9I_ABAПA»*."}, {"num": 16, "title": "МЕДИЦИНСКАЯ КАРТА И ХРУСТ КОСТЕЙ", "content": "* **Проблемы с ЖКТ:** «Код коричневый», диарея, боли в животе от\nострых чипсов и энергетиков.\n* **Похмелье:** *«хуево мени», «скрытая похма... я как будто\nводку пил вчера»*.\n* **Бессонница:** Андрей выпил кофе и не мог уснуть до утра.\n*«сердце чуть не встало»*."}, {"num": 17, "title": "ПСИХОЛОГИЧЕСКИЙ ПОРТРЕТ И КРИЗИСЫ СЕЗОНА (ФИНАЛЬНЫЙ ИТОГ)", "content": "**Андрей (25-26 лет): Офисный Скуф-Тролль**\nАндрей полностью смирился с рутиной взрослой жизни. Он работает в офисе,\nненавидит это, но нашел идеальный механизм защиты --- постиронию. Он\nгордо называет себя «скуфом», пьет пиво вечером, играет в Доту на\nсаппортах и генерирует мемы в нейросетях. В отношениях с братом он\nзанимает позицию безжалостного старшего: троллит Михаила за его учебу,\nбедность и фейлы в играх. При этом он искренне смеется до слез над их\nсовместными приколами (типа Индийского Пыха), потому что это\nединственное, что пробивает его взрослую апатию.\n\n**Михаил (22-23 года): Студент-Хайпбист на Пороге Взросления**\nМихаил переживает тяжелый кризис окончания университета. Он боится\nбудущего («не дай бог на завод»), поэтому отчаянно цепляется за юность:\nслушает агрессивный трэп, пытается делать биты, мечтает стать\nразработчиком игр (хватает на пару часов) и пьет дешевый алкоголь. Его\nментальное состояние --- это качели. Он может полдня ныть про боли в\nживоте и «Код коричневый», а вечером капслоком орать в Доте. Его спам по\nклавиатуре (АЫФФФФФ) --- это не просто смех, это сублимация\nколоссального стресса перед выходом во взрослую жизнь.\n\n**Общая динамика мировоззрения:**\nИх переписка 2023-2024 годов --- это абсолютный монолит кибер-культуры.\nОни достигли стадии, когда им даже не нужно заканчивать предложения ---\nвторой всё понимает по одному слову («Дирон», «База», «Скуф»). Реальная\nжизнь для них --- это просто декорация, серый фон. Настоящие эмоции,\nдрамы, победы и поражения происходят в лобби Lethal Company, на миде в\nДоте и в голосовых каналах Дискорда. Их токсичность --- это толстый\nпанцирь, под которым скрывается уникальная, нерушимая братская связь\nдвух людей, плывущих в одной лодке по волнам русского абсурда."}], "id": 17, "seq": 18}, {"roman": "XV", "subtitle": "ЗАЩИТА ДИПЛОМА, SUNO AI И СКУФЕЙСК", "period": "Апрель 2024 --- Сентябрь 2024 года.", "ages": "Андрей (25-26 лет), Михаил (22-23 года).", "codename": "Лето 24-го: Нейро-Трап, PVE-Тарков и 10 Trillion Beers", "sections": [{"num": 1, "title": "ЭПОХА И ВАЙБ (СЕЗОН)", "content": "* **Временной период:** 27 Апреля 2024 --- Сентябрь 2024 года.\n* **Название сезона:** «Нейросетевое Безумие, Защита Диплома и Эра\nDeadlock».\n* **Главный лейтмотив:** Симбиоз тревоги и нейросетей. Михаил\nпытается закончить университет, параллельно спасаясь от реальности в\nодиночном Таркове (SPT). Андрей убивает время на работе, генерируя\nабсурдные песни через Suno AI. Их диалоги --- это непрерывный смех до\nслез (ФЫАХАФЫХ) над сгенерированным контентом, перемешанный с\nобсуждением новых игр и пивных акций."}, {"num": 2, "title": "ГЛОБАЛЬНЫЙ ФОН И МИРОВЫЕ СОБЫТИЯ", "content": "Внешний мир обсуждается через призму громких релизов и скандалов:\n* **Тарковский Скам (Unheard Edition):** Главная игровая драма 2024\nгода. Разработчики просят 11 000 рублей за PVE-режим. Братья в ярости.\n*«КТО ЗНАЛ ЯТО НИКИТА БУЯНОВ ВСЕХ ПРОГРЕЕТ ТАК СИЛЬН... И ВЕДЬ\nПРОДАДУТ ПВЕ»*.\n* **Сериал Fallout (Amazon):** Смотрят запоем. *«ДОСМОТРЕЛ ФОЛЫЧ\nТОП... Играл по доброму и на него сбросили бомбы»*.\n* **Замедление YouTube в РФ (Август 2024):** *«Обходим замедление\nYouTube через GoodbyeDPI... ИНТЕРНЕТ ЛИКВИДИРОВАН»*.\n* **Сериал «Пацаны» (The Boys, 4 сезон):** Смотрят, спойлерят друг\nдругу и обсуждают озвучки.\n* **Бум Deadlock:** Анонс и альфа-тест новой игры от Valve\nполностью захватывает их внимание к концу лета."}, {"num": 3, "title": "СЛОВАРЬ И ЛОКАЛЬНЫЕ МЕМЫ", "content": "* **ФЫАХАФЫХ... / ЗЫФАЗЩАФЫЩЗАФЫ** --- Абсолютная доминанта\nобщения. Если сообщение не содержит капс из случайных букв --- значит,\nдень прожит зря. Означает дикий смех и истерику.\n* **Скибиди / Skibidi Ohio** --- Высшая степень бреда (brain rot),\nкоторую они постиронично внедряют во все слова. *«За окном скибиди в\nбежевом платьице», «Скибиди тарков»*.\n* **Скуф / Скуфейск / Скуф-гейминг** --- Ироничное принятие своей\nвзрослой, ленивой жизни с пивом и лишним весом. *«СКУФЕЙСК», «Майндсет\nзаводчанина»*.\n* **Сабжи / Капуста** --- Деньги.\n* **HUR HUR HUR** --- Звук Фредди Фазбера (FNAF). Универсальная\nреакция.\n* **Дрова / Бад / Гара** --- Алкоголь. *«Бад лайт два слота»*.\n* **Валекс Джонсон (Valex Johnson)** --- Вымышленный персонаж, их\nстарое альтер-эго, которое они ставят на никнеймы. *«ДОБРЫЙ ПОЛЯК\nВАЛЕКС ДЖОНСОН ЗАШЕЛ И ЕГО ВЫКИНУЛО ИЗ ИГРЫ»*."}, {"num": 4, "title": "БЕСТИАРИЙ И NPC", "content": "* **Никита Буянов** --- Создатель Таркова. Главный злодей эпохи,\nпрогревший их на деньги. *«Ебало буянова когда он это придумывает»*.\n* **Папич (Arthas)** --- Его переезд в Дубай вызывает гомерический\nсмех. Они читают комментарии под его видео как Библию. *«АМЕРИКА БЛЯТТ\nВЫ ВИДЕЛИ ЧТО НИБУДЬ ПОДОБНОЕ В РОССИИ??... ОПЕРАТОР В ХИДЖАБЕ ЭТО\nСЮР»*.\n* **Назар / Скандал** --- ИРЛ-друг и тиммейт. *«Назар отвечает за\nподразделение КС, я за доту, ты за Тарков... И БЕРЕМ ТУРИКИ»*.\n* **Костян Муринчик** --- Вечная жертва рофлов. *«Вспомни как у\nКостяна Дота лагает на проце за 30к и 3080»*.\n* **MellowBite (Дозер, Поляна, Стив) / Воскресенский** --- Идолы\nтрэп-сцены. Они обсуждают их каждый день.\n* **Озон (Ozon671Games)** --- Стример. *«СЮР... ОЗОН В 12 НОЧИ А\nПОТОМ КРЫША ЕДЕТ»*."}, {"num": 5, "title": "⚔️ КВЕСТЫ, СПОРЫ И КЛАДБИЩЕ ИДЕЙ", "content": "* **ГРАНД-КВЕСТ «Защита Диплома»:** Михаил заканчивает университет.\nОн сидит в Дискорде и репетирует речь: *«Добрый день уважаемые члены\nкомиссии... слышь ты жирный уродливый ребенок иди отсюда говно»*.\nЗащита проходит онлайн, Андрей комментирует это как киберспорт.\n* **Квест «Песни в Suno AI»:** Величайшее открытие сезона. Андрей и\nМихаил генерируют абсурдные песни через нейросеть Suno.com. Они создают\n\"Бразильский фонк\", \"Дискорд ремикс\", песню \"Бутерброд звонит\" и\nтрек \"Белка попса\". У них буквально идут слезы от смеха: *«Я\nОБОССАЛСЯ НАХУЙ У МЕНЯ СЛЁЗЫ ИДУТ... ЭТО САМЫЙ КРУТОЙ ТЭГ В ИСТОРИИ\nЧЕЛОВЕЧЕСТВА»*.\n* **Спор «Tarkov PVE vs SPTarkov»:** Михаил отказывается покупать\nофициальный PVE за 11к рублей и уходит в пиратский SPT (синглплеер-мод),\nнаваливая туда сотни модов на ботов (SAIN, SWAG). Андрей смеется над\nним, но в итоге тоже подсаживается.\n* **Золотой фонд цитат:**\n> *Михаил: «мама всегда говорила мне ляна добывай деньги И ВЫЖИВАЙ»*\n> *Вы: «Я когда родился, не рыдал как сучка, я сразу сел...»*\n> *Вы: «Топ радостей в жизни по возрастанию: 1. Отбеливатель с\nщеткой»* (Локальный бред)."}, {"num": 6, "title": "ГЕОГРАФИЯ И ЛОКАЦИИ", "content": "* **Тарков (Развязка, Эпицентр, Резерв):** Виртуальная родина.\nМихаил знает эти карты лучше, чем улицы родного города.\n* **ННГАСУ (Краснуха):** Локация финального босса Михаила\n(Диплом).\n* **Дзержинск (ДЗР):** Родной город. Походы в \"КБ\", \"Пивоман\" и\n\"Спар\".\n* **Офис / Работа:** Тюрьма Андрея, где он генерирует ИИ-песни.\n* **GeoGuessr (Биробиджан / Улан-Удэ / Сахалин /\nКомсомольск-на-Амуре):** Братья играют в угадывание городов по\nпанорамам. *«ЭТО ОРСК ДОРОГИЕ ЗЕМЛЯКИ»*."}, {"num": 7, "title": "ЭКОНОМИКА И АРСЕНАЛ", "content": "* **Broke Boys:** Безденежье --- стиль жизни. *«На броуке\nсегодня... СКИНЬ СОТКУ СЮЕР»*.\n* **Дефицит Таркова:** Андрей горит с экономики официального PVE.\n*«А смысл в пве так демпить цены... АКБ по 5 миллионов, Карты по\n40... Надо фармить пока дают»*.\n* **Вишлист:** Желание купить куртку *East Crane*, страйкбольный\nпривод (Аирсофт) и мощную оперативку для компа (*«Просто иди в магазин\nи купи ОПЕРАТИВУ»*)."}, {"num": 8, "title": "КУЛЬТУРНЫЙ КОД И МЕДИА (КИНО И МУЗЫКА)", "content": "* **Музыка:** MellowBite, OG Buda, Воскресенский. *«Я НЕ ЛЮБЛЮ\nКОКАИН»*. Они слушают это нон-стоп и переделывают их тексты в\nнейросетях.\n* **Стримеры:** Папич (Arthas) в Дубае, Рекрент (Recrent), Глад\nВалакас, Мэддисон.\n* **ТикТок / Шортсы:** Одержимость \"Скибиди\", мемами про\n\"Жирного уродливого ребенка\" (Fat ugly kid) и \"My honest reaction\".\n*«захожу в тикток у меня уже 200 входящих»*.\n* **SCP Foundation:** Внезапное увлечение крипипастой. *«SCP -\n7:18 - бутерброд с колбасой совершает звонок на телефон который нельзя\nотменить»*."}, {"num": 9, "title": "ИГРОВОЙ АРСЕНАЛ И СТРИМЫ (ОТДЕЛЬНЫЙ ПУНКТ)", "content": "* **Escape from Tarkov (SPT & PVE):** Это болезнь. Михаил ставит\nмоды на интеллект ботов (SAIN) и кричит от ужаса. *«Я ВЫШЕЛ СО СПАВНА И\nУЖЕ ДВА ЮСЕКА ЕБАНУТЫХ 38 ЛВЛ ТАМ БОЙНЯ... Я ЗАПЛАЧУ ЩАС»*.\n* **Deadlock (Август-Сентябрь 2024):** Новая зависимость. *«ПОШЛИ\nВ ДЕДЛОК ПРОСТО»*. Играют на Абрамсе (*«Абрамс пьяный мастер»*), Лэше\nи Пангольере (переносят названия из Доты).\n* **GeoGuessr:** Угадывают русские города по разбитым дорогам.\n*«жесткий клатч в гесере по биому»*.\n* **Bodycam:** *«ИГРА БУКВАЛЬНО УБИЙСТВО В 3Д... ТАМ ПИЗДЕЦ\nСТРАШНО БУДЕТ»*.\n* **DOTA 2:** Редкие заходы ради патча 7.36. *«ПУДЖ ЧЕРЕЗ\nБОМЖА... ТЕПЕРЬ ОН САМЫЙ СИЛЬНЫЙ ГЕРОЙ»*."}, {"num": 10, "title": "БРАТСКИЕ БАТЛЫ И ТОКСИЧНОСТЬ", "content": "* **Стиль общения:** Это не токсичность, это искусство. Оскорбления\nдоведены до абсолюта. «Пидорас», «Даун», «Уебище» --- базовые артикли.\n* **Батлы в Дискорде:**\n> *Вы: «сказал бы ты мне это в реале, я бы тебе все ебало\nраскрошил»*\n> *Михаил: «я бы щас пришел к нему домой и просто нахуй ебальник бы\nему разбил сука»*\n* **Батл за игру:** Андрей: *«Отдай аккаунт пидарас»*. Михаил:\n*«не дам»*. Андрей: *«Я тебе в чай слабительное добавлю»*."}, {"num": 11, "title": "ГАСТРОНОМИЯ И РАЦИОН", "content": "* **Трэш-кулинария:** *«Жареные письки хахахаха»*. Супы из банки,\nперловка (вспоминая армию), сосиски.\n* **Острая пища:** Андрей: *«Вчера маринованные перцы съел\nострые... Сегодня возмездие пришло ДАЖЕ СИДЕТЬ БОЛЬНО»*.\n* **Фастфуд:** Шаурма V.I.P., Додстер (Dodo), «Биг Бон».\n* **Энергетики:** Флэш (Flash), Адреналин. *«литровый флеш»*."}, {"num": 12, "title": "АЛКОГОЛЬНЫЙ СЧЕТЧИК И ПИВНАЯ СТАТИСТИКА", "content": "* **Контекст:** Лето, Жара, Пиво.\n* **Напитки:** Пиво Bud (Бад) --- абсолютный лидер. *«12 бутылок\nбада... 10 trillion beers please»*. Пиво «Макарий», крафт «Атомная\nПрачечная» (Jaws). Вино, Соджу. Водка «Талка».\n* **Последствия (Код Коричневый):**\n> *Михаил: «ПОХМЕЛЬНЫЙ СОН... меня случайно не избили У МЕНЯ ВСЕ\nБОЛИТ»*.\n> *Вы: «Я не помню нихуя как я тут шел... Я обоссался в доте»*.\n* Михаил разбил банку пива в Пятерочке и сбежал: *«МИНУС 10000\nАУРА»*."}, {"num": 13, "title": "ХРОНИКИ ПРОКРАСТИНАЦИИ И УСПЕХОВ", "content": "* **Вместо дела:** Михаил делает всё, что угодно (качает моды на\nСкайрим на 340 ГБ, делает ИИ-песни, играет в Геогессер), лишь бы не\nготовиться к защите диплома. Андрей сидит на работе и читает комментарии\nна YouTube про Папича.\n* **ДОСКА ПОЧЕТА:** МИХАИЛ ЗАЩИТИЛ ДИПЛОМ! (Судя по тому, что летом\nон уже абсолютно свободен и пьет Бад днем). Андрей выбил крутую пушку в\nТаркове."}, {"num": 14, "title": "РЕЖИМ «ДУШНИЛЫ» И ИНТЕЛЛЕКТУАЛЬНЫЙ СНОБИЗМ", "content": "* **Suno AI Инженерия:** Они дотошно прописывают промпты (теги) для\nИИ, чтобы получить идеальный \"бразильский фонк\" или \"грязный рэп\".\n* **Тарковская Душнота:** Михаил читает лекции Андрею про то, как\nработают моды SAIN и SWAG на ботов, как настроить FOV и что такое\n\"динамический спавн\". Андрей в ответ орет: *«ДА ЗАЕБАЛ Я ПРОСТО ЕБАШУ\nИ ВСЁ»*."}, {"num": 15, "title": "ВНУТРЕННИЙ КИНЕМАТОГРАФ И ТЕАТР ОДНОГО АКТЕРА", "content": "* **Песня про Бутерброд:** Величайший ИИ-шедевр чата. *«Бутерброд\nзвонит... Невозможно отклонить... Хлеб и колбаса набирают номера»*.\nОни сгенерировали этот трек и слушали на репите, умирая от смеха.\n* **Пересказ Снов (Шиза):**\n> *Михаил: «мне снилось что я был на концерте воскресенского и он\nп
