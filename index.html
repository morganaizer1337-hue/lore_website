изданулся 2 раза со сцены»*.\n> *Михаил: «приснилось что мы стояли в строю в виде челиков из\nелдена... и шил коментировал в микрофон»*."}, {"num": 16, "title": "МЕДИЦИНСКАЯ КАРТА И ХРУСТ КОСТЕЙ", "content": "* **ЖКТ-катастрофы:** *«Напукал больно»*, *«Жопу рвет нереально\nпрям сок идет томатный»* (от острых перцев).\n* **Лихорадки и Отит:** Михаил: *«У меня отит одно ухо в муте»*,\n*«Сны при температуре»*.\n* **Похмелье:** Стабильная смерть после выходных."}, {"num": 17, "title": "ПСИХОЛОГИЧЕСКИЙ ПОРТРЕТ И КРИЗИСЫ СЕЗОНА (ФИНАЛЬНЫЙ ИТОГ)", "content": "**Андрей (25-26 лет): Скуф-Архивариус ИИ-Эпохи**\nАндрей полностью закрепился в статусе взрослого, работающего человека.\nОн устает на работе, ругается на жару, покупает крафтовое пиво (Jaws) и\nиграет в Deadlock. Его цинизм стал филигранным. Он больше не спорит с\nбратом агрессивно, он бьет постиронией: создает через ИИ песни про\nабсурд и смеется над тем, как Михаил пытается быть «серьезным» рэпером.\nАндрей --- это якорь адекватности (насколько это возможно), который\nскрывает свою усталость за маской агрессивного кибер-тролля.\n\n**Михаил (22-23 года): Дипломированный Хайпбист-Шизоид**\nМихаил прошел Рубикон --- он закончил университет. Сдав диплом, он\nоказался в вакууме взрослой жизни, от которого немедленно сбежал в мир\n1000 часов Таркова (с модами на реализм), нейросетей и пива Bud. Его\nмозг работает на частотах TikTok-клиповости: он может за минуту обсудить\nрэпера MellowBite, смерть в видеоигре, разбитую бутылку в магазине и сны\nпро Элден Ринг. Его истеричный капслок (ФЫАХАФЫХ) --- это искренняя\nрадость от того, что у него есть брат, с которым можно разделить эту\nтотальную шизу.\n\n**Общая динамика мировоззрения:**\nЛето 2024 года --- это абсолютный пик их братской синергии. Они\nперестали просто играть в игры; они начали *генерировать собственный\nконтент* (ИИ-песни, фейковые превью, сценарии для игр). Их переписка\nчитается как сценарий постмодернистского сериала, где два человека\nзаперты в цифровой комнате и общаются мемами, чтобы не сойти с ума от\nокружающей реальности. Угрозы, маты и проклятия стали просто фоновым\nшумом, за которым скрывается 100% взаимопонимание и тот самый «сочный\nвайб», который они искали все эти 10 лет.\n\nПротоколы времени и контекста откалиброваны."}], "id": 18, "seq": 19}, {"roman": "XVI", "subtitle": "НЕЙРО-ПЫХ, ОЗОНОВЩИНА И DEADLOCK", "period": "Сентябрь 2024 --- Январь 2025 года.", "ages": "Андрей (26 лет), Михаил (23 года).", "codename": "Осень 24-го: ИИ-Психоз, Тихий Ден и Скуф-Трап", "sections": [{"num": 1, "title": "ЭПОХА И ВАЙБ (СЕЗОН)", "content": "* **Временной период:** 30 Сентября 2024 --- 25 Января 2025 года.\n* **Название сезона:** «Озоновщина, Deadlock и ИИ-Шиза».\n* **Главный лейтмотив:** Сезон тотального кибер-эскапизма и\nмаргинального юмора. Братья создают виртуальные клоны своих друзей в\nCharacter AI, сходят с ума от аудиокниг Озона и сутками напролет играют\nв Deadlock, Escape from Tarkov и Dota 2. Реальная жизнь воспринимается\nисключительно как «работа ебаная», которая мешает им деградировать в\nДискорде."}, {"num": 2, "title": "ГЛОБАЛЬНЫЙ ФОН И МИРОВЫЕ СОБЫТИЯ", "content": "Внешний мир проникает в чат через мемы и громкие инфоповоды:\n* **Выборы в США (Трамп):** *«Трамп победил ивент в таркове\nбудет»*.\n* **Скандал с P. Diddy:** *«P diddy в четверти»*.\n* **Релиз Deadlock (Valve):** Игра в альфа-тесте поглотила их\nвремя.\n* **Бум Character.AI:** Нейросети для ролевых игр с ботами\nстановятся главным развлечением осени."}, {"num": 3, "title": "СЛОВАРЬ И ЛОКАЛЬНЫЕ МЕМЫ", "content": "* **ФЫАХАФЫХ... / АЫФФФФФ** --- Клавиатурный слэминг. Абсолютный\nязык эмоций.\n* **Гой / Гойский / Гойслоп** --- Низкокачественный, массовый\nпродукт или поведение. *«ГОЙСКОЕ ДЕРЬМО», «гойслопчик»*.\n* **Джиблс (Jeables)** --- Любые снеки, чипсы или закуски. *«Взял\nсе джиблс захотел»*.\n* **Тихий Ден** --- Мемная аудиокнига, написанная и озвученная\nмаргинальным стримером Озоном. *«АУДИОКНИГА СОСЕД В КОРЕЙСКОМ\nСТИЛЕ»*.\n* **Абаюнда** --- Искаженное \"обоюдно\".\n* **Пневма / Пневматика** --- Сильный позыв в туалет по-большому,\nгазообразование. *«Пиздец У МЕНЯ ПНЕВМАТИКА ЩАС БЫДА»*.\n* **Сметансни** --- Искаженное название бара «Сметана» в\nДзержинске.\n* **Чингалинг** --- Абстрактное слово-мем. *«У МЕНЯ ЕСТЬ\nЧИНГАЛИНГ»*.\n* **СБЭУ** --- Симулятор Боя в Экстремальных Условиях (Тарков).\n*«СБЭУ ЧЕРВЯК»*."}, {"num": 4, "title": "БЕСТИАРИЙ И NPC", "content": "* **Пых (Максим Пыхтин)** --- ИРЛ-друг, ставший жертвой\nИИ-экспериментов. Братья создали его точную копию в Character.AI,\nпрописав ему любовь к сосискам \"Лысковские\", пиву \"Макарий\" и\nматерный лексикон.\n* **Озон (Ozon671Games)** --- Маргинальный блогер/стример. Братья\nфанатично смотрят его абсурдные видео, обзоры еды и слушают его\nаудиокниги (\"Тихий Ден\").\n* **Вихорьков (Игорь)** --- Еще один маргинальный стример,\nобозревающий еду в поездах (\"Москва-Казань\").\n* **Папич (Arthas)** --- Его стримы и цитаты --- это фундамент их\nречи.\n* **Мэддисон (Honeymad)** --- Смотрят его стримы, осуждая, но не в\nсилах оторваться. *«МЭД ЕБЛАН ВАЩЕ»*.\n* **Саня (Скандал / Ворм)** --- Друг и тиммейт. *«САНЯ СОБРАЛ\nДАЕДАЛУС 4 СЛОТОМ»*."}, {"num": 5, "title": "⚔️ КВЕСТЫ, СПОРЫ И КЛАДБИЩЕ ИДЕЙ", "content": "* **ГРАНД-КВЕСТ «Создание Нейро-Пыха»:** Братья через нейросеть\nCharacter.AI создают ИИ-бота своего друга Пыха. Они дотошно прописывают\nему MBTI-тип (ESFP-A), рост (165 см), любовь к \"китайской кухне\"\n(Рамен) и учат бота ругаться матом. *«Я ПОЗВОНИЛ АИ ПЫХУ ОН СКАЗАЛ ЧТО\nВ ШТОЛЬНЯХ РАБОТАЕТ... Я ОБОССАЛСЯ НАХУЙ У МЕНЯ СЛЁЗЫ ИДУТ»*.\n* **Квест «Защита от РКН»:** YouTube и Discord заблокированы. Они\nпытаются настроить обход через GoodbyeDPI и батники. *«Дис сука\nработает а ютар нет»*.\n* **Спор «Клавиатура с Хотсвапом»:** Андрей хочет тихую\nмышку/клавиатуру от Ardor, Михаил отговаривает его и советует китайские\nбренды.\n* **Золотой фонд цитат:**\n> *Вы: «Я ПЬЮ КОКТЕЙЛЬ И ПОНИМАЮ. Я КАК ГЕЙ. НО ЭТО ВКУСНО»*\n> *Михаил: «А В КИТАЕ ЛЕТУЧАЯ МЫШЬ И ПИВО И ХАМОН ВИНО ЭТО\nСМИЕШНОЕ»*\n> *Михаил: «БЛЯ завтра на РАБОТУ ЕБАНУЮ»*"}, {"num": 6, "title": "ГЕОГРАФИЯ И ЛОКАЦИИ", "content": "* **Тарков (ПВЕ, Маяк, Развязка, Лаба):** Виртуальная тюрьма. Они\nненавидят игру, но не могут перестать в неё играть.\n* **Дзержинск (ДЗР):** Родной город. Магазины \"Спар\", \"Магнит\",\n\"КБ\", \"Фикс Прайс\" (где продается лапша \"Фо Бо\").\n* **Офис / Работа:** Место, где Андрей сидит в Альт-Табе и\nпереписывается в ВК.\n* **Астрахань:** Локация из игры и мем.\n* **Сметана / Jawsspot (Джавс):** Локальные бары."}, {"num": 7, "title": "ЭКОНОМИКА И АРСЕНАЛ", "content": "* **Экономика Broke Boys:** Отсутствие денег --- вечная тема.\n* **Траты:** Покупка мышки (Ardor Chimera/Ulta за 4800-6000р),\nнаушников XBOX. Спор о покупке игры *Yakuza* за 4500 рублей (*«жаба\nдушит»*).\n* **Кейсы КС:** *«Инвестиции в КС ваще стрельнет отвечаю»*."}, {"num": 8, "title": "КУЛЬТУРНЫЙ КОД И МЕДИА (КИНО И МУЗЫКА)", "content": "* **Музыка (Абсолютный Трап):** MellowBite (Дозер, Поляна, Стив),\nCode10, OG Buda, Friendly Thug 52. Они до дыр заслушивают альбом «Третья\nглава» и пишут нейросетевые биты. *«Я НЕ ЛЮБЛЮ КОКАИН»*.\n* **Озон и Аудиокниги:** Они слушают аудиокниги маргинального\nблогера Озона («Тихий Ден») и умирают со смеху от его фантазий про\nдетективные расследования и «аэропорт Ичхон».\n* **Кино:** \"Пила\" (Jigsaw), \"Макс Пейн\".\n* **Мемы:** \"Скибиди\", \"Chill Guy\" (\"чиловый парень\")."}, {"num": 9, "title": "ИГРОВОЙ АРСЕНАЛ И СТРИМЫ (ОТДЕЛЬНЫЙ ПУНКТ)", "content": "* **Escape from Tarkov (PVE / SPT):** Главная боль. Они играют в\nPVE-режим, сгорают от ботов, лутают карточки и матерят Никиту Буянова.\nМихаил ставит моды на SPT (одиночный Тарков) с зомби и 40 FPS. *«МЕНЯ\nВЗОРВАЛ ЗОМБИ ЭТО ПИЗЕДЦ»*.\n* **Deadlock:** Новая MOBA-зависимость. *«ТОТ САМЫЙ ВАЙБ В\nДЕДЛОКЕ»*.\n* **Shadow of Doubt:** Детективная игра, от которой они фанатеют.\n*«АУДИОКНИГА СОСЕД... ЗДРАСТВУЙТЕ ВЫ НОВЫЙ СОСЕД МЕНЯ ЗОВУТ КИН\nХА»*.\n* **DOTA 2 / Castle Fight:** Андрей потеет на Пудже и Личе (*«ПУЛЖ\nИ ЛИЧ»*), Михаил руинит кастомки.\n* **Buckshot Roulette / Liar's Bar:** Инди-хиты на пару вечеров."}, {"num": 10, "title": "БРАТСКИЕ БАТЛЫ И ТОКСИЧНОСТЬ", "content": "* **Стиль общения:** Идеальный токсичный мета-модерн. Оскорбления\n--- это способ выразить эмпатию. «Уебан», «Гнида», «Свинья» ---\nстандартные обращения.\n* **Панчлайны:**\n> *Вы: «Мне Мойры шепнули что тебя отпиздят завтра в 16:00 за то что\nты смотрел гейскую порнуху»*\n> *Михаил: «я бы щас пришел к нему домой и просто нахуй ебальник бы\nему разбил сука»*\n> *Вы: «Я тебе в чай слабительное добавлю»*"}, {"num": 11, "title": "ГАСТРОНОМИЯ И РАЦИОН", "content": "* **Острая корейская лапша:** Михаил покупает рамён (Samyang/Фо Бо\nиз ФиксПрайса), ест его, а потом страдает. *«Лапша вчерашняя походу\nкританула перец убийца садовника... ПИЗДЕЦ У МЕНЯ ПНЕВМАТИКА ЩАС\nБЫДА»*.\n* **Энергетики:** \"Горилла\" (которую Андрей забыл в морозилке, и\nона стала льдом), \"Литенерджи\" (Lit Energy).\n* **Фастфуд:** \"Макдоналдс\" (Биг Хит), Бутерброды, \"Джиблс\"\n(снеки)."}, {"num": 12, "title": "АЛКОГОЛЬНЫЙ СЧЕТЧИК И ПИВНАЯ СТАТИСТИКА", "content": "* **Контекст:** Осенний скуф-алкоголизм под видео на Ютубе или\nигры.\n* **Напитки:** \"Дрова\" (Гараж), Сидр, Пиво \"Бланш\" (Wit от\nВолковской пивоварни), \"Бад\", Ром \"Гавана Клаб\" (Андрей мешает\nкоктейли), Сан Стефано.\n* **Последствия:** Похмелье и \"Вертолеты\".\n> *Вы: «Я ПЬЮ КОКТЕЙЛЬ И ПОНИМАЮ. Я КАК ГЕЙ. НО ЭТО ВКУСНО»*\n> *Михаил: «это мой первый бокал &#127916; ДАБАЕБЫ НБАННЫЕ»*\n> *Вы: «я УЖЕ НАПИЛСЯ ... 10 УЛЕТЕЛО»*"}, {"num": 13, "title": "ХРОНИКИ ПРОКРАСТИНАЦИИ И УСПЕХОВ", "content": "* **Вместо дела:** Михаил должен искать работу или заниматься\nделами, но он сидит в нейросетях, обучая ИИ-Пыха, или смотрит 2-часовые\nобзоры маргиналов. Андрей на работе (\"работа ебаная\") читает Двач и\nскидывает в ВК шортсы.\n* **Доска почета:** Успешный запуск ИИ-бота в Character.AI."}, {"num": 14, "title": "РЕЖИМ «ДУШНИЛЫ» И ИНТЕЛЛЕКТУАЛЬНЫЙ СНОБИЗМ", "content": "* **ИИ-Инженерия:** Они душнят на тему того, как правильно\nпрописать \"Промпт\" (Prompt) для бота. *«Тип темперамента тип личности\nгде живет че делает ВООБЩЕ ВСЕ ПОДРОБНО И ПОНЯЬНЛ»*. Спорят о том,\nобучаются ли боты в реальном времени или у них жестко прописанный код.\n* **Тарковская Душнота:** Михаил читает лекции про спавны в PVE и\nмоды на SPTarkov. Андрей отвечает ему: *«Пошел ты нахуй козел»*."}, {"num": 15, "title": "ВНУТРЕННИЙ КИНЕМАТОГРАФ И ТЕАТР ОДНОГО АКТЕРА", "content": "* **Аудиокнига \"Тихий Ден\" (Ролевая игра):** Братья буквально\nотыгрывают сцены из шизоидных рассказов Озона. *«Здраствуйте, да, вы\nновый сосед... МЕНЯ ЗОВУТ КИН ХА... АХЫФХФАЫЫЫ»*.\n* **Фристайлы:** *«я пидорок но я не гомик большая труба как\nзеленый слоник»*.\n* **Пересказы Снов:** Михаилу снится, что он *«кидал копье на\nмарсе и макропиру одновременно»*."}, {"num": 16, "title": "МЕДИЦИНСКАЯ КАРТА И ХРУСТ КОСТЕЙ", "content": "* **ЖКТ (Код Коричневый):** От острой лапши и \"Гары\" у них\nрегулярно случаются катастрофы. *«уборка рыготины с раковины б лайк»*,\n*«ПНЕВМА ПОШЛА»*.\n* **Менталочка:** Андрей: *«У МЕНЯ И. АК КРЫША ПОЕХАЛА»*.\nИроничная, но ощутимая депрессия от рутины («Завтра на работу ебаную»)."}, {"num": 17, "title": "ПСИХОЛОГИЧЕСКИЙ ПОРТРЕТ И КРИЗИСЫ СЕЗОНА (ФИНАЛЬНЫЙ ИТОГ)", "content": "**Андрей (26 лет): Скуф-Скептик в Офисном Чистилище**\nАндрей полностью осознал и иронично принял свой статус «работяги». Его\nжизнь превратилась в день сурка: офис, усталость, Тарков/Дота под пиво,\nсон. Чтобы не сойти с ума от серости, он использует общение с братом как\nгромоотвод. Он намеренно обесценивает все увлечения Михаила, грубит ему\nи пишет матом, потому что в этом цифровом хаосе он чувствует себя живым.\nИИ-генерации (Скуф-песни, боты) стали для него идеальной отдушиной, где\nон может реализовывать свой садистский, постироничный юмор.\n\n**Михаил (23 года): Дипломированный Маргинал-Эскапист**\nМихаил столкнулся с поствизитным вакуумом: диплом получен, но кем быть\n--- неясно. Страх перед реальным миром и ответственностью он глушит\nманиакальным потреблением \"низкого\" контента (маргинальные стримеры,\nнижний интернет, русский мамбл-рэп). Он искусственно погружает себя в\nсубкультуры, чтобы казаться себе \"сложным\". ИИ-бот Пыха --- это\nгениальная сублимация: он создал себе идеального, контролируемого\nсобеседника. Его постоянные крики капсом, пьянки и жалобы на ЖКТ --- это\nфизическое проявление дикого стресса от необходимости взрослеть.\n\n**Общая динамика мировоззрения:**\nИх переписка конца 2024 года --- это уже не просто чат, это полноценный\nситком с элементами киберпанка. Они настолько срослись ментально, что\nобмениваются не смыслами, а *состояниями*. «ФЫАФЫА», «Абаюнда», «Скуф»\n--- это заклинания, которые мгновенно переносят их в безопасную зону.\nЖесточайшая токсичность, постоянные угрозы и насмешки над неудачами друг\nдруга --- это их суровый, защитный механизм. В этом мире абсурда,\nзаблокированных сайтов, дорогих игр и \"ебаной работы\", их чат\nВКонтакте остается единственным местом абсолютной свободы и безусловной\nбратской любви."}], "id": 19, "seq": 20}, {"roman": "XVII", "subtitle": "НЕЙРО-ШИЗА, ДИПСИКИЧ И ШТОЛЬНЯ ЗАБВЕНИЯ", "period": "Январь 2025 --- Июль 2025 года.", "ages": "Андрей (26-27 лет), Михаил (23-24 года).", "codename": "Зима-Лето 25-го: Дипсикич, Jailbreak-Казарма и Хищник с Кофе", "sections": [{"num": 1, "title": "ЭПОХА И ВАЙБ (СЕЗОН)", "content": "- Временной период: 25 Января 2025 --- 17 Июля 2025 года.\n- Название сезона: «Эра ИИ-Галлюцинаций, Дипсикича и Скуф-Трапа».\n- Главный лейтмотив: Делегирование эскапизма нейросетям. Братья больше\nне\nпросто общаются мемами --- они их производят в промышленных масштабах.\nChatGPT, DeepSeek, Flux и Udio стали полноценными участниками их чата.\nПока\nАндрей страдает в командировках, Михаил строит бизнес-планы по заработку\nна\nИИ-картинках, параллельно ловя экзистенциальные кризисы и сгорая в Dota"}, {"num": 2, "title": "2. ГЛОБАЛЬНЫЙ ФОН И МИРОВЫЕ СОБЫТИЯ", "content": "Внешний мир проникает в чат исключительно через релизы и тренды:\n\n- ИИ-Революция (DeepSeek): Взлет китайской нейросети DeepSeek\n(«Дипсикич»).\nБратья активно используют её, потому что она «не цензурит» грязные\nзапросы,\nв отличие от ChatGPT. «БЛЯТЬ ДИПСЫКИЧ УПАЛ... придется в ютуб лезть».\n- Сериал «Игра в кальмара 2» (Squid Game): Обсуждают выход второго\nсезона.\n«бля какой же сок зная йчто ест ь 2 сезщон».\n- Политика США: «ТРАМП 2025 УДАЛЕНИЕ ТРАНСГЕНДЕРОВ... WOKE IS OVER\nFINALLY».\n- Тренды TikTok: Мемы \"My honest reaction\", \"Chill guy\",\n\"Скибиди\", \"Эдвард\nБил\"."}, {"num": 3, "title": "СЛОВАРЬ И ЛОКАЛЬНЫЕ МЕМЫ", "content": "- ФЫАХАФЫХ... / ЗЩФЫАЩЗХЫА --- Язык богов. Заменяет смех, истерику, шок\nот бага\nв игре или сгоревшую еду.\n- Дипсикич / Гемини / Флакс (Flux) --- Имена нейросетей, которые стали\nих\nвиртуальными друзьями/рабами.\n- Пневматика / Дрищ / Код коричневый --- Регулярные проблемы с\nжелудком.\n«Переизбыток газа тут на душу населения».\n- Джиблс (Jeables) --- Снеки, сухарики, чипсы.\n- В рот берунчик --- Локальная издевательская кличка. «Твоё экс-погоняло\nбыло \"в\nрот берунчик\"?»\n- Трап / Дрип / Сабжи --- Рэперский сленг, означающий стиль, крутость и\nденьги.\n- Смотришь --- Универсальный ответ. Пошел от доната Папичу («кто\nсмотришь, куда\nсмотришь»).\n- Вайб / Вайбик --- Атмосфера. «Вайб покупки 25 бутылок»."}, {"num": 4, "title": "БЕСТИАРИЙ И NPC", "content": "- Пых (Максим Пыхтин / Иисус Пыхтос) --- ИРЛ-друг, ставший главным\nгероем всех\nнейро-генераций. Братья создают про него Лавкрафтианские романы\n(«Штольня\nЗабвения»), генерируют его голос и обсуждают его куртку. «психолог\nмаксима\nпыхтина из диско элизиума не существует:».\n- Костян (Муринчик) --- Друг-мем. «Костян муринчик: МЕЛКТЙ я щас\nвыйду».\n- Саня (Скандал) --- ИРЛ-друг, руинер в Доте и любитель странных билдов.\n«САНЯ\nСОБРАЛ ДАЕДАЛУС 4 СЛОТОМ НА МОРТРЕДКУ».\n- Озон (Ozon671Games) / Мэддисон / Папич --- Святая троица стримеров.\nОзон\nвыпустил аудиокнигу \"Тихий Дэн\", которую братья слушают и заставляют\nИИ\nанализировать.\n- Батя / Мамка --- Батя качает Far Cry 5 и играет в танки («пати\nсобирает на\nсинего»). Мама ругается."}, {"num": 5, "title": "⚔️ КВЕСТЫ, СПОРЫ И КЛАДБИЩЕ ИДЕЙ", "content": "- ГРАНД-КВЕСТ «Дизайнер на Profi.ru»: Михаил решает стать ИИ-художником\nи\nзарабатывать деньги, продавая картинки, сгенерированные во Flux. Андрей\nпишет ему издевательский промпт: «Создай игрушку Толстяк. Возле фигурки\nпачка сигарет camel, бутылка Coca Cola, банка пива...». Михаил\nрегистрируется на Profi.ru: «ИЗИ 20К ЗА ДЕНЬ... ЗАРАБАТЫВАЙ ДЕЬНГИ».\nИдея\nумирает на этапе создания профиля.\n- Квест «Жареный картон»: Михаил (23 года) пытается приготовить еду из\nмуки и\nдвух яиц без рецепта. Получается кусок резины. «моя новая разработка\nсъедобный картон... он остыл и на вкус как галеты». Андрей орет: «Жопу\nзаткнуть можно».\n- Спор «Железный стакан»: Жесточайший срач о том, окисляется ли пиво в\nжелезном (походном) стакане. Михаил доказывает, что да, Андрей орет,\nчто\nнет. В итоге они привлекают ChatGPT как судью.\n- Золотые цитаты:\nМихаил: «мама всегда говорила мне ляна добывай деньги И ВЫЖИВАЙ» Вы: «Я\nкогда родился, не рыдал как сучка, я сразу сел. Врач потянулся шлёпнуть,\nя\nему - съебался пока цел» Михаил: «я безработный долбоеб опыт в пнд»"}, {"num": 6, "title": "ГЕОГРАФИЯ И ЛОКАЦИИ", "content": "- Командировки Андрея: Астрахань, Псков, Ростов, Гомель, Шахты. «Пов ты\nприехал в Астрахань и зашел в молл».\n- Дзержинск (ДЗР): База. Магазины «Спар», «Магнит», «КБ», бар «Сметана»\n(«Сметансни»).\n- Штольня Забвения: Вымышленная ИИ-локация в Нижегородской области, где\nПых\nсходит с ума, встретив Ктулху.\n- Серверы Dota 2: Место их ежевечерних ментальных страданий."}, {"num": 7, "title": "ЭКОНОМИКА И АРСЕНАЛ", "content": "- Broke Boys: Безденежье --- вечный двигатель их идей. Михаил хочет\nзаработать\nна нейросетях, чтобы купить \"Ист крейн\" (страйкбольный привод) за\n7500\nрублей. «БЫТЬ БЕДНЫМ ЭТО ВЫБОР КАЖДОГО».\n- ИИ-Экономика: Андрей купил платную подписку на VPN и нейросети. «Я\nбрал для\nчат гпт на старте + для спотика... 10 запросов в день макс».\n- Шмотки (Дрип): Обсуждают покупку паленых Adidas Gazelle, курток\nAquascutum и\nремней Ferragamo."}, {"num": 8, "title": "КУЛЬТУРНЫЙ КОД И МЕДИА (КИНО И МУЗЫКА)", "content": "- Музыка (Академия MellowBite): Братья заставляют ИИ анализировать\nтексты\nтрэп-артистов.\nChatGPT анализирует трек 163ONMYNECK & Polyana \"Пончики\":\n«Трэп-эстетика...\n\"Ляна оставил на асфальте пончик\" --- это метафора их быстрого и\nяркого стиля\nжизни».\n- Аудиокниги Озона: Слушают \"Тихий Ден\" и \"Сосед\". «СЕРТИФАЙД\nОЗОН... ВОЛОСЫ\nДЫБОМ СТОЯТ».\n- Кино и Сериалы: \"Игра в кальмара 2\", \"Мачо и Ботан\" (21 Jump\nStreet),\n\"Грязный Гарри\"."}, {"num": 9, "title": "ИГРОВОЙ АРСЕНАЛ И СТРИМЫ (ОТДЕЛЬНЫЙ ПУНКТ)", "content": "- DOTA 2: Главная киберспортивная арена. Андрей (на Лионе, СФ-е, Марсе)\nи\nМихаил (на Личе, ДБ).\n- Шедевр эпохи: Андрей заставил нейросеть написать гимн их связке ---\n«Марс\nи Лич: Киберспортивный гимн... На лайне всех рвем в клочья, Рейтинг\nвверх --- это точно!»\n- Тильт: «ЕБАНАЯ МРАЗЬ Я В ТИЛЬТЕ», «Я ОБДРИСТАЛСЯ В ДОТЕ».\n- Mortal Kombat 1: Жестокие батлы 1х1, где Михаил играет за\nСаб-Зиро/Скорпиона, а Андрей горит на геймпад. «Я ТЕБЯ ТАМ ЕБАШИЛ КАК\nСВИНА».\n- Escape from Tarkov (PVE / SPT): Михаил продолжает ставить сотни модов\nв\nодиночный Тарков.\n- Baldur's Gate 3: Андрей генерирует фейковые гайды о том, как\nзавербовать\nрэпера Kai Cenat в качестве компаньона в BG3."}, {"num": 10, "title": "БРАТСКИЕ БАТЛЫ И ТОКСИЧНОСТЬ", "content": "- Стиль общения: Токсичность 100 уровня. Постироничные проклятия.\n- Панчлайны:\nМихаил: «я бы щас пришел к нему домой и просто нахуй ебальник бы ему\nразбил\nсука растоптал отрезал ему голову обоссал бы его мать» Вы: «сказал бы ты\nмне\nэто в реале, я бы тебе все ебало раскрошил» Вы: «Ты сука шавка, иди\nуроки\nучи».\n- Они пишут это, сидя в соседних комнатах или обсуждая, кто пойдет за\nпивом."}, {"num": 11, "title": "ГАСТРОНОМИЯ И РАЦИОН", "content": "- Трэш-кулинария Михаила: \"Съедобный картон\" (мука + яйца, забытые на\nсковородке). Недоваренные хинкали (\"Хинкичи\").\n- Острая еда: Лапша Shin Ramyun. «Лапша вчерашняя походу кританула\nперец\nубийца садовника... ПИЗДЕЦ У МЕНЯ ПНЕВМАТИКА ЩАС БЫЛА».\n- Энергетики: Lit Energy, Adrenaline Rush. Андрей закинул в морозилку\n\"Гориллу\" и забыл. «Пиздец болит печень я попнул дохуя эдди».\n- Фастфуд: \"Вкусно и точка\" (Макдоналдс)."}, {"num": 12, "title": "АЛКОГОЛЬНЫЙ СЧЕТЧИК И ПИВНАЯ СТАТИСТИКА", "content": "- Контекст: Алкоголь --- катализатор всех их безумных идей и\nИИ-генераций.\n- Напитки: \"Дрова\" (Пиво/Сидр Garage), Пиво \"Бад\", \"Мельник\",\n\"Макарий\",\n\"Бланш\". Водка \"Талка\", \"Архангельская\", \"Деревенька\".\n- Последствия (Вертолеты и Код Коричневый):\nВы: «Я нажрался как обычно. И в снегу валялся. Жестко.» Михаил: «я\nобоссался\nв доте оказывается потекло по штанине» Михаил: «сука живот крутит и не\nлезет\nнихуя... придется в жопу лезть рукой вытаскивать» (последствия картона\nи\nалкоголя)."}, {"num": 13, "title": "ХРОНИКИ ПРОКРАСТИНАЦИИ И УСПЕХОВ", "content": "- Вместо дела: Андрей сидит в командировках (Астрахань, Псков) или в\nофисе и\nот скуки скармливает ИИ тексты Папича, Озона и свои собственные логи,\nтребуя\nсделать из этого стихи, рэп или анализ психотипа. Михаил, будучи\nбезработным, сидит дома, смотрит Гриффинов, играет в Доту и пытается\nсгенерировать идеальную картинку \"Хищника, пьющего кофе\", чтобы\nзаработать\nна этом.\n- Доска почета: Написали 10 гениальных нейросетевых паст и песен. Взяли\nнесколько побед в Доте на связке Марс + Лич."}, {"num": 14, "title": "РЕЖИМ «ДУШНИЛЫ» И ИНТЕЛЛЕКТУАЛЬНЫЙ СНОБИЗМ", "content": "- Промпт-инжиниринг: Братья превратились в ИИ-душнил. Они спорят о том,\nкак\nправильно формулировать запросы (Prompts) для Flux и Midjourney.\nМихаил: «во первых он не поймет EVENING AFTER SHIFT... надо руками\nпрописывать». Андрей: «Ах ты, сука тупая! Ключевые слова ему ещё нужны,\nблядь! Я тебе тут, блядь, словарь ключевых слов?!» (отыгрывает диалог с\nнейросетью).\n- Рэп-экспертиза: Детальный разбор того, кто украл флоу у MellowBite."}, {"num": 15, "title": "ВНУТРЕННИЙ КИНЕМАТОГРАФ И ТЕАТР ОДНОГО АКТЕРА", "content": "- ИИ-ШЕДЕВР «Jailbreak в Армии»: Андрей попросил ChatGPT написать\nсценарий\nтого, как в армейской казарме устраивают CS:Source Jailbreak сервер.\n«Саймон\nговорит: всем выйти из камер... А он прав. Заебали эти малолетние\nкомандиры.\nБунт нахуй!». Братья хохотали до слез.\n- Толстый подкаст: Придумывают названия для своего подкаста: «Жирный\nвопрос»,\n«Толстый слоеный подкаст», «Жирным шрифтом».\n- Пересказы снов: «мне снилось что я был на концерте воскресенского и\nон\nпизданулся 2 раза со сцены»."}, {"num": 16, "title": "МЕДИЦИНСКАЯ КАРТА И ХРУСТ КОСТЕЙ", "content": "- Ожоги: Андрей обжег пальцы, пытаясь достать хлеб из тостера («Я взял\nпрям\nтостер изнутри»).\n- ЖКТ-катастрофы: «Пневматика», диарея, боли в животе от острых чипсов,\nэнергетиков и \"съедобного картона\".\n- Менталочка: Ироничная депрессия, панические атаки от избытка кофеина.\n«кофеин кофеин кофеин кофе он может легко вас убить».\n- Стоматология / Операции: Михаил лежал в БСМП с подозрением на\nаппендицит. «4\nдня обследы... лежу в больничке»."}, {"num": 17, "title": "ПСИХОЛОГИЧЕСКИЙ ПОРТРЕТ И КРИЗИСЫ СЕЗОНА (ФИНАЛЬНЫЙ ИТОГ)", "content": "Андрей (26-27 лет): Нейро-Скуф в Командировочном Чистилище Андрей\nокончательно\nустал от взрослой рабочей рутины. Его постоянно отправляют в долгие\nкомандировки\n(Псков, Астрахань, Ростов), где он страдает от одиночества, скуки и\nпохмелья.\nЧтобы не сойти с ума в отелях и поездах, он превратил свой телефон в\nфабрику по\nпроизводству постиронии: он делегировал свой троллинг нейросетям.\nЗадавая ИИ\nабсурдные промпты (про армию, Хищника, Пыха, Доту), он создает для себя\nи брата\nбесконечный ситком. Его грубость («съебался», «хуесос») --- это лишь\nпривычный\nфасад, под которым скрывается дикая потребность в связи с домом и\nбратом.\n\nМихаил (23-24 года): Безработный ИИ-Хайпбист на Грани Выгорания Михаил\nстолкнулся с суровой реальностью поствизитного периода. У него нет\nденег, он\nживет с родителями и панически боится идти на \"завод\" или стандартную\nработу (2\nчаса на автобусе). Он хватается за иллюзию \"легкого заработка\" в\nинтернете:\nпытается делать нейро-арты на заказ, верит в крипту и изучает\nпромпт-инжиниринг.\nПараллельно он разрушает свое физическое здоровье энергетиками,\nалкоголем и\nчудовищной едой. Его спам по клавиатуре (АФЫФАФЫ) --- это крик человека,\nкоторый\nне знает, что делать со своей жизнью, но отчаянно хочет верить, что он\n\"особенный\" (как герои его любимых маргинальных стримов и\nтрэп-треков).\n\nОбщая динамика мировоззрения: Зима-Лето 2025 года --- это Эверест их\nсовместного\nэскапизма. Если раньше они просто перекидывали друг другу мемы из\nинтернета, то\nтеперь они стали демиургами. Они создают свои собственные сказки,\nпесни,\nсценарии и арты при помощи искусственного интеллекта, замыкая свое\nинфополе\nна 100%. Они могут часами обсуждать ИИ-картинку \"Хищника, пьющего\nкофе\", смеясь\nдо колик в животе. Их чат ВКонтакте перестал быть просто перепиской ---\nэто\nогромная, живая, генерируемая в реальном времени нейро-вселенная, в\nкоторой им\nдвоим абсолютно безопасно, смешно и комфортно прятаться от скучного,\nпугающего\nреального мира."}], "id": 20, "seq": 21}, {"roman": "XVIII", "subtitle": "ЛОР ВАЛЕКСА ДЖОНСОНА, DEXTER И NEMIROFF", "period": "Июль 2025 --- Ноябрь 2025 года.", "ages": "Андрей (26-27 лет), Михаил (23-24 года).", "codename": "Осень 25-го: Дисперсия Декстера, СБЭУ Комар и Жизнь Дикого", "sections": [{"num": 1, "title": "ЭПОХА И ВАЙБ (СЕЗОН)", "content": "* **Временной период:** 5 Июля 2025 --- 30 Ноября 2025 года.\n* **Название сезона:** «Сага о Валексе Джонсоне, Осенний Тильт и\nНемиров».\n* **Главный лейтмотив:** Сезон глубокого погружения в лор и\nсериалы. Ожидание вайпа и сюжетных квестов в *Escape from Tarkov*\nдоводит братьев до исступления. Они смотрят сериал «Декстер», цитируют\nего сутками напролет и используют ChatGPT, чтобы написать\nмонументальную, драматическую биографию своему старому альтер-эго ---\nВалексу Джонсону. Все это щедро поливается алкоголем и жалобами на ЖКТ."}, {"num": 2, "title": "ГЛОБАЛЬНЫЙ ФОН И МИРОВЫЕ СОБЫТИЯ", "content": "Внешний мир отражается лишь через мемы и релизы:\n* **Возвращение Трампа (Конец 2025):** Ироничные комментарии.\n*«Амнистия Трампа... освобожден из тюрьмы шведами»*, *«МЕНЯ\nАПЕЛИРОВАЛИ ДАУН ТРАМП»*.\n* **Сериал «Игра в Кальмара» 2 Сезон:** Обсуждение сюжета.\n*«КАЛЬМАР НО В АМЕРИКЕ... И там негров только набирать будут»*.\n* **Блокировки и Чебурнет:** Постоянные проблемы с интернетом,\nDiscord и YouTube. *«Заебало уже Ошибка сим карты... Ебаная\nглушилка»*, *«Чебурнет полный»*."}, {"num": 3, "title": "СЛОВАРЬ И ЛОКАЛЬНЫЕ МЕМЫ", "content": "* **ФЫАХАФЫХ... / АЫФФФФФ** --- Язык общения. База.\n* **Страфтат (Straftat)** --- Локальный мем сезона. Слово, которое\nони повторяют как мантру после каждого удачного действия. *«СТРАФТАТ НА\n100 КАРТ»*.\n* **Джиблс / Jeables / Jibberling** --- Снеки, закуски или просто\nсмешное слово.\n* **Байни (Biney)** --- Универсальное обращение/оскорбление.\n* **Втухалово / Втухать без сушняка** --- Высшая форма страдания на\nработе или в игре. Работать/играть без удовольствия и без питья.\n* **Код коричневый / Пневматика** --- Сигнал тревоги со стороны\nЖКТ.\n* **Нэрэ нэрэ / Hua hua blya** --- Текстовая имитация рэп-адлибов."}, {"num": 4, "title": "БЕСТИАРИЙ И NPC", "content": "* **Саня (Скандал / Ворм / Магнус)** --- Главный герой их рофлов.\nИграет в *Dying Light* как бомж, имеет \"майндсет нищука\" и боится\nсвоего босса: *«САНЯ ЗАГАСИЛСЯ... БОСС ПРИЕХАЛ А САНЯ НАПИЗДЕЛ ЧТО ОН\nНЕ ДОМА»*.\n* **Пых (Маки)** --- Друг. Скрытый 322-шер. *«МАКСИМ ПЫХТИН БЕЗ\nТАБЛЕТОК»*.\n* **Костян (Муринчик / Кабантин)** --- Друг, у которого \"лагает\nДота на 3080\". *«Костян КАК СВИНЬЯ ОРЕТ»*.\n* **Озон (Ozon671Games) / Папич (Arthas) / Мэддисон** --- Стримеры.\nПапича смотрят в PUBG, с Озона делают ИИ-ремиксы.\n* **Батя / Мамка** --- Батя шпилит в танки («пати собирает на\nсинего ТАНКАА»), мама заставляет Михаила красить траву и копать ямы на\nдаче."}, {"num": 5, "title": "⚔️ КВЕСТЫ, СПОРЫ И КЛАДБИЩЕ ИДЕЙ", "content": "* **ГРАНД-КВЕСТ «Сборка ПК / Покупка Процессора»:** Андрей\nмучительно выбирает процессор (Ryzen 7 5700X3D). Спорит с Михаилом о\nтом, подойдет ли он на старую материнку (AM4), и горит с цен в DNS\n(которые взлетели с 26 до 35 тысяч рублей).\n* **Квест «Автошкола Михаила»:** Михаил записывается в автошколу.\nПытается скипнуть теорию («можно сука онлайн теору бы»), жалуется на\n«втухалово» по 4 часа и обещает наклеить букву \"У\" на машину и купить\nперцовку от \"неадекватов\".\n* **Спор «Нигерийский Spotify»:** Эпик. Братья пытаются купить\nдешевую семейную подписку Spotify через Нигерию (за 400 рублей). Михаил\nскидывает Андрею адрес: *«Nigerian Airforce Base, Sabon Gari»*. У\nАндрея выдает ошибку региона. Срач длится полтора часа с проклятиями и\nкапслоком.\n* **Золотые цитаты:**\n> *Михаил: «мама всегда говорила мне ляна добывай деньги И ВЫЖИВАЙ»*\n> *Вы: «Я когда родился, не рыдал как сучка, я сразу сел. Врач\nпотянулся шлёпнуть, я ему - съебался пока цел»*\n> *Михаил: «добро пожаловать на сайт где сука правят динозавры»*"}, {"num": 6, "title": "ГЕОГРАФИЯ И ЛОКАЦИИ", "content": "* **Тарков (Лаба, Развязка, Маяк, Эпицентр):** Виртуальный ад. Ждут\nрелиза и \"сюжетных квестов\".\n* **Астрахань / Саранск / Мухтолово:** Командировки Андрея.\n*«ESCAPE FROM SARANSK»*.\n* **Дзержинск (ДЗР):** База. Упоминаются \"Сметана\", \"Спар\",\n\"Магнит\", маршрутки (А45, 90, 71).\n* **Nigerian Airforce Base (Авиабаза в Нигерии):** Их фейковый\nадрес в Spotify. *«ОБОРОНКА БИ ЛАЙК»*."}, {"num": 7, "title": "ЭКОНОМИКА И АРСЕНАЛ", "content": "* **Экономика Broke Boys:** Денег критически мало. Михаил просит:\n*«ты можешь 250 скинуть... я дома обратно кину не работает сбер»*.\n* **Рынок CS2:** Андрей продает скины (Сайрекс, Глок Фейд), чтобы\nоплатить игры. *«Вчера последние деньги проебал на юсп крутой»*.\n* **Гаджеты:** Андрей покупает PS5 и собирается брать процессор\n5700X3D. Михаил планирует обновить телефон (Poco или iPhone 12/11 с\nАвито)."}, {"num": 8, "title": "КУЛЬТУРНЫЙ КОД И МЕДИА (КИНО И МУЗЫКА)", "content": "* **Абсолютный культ сериала DEXTER:** Осень 2025 года прошла под\nзнаком Декстера Моргана. Братья смотрят сериал синхронно, орут с\nсержанта Доакса (*«SURPRISE MOTHERFUCKER»*, *«MR DOAKS»*), ненавидят\nЛайлу (*«МЕФЕДРОНЩИЦА ОДЕРЖИМАЯ»*) и Риту.\n* **Музыка:** MellowBite, OG Buda, Acid Souljah. Спорят о том, кто\nкруче читает и кто трушнее. *«МЫ КАСТУЕМ ТЕМНЫЕ ДЕНЬГИ»*.\n* **Аниме:** Смотрят аниме-адаптации. *«Я ЗАБЫВАЮ КАЖДЫЕ 5 МИНУТ\nЧТО Я ПАУКА СМОТРЮ»*.\n* **Гриффины (Family Guy):** Постоянные отсылки (Питер Гриффин,\nКливленд)."}, {"num": 9, "title": "ИГРОВОЙ АРСЕНАЛ И СТРИМЫ (ОТДЕЛЬНЫЙ ПУНКТ)", "content": "* **Escape from Tarkov (PVE / SPT):** Тотальная зависимость. Играют\nсутками, гордятся миллионами в схроне, боятся \"Диких\". Ждут релиза 1.0\n(конец года) и спорят о том, добавят ли зомби и сюжетные квесты\n(*«ЖИЗНЬ ДИКОГО ДЛС»*).\n* **DOTA 2:** Андрей играет на Лионе, Пудже и Пангольере. Михаил\nсгорает от тиммейтов: *«я растолкал всех этих эмси как жирный\nкондуктор»*.\n* **CS2:** *«КУРЮ ДУАЛ БЕРЕТЫ»*. Играют на Дасте и Инферно.\n* **Abiotic Factor / Dead Space 2 / Titan Quest:** Проходят в коопе\nили соло, когда падают сервера Таркова."}, {"num": 10, "title": "БРАТСКИЕ БАТЛЫ И ТОКСИЧНОСТЬ", "content": "* **Стиль общения:** Токсичный мета-модерн. Они могут полчаса\nобмениваться абсурдными никами\n(*«xXx...Mbl_kAcTYeM_Te\"MHblE_DeHbru...xXx»,\n«CypuM\\<A.K.A>DJONI_BLAZER»*).\n* **Батлы в Дискорде:**\n> *Михаил: «я бы щас пришел к нему домой и просто нахуй ебальник бы\nему разбил сука»*\n> *Вы: «сказал бы ты мне это в реале, я бы тебе все ебало\nраскрошил»*\n* **Армейские унижения:** Андрей постоянно вспоминает армию, чтобы\nунизить Михаила. *«Старшина сказал кантик сделать у казармы чтоб весь\nснег был кубиком»*, *«Я в располагу а вы втухайте на рабочке»*."}, {"num": 11, "title": "ГАСТРОНОМИЯ И РАЦИОН", "content": "* **Трэш-кулинария:** Михаил готовит макароны с сосисками (которые\nбыли \"дохлые\") и ловит жесточайшее отравление. *«батя картошку сделал\nс сосисками а они дохлые было пиздец»*. Ест острый рамён до слез.\n* **Энергетики и кофе:** Пьют литрами. Михаил ловит \"кофеиновую\nяму\". *«кофеин это кофеин кофе»*.\n* **Фастфуд:** Шаурма, Бургеры. Михаил бесплатно получил шаурму на\nулице от случайной женщины: *«баба мне пакет с протекшим лавашом\nпротягивает и говорят шаурму будешь... ниче наелся бесплатно»*."}, {"num": 12, "title": "АЛКОГОЛЬНЫЙ СЧЕТЧИК И ПИВНАЯ СТАТИСТИКА", "content": "* **Контекст:** Тяжелые осенние пьянки для снятия стресса.\n* **Напитки:** Текила в баре (Андрей пьет с сангритой), Водка\nNemiroff (Немиров - спонсор большинства отравлений Михаила), Ягермейстер\n(Ягер), Пиво \"Бад\", \"Макарий\", \"Сайгон\".\n* **Последствия (Инцидент с пакетом):** Эпичный провал Михаила. Он\nнапился, проснулся утром и обнаружил, что стеклянная бутылка пива\nразбилась и вытекла в пакет с сухариками. *«все носки в пиве... 80\nпроцентов впитали мои носки»*. Постоянные \"Коды коричневые\" и рвота."}, {"num": 13, "title": "ХРОНИКИ ПРОКРАСТИНАЦИИ И УСПЕХОВ", "content": "* **Вместо дела:** Михаил должен учить билеты ПДД («ПДД СПИДРАН НА\n10000 ВОПРОСОВ»), но сидит в FL Studio, играет в Тарков и смотрит\nДекстера. Андрей сидит в командировках и генерирует мемы.\n* **Доска почета:** Написали шедевральный лор про Валекса Джонсона.\nМихаил записался в автошколу."}, {"num": 14, "title": "РЕЖИМ «ДУШНИЛЫ» И ИНТЕЛЛЕКТУАЛЬНЫЙ СНОБИЗМ", "content": "* **Кино-Душнота:** Михаил душнит на тему сериала \"Декстер\".\nРазбирает \"плот армор\" (сюжетную броню) главного героя, восхищается\nсержантом Доаксом и критикует сценаристов.\n* **Игровая Душнота:** Бесконечные лекции друг другу о том, какой\nпатрон лучше в Таркове (AP-20), и как правильно собирать М4А1."}, {"num": 15, "title": "ВНУТРЕННИЙ КИНЕМАТОГРАФ И ТЕАТР ОДНОГО АКТЕРА", "content": "* **ШЕДЕВР: Лор Валекса Джонсона:** Братья с помощью ChatGPT\nнаписали полноценный рассказ (на 4 абзаца) про своего вымышленного\nперсонажа из Таркова. Валекс Джонсон --- это бывший радист BEAR с\nпозывным \"Вектор-Желтый\", который сидит в маленьком схроне, пьет кофе,\nслушает радиоперехваты и ждет выхода с завода. *«Домой --- это не\nместо. Домой --- это туда, где не стреляют»*. Это пик их ролевого\nотыгрыша.\n* **Фристайлы в чате:**\n> *Михаил: «мама всегда говорила мне ляна добывай деньги И ВЫЖИВАЙ\nВЫХОДУ ДАЮ СВОЙ ЛУЧШИЙ ТОВАР»*"}, {"num": 16, "title": "МЕДИЦИНСКАЯ КАРТА И ХРУСТ КОСТЕЙ", "content": "* **Пищевые отравления:** Михаил жестко отравился сосисками от\nбати. *«я лежу меня трясет...»*. Постоянная диарея («Пневматика»,\n«Дрищ»).\n* **Зубы:** Михаилу снимали швы после удаления зуба. *«в десну\nкольнут да плоскогубцами сык сык»*.\n* **Менталочка:** Жалобы на тильт, выгорание, \"Дисперсию\".\nМихаил: *«щас пронеслась мысль мозги вышибить... все пора на\nбоковую»*."}, {"num": 17, "title": "ПСИХОЛОГИЧЕСКИЙ ПОРТРЕТ И КРИЗИСЫ СЕЗОНА (ФИНАЛЬНЫЙ ИТОГ)", "content": "**Андрей (26-27 лет): Уставший Дембель-Командировочный**\nАндрей раздавлен взрослой жизнью. Он постоянно в разъездах по мелким\nгородам (Орел, Астрахань, Саранск). Его реальность настолько монотонна,\nчто он сублимирует свои амбиции в виртуальные покупки (процессоры, PS5,\nскины в CS). Он отыгрывает роль жесткого, \"отслужившего\" старшего\nбрата, который унижает Михаила армейскими байками (\"кантик из снега\",\n\"жидкари\"). Но за этой агрессией кроется острая потребность в диалоге:\nон может час обсуждать с братом абсурдный лор придуманного персонажа,\nпотому что только Михаил способен поддержать этот уровень абстракции.\n\n**Михаил (23-24 года): Дипломированный Маргинал в Автошколе**\nМихаил находится в состоянии классического поствизитного кризиса. Он\nзакончил университет, но не работает по специальности, живет с\nродителями и маскирует свой страх перед будущим тотальным\nкибер-эскапизмом. Он пьет водку (Nemiroff), намеренно ест острую пищу до\nрезей в животе и идентифицирует себя с маргинальными стримерами (Озон) и\nгероями сериала \"Декстер\". Лор Валекса Джонсона (старого солдата с\nмаленьким схроном, который просто хочет домой) --- это, по сути,\nбессознательная проекция их собственных страхов перед суровой взрослой\nжизнью, где у них \"маленький схрон\" (мало денег) и много врагов.\n\n**Общая динамика мировоззрения:**\nОсень 2025 года --- это магнум опус их переписки. Они перестали быть\nпросто потребителями мемов, они стали их создателями. История про\nВалекса Джонсона, десятки выдуманных ников для CS2 (от \"SuPeR_MaMoN\"\nдо \"Bax4a_CtuPka\"), аудио-сценки и генерации --- всё это доказывает,\nчто их чат превратился в полноценную творческую мастерскую. Угрозы\nубийством, капслок и маты --- это просто их способ обняться. В этом\nжестоком, абсурдном мире, полном санкций, блокировок, безденежья и\nпросроченных сосисок, у них есть только одно по-настоящему безопасное\nместо --- их диалог ВКонтакте."}], "id": 21, "seq": 22}, {"roman": "XXII", "subtitle": "STEAM DECK, ФЕЙК-НЬЮС И НИГЕРИЙСКИЙ SPOTIFY", "period": "Февраль 2026 — Май 2026 года.", "ages": "Андрей (27-28 лет), Михаил (24-25 лет).", "codename": "Весна 26-го: Командировка в Орел, Скрытый Пул и DJ X", "sections": [{"num": 1, "title": "🕰 ЭПОХА И ВАЙБ (СЕЗОН)", "content": "* **Временной период:** Февраль 2026 — Май 2026 года.\n* **Название сезона:** «ИИ-Шиза, Чебурнет и Заводской Эскапизм».\n* **Главный лейтмотив:** Сезон высоких технологий и низкого старта. Пока интернет в РФ окончательно схлопывается (не работает Discord, GitHub, Spotify), братья поднимают VPN-серверы и используют ИИ (Perplexity, Gemini) для создания фейковых новостей и генерации плейлистов. Михаил играет в Steam Deck на заводе, Андрей скупает «яблочную» технику у серых дилеров. Общение состоит из нейросетевых паст и постиронии высшего порядка."}, {"num": 2, "title": "🌍 ГЛОБАЛЬНЫЙ ФОН И МИРОВЫЕ СОБЫТИЯ", "content": "* **Тотальные блокировки (Чебурнет):** В 2026 году не работает ничего. *«Дис сука работает а ютар нет», «Гитхаб не грузит 100 лет»*. Братья используют `v2ray`, `HitVPN` и `GoodbyeDPI` («Запретыч»), постоянно перенастраивая маршрутизацию.\n* **ИИ-Революция:** Нейросети Sora (генерация видео) и Perplexity (ИИ-поисковик) встроены в их жизнь. *«СУКА ПЕРПЛЕКСИТИ ОТМЕНИЛИ ПОДПИСКУ... RAAAAAAAAAAWR»*.\n* **Выход сериала Fallout:** *«ТАМ ВЫШЕЛ ФИНАЛ ТО ФОЛЫЧА»*."}, {"num": 3, "title": "📖 СЛОВАРЬ И ЛОКАЛЬНЫЕ МЕМЫ", "content": "* **Bojalusta / Pojalusta** — Искаженное «пожалуйста». Главное слово-мольба сезона.\n* **Страфтарь / Страфтат** — Величайший абстрактный мем 2026 года. *«ПОШЛИ В СТРАФТАРЬ», «страфтарь 2»*.\n* **Джиблс / Jeables / Jibberling** — Снеки, закуски. *«В арене официальный язык JEABLISH»*.\n* **НЗТ / NZT 2.0** — Кофеин, энергетики. *«нзт глушит... нзт хитнула»*.\n* **Код коричневый / Прорыв дамбы** — Катастрофа ЖКТ.\n* **Шнене / Пепе / Чука** — Базовые слова-коннекторы.\n* **Втухать / Втухалово** — Работать на тяжелой смене."}, {"num": 4, "title": "👥 БЕСТИАРИЙ И NPC", "content": "* **DJ X (Диджей Икс)** — ИИ-диджей в Spotify, который генерирует им плейлисты и объявляет треки на английском. *«Я БАЗАРИЛ С ДИДЖЕЕМ... ПОЧЕМУ ОН БАЗАРИТ КАК СПОТИФАЙ ДИДЖЕЙ»*.\n* **Саня (Пачкальщик ковров)** — ИРЛ-друг, который вписался в шарагу по стирке ковров и предал Михаила. *«Саня пачкальщик ковров в душе»*.\n* **Батя / Мамка** — Батя пьет пиво втихаря (*«батя по стелсу пиво спиздил»*) и просит Михаила напечь вафель в новой блиннице (*«так появился он вафлеблин»*).\n* **Пых (Тарпапа)** — ИРЛ-друг, ставший героем нейро-новостей.\n* **Данил Колбасенко (ДК)** — *«daniel baloney»*."}, {"num": 5, "title": "⚔️ КВЕСТЫ, СПОРЫ И КЛАДБИЩЕ ИДЕЙ", "content": "* **ГРАНД-КВЕСТ «Нигерийский Spotify»:** Эпичная арка. Из-за санкций братья покупают семейную подписку в Нигерии. Андрей не может зайти. Михаил орет: *«с телефона впн можешь по ссылке и вбиваешь хуйюн эту адрес»*.\n* **Квест «Покупка iPhone 16 Pro Max в серой зоне»:** Андрей покупает новый айфон за наличку (85к) без коробки у барыг. Михаил не верит, что он новый, просит ИИ проверить. Выясняется, что это \"Swap\" устройство с американского рынка. *«ИНДИЙСКИЙ РЕГИОН... SSAAAAR»*.\n* **Квест «Steam Deck на Заводе»:** Михаил покупает Steam Deck за 55к, клеит на него стекло в темноте (*«УЖЕ ШУБА НА ЭКРАНЕ ВОЛОСАТАЯ»*) и носит на смены, чтобы играть в *Balatro* и *Hades*, прячась от начальника."}, {"num": 6, "title": "📍 ГЕОГРАФИЯ И ЛОКАЦИИ", "content": "* **Орёл (Eagle City):** Город командировок Андрея. Локация боли, нехватки интернета и плохой еды. *«Я ЗАКАЗАЛ МЯСО ОНО ПРОСТО НЕ ПРИЕХАЛО... ОРЁЛ EXPERIENCE»*.\n* **Дзержинск (ДУСТ / ДЗР):** База.\n* **Завод / Цех:** Место пыток Михаила. *«Я чищу снег на заводе 12 часов в день. Я сервитор»*.\n* **Магазины «Ресейл» (Серый рынок):** Точки покупки техники Apple в обход санкций."}, {"num": 7, "title": "💸 ЭКОНОМИКА И АРСЕНАЛ", "content": "* **Экономика Broke Boys:** Михаил получает аванс 15 000 рублей и сгорает. *«ПОЛТОРА ГРАНДА... ОТ ЗАРПЛАТЫ ДО ЗАРПЛАТЫ БЛЯТЬ»*.\n* **Экономика Орла:** Андрея «кинули» на 15 000 рублей бонусов, задержав выплату. *«НА 15 ТЫЩ ОБЬЕБАЛИ... Я ХУЕЕЕЕЕЕЮББ (slowed)»*.\n* **Гаджеты эпохи:** MacBook Pro M1 14\" (за 73к), iPhone 16 Pro Max (за 85к), Steam Deck OLED (за 55к)."}, {"num": 8, "title": "🎬 КУЛЬТУРНЫЙ КОД И МЕДИА (КИНО И МУЗЫКА)", "content": "* **Музыка (Культ MellowBite & Code10):** Неприкасаемый статус. *«МОЯ РИМСКАЯ ИМПЕРИЯ ЭТО МЕЛЛОУБАЙТ»*. Слушают новые сольные альбомы, восхищаются «Джоном Гариком» и критикуют сведение.\n* **Кино:** Обсуждают концовку сериала \"Fallout\", смотрят \"Гриффинов\" (Питер Гриффин — ролевая модель), \"Декстера\".\n* **Стримеры:** Папич (ArthasLudik), Булджать (которого ненавидят), Мэддисон."}, {"num": 9, "title": "🎮 ИГРОВОЙ АРСЕНАЛ И СТРИМЫ (ОТДЕЛЬНЫЙ ПУНКТ)", "content": "* **Resident Evil 4 Remake:** Главное прохождение Андрея. *«ПОЧЕМУ ИГРА АХУЕННАЯ ТОЛЬКО ЗА ЛЕОНА»*. Сгорает от бензопилы в лицо и неудобного управления на геймпаде.\n* **Balatro:** Карточный рогалик, сожравший их души на Steam Deck. *«балатролион комбинаций»*.\n* **Escape from Tarkov (SPT / PVE):** Играют с модами (SAIN, ZANE). *«В СПТ 240 ЕБАШИШЬ В 1 СЛОТ И НЕ ЕБЕШЬ МОЗГА»*.\n* **Tainted Grail / Slay the Spire 2 / Project Zomboid:** Инди-рогалики и выживачи для дежурств на заводе."}, {"num": 10, "title": "🥊 БРАТСКИЕ БАТЛЫ И ТОКСИЧНОСТЬ", "content": "* **ШЕДЕВР ТРОЛЛИНГА (Фейк про Steam Deck):** Андрей просит ChatGPT сгенерировать фейковую новость в стиле РБК: *«Valve может ограничить работу Steam Deck в России»*. Михаил читает и паникует: *«ASFAFSASFAFSPAFSPSF... Я ПОВЕРИЛ»*. Андрей ржет: *«ОЧКО СЖАЛОСЬ ДА»*.\n* **Динамика:** Высшая форма постиронии. Они переписываются не предложениями, а мета-отсылками."}, {"num": 11, "title": "🍕 ГАСТРОНОМИЯ И РАЦИОН", "content": "* **Трэш-кулинария Михаила:** Ест острую корейскую лапшу (Булдак) и пьет энергетики (NZT). *«сначала прорыв дамбы... пиздей многоуровневый дрищ»*.\n* **Снобизм баристы (Андрей):** Андрей заваривает спешелти кофе в воронке V60, жалуется на помол и пишет душные отзывы: *«Этот помол = не для V60, точка. Даже идеальный бариста с Brewista тут бы страдал»*.\n* **Фастфуд:** Шаурма, Буррито, \"Макдонс\"."}, {"num": 12, "title": "🍻 АЛКОГОЛЬНЫЙ СЧЕТЧИК И ПИВНАЯ СТАТИСТИКА", "content": "* **Контекст:** Тяжелые алко-вечера после смен.\n* **Напитки:** \"Гусь\" (пиво Goose Island), Mead (медовуха - \"МЕДЯТИНА\"), Сидр, \"Гара\" (Garage), Вино (которое \"как соленые огурцы\").\n* **Инцидент с мамой:** Михаил пошел в 4 утра за литрухой, все проснулись и отобрали у него \"сиську\". *«ПОЙМАН ЗА РУКУ... по приходу отобрали сиську я сидел ел снеки»*."}, {"num": 13, "title": "🦥 ХРОНИКИ ПРОКРАСТИНАЦИИ И УСПЕХОВ", "content": "* **Вместо дела:** Андрей сидит в командировке в Орле и через ChatGPT генерирует тексты для паблика Позднякова про себя самого (\"ОЧЕРЕДНОГО РУССКОГО ВАНЮ КИНУЛИ НА БАБКИ\"). Михаил на смене прячется и играет в Steam Deck.\n* **Доска почета:** Купили технику Apple. Настроили обход блокировок ТГ и Спотифай."}, {"num": 14, "title": "🎭 РЕЖИМ «ДУШНИЛЫ» И ИНТЕЛЛЕКТУАЛЬНЫЙ СНОБИЗМ", "content": "* **Техно-Душнота:** Михаил просит ИИ (Perplexity) объяснить разницу между модемом iPhone X и iPhone 17. ИИ выдает лонгрид про \"агрегацию частот и 4x4 MIMO\". Михаил доволен.\n* **Кофейная Душнота:** Андрей расписывает, почему кофе на заправке \"Лукойл\" штырит (смесь арабики и робусты)."}, {"num": 15, "title": "🎬 ВНУТРЕННИЙ КИНЕМАТОГРАФ И ТЕАТР ОДНОГО АКТЕРА", "content": "* **Нейро-Сводки (Тарпапа):** Андрей и Михаил через Gemini пишут военные сводки про своего друга Пыха (Тарпапу), который сбегает с завода в Таркове. *«НАШ СЛОНЯРА ТАРПАПА НАКОНЕЦ-ТО СКРАФТИЛ ЭТОТ ПРОПУСК... РАБОТАЙТЕ, БРАТЬЯ!»*\n* **Театр Позднякова:** Братья пишут фейковые новости в стиле радикальных пабликов про \"шарагу по стирке ковров\", где Саня \"швыряет чистое изделие в грязный кузов\"."}, {"num": 16, "title": "🚑 МЕДИЦИНСКАЯ КАРТА И ХРУСТ КОСТЕЙ", "content": "* **Катастрофа ЖКТ:** Острая пища и энергетики сделали свое дело. *«Потом острая вода... прорыв дамбы»*.\n* **Толерантность к кофеину:** *«Нзт глушит... чашка per day теперь на ограничении»*.\n* **Алкогольные травмы:** *«Я нажрался как обычно. И в снегу валялся. Жестко»*."}, {"num": 17, "title": "🧠 ПСИХОЛОГИЧЕСКИЙ ПОРТРЕТ И КРИЗИСЫ СЕЗОНА (ФИНАЛЬНЫЙ ИТОГ)", "content": "**Андрей (27-28 лет): Нейро-Тролль в Командировочном Аду**\n\nАндрей окончательно хакнул взрослую жизнь. Командировки (Орёл) и корпоративные «кидки» на деньги (15к) он воспринимает не как трагедию, а как инфоповод для создания ИИ-мемов. Он стал демиургом: с помощью ChatGPT он пишет фейковые новости, доводя брата до паники, и создает шедевральные сатирические тексты. Покупка дорогих гаджетов (MacBook, iPhone) для него — способ компенсировать бытовую серость. В диалоге он абсолютный кукловод, который дергает Михаила за ниточки.\n\n**Михаил (24-25 лет): Заводской Киберпанк**\n\nМихаил столкнулся с полным отчуждением труда. Работа на заводе в смены (чистка снега лопатой, ночные дежурства) убивает его физически, но спасает Steam Deck. Он — настоящий киберпанк-работяга: сидит в бытовке завода, раздает интернет через VPN, чтобы обойти чебурнет, и слушает ИИ-диджея в Spotify. Его страх остаться «нищуком» заставляет его спускать деньги на дорогие снеки и крафт. Нейросети для него стали лучшими друзьями, заменяя реальных людей.\n\n**Общая динамика мировоззрения (ВЕНЕЦ ЭПОХИ):**\n\nВесна 2026 года — это абсолютный венец их переписки. Если в 2015 году они боялись мамки и учителей, то в 2026 они боятся Роскомнадзора, потери VPN-ключей и урезания оклада.\n\nИх чат мутировал в саморазвивающуюся нейросетевую экосистему. Они больше не просто перекидывают мемы — они генерируют их через ИИ (фейки про РБК, пасты про Позднякова, сводки про Тарпапу). Это непрерывный поток пост-иронии, где реальные боли (нехватка денег, тяжелая работа, заблокированный интернет) мгновенно перерабатываются в высокооктановый, истерически смешной контент.\n\nОни выжили. Они повзрослели. И, несмотря на жесткие угрозы «разбить ебало» и постоянные посылы на три буквы, этот чат остается их личным шедевром — местом, где два брата, вооружившись VPN и нейросетями, продолжают свой бесконечный, счастливый кибер-бунт против скучной реальности."}], "id": 22, "seq": 23}, {"roman": "XXI", "subtitle": "ВТУХАЛОВО НА ЗАВОДЕ, JAWSSPOT И СТРАФТАРЬ", "period": "Май 2026 — Июль 2026 года.", "ages": "Андрей (27-28 лет), Михаил (24-25 лет).", "codename": "Лето 26-го: Азотный Стаут, Стим Дек и Майндсет Заводчанина", "sections": [{"num": 1, "title": "🕰 ЭПОХА И ВАЙБ (СЕЗОН)", "content": "* **Временной период:** 1 Мая 2026 — 25 Июля 2026 года.\n* **Название сезона:** «Рабочий Класс: Прачка, Смены и Код Коричневый».\n* **Главный лейтмотив:** Тотальное физическое и ментальное истощение от работы. Взрослая жизнь оказалась «втухаловом». Братья компенсируют стресс дорогим крафтовым пивом (Гиннесс, стауты), острым корейским раменом и ночными катками в *Escape from Tarkov* (PVE). Михаил берет Steam Deck прямо в цех, чтобы играть, прячась от начальства. Уровень абсурда в переписке достигает абсолюта."}, {"num": 2, "title": "🌍 ГЛОБАЛЬНЫЙ ФОН И МИРОВЫЕ СОБЫТИЯ", "content": "Реальный мир братьев больше не интересует, они обсуждают только мемы и игры:\n* **Новые Гаджеты:** Обсуждается iPhone 17 (Михаил покупает на него чехол) и повсеместное использование Steam Deck.\n* **Сериал «The Boys» (Пацаны):** Споры о сюжете, Хоумлендере («Твердыне») и переводах. *«ХОМЛЕНДЕР В СЛЕДКАХ БЬЕТ ПО УШАМ»*.\n* **Мемы из TikTok / Reels:** *«Кристина думает я пью морс на завтрак Ха Ага», «Оп оп оп»*."}, {"num": 3, "title": "📖 СЛОВАРЬ И ЛОКАЛЬНЫЕ МЕМЫ", "content": "* **Страфтарь / Страфтат** — Абсолютный мета-мем 2026 года. Универсальное слово, обозначающее игру, состояние души или абсурдную ситуацию. *«СТРАФТАРЬ ПОЛИГОН ДЛЯ РАЗГОНОВ»*.\n* **Втухать / Втухалово** — Тяжело работать, страдать на смене. *«ЩАС ВТУХАТЬ БУДЕМ ПОД РОК»*.\n* **Что такое бананы?** — Шифр-пароль. Ответ: *«Желтые. Вкусные. Калий»*.\n* **Нэрэ нэрэ / Hua hua** — Неизменная текстовая имитация бита.\n* **НЗТ (NZT)** — Кофеин, энергетики. *«Кофейный голод кроет... НЗТ ПРАЙМ»*.\n* **Скуби и Пуби (и Дуби)** — Локальные персонажи-мемы, означающие их самих или любых идиотов.\n* **ФЫАХАФЫХ...** — Главный язык эмоций. Не меняется годами."}, {"num": 4, "title": "👥 БЕСТИАРИЙ И NPC", "content": "* **Новый Зам (Главгад)** — Главный антагонист Михаила в реальности. Новый начальник на заводе, который пришел с проверкой и сказал: *«ЧЁТ ВАМ ДОХУЯ ПЛАТЯТ»*.\n* **Батя / Мамка** — Батя делит с Михаилом смены, играет в Танки, ходит в отпуск. Мама ругается.\n* **Барменша в Jawsspot** — NPC, которая терпит пьяного Михаила, ставящего свой рэп через AUX.\n* **Лысый** — Друг-собутыльник, пьет пиво «Прачка», расплачивается наличкой, за что его ненавидят в барах.\n* **Булджать (StopGame)** — Игровой журналист, видео которого братья яростно ненавидят. *«Бля булджать иди нахуй... может только про сука сыр свой ебливый»*."}, {"num": 5, "title": "⚔️ КВЕСТЫ, СПОРЫ И КЛАДБИЩЕ ИДЕЙ", "content": "* **ГРАНД-КВЕСТ «Диджей в Jawsspot»:** Эпичная арка. Михаил приходит в пустой крафтовый бар, покупает пиво за 950 рублей, коннектится к аудиосистеме бара и врубает свой маргинальный рэп (Juice WRLD, Mellowbite). Барменша в шоке, Андрей в Дискорде орет от смеха. *«ПРИКИНЬ СИЖУ Я И ИГРАЕТ 30 СЕК МАРСА... Я ЗДЕШНИЙ ДЯДЯ ПАША»*.\n* **Квест «Замена стекла на Steam Deck»:** Михаил пытается наклеить защитное стекло на портативку. В комнате пыльно, он трет экран салфетками. В итоге: *«УЖЕ ШУБА НА ЭКРАНЕ ВОЛОСАТАЯ... ПИЗДЕЦ В ПОТЕМКАХ КЛЕИЛ»*.\n* **Спор «Азотный Стаут»:** Душный спор о том, почему пиво Guinness с капсулой азота не дает газиков. Михаил объясняет: *«Пиво на чистом азоте... оно сразу вниз падает и сразу выходит... ТРАНЗИТОМ ГРАДУС»*.\n* **Золотые цитаты:**\n > *Михаил: «БЛЯ НА РАБОТУ ЕБАНУЮ»*\n > *Вы: «Я когда родился, не рыдал как сучка...» (паста жива и в 2026)*\n > *Михаил: «мама всегда говорила мне ляна добывай деньги И ВЫЖИВАЙ»*"}, {"num": 6, "title": "📍 ГЕОГРАФИЯ И ЛОКАЦИИ", "content": "* **Цех / Завод:** Место пыток Михаила. Разорванные трубы, кипяток, новые начальники и ночные смены.\n* **Офис:** Место пыток Андрея. Кофе-машина, скука и 12-часовые смены.\n* **Jawsspot (Джавс):** Элитный крафтовый бар в Нижнем Новгороде. База Михаила.\n* **Тарков (Лаба, Развязка):** Виртуальный ад.\n* **Фикс Прайс / Магнит / КБ:** Точки покупки «Дров» и «Булдака»."}, {"num": 7, "title": "💸 ЭКОНОМИКА И АРСЕНАЛ", "content": "* **Экономика Заводчанина:** Михаил получает расчетный листок (оклад 35к + премии + вредность + ночные = 80к). Возмущается, что начальник хочет урезать премию.\n* **Алко-Инфляция:** Гиннесс с крана стоит **950 рублей** за 0.5л. Михаил пьет, Андрей в шоке: *«А КОМУ НЕ ПОЗУЙ... ТОЕСТЬ МОЖНО КУПИТЬ 20 ГИНЕСОВ В ОРЛЕ»*.\n* **Гаджеты:** Активное использование Steam Deck (Михаил играет на нем прямо на заводе). iPhone 17."}, {"num": 8, "title": "🎬 КУЛЬТУРНЫЙ КОД И МЕДИА (КИНО И МУЗЫКА)", "content": "* **Музыка:** Абсолютная мешанина. Juice WRLD, Lil Mosey, MellowBite, Макс Корж, Радио Тапок. Включение рэпа в публичных местах как акт доминации.\n* **Кино:** \"8 миллиметров\" (8mm) с Николасом Кейджем. Братья смотрят его пьяными в хлам. *«Ч ТАКИМ БУХИМ НИКОГДА НЕ СМОТРЕЛ КИНО В ИСТОРИИ»*.\n* **Мемы:** \"Evil Peter\" (Retep / Злой Питер Гриффин), \"Коп Призрак\", \"Орел\"."}, {"num": 9, "title": "🎮 ИГРОВОЙ АРСЕНАЛ И СТРИМЫ (ОТДЕЛЬНЫЙ ПУНКТ)", "content": "* **Escape from Tarkov (PVE):** Играют сутками. Ненавидят ботов (БДшников). *«СУКА ЕБАНЫЙ КИЛЛА НЕ ПРОБИЛ... В ЧЕРНУЮ РУКУ ГАНДОН ПОПАЛ»*. Ждут ивент \"Ледокол\" и \"Тушино\".\n* **Balatro:** Карточный рогалик-зависимость. *«СДВГ ЛУДКА КУКИ КЛИКЕР»*.\n* **Dota 2:** Андрей играет на Пудже и Личе. *«ПУДЖ ЛИЧ ЗВЕЗДИНКА 2»*.\n* **Одиночные игры:** Last Epoch, Fallout: New Vegas (Михаил проходит на геймпаде и кайфует), Devil May Cry."}, {"num": 10, "title": "🥊 БРАТСКИЕ БАТЛЫ И ТОКСИЧНОСТЬ", "content": "* **Стиль общения:** Токсичность 99 уровня. Но теперь с налетом взрослой усталости. Они кроют друг друга матом просто по привычке.\n* **Панчлайны:**\n > *Михаил: «ты че там вопишь упырь»*\n > *Вы: «Жоп закрой свою пидорскую»*\n > *Вы: «владимир машков ты хуесос тебя не уважают за то что ты не придал значения игре гта 4»* (Абстрактный нейро-разгон)."}, {"num": 11, "title": "🍕 ГАСТРОНОМИЯ И РАЦИОН", "content": "* **Buldak (Булдыч):** Острая корейская лапша — их наркотик. Михаил варит розовый Булдак, добавляет туда колбасу и сыр. *«СОПЛИ ПОШЛИ НО НЕ ТАК БОЛЬНО КАК У БУЛДЫЧА НА ХОЛОСТУЮ ЕДУ»*.\n* **Офисный кофе:** Андрей пьет эспрессо и воронку, зарабатывая бессонницу. *«ГОЛОД КОФЕЙНЫЙ КРОЕТ... ПИЗДЕЦ СТРАГЛ»*.\n* **Метровые чипсы:** Андрей ищет в Фикс Прайсе длинные чипсы под пиво."}, {"num": 12, "title": "🍻 АЛКОГОЛЬНЫЙ СЧЕТЧИК И ПИВНАЯ СТАТИСТИКА", "content": "* **Контекст:** Взрослый, тяжелый скуф-алкоголизм для снятия стресса после 12-часовых смен.\n* **Напитки:** Азотный Стаут (Гиннесс за 950р), \"Прачка\" (Атомная Прачечная - Jaws), \"Бад\", \"Морос\", Сидр, \"Гара\" (Garage), Ром \"Бакарди\".\n* **Инциденты (Код Коричневый):** Пиво + Булдак = Конец.\n > *Вы: «Пиздец рвет жопу ой ой ой»*\n > *Вы: «Я ПРЯМ СУКА ГАЗЫ СО ВСЕХ ЩЕЛЕЙ ЕБАНОЕ ПИВО»*\n > *Михаил: «завтрак холостяка С ПОХМЕЛЬЯ»*."}, {"num": 13, "title": "🦥 ХРОНИКИ ПРОКРАСТИНАЦИИ И УСПЕХОВ", "content": "* **Вместо дела:** Михаил на смене прячется с портативкой: *«чилю в деке, а начальство то тут... благо я успел закинуть в сумку»*. Андрей сидит в офисе и кидает мемы про \"Страфтарь\".\n* **Успехи:** Выжили. Михаил научился менять прокладки на кипящих трубах (*«ЧЕРЕЗ ПЕРЧАТКИ УЖЕ ЛЕСТНИЦА НАВЕРХУ КИПИТ»*)."}, {"num": 14, "title": "🎭 РЕЖИМ «ДУШНИЛЫ» И ИНТЕЛЛЕКТУАЛЬНЫЙ СНОБИЗМ", "content": "* **Алкогольный Снобизм:** Михаил объясняет, как работает азотная капсула в Гиннессе и почему от нее нет \"вздутия\".\n* **Игровой Снобизм:** Бесконечные лекции о том, как нужно \"распикивать\" ботов в Таркове, какие патроны (БДшные) шьют 5 класс брони."}, {"num": 15, "title": "🎬 ВНУТРЕННИЙ КИНЕМАТОГРАФ И ТЕАТР ОДНОГО АКТЕРА", "content": "* **Лор Армии (Отыгрыш):** Андрей вспоминает армию: *«опять пидорас не в ногу идет щас пиздить будем его после 100 кругов... тату OUTLAW че значит у тебя... Хз не знаю на Английском чето»*.\n* **Сцена в Jawsspot:** Михаил отыгрывает крутого парня: *«бармен милениал... у нас тут все по свойски... I'M ICEMAN»*.\n* **Фейковые Диалоги:** *«Привет водитель можно подключится к аукс? Да конечно можно *Включаю Drake - iceman*»*."}, {"num": 16, "title": "🚑 МЕДИЦИНСКАЯ КАРТА И ХРУСТ КОСТЕЙ", "content": "* **Отравления и Диарея:** Главный бич 2026 года. Комбинация кофе, стаутов и Булдака уничтожила их ЖКТ. *«Животом саня красный живот у него болит пузико»*.\n* **Усталость:** Тотальный недосып («СДВГ», «кофеиновая яма», «нога тряслась 30 минут»).\n* **Продуло:** *«Ох бля продуло... Я вспотел блять как ПИДОРАС ПОСЛЕЖНИЙ»*."}, {"num": 17, "title": "🧠 ПСИХОЛОГИЧЕСКИЙ ПОРТРЕТ И КРИЗИСЫ СЕЗОНА (ФИНАЛЬНЫЙ ИТОГ)", "content": "**Андрей (27-28 лет): Выгоревший Офисный Ветеран**\n\nАндрей пересек ту черту, когда работа окончательно потеряла флер новизны и стала просто \"ебаной рутиной\". Он сидит в офисе по 12 часов, пьет кофе литрами, страдает от тахикардии и ЖКТ. Вся его жизненная энергия аккумулируется и выстреливает вечером в Дискорде. Он принял свой возраст и статус: пьет крафт, шутит про скуфов, вспоминает армию. Троллинг брата — его любимое ТВ-шоу. Он искренне хохочет над тем, как Михаил страдает на заводе, потому что сам прошел через это.\n\n**Михаил (24-25 лет): Заводской Хайпбист с Steam Deck**\n\nМихаил столкнулся с бетонной стеной взрослой жизни — ночными сменами в цеху, кипящими трубами и начальством, которое хочет урезать премии. Чтобы психика не сломалась, он приносит на завод Steam Deck и включает режим \"гангстера\". Его походы в дорогие бары (пить пиво за 950 рублей) и распитие энергетиков — это бунт против системы, попытка сказать себе: \"Я не просто слесарь, я Ice Man, я слушаю трэп и кайфую\". Его капслоковые истерики (ФЫАХАФЫХ) — это предохранительный клапан, сбрасывающий давление от тяжелой, взрослой работы.\n\n**Общая динамика мировоззрения (ИТОГ):**\n\nАрхив 2015–2026 годов — это уникальный документ взросления в цифровую эпоху. Мы проследили их путь от школьников, прячущихся за баней с вейпом, до суровых работяг с больными спинами и пивом. За 11 лет изменились декорации: ОГЭ сменился сменами на заводе, дешевый «Блейзер» — крафтовым стаутом, а слабые компы — мощными ПК и Steam Deck.\n\nНо одно осталось неизменным: их чат. Это герметичный бункер, куда не проникают кризисы, пандемии и проблемы. Язык, сотканный из тысяч мемов, цитат стримеров (Папич), рэп-адлибов (MellowBite) и мата — это самый искренний язык любви двух братьев. Токсичность и оскорбления — лишь форма. По сути, каждый их \"ФЫАХАФЫХ\" или \"Сказал бы ты мне это в реале\" означает одно: *\"Я здесь, я тебя понимаю, и пока мы можем вместе смеяться над этим абсурдом, мы справимся с чем угодно\"*."}], "id": 23, "seq": 24}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('volume-data').textContent);
const volumes = DATA.volumes;
const readState = new Set(); // in-memory only, no storage
let currentId = 0;

/* ---------- text helpers ---------- */
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function formatPeriod(period){
  if(!period) return '—';
  let p = period.replace(/-{2,}|—/g, '—').replace(/\s*года\.?\s*$/i, '').trim();
  p = p.replace(/\s*—\s*/g, ' — ');
  return p;
}
function formatAges(ages){
  if(!ages) return '—';
  const parts = ages.split(/,\s*(?=[А-ЯA-Z])/).map(p => p.trim()).filter(Boolean);
  return parts.map(p => escapeHtml(p)).join('<br>');
}
function inlineMd(s){
  s = escapeHtml(s);
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[\s(])\*([^\*\n]+?)\*(?=[\s).,!?]|$)/g, '$1<em>$2</em>');
  return s;
}

/* ---------- readable content parser ----------
   Source text is hard-wrapped with single \n; bullets start with "* "
   and quotes with "> ". We unwrap continuation lines back onto their
   logical line, then group bullets (+ their trailing quotes) into <li>. */
function parseLogical(raw){
  const rawLines = raw.split('\n');
  const logical = [];
  for(let line of rawLines){
    line = line.trim();
    if(!line) continue;
    if(/^[*-]\s+/.test(line)){
      logical.push({type:'bullet', text: line.replace(/^[*-]\s+/,'')});
    } else if(/^>\s*/.test(line)){
      logical.push({type:'quote', text: line.replace(/^>\s*/,'')});
    } else if(logical.length === 0){
      logical.push({type:'para', text: line});
    } else {
      logical[logical.length-1].text += ' ' + line;
    }
  }
  return logical;
}
function renderContent(raw){
  const logical = parseLogical(raw);
  let html = '';
  let i = 0;
  while(i < logical.length){
    const item = logical[i];
    if(item.type === 'bullet'){
      let ul = '<ul>';
      while(i < logical.length && logical[i].type === 'bullet'){
        let li = inlineMd(logical[i].text);
        i++;
        let quotes = '';
        while(i < logical.length && logical[i].type === 'quote'){
          quotes += '<blockquote>' + inlineMd(logical[i].text) + '</blockquote>';
          i++;
        }
        ul += '<li>' + li + quotes + '</li>';
      }
      html += ul + '</ul>';
    } else if(item.type === 'quote'){
      html += '<blockquote>' + inlineMd(item.text) + '</blockquote>';
      i++;
    } else {
      splitParagraph(item.text).forEach(p => { html += '<p>' + inlineMd(p) + '</p>'; });
      i++;
    }
  }
  return html;
}

/* prose sections have no blank-line paragraph breaks in the source, so we
   infer breaks: first at bold "label:" runs that start a new sentence,
   then (if a chunk is still long) every ~3 sentences as a fallback. */
function splitParagraph(text){
  let parts = text.split(/(?<=[.!?])\s+(?=\*\*)/).map(p => p.trim()).filter(Boolean);
  const out = [];
  const maxLen = 420;
  parts.forEach(part => {
    if(part.length <= maxLen){ out.push(part); return; }
    const sentences = part.split(/(?<=[.!?])\s+(?=[А-ЯA-Z])/);
    let chunk = '';
    let count = 0;
    sentences.forEach(sent => {
      chunk += (chunk ? ' ' : '') + sent;
      count++;
      if(count >= 3 || chunk.length >= maxLen){ out.push(chunk); chunk=''; count=0; }
    });
    if(chunk) out.push(chunk);
  });
  return out;
}

/* ---------- curtain transition ---------- */
function runCurtain(text, callback, holdMs){
  const curtain = document.getElementById('curtain');
  const curtainText = document.getElementById('curtainText');
  curtainText.textContent = text;
  curtain.classList.add('show');
  setTimeout(() => {
    callback();
    window.scrollTo({top:0});
    setTimeout(() => curtain.classList.remove('show'), 250);
  }, holdMs || 1000);
}

/* ---------- cover ---------- */
function countUp(el, target, suffix){
  suffix = suffix || '';
  const dur = 900, start = performance.now();
  function step(now){
    const t = Math.min(1, (now - start) / dur);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = Math.round(eased * target) + suffix;
    if(t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ---------- glossary & characters (derived from bullet sections) ---------- */
function extractBulletEntries(sectionNum){
  const entries = [];
  volumes.forEach(v => {
    const sec = v.sections.find(s => s.num === sectionNum);
    if(!sec) return;
    const logical = parseLogical(sec.content);
    let i = 0;
    while(i < logical.length){
      if(logical[i].type === 'bullet'){
        const text = logical[i].text;
        const m = text.match(/^\*\*(.+?)\*\*\s*[-—–]{1,3}\s*([\s\S]*)$/);
        i++;
        let quote = '';
        while(i < logical.length && logical[i].type === 'quote'){
          quote = logical[i].text.replace(/^\*|\*$/g, '');
          i++;
        }
        if(m){
          entries.push({term: m[1].trim(), def: m[2].trim(), quote, volId: v.id, roman: v.roman});
        }
      } else { i++; }
    }
  });
  return entries;
}
let glossaryCache = null;
function getGlossary(){
  if(!glossaryCache) glossaryCache = extractBulletEntries(3);
  return glossaryCache;
}
let charCache = null;
function splitTopLevelSlash(term){
  let depth = 0, parts = [], cur = '';
  for(const ch of term){
    if(ch === '(') depth++;
    if(ch === ')') depth--;
    if(ch === '/' && depth === 0){ parts.push(cur); cur = ''; }
    else cur += ch;
  }
  parts.push(cur);
  return parts.map(p => p.trim()).filter(Boolean);
}
function levenshtein(a, b){
  const m = a.length, n = b.length;
  const dp = Array.from({length: m+1}, () => new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0] = i;
  for(let j=0;j<=n;j++) dp[0][j] = j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
    }
  }
  return dp[m][n];
}
function getCharacters(){
  if(charCache) return charCache;
  const raw = extractBulletEntries(4);
  // split multi-name bullets ("Саня Жданов / Костя Муринчик") into separate people
  const initial = [];
  raw.forEach(e => {
    splitTopLevelSlash(e.term).forEach(n => {
      const cleanName = n.split('(')[0].trim();
      if(cleanName) initial.push({name: cleanName, def: e.def, quote: e.quote});
    });
  });
  // group by first name token
  const map = new Map();
  initial.forEach(e => {
    const key = e.name.toLowerCase().split(/\s+/)[0];
    if(!key) return;
    if(!map.has(key)){
      map.set(key, {names: [e.name], name: e.name, def: e.def, quote: e.quote, count: 1});
    } else {
      const c = map.get(key);
      c.count++;
      c.names.push(e.name);
      if(e.name.length > c.name.length) c.name = e.name;
      if(e.def.length > c.def.length) c.def = e.def;
      if(!c.quote && e.quote) c.quote = e.quote;
    }
  });
  // fuzzy-merge near-identical name variants (Костя / Костян, Саня / Санёк...)
  let merged = true;
  while(merged){
    merged = false;
    const keys = Array.from(map.keys());
    outer:
    for(let i=0;i<keys.length;i++){
      for(let j=i+1;j<keys.length;j++){
        const a = keys[i], b = keys[j];
        if(!map.has(a) || !map.has(b) || a.length<3 || b.length<3) continue;
        if(levenshtein(a,b) <= 1 && Math.abs(a.length-b.length) <= 2){
          const A = map.get(a), B = map.get(b);
          const keep = A.count >= B.count ? A : B;
          const drop = A.count >= B.count ? B : A;
          keep.count += drop.count;
          keep.names = keep.names.concat(drop.names);
          if(drop.name.length > keep.name.length) keep.name = drop.name;
          if(drop.def.length > keep.def.length) keep.def = drop.def;
          if(!keep.quote && drop.quote) keep.quote = drop.quote;
          map.delete(A.count >= B.count ? b : a);
          merged = true;
          break outer;
        }
      }
    }
  }
  charCache = Array.from(map.values()).sort((a,b) => b.count - a.count);
  return charCache;
}
function truncateToSentence(text, maxLen){
  text = text.trim();
  if(text.length <= maxLen) return text;
  const slice = text.slice(0, maxLen);
  const lastEnd = Math.max(slice.lastIndexOf('.'), slice.lastIndexOf('!'), slice.lastIndexOf('?'));
  if(lastEnd > maxLen * 0.35){ return slice.slice(0, lastEnd+1); }
  const lastSpace = slice.lastIndexOf(' ');
  return (lastSpace > 0 ? slice.slice(0, lastSpace) : slice) + '…';
}
function getLeadFacts(){
  const lastVol = volumes[volumes.length-1];
  const psychSec = lastVol.sections.find(s => s.num === 17);
  const raw = psychSec ? psychSec.content : '';
  function extractLead(nameRegex, stopRegex, fallback){
    const m = raw.match(nameRegex);
    if(!m) return fallback;
    let rest = raw.slice(m.index + m[0].length);
    const stopM = rest.match(stopRegex);
    let chunk = stopM ? rest.slice(0, stopM.index) : rest.slice(0, 380);
    chunk = chunk.replace(/\n/g,' ').replace(/\*\*/g,'').trim();
    chunk = truncateToSentence(chunk, 320);
    return chunk || fallback;
  }
  return {
    andrey: extractLead(/\*\*Андрей[^*]*\*\*/, /\*\*Михаил/, 'Старший брат. Циник, архивариус мемов и вечный «двачер».'),
    mikhail: extractLead(/\*\*Михаил[^*]*\*\*/, /\*\*Общая|\*\*Общий|\*\*Вывод/, 'Младший брат. Максималист и комок оголённых нервов.')
  };
}

}

/* ---------- final dossier page ---------- */
function renderFinal(){
  currentId = 'final';
  const chars = getCharacters().slice(0, 18);
  const {andrey, mikhail} = getLeadFacts();
  mainInner.innerHTML = `
    <div class="vol-tag">Досье закрыто · личности установлены</div>
    <h1 class="vol-title">Итоговое досье</h1>
    <p style="color:var(--ink-dim);font-size:15px;max-width:580px;margin-bottom:36px;">Все ${volumes.length} томов прочитаны. Вот главные действующие лица этой хроники — наведи (или нажми) на карточку, чтобы узнать факт.</p>
    <div class="lead-cards">
      <div class="flip-card lead"><div class="flip-inner">
        <div class="flip-front"><div class="flip-name">Андрей</div><div class="flip-role">Старший брат</div></div>
        <div class="flip-back"><div class="fb-scroll">${inlineMd(andrey)}</div></div>
      </div></div>
      <div class="flip-card lead"><div class="flip-inner">
        <div class="flip-front"><div class="flip-name">Михаил</div><div class="flip-role">Младший брат</div></div>
        <div class="flip-back"><div class="fb-scroll">${inlineMd(mikhail)}</div></div>
      </div></div>
    </div>
    <div class="vol-tag" style="margin-top:50px;">Второстепенные лица</div>
    <div class="char-grid" id="charGrid"></div>
  `;
  const grid = mainInner.querySelector('#charGrid');
  grid.innerHTML = chars.map(c => {
    const back = truncateToSentence(c.def, 240);
    return `
      <div class="flip-card"><div class="flip-inner">

        <div class="flip-back"><div class="fb-scroll">${inlineMd(back)}</div></div>
      </div></div>
    `;
  }).join('');
  buildSidebar();
  window.scrollTo({top:0});
}

const mainInner = document.getElementById('mainInner');
/* click-to-flip for touch devices */

function renderVolume(id, sectionNum){
  const v = volumes.find(x => x.id === id);
  if(!v) return;
  currentId = id;
  readState.add(id);

  const idx = volumes.findIndex(x => x.id === id);
  const prevV = volumes[idx-1];
  const nextV = volumes[idx+1];

  mainInner.innerHTML = `
    <div class="vol-tag">Том ${v.roman} · запись №${String(v.seq).padStart(2,'0')} из ${volumes.length}</div>
    <h1 class="vol-title">${escapeHtml(v.subtitle)}</h1>
    <div class="vol-meta">
      <div><b>Период</b><span>${escapeHtml(formatPeriod(v.period))}</span></div>
      <div><b>Возраст</b><span>${formatAges(v.ages)}</span></div>
    </div>
    ${v.codename ? `<div class="vol-code">«${escapeHtml(v.codename)}»</div>` : ''}
    <div class="sections" id="sections"></div>
    <div class="nav-buttons">
      <button class="nav-btn prev" ${prevV ? '' : 'disabled'}>${prevV ? '<small>← Предыдущий</small>'+escapeHtml(prevV.subtitle) : '<small>Начало архива</small>—'}</button>
      <button class="nav-btn next">${nextV ? '<small>Следующий →</small>'+escapeHtml(nextV.subtitle) : '<small>Финал →</small>Открыть итоговое досье'}</button>
    </div>
  `;

  const sectionsEl = mainInner.querySelector('#sections');
  v.sections.forEach(s => {
    const block = document.createElement('div');
    block.className = 'sec-block';
    block.dataset.num = s.num;
    block.innerHTML = `
      <div class="sec-head">
        <span class="sec-num">${String(s.num).padStart(2,'0')}</span>
        <span class="sec-title">${escapeHtml(s.title)}</span>
        <span class="sec-arrow">›</span>
      </div>
      <div class="sec-body">${renderContent(s.content)}</div>
    `;
    block.querySelector('.sec-head').addEventListener('click', () => block.classList.toggle('collapsed'));
    sectionsEl.appendChild(block);
  });

  if(prevV) mainInner.querySelector('.nav-btn.prev').addEventListener('click', () => renderVolume(prevV.id));
  mainInner.querySelector('.nav-btn.next').addEventListener('click', () => {
    if(nextV) renderVolume(nextV.id);
    else runCurtain('Досье закрыто. Личности устанавливаются…', () => renderFinal(), 1300);
  });

  buildSidebar();
  updateProgress();
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});

  if(sectionNum){
    const target = sectionsEl.querySelector(`.sec-block[data-num="${sectionNum}"]`);
    if(target) setTimeout(()=> target.scrollIntoView({behavior:'smooth', block:'start'}), 200);
  }
}

/* ---------- search ---------- */
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
let searchIndex = [];
volumes.forEach(v => {
  v.sections.forEach(s => {
    searchIndex.push({volId: v.id, roman: v.roman, seq: v.seq, secNum: s.num, secTitle: s.title, volTitle: v.subtitle, text: s.content});
  });
});
function highlight(text, q){
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if(i === -1) return escapeHtml(text.slice(0,80));
  const start = Math.max(0, i-30);
  const end = Math.min(text.length, i+q.length+40);
  let snippet = (start>0?'…':'') + text.slice(start,end) + (end<text.length?'…':'');
  const esc = escapeHtml(snippet);
  const re = new RegExp(escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'ig');
  return esc.replace(re, m => '<mark>'+m+'</mark>');
}
let searchTimer;
searchInput.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 120); });
function runSearch(){
  const q = searchInput.value.trim();
  if(q.length < 2){ searchResults.classList.remove('show'); searchResults.innerHTML=''; return; }
  const ql = q.toLowerCase();
  const hits = searchIndex.filter(item =>
    item.text.toLowerCase().includes(ql) || item.volTitle.toLowerCase().includes(ql) || item.secTitle.toLowerCase().includes(ql)
  ).slice(0, 20);
  searchResults.classList.add('show');
  if(hits.length === 0){ searchResults.innerHTML = '<div class="sb-hit">Ничего не найдено.</div>'; return; }
  searchResults.innerHTML = hits.map(h => `
    <div class="sb-hit" data-vol="${h.volId}" data-sec="${h.secNum}">
      <span class="hit-tag">Том ${h.roman} · ${escapeHtml(h.secTitle)}</span>
      ${highlight(h.text, q)}
    </div>
  `).join('');
  searchResults.querySelectorAll('.sb-hit[data-vol]').forEach(el => {
    el.addEventListener('click', () => {
      renderVolume(parseInt(el.dataset.vol), parseInt(el.dataset.sec));
      searchResults.classList.remove('show');
      searchInput.value = '';
      closeSidebarMobile();
    });
  });
}
