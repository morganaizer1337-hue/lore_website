<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Архив переписки — АМ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#161209;
    --bg-1:#1c170e;
    --bg-2:#221c11;
    --panel:#221c11;
    --line:#3c3320;
    --line-soft:#2a2416;
    --ink:#f1ecdf;
    --ink-dim:#b7ab8f;
    --ink-dimmer:#8a7e66;
    --white:#f7f3e8;
    --disp:'Unbounded', sans-serif;
    --body:'Manrope', sans-serif;
    --mono:'JetBrains Mono', monospace;
    --sidebar-w:308px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(1000px 560px at 12% -8%, #241e12 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 8%, #1e1a10 0%, transparent 55%),
      var(--bg-0);
    color:var(--ink);
    font-family:var(--body);line-height:1.6;-webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    position:relative;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:998;
    opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  ::selection{background:var(--white);color:#000;}
  button{font:inherit;}

  /* ================= COVER ================= */
  #cover{
    position:fixed;inset:0;z-index:500;
    background:var(--bg-0);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    transition:opacity .7s ease, visibility .7s;
  }
  #cover.hide{opacity:0;visibility:hidden;pointer-events:none;}
  #cover .bg-svg{
    position:absolute;inset:0;width:100%;height:100%;opacity:.16;
    animation:coverRotate 140s linear infinite;
    transform-origin:center;
  }
  @keyframes coverRotate{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  @media (prefers-reduced-motion: reduce){ #cover .bg-svg{animation:none;} }
  #cover .bg-glow{
    position:absolute;top:50%;left:50%;width:900px;height:900px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,255,255,.06) 0%, transparent 65%);
    pointer-events:none;
  }
  .cover-inner{position:relative;z-index:2;text-align:center;max-width:760px;padding:0 28px;}
  .cover-eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--ink-dimmer);margin-bottom:26px;
    opacity:0;animation:coverUp .8s .1s forwards;
  }
  .cover-eyebrow span{color:var(--ink-dim);}
  .cover-title{
    font-family:var(--disp);font-weight:700;letter-spacing:-.01em;
    font-size:clamp(40px,8vw,84px);line-height:.98;color:var(--white);margin:0 0 26px;
    opacity:0;animation:coverUp .9s .25s forwards;
  }
  .cover-title em{font-style:normal;color:var(--ink-dimmer);}
  .cover-sub{
    font-family:var(--body);font-size:16.5px;color:var(--ink-dim);max-width:480px;margin:0 auto 44px;
    opacity:0;animation:coverUp .9s .4s forwards;
  }
  .cover-stats{
    display:flex;justify-content:center;gap:36px;margin-bottom:48px;flex-wrap:wrap;
    opacity:0;animation:coverUp .9s .5s forwards;
  }
  .cover-stats div{font-family:var(--mono);font-size:11px;color:var(--ink-dimmer);letter-spacing:.05em;text-transform:uppercase;}
  .cover-stats b{display:block;font-family:var(--disp);font-size:24px;color:var(--white);font-weight:600;margin-bottom:2px;}
  .cover-cta{
    opacity:0;animation:coverUp .9s .6s forwards;
  }
  .btn-cover{
    font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.02em;
    background:var(--white);color:#000;border:none;
    padding:19px 44px;border-radius:100px;cursor:pointer;
    transition:transform .2s, box-shadow .2s;
    box-shadow:0 0 0 rgba(255,255,255,0);
  }
  .btn-cover:hover{transform:translateY(-2px);box-shadow:0 14px 40px -12px rgba(255,255,255,.25);}
  .cover-foot{
    margin-top:26px;font-family:var(--mono);font-size:10.5px;color:var(--ink-dimmer);letter-spacing:.08em;
    opacity:0;animation:coverUp .9s .7s forwards;
  }
  @keyframes coverUp{ from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){
    .cover-eyebrow,.cover-title,.cover-sub,.cover-stats,.cover-cta,.cover-foot{animation:none;opacity:1;}
  }

  /* ================= CURTAIN TRANSITION ================= */
  #curtain{
    position:fixed;inset:0;z-index:600;background:var(--bg-0);
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    opacity:0;pointer-events:none;transition:opacity .45s ease;
  }
  #curtain.show{opacity:1;pointer-events:all;}
  #curtain .curtain-line{
    width:40px;height:1px;background:var(--ink-dimmer);
    transform:scaleX(0);transition:transform .5s ease .1s;
  }
  #curtain.show .curtain-line{transform:scaleX(1);}
  .curtain-text{
    font-family:var(--mono);letter-spacing:.22em;text-transform:uppercase;
    font-size:clamp(11px,2vw,13px);color:var(--ink-dim);
    opacity:0;transform:translateY(8px);transition:opacity .5s ease .2s, transform .5s ease .2s;
  }
  #curtain.show .curtain-text{opacity:1;transform:translateY(0);}

  /* ================= APP SHELL ================= */
  #app{display:flex;min-height:100vh;}

  /* ---- sidebar ---- */
  #sidebar{
    width:var(--sidebar-w);flex-shrink:0;
    position:fixed;top:0;left:0;bottom:0;
    border-right:1px solid var(--line-soft);
    display:flex;flex-direction:column;
    background:var(--bg-0);
    z-index:100;
    transition:transform .3s ease;
  }
  .sb-head{padding:22px 22px 16px;border-bottom:1px solid var(--line-soft);}
  .sb-brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:600;font-size:14px;margin-bottom:14px;}
  .sb-brand .mark{width:26px;height:26px;border-radius:50%;background:var(--white);color:#000;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:10px;}
  .sb-progress-bar{height:3px;background:var(--line-soft);border-radius:2px;overflow:hidden;margin-bottom:8px;}
  .sb-progress-fill{height:100%;background:var(--white);width:0%;transition:width .4s ease;}
  .sb-progress-label{font-family:var(--mono);font-size:10px;color:var(--ink-dimmer);letter-spacing:.05em;text-transform:uppercase;}

  .sb-search{padding:14px 22px;border-bottom:1px solid var(--line-soft);}
  .sb-search input{
    width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);
    font-family:var(--body);font-size:12.5px;padding:10px 14px;border-radius:100px;outline:none;
  }
  .sb-search input:focus{border-color:var(--ink-dim);}
  .sb-search-results{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .sb-search-results.show{max-height:340px;overflow-y:auto;margin-top:10px;}
  .sb-hit{font-family:var(--body);font-size:11.5px;padding:9px 10px;border-radius:5px;cursor:pointer;color:var(--ink-dim);}
  .sb-hit:hover{background:var(--bg-2);color:var(--ink);}
  .sb-hit .hit-tag{display:block;font-family:var(--mono);font-size:9.5px;color:var(--ink-dimmer);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
  .sb-hit mark{background:var(--white);color:#000;border-radius:2px;padding:0 1px;}

  .sb-pin{padding:12px 12px 2px;border-bottom:1px solid var(--line-soft);}
  .sb-pin-btn{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:6px;cursor:pointer;font-family:var(--body);font-weight:600;font-size:12.5px;color:var(--ink-dim);margin-bottom:6px;transition:background .15s,color .15s;}
  .sb-pin-btn:hover{background:var(--bg-1);color:var(--ink);}
  .sb-pin-btn.active{background:var(--bg-2);color:var(--white);}
  .sb-pin-btn .pin-icon{width:16px;text-align:center;flex-shrink:0;font-size:12px;}
  .sb-pin-btn.locked{opacity:.4;cursor:default;}
  .sb-pin-btn.locked:hover{background:none;color:var(--ink-dim);}

  .sb-list{flex:1;overflow-y:auto;padding:8px 10px 24px;}
  .sb-item{
    display:flex;align-items:center;gap:12px;
    padding:12px 12px;border-radius:6px;cursor:pointer;
    border-left:2px solid transparent;
    transition:background .15s;
  }
  .sb-item:hover{background:var(--bg-1);}
  .sb-item.active{background:var(--bg-2);border-left-color:var(--white);}
  .sb-status{
    width:16px;height:16px;border-radius:50%;flex-shrink:0;
    border:1.4px solid var(--ink-dimmer);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:9px;color:transparent;
  }
  .sb-item.read .sb-status{background:var(--white);border-color:var(--white);color:#000;}
  .sb-item.active .sb-status{border-color:var(--white);}
  .sb-item-text{flex:1;min-width:0;}
  .sb-item-num{font-family:var(--mono);font-size:9.5px;color:var(--ink-dimmer);letter-spacing:.06em;}
  .sb-item-title{font-family:var(--body);font-weight:600;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .sb-item-period{font-family:var(--mono);font-size:9.5px;color:var(--ink-dimmer);margin-top:2px;}

  #sb-toggle{
    display:none;position:fixed;top:18px;left:18px;z-index:150;
    background:var(--panel);border:1px solid var(--line);color:var(--ink);
    width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:16px;
  }
  #sb-backdrop{display:none;}

  @media (max-width:880px){
    #sidebar{transform:translateX(-100%);width:86vw;max-width:340px;box-shadow:0 0 60px rgba(0,0,0,.6);}
    #sidebar.open{transform:translateX(0);}
    #sb-toggle{display:flex;align-items:center;justify-content:center;}
    #sb-backdrop.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;}
  }

  /* ---- main panel ---- */
  #main{margin-left:var(--sidebar-w);flex:1;min-width:0;}
  @media (max-width:880px){ #main{margin-left:0;} }
  .main-inner{max-width:720px;margin:0 auto;padding:64px 40px 140px;}
  @media (max-width:640px){ .main-inner{padding:80px 22px 120px;} }

  .vol-tag{font-family:var(--mono);font-size:11px;color:var(--ink-dimmer);letter-spacing:.16em;text-transform:uppercase;margin-bottom:18px;}
  .vol-title{font-family:var(--disp);font-weight:600;font-size:clamp(28px,4.6vw,42px);line-height:1.1;color:var(--white);margin:0 0 26px;}
  .vol-meta{display:grid;grid-template-columns:1fr 1fr;gap:24px;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);padding:22px 0;margin-bottom:8px;}
  @media(max-width:520px){.vol-meta{grid-template-columns:1fr;gap:16px;}}
  .vol-meta div b{display:block;color:var(--ink-dimmer);font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px;}
  .vol-meta div span{display:block;font-family:var(--body);font-weight:600;font-size:16px;color:var(--ink);line-height:1.4;}
  .vol-code{font-family:var(--body);font-style:italic;color:var(--ink-dim);font-size:15px;margin:26px 0 6px;padding:16px 20px;border-left:2px solid var(--line);background:var(--bg-1);}

  .sections{margin-top:44px;}
  .sec-block{padding:30px 0;border-bottom:1px solid var(--line-soft);}
  .sec-head{display:flex;align-items:baseline;gap:14px;cursor:pointer;user-select:none;margin-bottom:16px;}
  .sec-num{font-family:var(--mono);font-size:11.5px;color:var(--ink-dimmer);flex-shrink:0;width:20px;}
  .sec-title{font-family:var(--disp);font-weight:500;font-size:15.5px;letter-spacing:.01em;color:var(--ink);flex:1;text-transform:uppercase;}
  .sec-arrow{font-family:var(--mono);color:var(--ink-dim);transition:transform .2s;font-size:13px;}
  .sec-block.collapsed .sec-arrow{transform:rotate(0deg);}
  .sec-block:not(.collapsed) .sec-arrow{transform:rotate(90deg);color:var(--white);}
  .sec-body{padding-left:34px;font-size:15px;color:var(--ink-dim);}
  .sec-block.collapsed .sec-body{display:none;}
  .sec-body p{margin:0 0 15px;}
  .sec-body ul{margin:0 0 6px;padding-left:0;list-style:none;}
  .sec-body li{margin-bottom:16px;padding-left:20px;position:relative;}
  .sec-body li::before{content:"—";position:absolute;left:0;color:var(--ink-dimmer);}
  .sec-body strong{color:var(--ink);font-weight:700;}
  .sec-body blockquote{
    font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--bg-1);
    border-left:2px solid var(--line);padding:10px 14px;margin:9px 0 0;border-radius:0 4px 4px 0;
    white-space:pre-wrap;
  }

  .nav-buttons{display:flex;justify-content:space-between;gap:14px;margin-top:56px;}
  .nav-btn{
    flex:1;font-family:var(--body);font-weight:600;font-size:13.5px;
    padding:16px 20px;border-radius:10px;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);color:var(--ink);
    transition:border-color .15s, background .15s;
    text-align:left;
  }
  .nav-btn:hover{border-color:var(--ink-dim);background:var(--bg-1);}
  .nav-btn.next{text-align:right;background:var(--white);color:#000;border-color:var(--white);}
  .nav-btn.next:hover{opacity:.9;}
  .nav-btn small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin-bottom:4px;}
  .nav-btn:disabled{opacity:.3;cursor:default;}
  .nav-btn:disabled:hover{border-color:var(--line);background:var(--panel);}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  /* ---- glossary ---- */
  .filter-input{
    width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);
    font-family:var(--body);font-size:14px;padding:13px 18px;border-radius:100px;outline:none;
    margin-bottom:30px;
  }
  .filter-input:focus{border-color:var(--ink-dim);}
  .glossary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .gloss-card{background:var(--panel);border:1px solid var(--line-soft);border-radius:8px;padding:16px 18px;}
  .gloss-term{font-family:var(--disp);font-weight:600;font-size:13px;color:var(--white);text-transform:uppercase;margin-bottom:8px;line-height:1.3;}
  .gloss-def{font-size:12.5px;color:var(--ink-dim);margin-bottom:10px;line-height:1.55;}
  .gloss-quote{font-family:var(--mono);font-size:11px;color:var(--ink);background:var(--bg-1);border-left:2px solid var(--line);padding:7px 10px;border-radius:0 4px 4px 0;margin-bottom:10px;white-space:pre-wrap;}
  .gloss-tag{font-family:var(--mono);font-size:9px;color:var(--ink-dimmer);letter-spacing:.06em;text-transform:uppercase;}

  /* ---- final dossier / flip cards ---- */
  .lead-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:12px;}
  @media(max-width:520px){.lead-cards{grid-template-columns:1fr;}}
  .char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-top:18px;}
  .flip-card{perspective:1200px;height:210px;}
  .flip-card.lead{height:260px;}
  .flip-inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;cursor:pointer;}
  .flip-card:hover .flip-inner, .flip-inner.flipped{transform:rotateY(180deg);}
  .flip-front,.flip-back{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;border:1px solid var(--line-soft);padding:20px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;}
  .flip-front{background:var(--panel);align-items:center;text-align:center;}
  .flip-back{background:var(--bg-2);transform:rotateY(180deg);font-size:12.5px;line-height:1.55;color:var(--ink-dim);justify-content:flex-start;}
  .flip-back .fb-scroll{
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:8;overflow:hidden;
  }
  .flip-card.lead .flip-back .fb-scroll{-webkit-line-clamp:9;}
  .flip-name{font-family:var(--disp);font-weight:600;font-size:16px;color:var(--white);text-transform:uppercase;margin-bottom:6px;}
  .flip-card.lead .flip-name{font-size:23px;}
  .flip-role{font-family:var(--mono);font-size:9.5px;color:var(--ink-dimmer);letter-spacing:.05em;text-transform:uppercase;}
</style>
</head>
<body>

<!-- ================= COVER ================= -->
<div id="cover">
  <svg class="bg-svg" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
    <circle cx="500" cy="300" r="60" fill="none" stroke="#ffffff" stroke-width="1"/>
    <circle cx="500" cy="300" r="140" fill="none" stroke="#ffffff" stroke-width="1"/>
    <circle cx="500" cy="300" r="220" fill="none" stroke="#ffffff" stroke-width="1"/>
    <circle cx="500" cy="300" r="300" fill="none" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="300" x2="1000" y2="300" stroke="#ffffff" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="600" stroke="#ffffff" stroke-width="1"/>
  </svg>
  <div class="bg-glow"></div>
  <div class="cover-inner">
    <div class="cover-eyebrow">Личный архив · <span>доступ для двоих</span></div>
    <h1 class="cover-title">Архив великой<br><em>переписки</em></h1>
    <p class="cover-sub" id="coverSub">Одиннадцать лет одного чата. Сленг, войны за последнюю котлету, ночные катки и взросление — том за томом, глава за главой.</p>
    <div class="cover-stats" id="coverStats"></div>
    <div class="cover-cta">
      <button class="btn-cover" id="openArchiveBtn">Открыть архив →</button>
    </div>
    <div class="cover-foot" id="coverFoot"></div>
  </div>
</div>

<div id="curtain">
  <div class="curtain-line"></div>
  <div class="curtain-text" id="curtainText">Расшифровка архива</div>
  <div class="curtain-line"></div>
</div>

<!-- ================= APP ================= -->
<button id="sb-toggle" aria-label="Открыть оглавление">☰</button>
<div id="sb-backdrop"></div>
<div id="app">
  <aside id="sidebar">
    <div class="sb-head">
      <div class="sb-brand"><span class="mark">АМ</span>Архив</div>
      <div class="sb-progress-bar"><div class="sb-progress-fill" id="progressFill"></div></div>
      <div class="sb-progress-label" id="progressLabel">0 из 20 прочитано</div>
    </div>
    <div class="sb-search">
      <input type="text" id="searchInput" placeholder="Искать по переписке…" autocomplete="off">
      <div class="sb-search-results" id="searchResults"></div>
    </div>
    <div class="sb-pin">
      <div class="sb-pin-btn" id="navGlossary"><span class="pin-icon">▤</span>Глоссарий</div>
      <div class="sb-pin-btn locked" id="navFinal"><span class="pin-icon">🔒</span>Итоговое досье</div>
    </div>
    <div class="sb-list" id="sbList"></div>
  </aside>

  <main id="main">
    <div class="main-inner" id="mainInner"></div>
  </main>
</div>

<script id="volume-data" type="application/json">{"intro": "Отличная стратегия. Сохранение данных в отдельные хронологические «Тома»\n--- идеальный подход для обхода лимитов памяти нейросетей при работе с\nмасштабными архивами. Когда мы дойдем до сборки итогового сайта, ты\nсможешь просто скармливать мне эти готовые файлы, и я буду сводить их в\nединый таймлайн.\n\nЯ подготовил для тебя файл с **Архивным заголовком, Мета-данными эпохи\nи Оглавлением**, чтобы структура была идеальной для будущей базы\nданных.\n\nКопируй всё, начиная с черты ниже, в отдельный документ (например,\n`ЛОР_ТОМ_1_2015_2016.md`). Жду следующие фрагменты, будем работать на\nпределе аналитики!\n\n***", "volumes": [{"roman": "I", "subtitle": "ЗАРОЖДЕНИЕ ВАЙБА", "period": "Май 2015 --- Август 2016", "ages": "Андрей (17--18 лет), Михаил (14--15 лет)", "codename": "Сага о Палёном Шмоте: Эра Клауд-Рэпа, Двача и Скрытых Смокоутов", "sections": [{"num": 1, "title": "ЭПОХА И ВАЙБ (СЕЗОН)", "content": "* **Временной период:** Май 2015 --- Август 2016 года.\n* **Название сезона:** «Старшие классы: Эра Клауд-Рэпа, Скёр-Скёр и\nПалёного Шмота» *(Альтернативное название: «Культ Двача и Скрытых\nСмокоутов»)*.\n* **Главный лейтмотив:** Тотальный цифровой эскапизм и погоня за\nсубкультурным хайпом. Братья отчаянно пытаются выжить в суровой школьной\nреальности (алгебра, МХК, физра, отсутствие карманных денег), прячутся\nот родителей, чтобы поиграть в комп или «попарить жижу», и агрессивно\nпоглощают интернет-контент. Главная цель Михаила (14 лет) --- казаться\nстарше, моднее и «в тренде», главная цель Андрея (17 лет) --- троллить\nмладшего брата и снабжать его WebM-роликами с имиджборд."}, {"num": 2, "title": "ГЛОБАЛЬНЫЙ ФОН И МИРОВЫЕ СОБЫТИЯ", "content": "Внешний мир 2015-2016 годов вторгается в диалоги братьев через призму\nмолодежных трендов:\n* **Революция в русском хип-хопе (2015):** Взлет Pharaoh (с\nлегендарным треком Black Siemens) и объединений Dead Dynasty, Dopeclvb.\nБратья переживают это как главное культурное событие десятилетия, споря,\nкто начал слушать их раньше, и ненавидя «ньюфагов».\n* **Бум Pokemon GO (лето 2016):** Глобальная истерия заставляет их\nна время выйти из дома.\n> *Вы: скачай покемонов поймайа там кого нибудь / Сука покемон не\nловится*\n* **Вейп-нация:** Пик популярности электронных сигарет. «Парить»\nстановится моднее, чем курить. Это порождает кучу локальных мемов.\n* **Эпоха Versus Battle:** Расцвет батл-рэпа в России. Упоминаются\nбатлы Rickey F, Oxxxymiron, Galat.\n> *Вы: VERSUS: FRESH BLOOD 2 (Rickey F VS Sin) Round 1 смотрел?*"}, {"num": 3, "title": "СЛОВАРЬ И ЛОКАЛЬНЫЕ МЕМЫ", "content": "* **ФЫАХАФЫХ / Клавиатурный слэминг** --- высшая форма проявления\nэмоций (особенно у Михаила). Заменяет смех, шок, истерику и страх.\nОзначает, что автор буквально бьется лицом о клавиатуру от переизбытка\nчувств.\n> *Вы: ФЫАААААААААААААААААААААХФХЫААФЫХАФЫХФАЫХЫФХФЫАХЫФАФХЫАФЫАХ*\n* **Да да я / Да я** --- универсальное подтверждение своего\nстатуса, крутости или авторства абсурдной ситуации (мем из геймерской\nсреды).\n> *Вы: да я да да да да да я*\n* **В салянава / В соляного** --- сделать что-либо в одиночку,\nзатащить катку без помощи. Культовая фраза стримера Папича (Arthas).\n> *Михаил: Я с отвертки ем в салянаваааа*\n* **Хухрик / Пухрик** --- абстрактное обзывательство-прозвище для\nдруга.\n> *Михаил: ХуХрИк / Вы: соси хухрик*\n* **Саша / Саня** --- имя нарицательное. Означает любого\nабстрактного человека (или их самих), который тупит, творит дичь,\nумирает в игре или смешно падает.\n> *Михаил: САНЯ САНЯ ОН ЖИВОТОМ САНЯ КРАСНЫЙ ЖИВОТ У НЕГО БОЛИТ\nПУЗИКО*\n* **Кек / Кекич / Рофл** --- база интернета 2015 года, обозначающая\nсмешок или иронию."}, {"num": 4, "title": "БЕСТИАРИЙ И NPC", "content": "* **Батя / Мамка** --- верховные боссы и главная угроза свободе.\nМама заставляет ехать в деревню или угрожает отключить интернет. Батя\nзанимает компьютер, чтобы играть в игры, доводя ПК до перегрева и синего\nэкрана.\n> *Вы: Батя играл в тутлс комп перегрелся и теперь не включается*\n* **Матос** --- легендарный одноклассник и генератор хаоса. По\nлору: отравился вместе с Михаилом, постоянно орет возле школы, потерял\nмамину куртку на физкультуре.\n* **Костя Муринчик (Кабантин / Кабан)** --- друг братьев.\nПостоянная жертва подколов, обладает титулом «Константин Россиянинчик».\nПо лору чата его съел Саня Циркач.\n* **Жук (Жуксик)** --- еще один друг. Упоминается в контексте\nглупостей и игровых фейлов. Легенда гласит, что он купил дорогой\nаккаунт, а у него «нож забрали нахуй лоло».\n* **Тиня** --- кот Михаила. Воплощение хаоса. Постоянно орет по\nутрам, кусается и получает угрозы стать шаурмой.\n* **Учителя (МХК, Математичка)** --- враждебные NPC. Математичка\nвызывает особую ярость Михаила (14 лет) за то, что игнорирует его знания\nи спрашивает «двоечниц с задних парт».\n* **Ванька Ерохин** --- мемный образ идеального парня-соперника с\nДвача.\n> *Михаил: ВОТ ВАНЬКА ЕРОХИН УЖЕ В СБОРНУЮ ИДЕТ А ТЫ ОБАЛДУЙ ВСЁ ЗА\nКОМПАРОБАСТЕРОМ СИДИШЬ*"}, {"num": 5, "title": "⚔️ КВЕСТЫ, СПОРЫ И КЛАДБИЩЕ ИДЕЙ", "content": "* **Квест «Скрытый Смокоут»:** Великая деревенская вылазка\n14-летнего Михаила. Он соврал маме, что пошел в туалет, а сам с двумя\nфонарями ушел за баню курить (или парить). Всю ночь боялся звуков\nпадающих яблок, думая, что это шаги, а потом объелся сушеных яблок,\nчтобы перебить запах изо рта.\n* **Квест «Паленый шмот»:** Эпичная сага о попытках одеться модно\nбез денег. Жаркие споры, зашквар ли носить кроссовки Roshe Run в\nкамуфляже, и где купить дешевый Thrasher или Sputnik 1985 (на AliExpress\nили в бордшопе).\n* **Спор об «Истинном фанате»:** Бесконечная битва за то, кто\nраньше начал слушать Клауд-рэп. Братья ненавидят «позеров».\n> *Вы: АХАХАХАХАХАХАХАХАХА НАШИ КУМИРЫ БЛЯТЬ КАК ЖЕ МЫ В ТЕМЕ... ТЫ\nТОЛЬКО НАЧАЛ ХАЙПИТЬ ТИПО ЧИФ КИФ И ТУТ ОП ОП ОП ТРЕКИЧИ ПОДЪЕХАЛИ*\n* **Золотой фонд цитат:**\n> *Вы: Я когда родился, не рыдал как сучка, я сразу сел Врач потянулся\nшлёпнуть, я ему - съебался пока цел*\n\n> *Михаил: ПХААХААХАХАХВХЫХААХАХЫХВХАХВХВАХАХАХАХАХ ТЫ ПРИКИНЬ ТАКОЙ\nВЫБИРАЕШЬ СЕБЕ КРОСЫ С БАТЕЙ А ОН ТЕБЕ МАЛЕНЬКИЙ ЧЕ ОПЯТЬ НОВЫЕ\nКРОССФАЕРЫ ВЫБИРАЕШЬ ВОН Я ТЕБЕ КУПИЛ АДАДИС ГАЗЕЛЬ ЗА 3 ТУГРИКА НОСИ\nИХ*"}, {"num": 6, "title": "ГЕОГРАФИЯ И ЛОКАЦИИ", "content": "* **Деревня (дача):** Зона вечной ссылки для младшего брата. Символ\nскуки, грядок, бабок с дедами и отвратительного EDGE-интернета, где\nкартинки грузятся по три минуты.\n* **ТЦ «Мега» / «Фантастика» (Нижний Новгород):** Святые места\nпаломничества. Локации для закупки шмоток и открытия официального\nмагазина Vans.\n* **Дзержинец / ДКХ / Спортмастер:** Локации обитания, прогулок и\nнаблюдения за «быдлом в паленых форсах».\n* **Школа (Столовка):** Убежище, где пьют кисель и спасаются от\nуроков.\n* **Los Santos (GTA Online):** Главная виртуальная база для встреч\nпосле школы."}, {"num": 7, "title": "ЭКОНОМИКА И АРСЕНАЛ", "content": "* **Финансы:** Очень скромные. Огромной радостью является продажа\nдропа в CS:GO за 148 рублей. Михаил рассуждает, что 65 баксов за шмотку\n--- это 5600 рублей (безумные деньги для 14-летнего).\n* **Арсенал Хайпбиста (Вишлист):** Одержимость брендами. Гоша\nРубчинский, Palace, Vans Old Skool, Thrasher, Sputnik 1985, Stone Island\n(«остров камней»), Tommy Hilfiger. Жесткое осуждение «паленки» с\nAliExpress.\n> *Вы: щас бы не на рынке или алике найки покупать*\n* **Девайсы:** Мучительный выбор геймерской периферии. Мечтают о\nклавиатуре Tesoro Lobera (12 990 руб) и мышке Marvo (за 16400 DPI).\nПокупка электронной сигареты («жижи» за 100 рублей и самого девайса с\nрук за 200)."}, {"num": 8, "title": "КУЛЬТУРНЫЙ КОД И МЕДИА (КИНО И МУЗЫКА)", "content": "* **Музыка (Абсолютный культ):** Русскоязычный клауд-рэп и\nандерграунд. Dead Dynasty (Pharaoh, Jeembo, Tveth), Dopeclvb (Boulevard\nDepo, i61), Kizaru (Томас Кекс), Yung Lean, \\$uicideboy\\$. Музыка не\nпросто слушается, она определяет стиль одежды, разговора и статус.\n* **Двач (2ch.hk):** Андрей (17 лет) активно использует борду как\nисточник WebM-роликов с шок-контентом, всратыми танцами и мемами, чтобы\nпугать и смешить брата.\n* **Стримеры и YouTube:** Папич (Arthas) --- бог их сленга.\nХованский, Ларин («ко-ко-ко»), Мэддисон, Глад Валакас (Жмышенко).\n* **Кинематограф:** «Бойцовский клуб» (Тайлер Дерден), «Остров\nпроклятых», «Бёрдмэн», сериал «Мистер Робот» и «Сорвиголова»."}, {"num": 9, "title": "ИГРОВОЙ АРСЕНАЛ И СТРИМЫ (ОТДЕЛЬНЫЙ ПУНКТ)", "content": "* **Во что играли:** GTA V Online (главная мультиплеерная база для\nфарма и ограблений), CS:GO (поднятие ранга), Hearthstone, Fallout 4, The\nWitcher 3, Dead by Daylight, Hotline Miami (эстетический идеал).\n* **Боль геймера 2015-го:** Выживание на слабом ПК. Попытки\nзапустить новые игры на «вёдрах». Сгоревшая пластмасса, вонь на всю\nквартиру, 40 FPS и вылеты.\n> *Вы: Короче сижу такой,думаю чё воняет чем то... приходит батя\nговорит чё за хуйня РЕЗИНОЙ(блоком моим из плассмасы)пахнет.*\n> *Михаил: ПОТОМУ ЧТО ОНА ПО ВИДЮХЕ ОПРЕДЕЛЯЕТ ЕБЛАН... ЭТО НЕ ТВОЙ\nБИЧАНСКИЙ ПК СГОРЕВШИЙ*\n* **Тильт в Hearthstone:**\n> *Михаил: РЕНО ДЖЕКСОН ЧМО ДЛЯ ДАУНОВ С МЁРТВОЙ МАТЕРЬЮ... 1 СУКА\nВЫЙГРЫШ ДО 21 РАНКА... ЩАС БЫ НАХУЙ ОТХИЛИТСЯ С 4 ХП*"}, {"num": 10, "title": "БРАТСКИЕ БАТЛЫ И ТОКСИЧНОСТЬ", "content": "* **Уровень токсичности:** Максимальный, но исключительно в рамках\nбратской иерархии. Слова «пидорас», «уёбище», «мразь» и «даун»\nиспользуются как запятые. Андрей (старший) чаще выступает инициатором\nтроллинга, Михаил (младший) --- ведется, сгорает и выдает тонны капса.\n* **Главные поводы для срача:**\n1. *Гейткипинг:* «Я слушал эту группу в 2014 году, а ты позер».\n2. *Предательство Скайпа:* Если один пошел гулять или играть без\nмикрофона --- это повод для часовой агрессии.\n* **Изощренные панчлайны:**\n> *Вы: если ты не зарофлишь не с чего то ты умер как человек*\n\n> *Михаил: блять я бы щас пришел к нему домой и просто нахуй ебальник\nбы ему разбил сука растоптал отрезал ему голову обоссал бы его мать\nпотом закопал бы их и поджег сука как такие люди нахуй живут (реакция на\nпротивника в HS).*"}, {"num": 11, "title": "ГАСТРОНОМИЯ И РАЦИОН", "content": "* **Школьный рацион:** «Мивина» (лапша быстрого приготовления),\nшкольные пирожки. Сушеные яблоки на даче.\n* **Фастфуд:** Шаурма («Шаверма в стиле VERSUS»), «Комби обеды» в\nMcDonald's (Михаил оплачивает картошку), KFC.\n* **Вейп-меню (Жижа):** Электронная еда. Вкусы: «Лесная ягода»,\n«Фруктовый микс», «Черная смородина»."}, {"num": 12, "title": "АЛКОГОЛЬНЫЙ СЧЕТЧИК И ПИВНАЯ СТАТИСТИКА", "content": "В силу возраста (14 и 17 лет) реального алкоголизма здесь нет. Алкоголь\nфигурирует в виде мемов, рэп-отсылок или рассказов о чужих фейлах.\n* **Частота:** ИРЛ-употребление упоминается крайне редко.\n* **Инициаторы и похмелье:** Упоминаются друзья, которые не умеют\nпить (Саня).\n> *Михаил: Саня он Балтики выпил и в ГАВНО*\n> *Михаил: САНЯ НАХУЙ ТЫ ВОДЯРУ СМЕШАЛ ВЕЗИТЕ У НЕГО ВЕРТОЛЁТЫ*\n* **Напитки эпохи:**\n* **Блейзер (Вишня):** Культовый напиток школьников тех лет.\nУпоминается иронично.\n> *Вы: ОНА ВИДИТ НА ПРИЛАВКЕ СВОЙ ЛЮБИМЫЙ БЛЕЙЗЕР-ВИШНЯ ПОДНИМАЕТ РУКИ\nК ВЕРХУ МОЛВИТ СПАСИБО ВСЕВЫШНИЙ*\n* **Спрайт:** Постоянные шутки про смешивание Спрайта с сиропом от\nкашля (копирование стиля западных клауд-рэперов)."}, {"num": 13, "title": "ХРОНИКИ ПРОКРАСТИНАЦИИ И УСПЕХОВ", "content": "* **Вместо дела:** Тотальная прокрастинация. Андрей (17 лет) вместо\nподготовки к выпускным сидит на Дваче и в CS:GO. Михаил (14 лет)\nзабивает на геометрию и домашку ради GTA V и обсуждения шмоток.\n> *Вы: Щас бы спать когда время блять бесценно*\n> *Вы: я ещё ток сочинение на компе написал+переписать надо+ещё\nалгебру списать+ ещё нахуй тебя послать*\n* **Доска почета:** Реальные победы измеряются играми. Апнули\nзвание в CS:GO («почти глобал», «апнулся»), прошли сложного босса в\nBloodborne/Dark Souls, выбили легендарную карту в Hearthstone, заказали\nшмотку от Sputnik 1985."}, {"num": 14, "title": "РЕЖИМ «ДУШНИЛЫ» И ИНТЕЛЛЕКТУАЛЬНЫЙ СНОБИЗМ", "content": "* **Душные споры:** Касаются лора хип-хопа, разбора клипов и\nтехнических нюансов. Андрей (17 лет) любит включать эксперта по мемам с\nДвача. Михаил (14 лет) душнит по поводу лора игр Bethesda и деталей\nодежды.\n> *Михаил: И делают трешку Бетесды на движке прошлой тес... Потом\nразрабы фолаута обанкротились и дали права на фол*\n* **Реакция:** Токсичная. Монолог прерывается капсом, игнором или\nпосылом «нахуй»."}, {"num": 15, "title": "ВНУТРЕННИЙ КИНЕМАТОГРАФ И ТЕАТР ОДНОГО АКТЕРА", "content": "* **Текстовые ролевые игры (Greentext):** Братья постоянно общаются\nформатом паст с Двача (через собачку @).\n> *Михаил: ПРОЕБАЛ ФИЗРУ @ ЗВОНИТ МАМКА @ ПОЯСНЯЕШЬ ЕЙ ЗА ФИЗРУ @ -И\nЧТО??? ОТ ФИЗРЫ ТЕБЯ НИКТО НЕ ОСВОБОЖДАЛ*\n* **Сценки «Про Саню»:** Братья разыгрывают абсурдные ситуации в\nстиле ситкома.\n> *Вы: Саня а за пятиху в рот лампочку возьмёшь?? БЛЯ ПАЦАНЫ ОНА\nЛОПНУЛА У НЕГО ВО РТУ НЕСИ БИНТЫ...*\n* **Эпичные пересказы:** Пересказ сна Михаила на 200 слов с капсом\nпро 37-этажный ТЦ, падающий лифт, стрельбу из УЗИ, маньяка и побег от\nполиции."}, {"num": 16, "title": "МЕДИЦИНСКАЯ КАРТА И ХРУСТ КОСТЕЙ", "content": "Болячки в этом возрасте --- это либо смешные травмы, либо последствия\nфастфуда.\n* **Травмы:**\n> *Михаил: ОБ ВИДЕОКАРТУ РУКУ ЕБАНУЛ*\n> *Михаил: Я сегодня на скейте прыгал и упал и такой на споте мало\nсил*\n* **Стоматология:** Эпичный поход к зубному, где 14-летнему Михаилу\n«удаляли нерв иголкой» и «прижигали горячей иглой пломбу», из-за чего он\nныл полдня.\n* **ЖКТ:** Последствия школьного питания и энергосов.\n> *Михаил: Я 3 слабительных выпил и обосрался*"}, {"num": 17, "title": "ПСИХОЛОГИЧЕСКИЙ ПОРТРЕТ И КРИЗИСЫ СЕЗОНА (ФИНАЛЬНЫЙ ИТОГ)", "content": "**Андрей (17-18 лет): Циник, Архивариус мемов и «Двачер»**\nАндрей находится на пороге окончания школы и начала взрослой жизни. У\nнего ярко выражен синдром старшего брата и интеллектуальный снобизм,\nподпитанный сидением на анонимных имиджбордах (2ch.hk). Он использует\nпостиронию и шок-контент как щит от надвигающейся ответственности\n(экзамены, поступление). Его главная роль в диалоге --- приносить\n«запрещенку», тестировать новые мемы на брате и обесценивать его детские\nвосторги. Он боится показаться «нормисом», поэтому отрицает все\nмейнстримное, пока это не станет локальным приколом.\n\n**Михаил (14-15 лет): Максималист, Хайпбист и Комок Оголенных\nНервов**\nМихаил переживает самый острый и болезненный период пубертата. Его\nментальное состояние --- это качели от истерического смеха до\nабсолютной, капслоковой ярости. У него колоссальный уровень FOMO (страх\nупустить тренд): ему жизненно важно носить Thrasher, парить вейп, знать\nнаизусть треки Pharaoh и казаться старше. Он отчаянно ищет идентичность\nчерез агрессивное потребление субкультур. Школа для него --- тюрьма,\nродители --- надзиратели, мешающие играть в комп.\n\n**Общая динамика мировоззрения:**\nЭто период жесточайшего цифрового эскапизма. Реальный мир (Дзержинск,\nдеревня, уроки) кажется им невыносимо серым и скучным. Их настоящая\nжизнь, эмоции, победы и поражения происходят в Скайпе, ВКонтакте, в Los\nSantos и на серверах CS:GO. Отношение друг к другу строится на взаимных,\nкрайне токсичных подколах, за которыми скрывается глубокая эмоциональная\nзависимость: в этот странный период взросления они --- единственные люди\nв мире, которые на 100% понимают локальные мемы, сленг и страхи друг\nдруга."}], "id": 0, "seq": 1}, {"roman": "II", "subtitle": "ЭПОХА ПОСТИРОНИИ И ХАЙПБИСТОВ", "period": "Сентябрь 2016 --- Январь 2017", "ages": "Андрей (18 лет), Михаил (15 лет)", "codename": "Осень 16-го: Мёртвые Найки, Овервотч и Зарождение Фейса", "sections": [{"num": 1, "title": "ЭПОХА И ВАЙБ (СЕЗОН)", "content": "* **Временной период:** Сентябрь 2016 --- Январь 2017 года.\n* **Название сезона:** «Саня Кабан, Мёртвые Найки и Эра Папича».\n* **Главный лейтмотив:** Тотальное погружение в\nинтернет-субкультуры на фоне ненависти к реальному миру. Брат-студент\n(Андрей) и брат-школьник (Михаил) общаются исключительно языком мемов,\nцитатами стримеров и строчками из клауд-рэпа. Главная цель эпохи ---\nдоказать друг другу, кто больше «шарит» за андеграунд, кто раньше начал\nслушать Фейса и Фараона, и кто более модно одевается (не имея при этом\nденег)."}, {"num": 2, "title": "ГЛОБАЛЬНЫЙ ФОН И МИРОВЫЕ СОБЫТИЯ", "content": "Внешний мир обсуждается исключительно через призму молодежных трендов:\n* **Бум русского рэпа и Versus Battle:** Обсуждение 140 BPM Battle,\nбатлов Гнойного, Booker D. Fred, Rickey F и Oxxxymiron'а.\n* **Зарождение новой волны хип-хопа:** Первые упоминания FACE,\nKizaru, Lizer, Boulevard Depo и западных фрешменов (XXXTentacion, Lil\nPeep, Bones). Братья гордятся тем, что слушают их до того, как они стали\nмейнстримом.\n* **Выход Overwatch и Legion (WoW):** Главные игровые релизы конца\n2016 года, поглощающие все их свободное время.\n* **Культ Двача (2ch.hk):** Золотая эра WEBM-тредов. Андрей\nпостоянно кидает Михаилу видео с имиджборды, чтобы напугать или\nрассмешить его."}, {"num": 3, "title": "СЛОВАРЬ И ЛОКАЛЬНЫЕ МЕМЫ", "content": "* **ФЫАХАФЫХ / Клавиатурный слэминг** --- основа общения. Чем\nбольше букв, тем сильнее эмоция (истерика, ор, шок).\n> *Вы: ФЫАААААААААААААААААААААХФХЫААФЫХАФЫХФАЫХЫФХФЫАХЫФАФХЫАФЫАХ*\n* **Саня [Вставить любое слово]** --- универсальная конструкция\nдля описания любого состояния, альтер-эго или человека. Абсолютный хит\nсезона.\n> *Примеры из текста:* «Саня квест», «Саня терминатор», «Саня\nдиджитал», «Саня восточный мордор», «Саня мышьяк», «Саня спортивный\nинвентарь».\n* **haHAA / I'm 12 btw / EleGiggle** --- текстовое использование\nсмайликов с Twitch (BTTV) для выражения кринжа или троллинга.\n* **Далбич / Дэлбич** --- искаженное «долбоёб» (пришло от стримера\nПапича).\n* **Мига / Мигуна** --- локальное прозвище Михаила.\n* **В салянава / В соляного** --- сделать что-либо в одиночку без\nпомощи команды (снова Папич).\n* **Заменамена** --- абстрактная ритмичная дразнилка."}, {"num": 4, "title": "БЕСТИАРИЙ И NPC", "content": "* **Артём Седов (Седог / Морской Пёс)** --- друг братьев и главная\nжертва их рофлов. Ему придумывают смешные клички («Артём железногор»,\n«Седожняг») и постоянно подкалывают.\n* **Костя Муринчик (Кабан / Кабантин)** --- друг, который «зажал\nаккаунт Overwatch» и за это подвергся жесточайшей травле в чате.\n*«ТУПОЙ КОНСТАНТИН МУРИНЧИК ПРОСТО ЗАЖАЛ АККАУНТ СУКА»*.\n* **Матос** --- легендарный одноклассник. Фигурирует в истории про\nтусовку, где он пошел в туалет и от запаха блеванул прямо в ванную.\n* **Завуч Ольга Станиславовна** --- финальный босс 15-летнего\nМихаила. Писала его родителям: *«Когда Вы сможете прийти в школу и\nвстретиться с кл.рук. и завучем?»*, что вызвало у Миши панику.\n* **Тиня** --- кот Михаила. Животное-мем. Либо орет по ночам, либо\nбьется в ногу, либо ест крошки. *«ТУПА ТИНЯ ЗЛОЙ И ЖИРНЫЙ»*."}, {"num": 5, "title": "⚔️ КВЕСТЫ, СПОРЫ И КЛАДБИЩЕ ИДЕЙ", "content": "* **Квест «Защита Хайпа» (Гейткипинг):** Жесточайшие споры о том,\nкто первый начал слушать модную музыку.\n> *Михаил: АХАХАХАХАХАХАХАХАХА НАШИ КУМИРЫ БЛЯТЬ КАК ЖЕ МЫ В ТЕМЕ\nПРОСТО ПИЗДЕЦ... ТЫ ТОЛЬКО НАЧАЛ ХАЙПИТЬ ТИПО ЧИФ КИФ И ТУТ ОП ОП ОП\nТРЕКИЧИ ПОДЪЕХАЛИ*\n* **Квест «Выжить на хате»:** Эпичная история (в пересказе) о том,\nкак друзья пили на квартире. Один выпил водки с соком, второй (Темик)\n«обблевал весь толчок», а третий (Матос) блеванул в ванную от запаха.\n* **Спор «Палёный шмот»:** Дискуссии о том, зашквар ли носить\nподделки с AliExpress.\n> *Михаил: В школе дебил в паласе ходит с алика... Он палас на рынке\nкупил думал алик*\n* **Золотой фонд цитат:**\n> *Вы: Я когда родился, не рыдал как сучка, я сразу сел Врач потянулся\nшлёпнуть, я ему - съебался пока цел*\n\n> *Вы: я дико извиняюсь но у кого каникулы тот п*дорас полный\n(извините за матюки)!*"}, {"num": 6, "title": "ГЕОГРАФИЯ И ЛОКАЦИИ", "content": "* **MILO Concert Hall (Нижний Новгород):** Главная концертная\nМекка. Братья постоянно обсуждают покупку билетов туда (на YungRussia,\nPharaoh).\n* **Школа vs Шарага/Универ:** Две тюрьмы для братьев. Андрей сидит\nна «49-й паре», а Михаил пишет пробники по алгебре.\n* **Деревня (Дача):** Зона отчуждения с плохим интернетом, где\nМихаил прячется за баней.\n* **Виртуальные:** Los Santos (GTA V) и серверы Overwatch --- места\nих реального обитания по вечерам."}, {"num": 7, "title": "ЭКОНОМИКА И АРСЕНАЛ", "content": "* **Экономика школьника/студента:** Огромной радостью является\nпродажа дропа в CS:GO за 112 рублей. Михаил умоляет одолжить 200\nрублей.\n* **Арсенал Хайпбиста (Вишлист):** Тотальная одержимость брендами.\nGosha Rubchinskiy, Palace, Vans Old Skool, Thrasher, Sputnik 1985,\nSupreme.\n> *Михаил: Тишка СУПРИМ с 12 дропа DS не носилась ни разу 13к или b/o\nза бирками*\n* **Техника:** Обсуждение покупки механической клавиатуры и\nнаушников (споры про бренд MARVO, который они считают говном). Желание\nкупить Overwatch."}, {"num": 8, "title": "КУЛЬТУРНЫЙ КОД И МЕДИА (КИНО И МУЗЫКА)", "content": "* **Музыка (Абсолютный культ):** Ядро их личности в 2016 году. Они\nдышат клауд-рэпом. YungRussia, Pharaoh (Фараон), Boulevard Depo, Lizer,\nFace, Kizaru, Овсянкин, Слава КПСС, Oxxxymiron. Из западных:\nXXXTentacion, Lil Peep, Bones, Yung Lean.\n* **Батл-рэп:** 140 BPM, Versus. Они цитируют панчи наизусть.\n* **Стримеры и YouTube:** Папич (Arthas) --- бог их лексикона (в\nтексте миллион ссылок на `oddshot.tv/gladiatorpwnz`). Глад Валакас\n(Жмышенко В.А.), Озон, Мэддисон.\n* **Кино:** «Драйв» (Drive), «Неоновый демон», «Бойцовский клуб»,\nсериал «Мистер Робот» (Эллиот)."}, {"num": 9, "title": "ИГРОВОЙ АРСЕНАЛ И СТРИМЫ", "content": "* **Во что играли:** CS:GO (горение от слива звания с «Двух\nкалашей»), Overwatch (молитвы на выпадение Легендарок из лутбоксов, хейт\nМэй и Дзенъятты), GTA V Online, Hearthstone (тильт от карты Рено\nДжексон), World of Warcraft (Legion).\n* **Тильт и горение:**\n> *Михаил: МЫ БЛЯТЬ 4 ПОДРЯД [слили] НА ДВУХ КАЛАШАХ... ну и игра\nебаная*\n> *Михаил: РЕНО ДЖЕКСОН ЧМО ДЛЯ ДАУНОВ С МЁРТВОЙ МАТЕРЬЮ... ЩАС БЫ\nНАХУЙ ОТХИЛИТСЯ С 4 ХП*"}, {"num": 10, "title": "БРАТСКИЕ БАТЛЫ И ТОКСИЧНОСТЬ", "content": "* **Динамика общения:** Гипер-токсичная, но это их зона комфорта.\nСлова «пидорас», «уёбище», «мразь» и «даун» заменяют запятые. Андрей\n(18) троллит младшего брата, скидывая шок-контент или спойлеры. Михаил\n(15) моментально сгорает и отвечает капсом на 10 строк.\n* **Текстовые рэп-батлы:** Они буквально пишут друг другу диссы в\nрифму прямо в чате.\n> *Михаил: ты щас бля меня оскорбил но ты тупой дебил чёто ты щас\nспизданул я как матрас тебя надул... КАНАВИНСКИЙ ВОДОКАНАЛ СУКА\nРАУНД*\n> *Андрей: Я не одет я как джаба фет ворвался в твой дом съел твой\nобед твой флоу рогатка мой арбалет файт*"}, {"num": 11, "title": "ГАСТРОНОМИЯ И РАЦИОН", "content": "* **Школьно-студенческий фастфуд:** Ведра KFC (Андрей часто сидит в\nаудитории и ест курочку).\n* **Домашняя еда:** Андрей регулярно пишет: *«Проснулся. Ем сырный\nсуп»* (это стало локальным мемом).\n* **Вейп-меню (Жижа):** Покупка жижи со вкусами «лесная ягода» и\n«фруктовый микс»."}, {"num": 12, "title": "АЛКОГОЛЬНЫЙ СЧЕТЧИК И ПИВНАЯ СТАТИСТИКА", "content": "Учитывая возраст (15 и 18), алкоголь --- это способ казаться взрослее.\n* **Что пили:** Напиток «Гараж» (Garage) --- абсолютный хит их\nтусовок. Дешевая водка с соком, «паленый Хеннесси», пиво «Оболонь»,\nБлейзер (иронично).\n* **Последствия:** Постоянные рассказы о том, как кому-то стало\nплохо.\n> *Михаил: я пил коньяк норм и ваодку... пиздкец ну с него не так\nебашит как тогда*\n> *Михаил: ТЕМИК БЛЯТЬ ОББЛЕВАЛ ВЕСЬ ТОЛЧОК*"}, {"num": 13, "title": "ХРОНИКИ ПРОКРАСТИНАЦИИ И УСПЕХОВ", "content": "* **Вместо дела:** Тотальная прокрастинация. Андрей сидит на парах\nв университете, смотрит 2ch и ест KFC. Михаил не делает алгебру до 2\nчасов ночи, сочиняя рэп в ВК.\n> *Михаил: 31 номер из 46... я сон:0 1... я алгебра:1 0*\n> *Вы: ПОЧЕМУ Я ДОЛЖЕН ДЕЛАТЬ ЕБАНЫЙ ЧЕРТЁЖ ДО 2 НОЧИ*\n* **Доска почета:** Андрей сдал экзамен по математике («ИЗИ НАХУЙ\nСДАЛ МАТАН»). Михаил получил легендарку в Овервотче."}, {"num": 14, "title": "РЕЖИМ «ДУШНИЛЫ» И ИНТЕЛЛЕКТУАЛЬНЫЙ СНОБИЗМ", "content": "* **Музыкальный снобизм:** Бесконечные споры о том, что такое\nнастоящий Грайм (Grime), кто у кого украл бит (сэмпл) и почему новые\nфанаты Фейса --- «факбои и позеры».\n> *Вы: а вы тоже угараете с таких челов,которые из Bones слушали\nтолько Deadboy, но уже рассуждают о масс school шутинге?*\n* **Реакция:** Второй брат моментально пишет *«ЗАТКНИСЬ», «ИДИОТ»,\n«ДАЛБИЧ»* или спамит случайные буквы."}, {"num": 15, "title": "ВНУТРЕННИЙ КИНЕМАТОГРАФ И ТЕАТР ОДНОГО АКТЕРА", "content": "* **Текстовые ролевые игры (Greentext):** Общение в формате паст с\nимиджборд (через символ @).\n> *Михаил: ПРОЕБАЛ ФИЗРУ @ ЗВОНИТ МАМКА @ ПОЯСНЯЕШЬ ЕЙ ЗА ФИЗРУ @ -И\nЧТО??? ОТ ФИЗРЫ ТЕБЯ НИКТО НЕ ОСВОБОЖДАЛ*\n* **Эпичные пересказы снов:** Михаил регулярно рассказывает свои\nсюрреалистичные сны капсом. Например, сон про то, как они с мамой\nотдыхали на пляже, потом началось цунами, потом он провалился в глину в\nдеревне, дошел до магазина, а потом улетел на космическом корабле."}, {"num": 16, "title": "МЕДИЦИНСКАЯ КАРТА И ХРУСТ КОСТЕЙ", "content": "* Медицинская карта в 15-18 лет заполнена исключительно глупыми\nтравмами и жалобами на ЖКТ из-за энергетиков.\n> *Михаил: я обжегся об сигу чуть не пизданулся с лестницы в падике\nчуть не уебался в снег и темик вьебал в бровь*\n* **Стоматолог:** Эпичный поход Миши к зубному, которого он\nсмертельно боится."}, {"num": 17, "title": "ПСИХОЛОГИЧЕСКИЙ ПОРТРЕТ И КРИЗИСЫ СЕЗОНА", "content": "**Андрей (18 лет): Циничный Архивариус Мемов**\nАндрей сталкивается с первыми трудностями взрослой жизни ---\nуниверситетом, сессией, чертежами по ночам. Чтобы справиться со\nстрессом, он уходит в глухую постиронию. Он выступает в роли поставщика\nшок-контента с Двача (WEBM) и тролля, который обесценивает восторги\nмладшего брата. Ему важно сохранять статус «олда», который знал обо всех\nрэперах и мемах еще в 2014 году. За агрессивным капсом скрывается\nусталость от учебы и нежелание взрослеть.\n\n**Михаил (15 лет): Бунтующий Хайпбист**\nМихаил находится в эпицентре пубертатного взрыва. Его эмоции\nпереключаются от эйфории до абсолютной ярости за секунду (что выражается\nбесконечными ударами по клавиатуре). У него острый синдром FOMO: он до\nдрожи боится оказаться «немодным», поэтому фанатично скупает паленый\nшмот, парит вейп и учит наизусть тексты новой школы рэпа. Школа для него\n--- враждебная среда, завучи --- враги, а родители --- надзиратели. Он\nпытается казаться жестким рэпером/гангстером в сети, но в реальности\nпугается, когда завуч вызывает маму в школу.\n\n**Общая динамика:**\nБратья строят свои отношения на фундаменте агрессивного, но абсолютно\nбезопасного словесного насилия. Они --- лучшее зеркало интернета 2016\nгода. Их реальная жизнь (Дзержинск/Нижний Новгород, школа, универ,\nотсутствие денег) кажется им невыносимо серой, поэтому они конструируют\nсебе яркие виртуальные аватары (Скейтеры, Граймеры, Факбои, Стримеры).\nНесмотря на постоянные посылы «нахуй», они предельно близки: только они\nмогут за секунду понять многослойную шутку, в которой смешаны цитаты\nПапича, тексты Фараона и локальные приколы про одноклассников.\n\nПротоколы времени и контекста откалиброваны. Аномальные временные\nразломы\n(всплески из декабря 2025 и июня 2026 годов про Тарков, Штурмана, 37\nмиллионов в\nсхроне и VR-шлемы) полностью заблокированы и удалены из анализа."}], "id": 1, "seq": 2}, {"roman": "III", "subtitle": "РЕЙДЖ, ФЕЙС И ПРОБНИКИ", "period": "Конец Января 2017 --- Март 2017", "ages": "Андрей (18-19 лет), Михаил (15-16 лет)", "codename": "Весна 17-го: Свистина, Скамбэк и ОГЭ по Алгебре", "sections": [{"num": 1, "title": "ЭПОХА И ВАЙБ (СЕЗОН)", "content": "- Временной период: 26 Января 2017 --- 14 Марта 2017 года.\n- Название сезона: «Эра Свистины, Фейса и Пробников» (Альтернативное:\n«Тупой\nСтрим Резидент Ивила»).\n- Главный лейтмотив: Цифровой симбиоз. Андрей сидит на скучных парах в\nуниверситете, а Михаил пытается выжить в 9 классе (сдавая пробники по\nматематике). Чтобы не сойти с ума от рутины, они общаются непрерывным\nпотоком мемов, орут капсом над тупостью стримеров и спорят о\nрэп-фрешменах.\nГлавная боль сезона --- отсутствие денег на алкоголь («дрова») и\nхайповые\nшмотки."}, {"num": 2, "title": "ГЛОБАЛЬНЫЙ ФОН И МИРОВЫЕ СОБЫТИЯ", "content": "Внешний мир отражается в архиве через релизы и тренды весны 2017 года:\n\n- Релиз Resident Evil 7: Братья сутками смотрят, как стример Папич\n(Arthas)\nпроходит игру, и ловят истерику от его неспособности решить простейшие\nголоволомки.\n- Взрыв популярности FACE: Выход трека «Бургер» и альбомов Фейса.\nЖесткие\nспоры: скатился ли он, почему у него везде один и тот же бит, и почему\nвсе\nстали его слушать.\n- Релиз For Honor: Открытая бета и выход игры от Ubisoft.\n- Премьера «Т2 Трейнспоттинг» (На игле 2): Обсуждение похода в кино на\nсиквел\nкультового фильма 90-х."}, {"num": 3, "title": "СЛОВАРЬ И ЛОКАЛЬНЫЕ МЕМЫ", "content": "- ФЫАХАФЫХ / АЫФФФФФ --- базовый язык эмоций. В этом сезоне достигает\nтаких\nмасштабов, что занимает по 5 строк текста.\n- Саня [Любое слово] --- мета-мем продолжается. Саня-бизи,\nСаня-государство,\nСаня-ликероводочный, Саня-псих, Саня-Скамбэк.\n- Дрова (белые / черные) --- кодовое название алкоголя (скорее всего,\nпивной\nнапиток Garage).\nМихаил: Я забыл сказать что нужны белые дрова / Вы: это тебе не\nбелые... и с\nних смерть неминуема\n- Падажжи ёбана --- универсальная фраза-паразит для прерывания диалога\n(отсылка\nк мемам Двача/рэп-тусовки).\n- Свистина --- локальный мем, родившийся из того, что у Михаила начал\nсвистеть\nнос при дыхании.\nМихаил: ФЩЩЩЩЩЩЩЩЩЩЩЩЩЩЩЩЩЩЩЩЩЩЩЩ бля у МЕНЯ НОС СВИСТИТ ВЫ СЛЫШИТЕ\n- Привет я Дробаш че по матеше задали --- спам-фраза, родившаяся из\nлокального\nконтекста про какого-то школьника."}, {"num": 4, "title": "БЕСТИАРИЙ И NPC", "content": "- Костя (Уринчик / Муринчик) --- главный объект насмешек и «крупье». В\nэтом\nсезоне он «пошел с козырей», сфоткался с прической назад, а братья шутят\nпро\nто, что «если один скажет Константин, миллионы скажут чмо».\n- Тёмик / Ляпа / Жел --- собутыльники Михаила. Тёмик отличился тем, что\nспрятал\n«дрова» (бухло) под стол от родителей Михаила, а Ляпу в этом месяце\n«кинула\nдевушка, сдохла собака и пал дед».\n- Учителя (по математике и физике) --- финальные боссы Михаила. Доводят\nего до\nтого, что он прямо с пробника пишет Андрею с мольбой решить вариант.\n- Папич (Arthas) --- стример, который незримо присутствует в их комнате.\nЕго\nпрохождение RE7 генерирует 30% всего капса в диалоге."}, {"num": 5, "title": "⚔️ КВЕСТЫ, СПОРЫ И КЛАДБИЩЕ ИДЕЙ", "content": "- Квест «Списать Пробник»: Эпичная арка, где Михаил сидит на пробном ОГЭ\nпо\nматематике (вариант 90604) и в панике кидает фотки Андрею. Андрей в это\nвремя спит, потом просыпается и высокомерно решает задачи за 5 минут:\n«я\nтупа в рукопашную решил... c3= 4-1 = 3».\n\n- Бизнес-план «Русский Ритейл»: Андрей пытается продать Михаилу 2 пака\nстикеров ВКонтакте за 115 рублей, выторговывая себе выгоду в 6 рублей.\nМихаил отказывается из принципа, торгуясь за скидку в 1 рубль. В итоге\nАндрей пишет ему официальное деловое письмо от лица магазина.\n\n- Спор про FACE: Михаил доказывает, что Фейс скатился и продался,\nиспользуя\nчужие биты. Андрей защищает артиста.\n\n- Золотые цитаты:\n\nВы: Графиня увидела издалека англичанина: - Здравствуйте, сэр. - Пошла\nнахуй. Это был не англичанин.\n\nМихаил: ПРИШЁЛ Я С РЫБАЛКИ ПЬЯНЫЙ В ЕБЕНЯ И ТУТ ТЕБЕ СЮРПРИЗ ПОДХОДИТ\nЖЕНА И\nГОВОРИТ У ТЕБЯ СОВЕСТЬ ЕСТЬ А Я ЕЙ Я УХУ ЕЛ... (зал взрывается)\n\nВы: Вы назначены пидарасом этого чата."}, {"num": 6, "title": "ГЕОГРАФИЯ И ЛОКАЦИИ", "content": "- Школа / Универ (пара): Места физического пребывания, но ментального\nотсутствия.\nВы: Это была пара ради которой стоит жить / Я на энглише сижу отдыхаю\n- Квартира (Хата): Главный ресурс. Вопрос «а у вас есть хата?» звучит\nкаждый\nвыходной. Если хаты нет --- приходится пить на улице.\n- Дом Коколотушкина / Петровского Разумовского: Локальные рофл-адреса.\n- Виртуальные: Особняк Бейкеров (RE7), Туссент и Велен (Ведьмак 3)."}, {"num": 7, "title": "ЭКОНОМИКА И АРСЕНАЛ", "content": "- Бюджет: Катастрофический. Михаил просит занять 50 рублей на киви.\nСпорят\nиз-за 20 рублей за стикеры. Поход на фильм «Логан» срывается из-за того,\nчто\nбилет стоит 300 рублей, а это «слишком дохуя денег».\n- Hypebeast-рынок: Одержимость брендом Carhartt, Raf Simons, Gosha\nRubchinskiy, BAPE. Обсуждение заказа худи с Farfetch и бешеных цен за\nдоставку из Франции (1500 руб).\nМихаил: у тебя на кофте написано ЧАРААРТИ(CARHART)\n- Железо: Михаил покупает дешманскую клавиатуру Genius SlimStar 130 за\n890\nрублей, потому что залил свою механику чаем/квасом («потому что тут\nдырочек\nнету чтобы жидкость утекала»)."}, {"num": 8, "title": "КУЛЬТУРНЫЙ КОД И МЕДИА (КИНО И МУЗЫКА)", "content": "- Музыка: FACE (главный герой споров), Boulevard Depo, Mnogoznaal,\nPharaoh,\nKizaru (Томас Кекс), Lil Pump, XXXTentacion, Ski Mask, Yung Lean.\nОбсуждение\nбатла Rickey F, упоминания СД и Замая.\n- Кино: «На игле 2» (T2 Trainspotting), «Особо опасен 3» (рофл),\n«Марсианин».\n- Мемы Двача: WebM-треды, видосы с авариями, падениями и абсурдными\nситуациями. Мем \"Look at this dude\"."}, {"num": 9, "title": "ИГРОВОЙ АРСЕНАЛ И СТРИМЫ", "content": "- Во что играли братья:\n- The Witcher 3: Михаил проходит на максимальной сложности («Ведьмак на\nпоследней сложности изи»).\n- Dota 2: Играют на Сайленсере и Инвокере («у меня 70 проц винрейт на\nнем»).\n- For Honor: Постоянно зовут друг друга на дуэли 1х1.\n- Стримы Папича (Resident Evil 7): Это жемчужина архива. Братья смотрят\nтрансляцию синхронно и капсом комментируют каждый провал стримера.\n- Михаил: ААААААА ДАУН а чё он блядь сам в машину не сел\n- Вы: КАК ВООБЩЕ МОЖНО ОТКРЫТЬ КЛЕТКУ МОНЕТКОЙ?? ОН ТУПОЙ\n- Папич забывает микрофон, пугается бензопилы и умирает, вызывая у\nбратьев\n«клавиатурный слэминг»."}, {"num": 10, "title": "БРАТСКИЕ БАТЛЫ И ТОКСИЧНОСТЬ", "content": "- Динамика общения: Ультра-токсичная постирония. На любой аргумент\nследует\nпосыл на три буквы.\n\n- Подколы и триггеры:\n\n- Андрей троллит Михаила его возрастом («иди уроки учи», «15 лет @\nкрашу\nволосы»).\n- Михаил сгорает от того, что Андрей делает спойлеры к играм/фильмам\nили\nигнорит его призывы пойти играть.\n\n- Панчлайны:\n\nМихаил: Я СЕЛ НА ХУЙ А ТЫ СЕЛ НА СКАМЙЕКУ\n\nМихаил: ты,придурошный если ты в течении часа не удалишь свое говно жди\nв\nгости прокуратуру"}, {"num": 11, "title": "ГАСТРОНОМИЯ И РАЦИОН", "content": "- Балдёж с багетом: Андрей хвастается, что съел «целый багет в соло».\n- Сыр: Рофл над английской фразой «Tasty Cheese», которая вызывает у\nних\nистерику.\n- Гречка: Упоминается как классическая еда для выживания."}, {"num": 12, "title": "АЛКОГОЛЬНЫЙ СЧЕТЧИК И ПИВНАЯ СТАТИСТИКА", "content": "- Контекст: В 15-18 лет алкоголь пьют ради «балдёжа» и историй. Главная\nпроблема --- найти свободную хату.\n- Статистика и напитки:\n- Пьют «Дрова» (Гараж), водку с соком, дешевый виски.\n- Упоминают способ не опьянеть: есть много хлеба (мякиша), чтобы он\nвпитывал алкоголь.\n- Последствия: Эпичные пересказы того, как кто-то блевал.\nМихаил: 5 ступень балдежа это курение с водкой и хлебом Михаил: я думал\nблевать буду... это была 1 рюмка"}, {"num": 13, "title": "ХРОНИКИ ПРОКРАСТИНАЦИИ И УСПЕХОВ", "content": "- Вместо дела: Михаил пишет пасты про «бытие» и биты в FL Studio вместо\nтого,\nчтобы готовиться к ОГЭ. Андрей сидит на парах («Я на энглише сижу\nотдыхаю»),\nчитает Двач и кидает брату мемы.\n- Доска почета: Андрей успешно сдал какой-то зачет, а Михаил смог\nвосстановить\nстарый аккаунт в Инстаграме/Стиме, угадав пароль («я БЛЯТЬ ОТГОДАЛ...\ninfamous***»)."}, {"num": 14, "title": "РЕЖИМ «ДУШНИЛЫ» И ИНТЕЛЛЕКТУАЛЬНЫЙ СНОБИЗМ", "content": "- Битмейкер Михаил: Михаил включает эксперта и доказывает Андрею, как\nправильно писать рэп-биты: «Хай ХЕТЫ это тттт ТРРР те самые... А 808\nБАССЫ\nТТТТ ТРРРР ТТТТ тыщ». Андрей в ответ предлагает засемплить, как Михаил\nплачет.\n- Философия Двача: Рассуждения о солипсизме, «отрицании отрицания бытия»\nи\nСократе."}, {"num": 15, "title": "ВНУТРЕННИЙ КИНЕМАТОГРАФ И ТЕАТР ОДНОГО АКТЕРА", "content": "- Пересказ Снов: Михаил детально пересказывает свои бредовые сны\nкапсом.\nМихаил: МНЕ КОРОЧЕ ПРИСНИЛОСЬ ТО ЧТО Я ИЗ МУЗВКАЛКИ С БУТЫЛКЛЙ ДРОВ\nДОСОЙ\nЕДУ И ТАКОЙ ЭХ ХОРОШО ЧТО ЭТО НЕ СОН\n- Рэп-фристайлы в чате:\nМихаил: ЕДУ В АБАКАН МЕНЯ ЗОВУТ ДИМАН ПОШЁЛ ДОМОЙ НАПАЛ РОЙ...\nПОХЛЕБКУ\nХЛЕБАТЬ ИЛИ ИДТИ СПАТЬ НИЧЕГО НЕ ПОНИМАТЬ ПРО СНЫ ПИСАТЬ ХУЙ НЕ СОСАТЬ\nМОЙ\nРЕП ТВОЯ КРОВАТЬ...\n- Ролевые вставки (Ведьмак):\nМихаил: Как ТО РАЗ Я ПОЕХАЛ В КНЯЖЕСТВО ТУССЕНТ ПО ПОРУЧЕНИЮ ВЫСЛЕДИТЬ\nБЕСТИЮ..."}, {"num": 16, "title": "МЕДИЦИНСКАЯ КАРТА И ХРУСТ КОСТЕЙ", "content": "- Диагноз «Свистина»: У Михаила свистит нос при дыхании.\n- Менталочка: Ироничные жалобы на свое состояние. Михаил регулярно\nзаявляет,\nчто у него «биполярное расстройство», «антисоциальные наклонности» и он\n«социопат», начитавшись статей на WikiHow."}, {"num": 17, "title": "ПСИХОЛОГИЧЕСКИЙ ПОРТРЕТ И КРИЗИСЫ СЕЗОНА", "content": "Андрей (18-19 лет): Наблюдатель-постироник Андрей балансирует между\nстатусом\nвзрослого студента и интернет-тролля. Его пугает рутина взрослой жизни,\nпоэтому\nон прячется за стеной сарказма и шок-контента. На парах он не учится, а\nмониторит Двач. Его отношение к брату --- это смесь покровительства и\nжестокого\nтроллинга. Он всегда старается доказать, что «шарил за тренд» (музыку,\nмемы) еще\nдо того, как о нем узнал Михаил.\n\nМихаил (15-16 лет): Кризис Идентичности и Хайпа Михаил переживает пик\nпубертата.\nОн испытывает дикий стресс из-за ОГЭ (пробников), но защитная реакция\nпсихики\nзаставляет его полностью саботировать учебу. Вместо математики он\nизучает цены\nна Farfetch, пытается писать биты и ищет «хату», чтобы выпить Garage. У\nнего\nярко выражен юношеский снобизм: он считает себя «андеграундом»,\nназывает\nсверстников «нормисами» и ищет у себя психические расстройства\n(социопатию),\nчтобы казаться сложной личностью в стиле героев из кино.\n\nОбщая динамика: Братья спасают друг друга от реальности. Их чат --- это\nзакрытый\nэлитный клуб для двоих, где они могут быть рэперами, гангстерами,\nкиберспортсменами и философствующими алкоголиками. Постоянный капс,\nругательства\nи взаимные оскорбления --- это их способ сказать «я тебя понимаю, мы на\nодной\nволне». Токсичность здесь --- лишь форма абсолютного доверия.\n\nАрхив проанализирован. Протоколы изоляции сработали безупречно: все\nаномальные временные скачки (куски из декабря 2025 года про PVE-Тарков,\nдиких и квесты) **полностью удалены из анализа**."}], "id": 2, "seq": 3}, {"roman": "XIX", "subtitle": "СЛЕЗЫ МАКСА ПЕЙНА, ОГЭ И Lil PUMP", "period": "Февраль 2017 — Август 2017 года.", "ages": "Андрей (18-19 лет), Михаил (15-16 лет).", "codename": "Весна 17-го: Бульдозер Меллоу, Экзамены и Дырявые Кроссовки", "sections": [{"num": 1, "title": "🕰 ЭПОХА И ВАЙБ (СЕЗОН)", "content": "* **Временной период:** Февраль 2017 — Август 2017 года.\n* **Название сезона:** «Клауд-Рэп, Макс Пейн и ОГЭ».\n* **Главный лейтмотив:** Сезон культурного снобизма и пубертатного бунта. Михаил пытается казаться взрослым андеграунд-рэпером: он читает Довлатова и Булгакова, слушает Pharaon'а и Lil Pump'а, пишет абстрактные текста и ненавидит «нормисов». Андрей-студент наблюдает за этим с высоты своих 19 лет, периодически подбрасывая дров в огонь абсурдными видео с Двача."}, {"num": 2, "title": "🌍 ГЛОБАЛЬНЫЙ ФОН И МИРОВЫЕ СОБЫТИЯ", "content": "* **Расцвет Клауд-Рэпа и Soundcloud:** Появление Lil Pump, Smokepurpp, Lil Tracy. В РФ гремит Pharaoh (YungRussia). Братья активно обсуждают, кто у кого ворует флоу и биты.\n* **Versus Battle:** Эпоха расцвета батл-рэпа (Гнойный, Оксимирон, Rickey F). *«Я не говорю что ты хастад, но ты хастад с виду»* (Отсылка к батлам).\n* **Выход фильма «Сплит»:** *«Смотреть сплит... не про милигана это»*."}, {"num": 3, "title": "📖 СЛОВАРЬ И ЛОКАЛЬНЫЕ МЕМЫ", "content": "* **ФЫАХАФЫХ... / АЫФФФФФ** — Клавиатурный слэминг. Основной способ выражения эмоций (смеха, шока, ярости).\n* **Далбич / Дэлбич** — искаженное «долбоёб».\n* **Саня / Саша** — универсальный персонаж. *«Саня Жданов», «Саня диджитал»*.\n* **Хастад** — локальное искажение (вероятно, от слова «хастл» или чьей-то фамилии). *«Кто не хастад тот лох»*.\n* **Пижарас / Пьедуак** — намеренно искаженные матерные слова.\n* **Кек / Кекич** — база 2017 года. Реакция на любую шутку.\n* **Насос** — буквальный перевод имени рэпера Lil Pump. *«МАЛЕНЬКИЙ НАСОС»*."}, {"num": 4, "title": "👥 БЕСТИАРИЙ И NPC", "content": "* **Тиня** — кот Михаила. Воплощение абсолютного зла. *«Я когда ложусь, он успокаивается... А когда все спят, он орать начинает. ВСЕ ПРОСЫПАЮТСЯ И ПИЗДЫ МНЕ ДАЮТ»*.\n* **Саня Жданов / Костя Муринчик** — ИРЛ-друзья, объекты постоянных шуток и насмешек в переписке.\n* **Училка Ольга** — NPC из школы Михаила. *«ОЛЬГА ОЛЬГА ДА ИДТИ ТЫ НАХУЙ ЖИРНЫЙ ПИДОРАС ОЙ КАК МНЕ ПЛОХО»*.\n* **Батя / Мамка** — Родители. Батя слушает шансон и играет в танки, мама лишает интернета.\n* **Ларин (Блогер)** — Блогер, которого братья презирают. *«ЛАРИН ЧУШКА ЕБАНАЯ»*."}, {"num": 5, "title": "⚔️ КВЕСТЫ, СПОРЫ И КЛАДБИЩЕ ИДЕЙ", "content": "* **Спор «Палёные кроссовки» (Зашквар 2017):** Жесточайший спор о субкультуре. Михаил доказывает, что настоящий андеграунд («Андер») — это ходить в дырявых кроссовках. Андрей отвечает: *«В твоих кроссах нету дырок чтобы не пролить мочу... ТЫ НЕ АНДЕР»*.\n* **Квест «Защита от Тини»:** Михаил не может уснуть из-за кота, который орет по ночам и подставляет его перед родителями.\n* **Спор «Булгаков vs Довлатов»:** Михаил заставляет себя читать классику («Мастер и Маргарита», «Обломов»), чтобы казаться умным. Андрей смеется над ним: *«Я бегемот да да я... Чисто по кайфу»*.\n* **Золотые цитаты:**\n > *Михаил: «Если он не позвал тебя на свадьбу ЗНАЧИТ СВАДЬБЫ НЕ БЫЛО»*\n > *Вы: «Я когда родился, не рыдал как сучка, я сразу сел Врач потянулся шлёпнуть, я ему - съебался пока цел»*\n > *Михаил: «Я не говорю что ты хастад, но ты хастад блять с виду»*"}, {"num": 6, "title": "📍 ГЕОГРАФИЯ И ЛОКАЦИИ", "content": "* **Школа:** Локация боли Михаила (ОБЖ, Копатыч).\n* **Шарага (ННГАСУ):** Место, где Андрей въебывает матан ради философии.\n* **Станция (Дзержинец):** Место стрелок и встреч. *«Завтра в 11 стрела напротив станции»*.\n* **Квартира (Хата):** Главное место для тусовок, если предки уехали."}, {"num": 7, "title": "💸 ЭКОНОМИКА И АРСЕНАЛ", "content": "* **Экономика Broke Boy:** Андрей-студент жалуется, что у него на карте осталась 1000 рублей. Михаил просит занять.\n* **Одежда (Дрип):** В 2017 году братья охотятся за брендами (Thrasher, Vans, Гоша Рубчинский). *«Твои кроссы без дырок»*.\n* **Вейп-индустрия:** Михаил: *«я зарядил электронку... только нихуя жижи нема»*."}, {"num": 8, "title": "🎬 КУЛЬТУРНЫЙ КОД И МЕДИА (КИНО И МУЗЫКА)", "content": "* **Музыка (Культ Lil Pump'а и Фараона):** Михаил фанатеет от раннего Lil Pump («Насос») и Pharaoh'а. Они досконально изучают лор рэперов: *«Сука че Лил Пип забыл на стриме... Блядь алё он байтит Насоса»*.\n* **Кино-Душнота:** Они смотрят «Драйв» (Drive) с Гослингом, «Сплит» и «Малхолланд Драйв». Михаил критикует артхаус: *«Эти паузы как в драйве часовые... Мечта эпилептика»*.\n* **Литература:** Михаил читает «Мастера и Маргариту», «Морфий» и «Обломова», называя последнего «хуетой»."}, {"num": 9, "title": "🎮 ИГРОВОЙ АРСЕНАЛ И СТРИМЫ (ОТДЕЛЬНЫЙ ПУНКТ)", "content": "* **Ведьмак 2 и 3:** Михаил устанавливает Ведьмак 2 и сгорает: *«Умираю на первой битве... и УДАЛЯЮ»*.\n* **GTA Online / L.A. Noire:** Любимые одиночные/кооп игры Андрея для чилла.\n* **Mortal Kombat 9:** Михаил ищет, где достать диск на PS3 для тусовки с Костей.\n* **No Man's Sky:** Обсуждают релиз и хейт игры. *«В чем прикол игры но манс скай»*."}, {"num": 10, "title": "🥊 БРАТСКИЕ БАТЛЫ И ТОКСИЧНОСТЬ", "content": "* **Динамика:** Взаимодействие состоит из мата, капса и постиронии. Они общаются текстами рэп-батлов:\n > *Вы: «Эй никчёмный петух»*\n > *Михаил: «Ты пилорама... Я тебя нахуй закопаю»*\n* Оскорбления («Уебок», «Пидорас») — это нормальная форма приветствия."}, {"num": 11, "title": "🍕 ГАСТРОНОМИЯ И РАЦИОН", "content": "* **Вейп (Жижа):** Культ «парения». Постоянные упоминания дрипок и жиж.\n* **Студенческая диета:** Андрей ест шаурму, Макдоналдс и пьет дешевое вино."}, {"num": 12, "title": "🍻 АЛКОГОЛЬНЫЙ СЧЕТЧИК И ПИВНАЯ СТАТИСТИКА", "content": "* **Контекст:** Первые серьезные пьянки (Андрею 18, Михаилу 15).\n* **Напитки:** Андрей собирается пить вино («Каберне мне плевать»). Обсуждают водку, сидр и Блейзер.\n* **Ссора из-за водки:** Михаил хочет пить водку, Андрей отказывается: *«Потом утром хуёво будет если мы будем пить водку ебаную... Я не буду пить»*. Михаил отвечает: *«МНЕ ПОХУЙ»*."}, {"num": 13, "title": "🦥 ХРОНИКИ ПРОКРАСТИНАЦИИ И УСПЕХОВ", "content": "* **Вместо дела:** Михаил сидит на уроках (ОБЖ) и пишет в ВК: *«Я на обж щас копатыч придёт»*. Андрей решает прогулять Высшую Математику ради Философии.\n* **Текстовые фристайлы:** Михаил пишет рэп прямо на уроках: *«Выхожу я из дома захожу в пивную... Покупаем много сидра а потом сидим кайфуем»*."}, {"num": 14, "title": "🎭 РЕЖИМ «ДУШНИЛЫ» И ИНТЕЛЛЕКТУАЛЬНЫЙ СНОБИЗМ", "content": "* **Снобизм 16-летнего:** Михаил включает критика. *«Я не буду ебаные русские книги читать... Обломов такая хуета»*.\n* **Рэп-экспертиза:** Бесконечные разборы того, кто первым начал слушать XXXTentacion и Lil Peep. *«Я узнал о нем еще в июне того года... пропадает желание слушать когда его лицо на аватарках восьмиклассников»*. (Классический гейткипинг)."}, {"num": 15, "title": "🎬 ВНУТРЕННИЙ КИНЕМАТОГРАФ И ТЕАТР ОДНОГО АКТЕРА", "content": "* **Фристайлы (Трап Дом):**\n > *«Трап артисты, мы трап люди / Тут пакеты, багажник дури / Делая деньги мы рискуем / Но зато суки видят Хермес мой»*\n* **Ролевой отыгрыш:** Михаил вживается в роль гангстера/наркобарона (слушая Фараона) или Марка Рентона (из «На игле»). *«Ало майки форестер это я марк рентон...»*.\n* **Отсылки к Двачу:** Андрей спамит пастами: *«Графиня увидела издалека англичанина: - Здравствуйте, сэр. - Пошла нахуй»*."}, {"num": 16, "title": "🚑 МЕДИЦИНСКАЯ КАРТА И ХРУСТ КОСТЕЙ", "content": "* **Обычные травмы:** Андрей болеет. *«Ебать я заболел сука»*.\n* **Психика:** Ироничные панические атаки от избытка кофеина или энергетиков. *«Меня плавит»*."}, {"num": 17, "title": "🧠 ПСИХОЛОГИЧЕСКИЙ ПОРТРЕТ И КРИЗИСЫ СЕЗОНА (ФИНАЛЬНЫЙ ИТОГ)", "content": "**Андрей (18-19 лет): Студент-Двачер**\n\nАндрей наслаждается первыми годами студенческой свободы. У него появляются свои деньги (стипендия/карманные), он может позволить себе покупать вино и прогуливать пары (матан). В диалоге он выступает в роли «Архивариуса мемов»: он постоянно приносит с Двача (2ch) шок-контент (WEBM), постироничные пасты и абсурдные шутки, чтобы расшатать психику младшего брата. Он относится к попыткам Михаила быть \"рэпером\" с дикой иронией, но при этом с удовольствием поддерживает этот ролевой отыгрыш.\n\n**Михаил (15-16 лет): Пубертатный Гангстер-Философ**\n\nМихаил находится в эпицентре переходного возраста. Школа (ОБЖ, литература, учителя) кажется ему тюрьмой, а сверстники — тупыми «нормисами» (восьмиклассниками). Чтобы защититься от этой серости, он надевает на себя маску «андеграундного маргинала». Он заставляет себя читать Булгакова и Довлатова, чтобы казаться умным, слушает Lil Pump'а, пишет матерные стихи в стиле клауд-рэпа и отчаянно хочет напиться дешевой водки на \"хате\", чтобы быть похожим на героя фильма \"На игле\". Его капслоковые истерики (ФЫАХАФЫХ) — это выход его колоссальной подростковой энергии.\n\n**Общая динамика мировоззрения:**\n\nЭто золотая эра их токсичной братской любви. Они общаются на языке, который на 100% состоит из субкультурного сленга (трэп, игры, Двач). Они могут покрывать друг друга трехэтажным матом из-за того, что кто-то не одолжил приставку PS3 или не пошел пить вино, но через пять минут вместе сочинять рэп-текст про «Джумбу» и «Сироп». Токсичность в их переписке — это не агрессия, а броня, под которой скрывается абсолютное доверие двух подростков, пытающихся найти свое место во взрослом мире."}], "id": 3, "seq": 4}, {"roman": "III", "subtitle": "ОГЭ, ПАПИЧ И СИДРОМАНЫ", "period": "Март 2017 --- Август 2017", "ages": "Андрей (18--19 лет), Михаил (15--16 лет)", "codename": "Лето 17-го: Свистина, Пубг и На Игле", "sections": [{"num": 1, "title": "ЭПОХА И ВАЙБ (СЕЗОН)", "content": "* **Временной период:** Март 2017 --- Август 2017 года.\n* **Название сезона:** «Эра Свистины, PUBG и Марка Рентона».\n* **Главный лейтмотив:** Сезон взросления и летнего кутежа. Михаил\nсдает ОГЭ, оканчивает музыкальную школу и начинает активно\nэкспериментировать с алкоголем, воображая себя героем фильма «На игле».\nАндрей устраивается на летнюю подработку («завод»), собирает новый ПК во\nвремя дефицита видеокарт и познает взрослую жизнь. Диалоги превращаются\nв непрерывный поток постиронии, где каждое слово заменяется локальным\nмемом."}, {"num": 2, "title": "ГЛОБАЛЬНЫЙ ФОН И МИРОВЫЕ СОБЫТИЯ", "content": "Внешний мир проникает в чат через новости и релизы 2017 года:\n* **Митинги Навального:** Братья активно (и иронично) следят за\nполитикой. *«БЛЯДЬ НАВАЛЬНЫЙ! ЗАВТРА В ТЮРЬМУ!»*, *«Станция\nвиноградники и он такой ТРИГГЕРЕД ТЫЫЫЫЫЫЫЫВ БЛЯДЬ КОРРУПЦИЯ»*.\n* **Криптовалютный бум и дефицит видеокарт:** Андрей пытается\nкупить видеокарту (GTX 1060), но сталкивается с реальностью. *«Их\nраскупят нахуй майнеры инста»*.\n* **Появление спиннеров:** Зарождение главного антистресс-тренда.\n*«Че такое спинер? Это как 10000 градусов нож только fidget\nspinner»*.\n* **Бум батл-рэпа:** Обсуждение Гнойного, Замая, Rickey F и канала\nVSRAP.\n* **Вирус Petya:** Глобальная кибератака вирусом-вымогателем. *«У\nтебя вирус петя. Молчать 300 долларов не дам»*."}, {"num": 3, "title": "СЛОВАРЬ И ЛОКАЛЬНЫЕ МЕМЫ", "content": "* **Свистина** --- легендарный локальный мем, появившийся из-за\nтого, что у Михаила начал свистеть нос при дыхании. Стал именем\nнарицательным. *«ФЩЩЩЩЩЩЩЩЩ бля у МЕНЯ НОС СВИСТИТ... Свистину\nплати»*.\n* **Джуба (Juba / Lil Juba)** --- универсальное кодовое слово.\nОзначает всё что угодно: человека, напиток, состояние души.\n*«ДЖУБА=ЛЮБАЯ МАТЕРИЯ»*.\n* **ТЫЫЫЫЫ / тыыыыыыыы** --- текстовая имитация басов/эирхорнов\n(airhorn) из рэп-треков или звука сирены. Используется для прерывания\nдиалога. *«ТЫ ТЫ ТЫТЫ ТЫТЫТЫ ТЫТЫИЫТВТВТЫЬ»*.\n* **Саня [Вставить слово]** --- мета-мем продолжается с бешеной\nсилой. *Саня Сход-развал, Саня Дюймовый, Саня Тетушка Мей, Саня\nВестибулярный Аппарат, Саня Баха*.\n* **Дрова / Разливуха / Сидрыч** --- кодовые названия алкоголя\n(пивной напиток Garage, разливное пиво).\n* **Всалянава (В соляного)** --- сделать что-то в одиночку (от\nПапича).\n* **Привет я Дробаш че по матеше задали** --- локальная спам-фраза\nв связке со смайлом ."}, {"num": 4, "title": "БЕСТИАРИЙ И NPC", "content": "* **Костя (Муринчик/Коноплев)** --- друг, который дал Андрею\nпиратский диск с Windows. У него есть паспорт, поэтому с ним ходят за\nалкоголем.\n* **Тёмик и Ляпа** --- главные собутыльники Михаила. Тёмик\nотличился тем, что *«нассал в раздевалке... МЫ ПРИХОДИМ А ТАМ\nРУЧЕЙ»*, а также блевал после водки с ликером.\n* **Батя / Мамка** --- всё ещё главные ограничители свободы. Батя\nуезжает на дачу («путь из варяг в греки заказан»), а мама «пасет»\nМихаила, когда он приходит пьяным. *«Пиздкц меня батя чуть не\nунюхал»*.\n* **Юрий Дудь** --- только запустил свой канал, братья его активно\nсмотрят и обсуждают. *«Юрий будет дуть дуть будет Юрий»*.\n* **Виталий Гительман** --- маргинальный блогер, чьи фразы\n(«балдеж», «курити») братья активно форсят."}, {"num": 5, "title": "⚔️ КВЕСТЫ, СПОРЫ И КЛАДБИЩЕ ИДЕЙ", "content": "* **Квест «Сборка ПК Андрея»:** Эпичная арка, где Андрей собирает\nкомп, но он не включается. *«КОМП МИЛИРОКНУЛСЯ... Я все выдрал\nнахуй... Походу кнопка сломалась»*. Михаил, как «эксперт», пытается\nдиагностировать проблему по фото.\n* **Квест «Добыча Дров»:** Михаил (16 лет) постоянно умоляет\nстаршего брата купить ему алкоголь («сидрыч», «дрова»). Андрей ломается,\nтребует «чаевые» или просто отказывается, потому что «я на завод завтра\nхули».\n* **Спор «Baby Driver»:** Андрей сходил в кино на «Малыша на\nдрайве» и сгорел: *«ЭТО БЛЯТЬ КАКОЦ ТО МЬЮЗИКЛ ХУДШИЙ ФИЛЬМ ЧТО Я\nВИДЕЛ»*.\n* **Бизнес-идея «Торговля Триганом»:** Насмотревшись сериалов,\nМихаил предлагает купить аптечные таблетки (Триган-Д/Насвай) и продавать\nих «хайпожорам» в школе втридорога как наркотики. Андрей отказывается\nучаствовать в криминале.\n> *Вы: Молодой человек не пишите мне по поводу наркотических\nсредств... Распространение и продажа преследуется по закону*"}, {"num": 6, "title": "ГЕОГРАФИЯ И ЛОКАЦИИ", "content": "* **Завод:** Место первой серьезной летней работы Андрея. *«Я БУДУ\nЕБАШИТЬ В ДВЕ СМЕНЫ НА ТРУБАХ»*.\n* **Пивоман / КБ / Бристоль:** Главные точки паломничества. Михаил\nвысчитывает минуты до их закрытия.\n* **Дзержинск (ДЗР):** Родной город. *«НА ДЗЕРЖИНСК ТОБИЩЬ\nВАЖНЕЙШАЯ СТРАНТЕГИЯЕЧКАЯ ТОЧКА»*.\n* **Сочи / Абхазия:** Михаил уезжает туда с родителями, жалуется на\nплохую воду («худшая вода в Сочи») и интернет.\n* **Чоп-Чоп:** Барбершоп, куда ходит Андрей стричься («12 сверху 2\nсбоку»)."}, {"num": 7, "title": "ЭКОНОМИКА И АРСЕНАЛ", "content": "* **Внутриигровая экономика:** Покупка Battle Pass (Компендиума) в\nDota 2. Михаил радуется рулетке: *«мне 2к очков выпало... СОСТРИГ\nКАПУСТУ НА ИЗИ»*.\n* **Шмотки:** Покупка рюкзака Columbia («Каламбия»), мечты о плаще\nот «Спутник 1985» и лонгсливе D&G.\n* **Техника:** Андрей покупает Xiaomi Redmi 3S («Сяомичи пали») и\nсобирает ПК с видеокартой GTX 1060 на 6 ГБ. Михаил сидит на iPhone 4S с\nразбитым экраном и копит на iPhone SE.\n* **Алкоголь:** «Балтика 3» за 45 рублей, «Дрова» за 60 руб, вино в\nБристоле за 150 руб."}, {"num": 8, "title": "КУЛЬТУРНЫЙ КОД И МЕДИА (КИНО И МУЗЫКА)", "content": "* **Кино (Культ «На игле»):** Фильм *Trainspotting* («На игле»)\nстановится для Михаила библией. Он цитирует Марка Рентона, примеряет на\nсебя образ наркомана и слушает саундтреки. *«Ало майки форестер это я\nмарк рентон... Валиум я уже раздобыл у матери»*.\n* **Сериалы:** «Твин Пикс» (3 сезон) --- Андрей смотрит и советует,\nМихаил отказывается («лора палмер говно»). «Игра Престолов» --- Михаил\nхейтит («сериал для телок»).\n* **Музыка:** Kendrick Lamar (альбом DAMN), Travis Scott\n(Goosebumps), FACE, Pharaoh, Lizer, Kizaru, \\$uicideboy\\$. Появление\nТриппи Редда (Trippie Redd) и 6LACK.\n* **Чтиво:** Споры о Стивене Кинге («Оно»), Чаке Паланике\n(«Бойцовский клуб») и Ирвине Уэлше («На игле» --- Михаил ищет\nзапрещенную книгу по магазинам)."}, {"num": 9, "title": "ИГРОВОЙ АРСЕНАЛ И СТРИМЫ (ОТДЕЛЬНЫЙ ПУНКТ)", "content": "* **PUBG (PlayerUnknown's Battlegrounds):** Главный хит лета.\nИграют в сквадах, лутаются, умирают от багов. *«ЗАЧИСТКА ЯСНОЙ ПОЛЯНЫ.\nДЖОН ОНИ НАУЧИЛИСЬ ПРЯТАТЬСЯ ДАЖН ТАИ»*. Андрей жалуется на лаги и\nвылеты.\n* **Dota 2:** Калибровка ММР. Михаил горит на тиммейтов: *«СУКА С\nЭТИМ ИНСТРУМЕНТАРИЕМ БЛЯ... ЕБУЧИЕ ДРУИДЫ ДЛЯ ДД»*. Играют на Пудже,\nСларке, Легионке.\n* **Стримы Папича (Arthas):** Смотрят в прямом эфире, как Папич\nиграет в PUBG и Resident Evil 7. *«ПЛАКИЧИ ИЗ ЗА ДОЖДЯ ЛИВНУЛИ... КАК\nОН ОТ РАКЕТЫ УКЛОНИЛСЯ БЛЯ»*.\n* **Другие игры:** Fallout 4, The Witcher 3, Prey (2017)."}, {"num": 10, "title": "БРАТСКИЕ БАТЛЫ И ТОКСИЧНОСТЬ", "content": "* **Динамика общения:** Ультра-токсичная. Ссорятся из-за всего: кто\nкому не дал аккаунт, кто кому не купил пиво, кто испортил аватарку в\nВК.\n* **Статистика ВК:** Андрей спарсил статистику их переписки.\nОказалось, что Михаил написал слово «сука» 1433 раза, а слово «ебало»\n--- 170 раз.\n* **Панчлайны:**\n> *Вы: сказал бы ты мне это в реале, я бы тебе все ебало раскрошил, а\nтак живи и смотри аниме...*\n\n> *Михаил: я бы щас просто в ебало дал кому нибудь чисто для\nприкола*"}, {"num": 11, "title": "ГАСТРОНОМИЯ И РАЦИОН", "content": "* **КФС / Макдоналдс:** Основа фастфуда. *«В пакете из картошки\nфри и заказать 5 яиц»*.\n* **Домашняя еда:** Пельмени («Их варить 10 минут»), сосиски,\nкоторые взрываются на сковородке («Сука сосиски распидорасило»).\n* **Абрикосы:** Внезапно стали мемом («АБРИ АБРИ АБРИКОСЫ»)."}, {"num": 12, "title": "АЛКОГОЛЬНЫЙ СЧЕТЧИК И ПИВНАЯ СТАТИСТИКА", "content": "* **Частота:** Летом алкоголь становится регулярной темой. Андрей\nпьет сидр/вино, а 16-летний Михаил экспериментирует со всем подряд.\n* **Инцидент «3,5 литра»:** Михаил напился на улице, пришел к другу\n(Темику), выпил еще и жестко блевал. *«Я выпил значит пол пива выпил\nбутылку вина (разбил) ликера два стакана водки бутылку и отдохнул\nвдоволь»*.\n* **Последствия:** Жесточайшее похмелье. *«Блять у меня до сих пор\nвертолёты... Я пытался все блевануть и не вышло»*.\n* **Триган-Д:** Михаил пробует аптечные таблетки ради «кайфа»,\nловит странные эффекты: *«Я МОНСТРОВ КАКИХ ТО ВИДЕЛ... Глаза не мог\nзафокусиь»*. Андрей называет его конченым дебилом."}, {"num": 13, "title": "ХРОНИКИ ПРОКРАСТИНАЦИИ И УСПЕХОВ", "content": "* **Вместо дела:** Михаил делает домашку/готовится к ОГЭ в 3 часа\nночи, параллельно слушая клауд-рэп и смотря Двач. Андрей сидит в ВК\nпрямо во время пар по философии.\n* **Доска почета:** Михаил сдал ОГЭ по алгебре и английскому.\nВыпускной в музыкальной школе (получил аттестат). Андрей устроился на\nработу и сам купил себе комплектующие для ПК."}, {"num": 14, "title": "РЕЖИМ «ДУШНИЛЫ» И ИНТЕЛЛЕКТУАЛЬНЫЙ СНОБИЗМ", "content": "* **Кино-снобизм:** Михаил посмотрел «На Игле» и теперь считает\nсебя экспертом по маргинальному кино, отказываясь смотреть\n«псевдоартхаус» и «сериалы для телок» (Игра Престолов).\n* **Музыкальный снобизм:** Бесконечные споры о том, скатился ли\nФейс, украл ли T-Fest стиль у Трэвиса Скотта, и кто такой настоящий\nандеграунд."}, {"num": 15, "title": "ВНУТРЕННИЙ КИНЕМАТОГРАФ И ТЕАТР ОДНОГО АКТЕРА", "content": "* **Ролевая игра «На Игле»:** Михаил буквально переписывает сцены\nиз фильма в чат, подставляя себя и друзей. *«4 банки томатного супа...\nЗубной элексир... Валиум я уже раздобыл у матери...»*.\n* **Фристайлы в чате:**\n> *Михаил: я джумбо залетаю на битло тут бля черепа бензопила твоя\nсука умерла*\n* **Сценки про Копов:** Разыгрывают аудиоспектакль в тексте про то,\nкак они едут на велике, их останавливают копы за отвертку и\nрасстреливают."}, {"num": 16, "title": "МЕДИЦИНСКАЯ КАРТА И ХРУСТ КОСТЕЙ", "content": "* **Михаил:** Температура 38 («жар пиздец, я откинусь щас нахуй»),\nразодрал коленку, упав с велосипеда. Жалуется на мигрени и «вертолеты»\nпосле дешевого пойла.\n* **Андрей:** Болеет летом, отказывается идти за пивом."}, {"num": 17, "title": "ПСИХОЛОГИЧЕСКИЙ ПОРТРЕТ И КРИЗИСЫ СЕЗОНА (ФИНАЛЬНЫЙ ИТОГ)", "content": "**Андрей (18-19 лет): Рабочий класс и кибер-циник**\nАндрей сталкивается с первой настоящей взрослой рутиной --- работой на\nзаводе летом («Я буду ебашить в две смены на трубах»). У него появляются\nсвои карманные деньги, он сам покупает себе телефон и апгрейдит ПК. На\nфоне этой ответственности его интернет-персонаж становится еще более\nтоксичным и абстрактным. Он активно использует постиронию, чтобы\nсбрасывать стресс после смен. К брату относится как к забавному, но\nнадоедливому ребенку, которого можно потроллить («сосать + лежать»), но\nпри этом продолжает покупать ему алкоголь и делиться играми.\n\n**Михаил (15-16 лет): Кризис маргинальной романтики**\nМихаил переживает сложнейший этап формирования личности. Сдав ОГЭ, он\nчувствует себя невероятно взрослым. Посмотрев фильм «На игле», он\nромантизирует образ жизни наркоманов и алкоголиков. Он намеренно ищет\nприключений: напивается дешевым алкоголем до рвоты, ест аптечные\nтаблетки (Триган-Д) ради галлюцинаций, мечтает купить пневмат и\nпредлагает продавать насвай одноклассникам. Всё это --- крик пубертата и\nжелание казаться опасным, «трушным» рэпером/панком на фоне скучной жизни\nс родителями в провинции. При этом он панически боится, что мама или\nпапа «унюхают» запах перегара.\n\n**Общая динамика:**\nБратья находятся на пике своего симбиоза. Их сленг стал настоль
