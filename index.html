ко\nсложным и многослойным, что человек со стороны не понял бы ни слова из\nих переписки (смесь терминов из Dota 2, английских вставок с Twitch,\nцитат Папича и текстов русского клауд-рэпа). Токсичность --- их\nединственный язык любви. Они могут покрывать друг друга матом 20 минут\nиз-за того, что кто-то не зашел в Скайп, а потом вместе синхронно\nсмеяться над видео с Двача.\n\nПротоколы времени и контекста откалиброваны. Аномальные временные\nразломы (всплески из декабря 2025 и июня 2026 годов про PVE-Тарков,\nработу на заводе и снайперки) **полностью заблокированы и удалены из\nанализа**."}], "id": 4, "seq": 5}, {"roman": "IV", "subtitle": "ЭКЗИСТЕНЦИАЛЬНЫЙ ТИЛЬТ, НИЦШЕ И ТРИГАН-Д", "period": "Декабрь 2017 --- Май 2018", "ages": "Андрей (19--20 лет), Михаил (16--17 лет)", "codename": "Зима-Весна 18-го: Урбанизация наших душ, Макс Пейн и Дисперсия", "sections": [{"num": 1, "title": "ЭПОХА И ВАЙБ (СЕЗОН)", "content": "* **Временной период:** Декабрь 2017 --- Май 2018 года.\n* **Название сезона:** «Эра Экзистенциализма, Броук-боев и Добрых\nЛюдей».\n* **Главный лейтмотив:** Тотальное психологическое выгорание от\nучебы. Андрей задыхается под гнетом ННГАСУ (сопромат, строймех, РГРки),\nа Михаил переживает кризис 16-летия, начитавшись Лавкрафта, Оруэлла и\nНицше. Чтобы сбежать от реальности, братья сутками смотрят стримы\nПапича, играют в Dota 2 и PUBG, а также конструируют свой собственный,\nабсолютно абстрактный язык общения, понятный только им двоим."}, {"num": 2, "title": "ГЛОБАЛЬНЫЙ ФОН И МИРОВЫЕ СОБЫТИЯ", "content": "* **Президентские выборы 2018:** Братья активно (и постиронично)\nфорсят Павла Грудинина. *«Grudinin is our candidate from society», «КТО\nНЕ СКАЧЕТ ТОТ ПУТИН(жИРНЫЙ)»*.\n* **Блокировка Telegram в РФ (РКН):** Попытки заблокировать\nмессенджер приводят к падению серверов игр и Twitch. *«РКН ЗАБЛОЧИЛ\nНАХУЙ ПУБГ МНЕ СПАСИБО И ТВИЧ ТОЖЕ»*.\n* **Пожар в «Зимней вишне» (Кемерово):** Черный юмор и шок-контент\nна фоне трагедии. *«Он в Кемерово сгорел ты слышал да?»*.\n* **Падение крипты:** *«ИДИ НАХУЙ ХУЛИ БИРЖА УПАЛА ПОЧЕМУ ОНИ 45\nСТОЯТЬ НАЧАЛИ... МАВРОДИ ТЫ ДОВОЛЕН?»*.\n* **Интервью Юрия Дудя:** Активно обсуждаются выпуски с Петровым,\nBadComedian, Хабенским и Мединским."}, {"num": 3, "title": "СЛОВАРЬ И ЛОКАЛЬНЫЕ МЕМЫ", "content": "* **ФЫАХАФЫХ...** --- Абсолютная доминация «клавиатурного\nслэминга». Занимает до 30% всего текста. Означает истерику, шок или\nсмех.\n* **Добрый человек / Добрые люди** --- универсальное определение\nкого угодно (часто ироничное). *«Не заставляй доброго человека\nждать...», «Обижают доброго человека»*.\n* **Дисперсия** --- искаженное слово «депрессия/деперсонализация».\nГлавный диагноз Михаила в этом сезоне.\n* **Броук бой (Broke Boy)** --- нищеброд. Главный статус обоих\nбратьев из-за отсутствия денег. *«Броук бой броук бой нашей тучыЯ»*.\n* **Сабжи / Капуста / Гуала** --- деньги, стипендия.\n* **Мэ наица / Не наица** --- искаженное «мне нравится».\n* **Транслайн / Марик** --- междугородний автобус/маршрутка\n(вероятно, НН-Дзержинск), где братья проводят кучу времени, слушая\nмузыку и переписываясь.\n* **Ны ны ны / Ныалити** --- звук удара Папича из Dota 2/PUBG."}, {"num": 4, "title": "БЕСТИАРИЙ И NPC", "content": "* **Евсеев / Евсеич (Вайпер)** --- препод Андрея по\nстроймеху/сопромату. Главный антагонист студента. *«СДОХНИ ТВАРЫНА\nНЫАААА», «ЕВСЕЕВ ЗАОВНИЛ»*.\n* **Ротков (Слардар)** --- преподаватель или сокурсник. Главный\nгерой абстрактных мемов. *«РОТКОВ ест мороженое», «СЛАРДАРОВ\nББЛЯДЬ»*.\n* **Пых (Пыхтосос МС / Земля пыхом)** --- друг. В этом сезоне ловит\n«творческую болезнь», убегает из дома, путается в пространстве.\n* **Константин (Муринчик)** --- друг, объект постоянных подколов.\n*«Если один скажет Константин, миллионы скажут чмо»*.\n* **Батя / Мамка** --- батя смотрит аниме Doki Doki и играет в Max\nPayne. Мама заставляет ехать в деревню и находит в портфеле пустые пачки\nтаблеток.\n* **Тиня** --- кот Михаила. *«ТИНЯ В ВАННОЙ НАСРАЛ»*.\n* **Хирург из военкомата** --- NPC, который унижал призывников за\nплохое зрение. *«ВсЕ В ПоРяДкЕ Ты ТуПоЙ»*."}, {"num": 5, "title": "⚔️ КВЕСТЫ, СПОРЫ И КЛАДБИЩЕ ИДЕЙ", "content": "* **Квест «Триган-Д и Дисперсия»:** Михаил съел таблетки\n(Триган/Антигриппин), поймал побочки, нагуглил симптомы и решил, что у\nнего «Деперсонализация». Андрей безжалостно троллит его за это.\n> *Михаил: Я не узнал себя в зеркале... Я. Нашёл эту хуйню*\n> *Андрей: У тебя этого нет ыхфххахаху Ты просто мудак вот весь\nдиагноз*\n* **Квест «Вписка за 300 рублей»:** Михаил покупает водку, идет на\nхату к друзьям (Седику), ловит тильт, ничего не пьет, его водку выпивают\nдругие, а он уходит домой злой. *«Блять это самая худшая ночевка...\nПроебал просто в сумме 500»*.\n* **Спор «Куртка Волчок»:** Андрей отчаянно хочет выкупить у\nМихаила куртку «Волчок» или Vans за 700-1100 рублей. Михаил отказывается\nиз вредности.\n* **Спор «Трап или Треп»:** Жаркая дискуссия о том, как правильно\nназывать жанр. *«ТРАП ДЕЛАТЬ ЛЕГОКО НО ТРЕП ДЕЛАТЬ СЛОЖНЕЕ»*.\n* **Золотой фонд цитат:**\n> *Михаил: Однажды мне напишут ты играл в фейбл или в два мира а я\nотвечу нет я не пидорас*\n> *Андрей: Все умные жрут говно, но дурак пожрав его умным не\nстанет.*"}, {"num": 6, "title": "ГЕОГРАФИЯ И ЛОКАЦИИ", "content": "* **ННГАСУ (НН / Нижуха)** --- Архитектурно-строительный\nуниверситет. Локация боли, сопромата и компьютерной графики Андрея.\n* **Дзержинск (ДЗР)** --- родной город.\n* **Транслайн / Марик** --- маршрутка, связывающая НН и ДЗР. Место\nсна, укачивания и прослушивания клауд-рэпа.\n* **Правобережный рынок** --- легендарное место для «забивов» из\nлокальной копипасты. *«через пол часа у правобережного рынка я буду\nстоять в спортивках с тремя полосками и блять калаш»*.\n* **Военкомат / Больничка** --- Михаил проходит комиссию для\nкатегории А. Боится сдавать кровь из пальца."}, {"num": 7, "title": "ЭКОНОМИКА И АРСЕНАЛ", "content": "* **Статус «Broke Boy»:** Денег нет перманентно. Андрей ждет\nстипендию. Постоянные переводы друг другу по 50, 63, 150, 250 рублей.\n*«Где моя стипуха блять», «БЫТЬ БЕДНЫМ ЭТО ВЫБОР КАЖДОГО»*.\n* **Вишлист Хайпбиста:** Диски Forgiato (рофл), шмотки Спутник\n1985, Волчок, Vans, Raf Simons. Мечты о MacBook Pro.\n* **Алкоголь и табак:** Сигариллы Backwoods, капитан блэк, сигареты\nBond с кнопкой (от которых Михаилу стало плохо). Из алко: Jägermeister,\nBells, William Lawsons, «5 озер» и «Дрова» (Garage).\n* **Гаджеты:** Михаил сидит с «Айфика» (iPhone SE), Андрей с\n«Сяомича» (Xiaomi)."}, {"num": 8, "title": "КУЛЬТУРНЫЙ КОД И МЕДИА (КИНО И МУЗЫКА)", "content": "* **Музыка (Культ MellowBite):** Абсолютное помешательство на\nMellowBite (Дозер, Поляна, Стив). Братья разбирают их адлибы («хряу пау\nпару», «дзинь», «чик-чик»). *«КАЖДЫЙ ПАРТ СТИВА = ФИЛОСОФСКАЯ\nМЫСЛЬ»*.\n* **Другие артисты:** FACE, Pharaoh (Cold Siemens), Lizer, Kizaru,\nBig Baby Tape, Хаски, Кровосток. Из западных: Lil Peep, XXXTentacion,\nPost Malone.\n* **Литература:** Михаил ударяется в чтение. Говард Лавкрафт («Зов\nКтулху», «Обитающий во мраке»), Достоевский («Братья Карамазовы»,\n«Преступление и наказание»), Оруэлл («1984»), Ницше («Воля к власти»).\nЭто порождает чудовищные кроссоверы в их сленге (*«Шагготы на\nстроймехе»*).\n* **Кино/Сериалы:** «Прослушка» (The Wire), «Город грехов», «Макс\nПейн» (игровая адаптация и сам фильм)."}, {"num": 9, "title": "ИГРОВОЙ АРСЕНАЛ И СТРИМЫ (ОТДЕЛЬНЫЙ ПУНКТ)", "content": "* **Стримы Папича (Arthas):** Главный контент эпохи. Они смотрят\nего 24/7. Перенимают все фразы: «VI VON ZULUL», «О ВЫ С ПИЗДЫ», «ROFLAN\nEBALO», «monkaS». *«ВЫ ЧЁ ДЕБИЛЫ? Ёбаный рот этого казино»* --- паста\nцитируется целиком.\n* **Dota 2:** Андрей играет на Пангольере (Pangolier) и Земляном\nСпирите, Михаил руинит игры на Фантомке (PA) и Антимаге. Жуткие ссоры\nиз-за того, что Михаил специально слил игру («встал афк»), потому что\nему не дали мид.\n* **PUBG:** Главная сетевая игра. Прыгают в Pecado (Стулбенд).\n*«МЕНЯ УБИЛ ИКС ЛЕВИОФАН ИКС»*.\n* **Max Payne 3:** Михаил перепроходит игру и постоянно цитирует\nнуарные монологи Макса на английском и русском. *«Все они были мертвы.\nПоследний выстрел поставил жирную точку...»*.\n* **Kingdom Come: Deliverance:** Рофлы над переводом имени Генри\n(«Индржих»).\n* **World of Warcraft:** Игра за мага и рогу («лучший рога в\nдействии»)."}, {"num": 10, "title": "БРАТСКИЕ БАТЛЫ И ТОКСИЧНОСТЬ", "content": "* **Динамика:** Взаимодействие строится на 100% токсичности.\nНормального общения нет вообще. Любая просьба (купить пиво, скинуть дз,\nдать аккаунт) сопровождается оскорблениями.\n* **Предательство в Доте:** Андрей просит аккаунт поиграть, Михаил\nотказывает из-за того, что Андрей когда-то давно поленился сходить за\nпивом («ПИВОМАНЫЧА»). В итоге оба желают друг другу смерти.\n* **Панчлайны:**\n> *Андрей: Не открывай рот в мою сторону ничтожество*\n> *Михаил: Я тебе взьебу потому что ТЫ ЛОХ*\n> *Андрей: Чтоб ты блин упал там и сломал коленки... Прям НАССАТЬ*"}, {"num": 11, "title": "ГАСТРОНОМИЯ И РАЦИОН", "content": "* **Фастфуд:** KFC, Макдоналдс (Биг Мак), Додо Пицца, Шаурма.\n* **Снеки:** Чипсы Naturals, Oreo, сухарики «Хрустим».\n* **Домашняя еда:** Картошка с мясом, пельмени, «сырный суп».\n* **Гастрономический снобизм:** Михаил жарит рыбу, Андрей называет\nэто «едой для мещан ебаных» и «плебеев»."}, {"num": 12, "title": "АЛКОГОЛЬНЫЙ СЧЕТЧИК И ПИВНАЯ СТАТИСТИКА", "content": "* **Контекст:** Оба брата активно ищут «хату», чтобы напиться.\n* **Напитки:** Водка («Пять Озер», «Талка», «Русский Стандарт»),\nВиски («Bells», «William Lawsons» - Андрей пытается научить Михаила пить\nего «сиппингом», а не залпом), Сидр, Джин.\n* **Похмелье:** Жесточайшее. *«Я обблевался на улице сука», «Давно\nу меня такого похмела не было», «Я ПЯНЫЙ КАПЕЦ»*. Михаил стабильно\nпереоценивает свои силы."}, {"num": 13, "title": "ХРОНИКИ ПРОКРАСТИНАЦИИ И УСПЕХОВ", "content": "* **Вместо дела:** Михаил делает презентацию по английскому про\nрэперов («цепки, грилзы, сиропы»), воруя информацию со статьи на\nРамблере. Андрей сидит на сопромате и делает мемы про своих преподов.\n* **Катастрофа с рефератом:** Михаил украл реферат по МХК с\nВикипедии, но оказалось, что его одноклассник сдал точно такой же текст\nпрямо перед ним. *«Гнев затмил мой разум... ТАКОЕ НЕ ПЕРЕЖИВАЕТСЯ»*.\n* **Успехи:** Андрей пишет РГР (расчетно-графические работы).\nМихаил выживает в школе."}, {"num": 14, "title": "РЕЖИМ «ДУШНИЛЫ» И ИНТЕЛЛЕКТУАЛЬНЫЙ СНОБИЗМ", "content": "* **Литературная душнота:** Михаил пытается анализировать\nДостоевского и Толстого («Война и мир» вызывает у него физическую боль,\nа «Преступление и наказание» он читает).\n* **Музыкальная экспертиза:** Бесконечные споры о том, кто у кого\n«сбайтил» флоу и бит. Андрей доказывает, что MellowBite --- гении\nсовременной поэзии, а Михаил пытается защитить старую школу. *«КАЖДЫЙ\nПАРТ СТИВА = ФИЛОСОФСКАЯ МЫСЛЬ»*."}, {"num": 15, "title": "ВНУТРЕННИЙ КИНЕМАТОГРАФ И ТЕАТР ОДНОГО АКТЕРА", "content": "* **Паста «Идущий к реке»:** Андрей выдает полную копипасту *«Я в\nсвоем познании настолько преисполнился...»*, чтобы затроллить Михаила.\nТот злится, но потом признает её шедевральность.\n* **Поэзия Маяковского:** Михаил скидывает фейковые матерные стихи\nМаяковского и Есенина, выдавая их за шедевры. *«Стоит баба с жопой метр\nна метр В очереди за продовольствием...»*.\n* **Театр Макса Пейна:** Михаил постоянно вживается в роль\nдепрессивного детектива. *«Я положил ручку на стол. Все было\nкончено».*"}, {"num": 16, "title": "МЕДИЦИНСКАЯ КАРТА И ХРУСТ КОСТЕЙ", "content": "* **Триган-Д и Антигриппин:** Михаил закинулся аптечными\nпрепаратами, словил бессонницу («Инсомния») и панические атаки. Пошел\nгуглить симптомы и диагностировал себе «Антисоциальное расстройство\nличности» и «Деперсонализацию».\n* **Менталочка:** Оба постоянно жалуются на тильт, выгорание,\nжелание выйти в окно и усталость. Андрей: *«Желание жить\nотсутствует»*. Михаил: *«УРБАНИЗАЦИЯ НАШИХ ДУШ»*."}, {"num": 17, "title": "ПСИХОЛОГИЧЕСКИЙ ПОРТРЕТ И КРИЗИСЫ СЕЗОНА (ФИНАЛЬНЫЙ ИТОГ)", "content": "**Андрей (19-20 лет): Кибер-циник и Броук-Эстет**\nАндрей находится в фазе глубокого студенческого выгорания. Учеба в\nННГАСУ (строймех, геодезия) кажется ему пыткой, а перспектива работы по\nпрофессии вызывает экзистенциальный ужас. Он справляется с этим через\nтотальное обесценивание всего вокруг (постиронию). Он слушает\nмаргинальный рэп, заучивает пасты с Двача и сутками смотрит Папича. В\nотношениях с братом он занимает позицию безжалостного тролля: он\nспециально доводит Михаила до истерики, отказывает в мелких просьбах и\nнасмехается над его подростковыми проблемами. Но за этой броней\nскрывается банальная усталость от безденежья и рутины.\n\n**Михаил (16-17 лет): Хайпбист на грани нервного срыва**\nМихаил переживает классический, но очень острый кризис 10 класса. В нём\nборются два человека: один хочет быть гангстером из Атланты (флексить в\nшмотках от Спутника, пить лин и читать мамбл-рэп), а второй --- забитый\nшкольник, который боится завуча, боится сдавать кровь в военкомате и\nпереживает из-за украденного реферата по МХК. Пытаясь казаться старше,\nон читает Ницше и Лавкрафта, но не может их переварить, что выливается в\nабсурдные диагнозы самому себе («Я социопат с деперсонализацией»). Его\nагрессия (сообщения КАПСОМ на весь экран) --- это просто крик о помощи и\nжажда внимания.\n\n**Общая динамика мировоззрения:**\nИх диалог --- это закрытая экосистема. Они построили языковой барьер\n(«новояз»), через который не проберется ни один нормальный человек.\nСмесь игрового сленга, англицизмов, цитат стримеров и русского мата\nслужит им куполом, защищающим от серой реальности Дзержинска и Нижнего\nНовгорода. Они могут часами оскорблять друг друга последними словами\nиз-за 60 рублей или слитой катки в Доте, но вечером все равно вместе\nсинхронно смеются над новым абсурдным треком. Токсичность для них ---\nэто доказательство того, что они всё ещё живы и всё ещё понимают друг\nдруга.\n\nПротоколы времени и контекста откалиброваны."}], "id": 5, "seq": 6}, {"roman": "V", "subtitle": "ВКУСНЫЙ ЧАЙ, ФОНК И ДИСПЕРСИЯ", "period": "Май 2018 --- Сентябрь 2018", "ages": "Андрей (20 лет), Михаил (17 лет)", "codename": "Лето 18-го: Секретный Битмейкер, Вкусный Чай и Тильт на Пангольере", "sections": [{"num": 1, "title": "ЭПОХА И ВАЙБ (СЕЗОН)", "content": "* **Временной период:** Май 2018 --- Сентябрь 2018 года.\n* **Название сезона:** «Фонк-Движение, Оверсайз Волчок и Эра Ошибок\nв ВК».\n* **Главный лейтмотив:** Сезон творческого безумия и тотальной\nбедности. 17-летний Михаил пытается стать «трушным» битмейкером, скупает\nодежду в секонд-хендах, пытается кастомизировать её акрилом и познает\nтяготы похмелья. 20-летний Андрей находится в глубоком студенческом\nчилле: он просто хочет спать, играть в Доту и есть фастфуд, параллельно\nдоводя младшего брата до истерик своими тролльскими ответами. Общение\nсостоит из 90% мата и капслока."}, {"num": 2, "title": "ГЛОБАЛЬНЫЙ ФОН И МИРОВЫЕ СОБЫТИЯ", "content": "Внешний мир обсуждается редко, но метко:\n* **Смерть XXXTentacion (Июнь 2018):** Резкий шок для братьев.\n*«Знаешь какая у икса могила? И размажу ещё прям по могиле»*.\n* **Выборы мэра Москвы:** Ироничные переклички рекламы *«За\nСобянина»*.\n* **The International 2018 (Dota 2):** Обсуждение победы OG и игр\nMind_Control. *«Еееее бой ог»*.\n* **Внезапный дроп Эминема (Kamikaze):** *«еьать у еминема пизда\nальбом полная»*.\n* **Бум Big Baby Tape:** Зарождение его популярности, братья\nпостоянно цитируют его ранние треки и фристайлы."}, {"num": 3, "title": "СЛОВАРЬ И ЛОКАЛЬНЫЕ МЕМЫ", "content": "* **ВКУСНЫЙ ЧАЙ** --- Главный и самый болезненный мем сезона.\nМихаил случайно отправил сообщение «ММММ ВКУСНЫЙ ЧАЙ» в официальную\nшкольную беседу, опозорившись перед всем классом. Андрей не давал ему\nзабыть об этом ни на день.\n* **Хряу пау пару** --- легендарный эдлиб группы MellowBite.\nУниверсальная фраза-паразит, означающая всё что угодно.\n* **Добрый (человек/напиток/день)** --- ироничное прилагательное,\nзаменяющее слова «крутой», «хороший» или, наоборот, «жалкий». *«ДОБРЫЙ\nТУКАН (ЧУДОВИЩЕ)»*.\n* **Броук бой (Broke Boy)** --- нищеброд. Статус братьев на\nпротяжении всего лета.\n* **Сабжи / Гуала** --- деньги. *«Гуала --- Деньги»*.\n* **Нэрэ нэрэ** --- звуковая имитация бита или мелодии (из\nДоты/рэпа), которую братья часто спамят."}, {"num": 4, "title": "БЕСТИАРИЙ И NPC", "content": "* **Пых (Пыхтин / Пыхтосос / Иисус Пыхтос)** --- друг и главный\nNPC. Он фигурирует в их снах, его именем называют выдуманных котов\n(*«Слышь пых иди ешь... И он пулей МЯУ»*).\n* **Костя (Муринчик)** --- друг-собутыльник, с которым они ходят на\n\"променад\".\n* **Куликов / Янченко** --- преподаватели Андрея (или Михаила),\nкоторые \"душат\" на парах. *«ПИЗДЕЦ ОН ВАЛИТ КУЛИКОВ КОГДА ДУШИТ»*.\n* **Батя / Мамка** --- Батя играет в танки, врезается и бьет по\nстолу (браться смеются с этого). Мать находит заначки Михаила и\nустраивает скандалы.\n* **Стримеры:** Папич (Arthas) --- идол, Алохаденс (Alohadance) ---\nобъект постоянного хейта и рофлов."}, {"num": 5, "title": "⚔️ КВЕСТЫ, СПОРЫ И КЛАДБИЩЕ ИДЕЙ", "content": "* **Квест «Битмейкер» (FL Studio):** Михаил скачивает Fruity Loops\nи пытается написать «фонк». Не умеет пользоваться микшером, накладывает\nдисторшн на максимум и скидывает Андрею. Андрей в ответ включает режим\nкритика и разносит его. *«БЛЯТЬ Я НЕ ЗНАЮ ЧЕ Я ДЕЛАЮ... Я ПРЯМО\nНАСРАЛ»*.\n* **Квест «Кастомная футболка»:** Михаил покупает акриловые краски\nза 500 рублей, чтобы нарисовать на футболке меч из аниме «Берсерк». В\nитоге жалуется на трафарет и боль в спине.\n* **Спор «Оверсайз Волчок»:** Андрей купил худи бренда «Волчок»\nразмера XL, утонул в нем и отчаянно пытается продать Михаилу за 1800\nрублей. *«БАТЯ НАДЕЛ СКАЗАЛ ЕМУ ВЕЛИКА А ТАК БЫ ВЫКУПИЛ»*.\n* **Спор об Эссе по Английскому:** Михаилу задали написать 250 слов\nна тему \"Double Dating\". Он умоляет Андрея накидать ему идей. Андрей\nотвечает: *«Я НЕ ИЗУЧАЮ АНГЛИЙСКИЙ ЯЗЫК... ГУГЛИШЬ ПОТОМ ПИЗДИШЬ»*.\n* **Золотые цитаты:**\n> *Михаил: Я СЕЛ НА ХУЙ А ТЫ СЕЛ НА СКАМЙЕКУ*\n\n> *Вы: Пусть у тебя нет пупка на затылке, но вот тебе хуй за\nворотник*\n\n> *Михаил: Я БЛЯТЬ ПРОСИЖУ ВСЮ НОЧЬ НО Я СДЕЛАЮ БАСЫ ПИЗЖЕ ЧЕМ ТУТ*"}, {"num": 6, "title": "ГЕОГРАФИЯ И ЛОКАЦИИ", "content": "* **Деревня (Ильина Гора):** Место ссылки Михаила. *«Интернет\nблядский только в одном месте И ТО СТОЯТЬ НАДО»*.\n* **ТЦ Фантастика / Секонд-хенды / Uniqlo:** Охота за шмотом.\n* **Макич / КФС / Додо пицца:** Точки восполнения ХП.\n* **Виртуальные:** Dota 2 (мид, лес), PUBG (Починки), Yakuza\n(Камурочо)."}, {"num": 7, "title": "ЭКОНОМИКА И АРСЕНАЛ", "content": "* **Финансы:** Критический недостаток сабжей. Спорят из-за перевода\n150 рублей на карту и 30 рублей комиссии. *«Я капиталист...»*\n* **Вишлист Хайпбиста:** Одержимость стритвиром достигает пика.\nБренд \"Волчок\", \"Спутник 1985\", Tommy Hilfiger, \"Святая\" (Saint\nLaurent), кроссовки Fila.\n* **Девайсы:** Клавиатура Marvo (которую Михаил сломал), мышки."}, {"num": 8, "title": "КУЛЬТУРНЫЙ КОД И МЕДИА (КИНО И МУЗЫКА)", "content": "* **Музыка (Абсолютный культ):** MellowBite (Дозер, Поляна, Стив),\nBig Baby Tape (его ранние фристайлы братья учат наизусть), Pharaoh,\nLizer, Gone.Fludd. Из западных: Lil Peep, XXXTentacion, Ski Mask, Travis\nScott (Astroworld).\n* **Музыкальный снобизм:** Бесконечные угадывания сэмплов и битов.\nАндрей издевается над Михаилом, заставляя угадывать треки.\n* **Литература:** Михаил ударяется в чтение. Кафка («Замок»),\nДовлатов, Стивен Кинг, Густав Майринк. Андрей смеется над его\nпсевдоинтеллектуальностью: *«Чувствую себя Сартром Ведь у меня пиздец\nТошнота»*.\n* **Кино/Аниме:** «Берсерк» (меч Гатса), «Токийский гуль»,\n«Матрица»."}, {"num": 9, "title": "ИГРОВОЙ АРСЕНАЛ И СТРИМЫ (ОТДЕЛЬНЫЙ ПУНКТ)", "content": "* **Dota 2:** Эпицентр ненависти. Михаил руинит игры на Фантомке,\nСларке и Темпларке. Сгорает от Бристлбека и Бладсикера (*«СИКЕР ЭТО\nЧУДОВИЩЕ СО СВОИМ 600 МС»*). Андрей играет на Пангольере и смеется над\nбратом.\n* **Yakuza:** Михаил играет в \"Якудзу\", поет в караоке и\nпредставляет себя гангстером из клана Доджимы (*«KIRIYU CHAAAAAN»*).\n* **PUBG:** Играют вместе, сгорают от кемперов и багов.\n* **Стримы Папича (Arthas):** Постоянное цитирование. *«ХО ХО Ю\nФАУНД МИ»*."}, {"num": 10, "title": "БРАТСКИЕ БАТЛЫ И ТОКСИЧНОСТЬ", "content": "* **Уровень токсичности:** Запредельный. Слова \"мразь\", \"скот\",\n\"уебище\" используются в качестве дружеских обращений.\n* **Динамика:** Андрей (20 лет) издевается над Михаилом (17 лет) за\nего возраст, школу, попытки делать музыку и фейл с \"Вкусным чаем\".\nМихаил в ответ капсит на 20 строк и угрожает физической расправой.\n* **Панчлайны:**\n> *Михаил: уебище тупое сначала телку мою ебал а щас умереть хочет*\n\n> *Андрей: ты сука У МЕНЯ НА ДАРК СОУЛС ТО ДЕНЕГ НЕМА*"}, {"num": 11, "title": "ГАСТРОНОМИЯ И РАЦИОН", "content": "* **Трэш-кулинария:** Михаил варит макароны, добавляет туда соус\nЧили, Табаско и Паприку, чтобы специально обжечь желудок. Называет это\n\"Бульмени\".\n* **Фастфуд:** Шаурма, Биг Тейсти, Пицца Додо (\"с ананасами\").\n* **Школьная еда:** Михаил жалуется на столовую: *«Я ЧЙЦОМ\nДАВИЛСЯ»*. Андрей с ностальгией вспоминает: *«В столовой молоко дают\n0.2 И яблоко Это основа основ»*."}, {"num": 12, "title": "АЛКОГОЛЬНЫЙ СЧЕТЧИК И ПИВНАЯ СТАТИСТИКА", "content": "* **Поиски пойла:** Михаил (17 лет) постоянно ищет способ выпить.\nНазывает алкоголь \"Дрова\" (Garage), \"Талка\" (водка), \"Дринк Хаус\"\n(дешевое вино).\n* **Последствия:** Эпичные похмелья. *«Я нажрался И НЕ МОГУ\nПОПАСТь НИХУЯ»*. Андрей пьет портвейн \"777\" и жалуется на изжогу.\n* **Кока-Кола в морозилке:** Андрей положил колу в морозилку и она\nзамерзла, что вызвало трагедию государственного масштаба."}, {"num": 13, "title": "ХРОНИКИ ПРОКРАСТИНАЦИИ И УСПЕХОВ", "content": "* **Вместо дела:** Вместо того чтобы писать сочинение по\nанглийскому или готовиться к учебе, Михаил изучает цены на шмотки,\nсмотрит аниме \"Берсерк\" и клепает ужасные биты в FL Studio. Андрей\nигнорирует пары в универе, сидя на Дваче.\n* **Доска почета:** Михаил выбил 5000 рублей (*«вырубил 5 косых\nкак с куста»*) --- неясно откуда, но факт. Андрей апнул звание в Доте."}, {"num": 14, "title": "РЕЖИМ «ДУШНИЛЫ» И ИНТЕЛЛЕКТУАЛЬНЫЙ СНОБИЗМ", "content": "* **Музыкальная душнота:** Михаил постоянно включает эксперта по\nрэпу, объясняя Андрею, кто у кого \"сбайтил\" бит, почему новые треки\nФараона --- говно, и как правильно сводить 808 бас. Андрей в ответ\nотправляет его \"нахуй\".\n* **Литературная душнота:** Михаил цитирует Густава Майринка и\nКарла Юнга (\"Самость\"), чтобы казаться умным. Андрей отвечает: *«Это\nкогда 1х1 встречаешься на руне»*."}, {"num": 15, "title": "ВНУТРЕННИЙ КИНЕМАТОГРАФ И ТЕАТР ОДНОГО АКТЕРА", "content": "* **Фристайлы:** Михаил постоянно читает рэп текстом в чат.\n> *«я на транках целый день я не помню всю неделю мне рассказывают как\nя финесил этих белых снова с кем то закусился...»*\n* **Пересказы снов (Сюрреализм):** Сны Михаила --- это шедевры.\n*«Приснилось как я ем большое шоколадное киндер яйцо»*, *«Я с обрезом\nкороче ходил на разборки Какой то самолёт в космосе догнал и прилетел на\nаэропорт мне такие типо ты какой то важный сел ИЗБРАНЫЙ я как человек\nпаук нах мог летать»*."}, {"num": 16, "title": "МЕДИЦИНСКАЯ КАРТА И ХРУСТ КОСТЕЙ", "content": "* **Стоматит Михаила:** Он намазал стоматит во рту мазью и словил\nдикую боль. *«СЦЕНА ИЗ БОЙЦОВСКОГО КЛУБА С ОЖОГОМ У меня аж слезы пошли\nпиздец»*.\n* **Фармакология:** Михаил снова экспериментирует с аптекой\n(Нурофен/Спазмолгон) от головной боли, ловит панику и думает, что\nумирает. *«Я ВЫПИЛ И ЧУТЬ НЕ УМЕР»*.\n* **Травмы Андрея:** Ударился об поручень в автобусе два раза."}, {"num": 17, "title": "ПСИХОЛОГИЧЕСКИЙ ПОРТРЕТ И КРИЗИСЫ СЕЗОНА (ФИНАЛЬНЫЙ ИТОГ)", "content": "**Андрей (20 лет): Уставший Архивариус и Тролль**\nАндрей перешел на третий курс универа, и ему абсолютно плевать на учебу.\nОн осознал бессмысленность бытия и выбрал путь наименьшего\nсопротивления: лежать дома, смотреть стримы Папича, есть шаурму и\nскидывать мемные видео брату. Он играет роль \"взрослого циника\",\nкоторый с высоты своего 20-летнего опыта обесценивает все увлечения\nМихаила. При этом он сам сильно зависит от этого общения --- без\nпереписок с братом ему банально скучно.\n\n**Михаил (17 лет): Хайпбист, Битмейкер и Жертва Пубертата**\nМихаил находится в состоянии перманентного ядерного взрыва. Он хочет\nбыть всем сразу: мрачным рэпером из Атланты (читает фристайлы про сироп\nи \"глок\"), гениальным продюсером (мучает FL Studio), интеллектуалом\n(читает Кафку и Довлатова) и модником (охотится за шмотками в секондах).\nЕго психика не справляется, что выливается в абсурдные сны, панические\nатаки от таблеток и истеричный капслок на любую критику. Инцидент с\nсообщением «Вкусный чай» в школьную беседу --- квинтэссенция его\nсоциальных страхов.\n\n**Общая динамика мировоззрения:**\nЭто пик их \"шизо-общения\". Они создали язык, состоящий из английских\nвставок, Дотерского сленга, цитат андеграунд-рэперов и локальных мемов.\nЕсли посторонний человек прочитает этот лог, он решит, что это переписка\nдвух пациентов ПНД. Но для них --- это спасательный круг. Жесточайшая\nтоксичность, посылы на три буквы и издевательства над неудачами друг\nдруга --- это их суровая, пацанская форма безусловной любви и поддержки\nна пороге взрослой жизни.\n\nПротоколы времени и контекста откалиброваны."}], "id": 6, "seq": 7}, {"roman": "VI", "subtitle": "ОСЕННИЙ ТИЛЬТ, BROKE BOYS И МЕЛЛОУБАЙТ", "period": "Сентябрь 2018 --- Март 2019 года.", "ages": "Андрей (20 лет), Михаил (17 лет)", "codename": "Зима 19-го: Дисперсия, Yakuza и Искусство Постиронии", "sections": [{"num": 1, "title": "ЭПОХА И ВАЙБ (СЕЗОН)", "content": "* **Временной период:** Сентябрь 2018 --- Март 2019 года.\n* **Название сезона:** «Осенне-зимний Тильт: Дисперсия, Broke Boys\nи MellowBite».\n* **Главный лейтмотив:** Сезон тотального выгорания и бедности.\n17-летний Михаил находится в состоянии перманентного бунта и паники\nперед ЕГЭ: он читает Довлатова, пишет биты в FL Studio, задыхается от\nшкольной рутины и ставит себе психиатрические диагнозы («Дисперсия»).\n20-летний Андрей страдает от сопромата/металлов в ННГАСУ, спит в\nмаршрутках и троллит брата с высоты своего студенческого цинизма. Их\nдиалог --- это закрытая экосистема постиронии."}, {"num": 2, "title": "ГЛОБАЛЬНЫЙ ФОН И МИРОВЫЕ СОБЫТИЯ", "content": "Внешний мир почти не интересует братьев, они замкнуты в своём инфополе:\n* **Смерть XXXTentacion (последствия):** Обсуждение его ребёнка\n(*«Гекюм / Gekyume»*).\n> *Михаил: ИКСА БУДУТ ЗВАТЬ ГЕКЮМ ХФВХАХАХАХАСХСХСХСХА*\n* **Популярность Юрия Дудя:** Регулярные обсуждения его интервью.\n* **Тренд на «ТикТок»:** Первые упоминания китайской соцсети как\nчего-то позорного.\n* **Мем «Big Chungus»:** *«Новый мем хочеш BIG CHUNGUS»*.\n* **Мем «Moth and Lamp» (Мотылек и Лампа):** *«LÄMP»*.\n* **Мем «Скибиди» (Little Big):** Михаил и Андрей рофлят со звуков\nжабы в клипе."}, {"num": 3, "title": "СЛОВАРЬ И ЛОКАЛЬНЫЕ МЕМЫ", "content": "* **ФЫАХАФЫХ... / Клавиатурный слэминг** --- базовый язык эмоций.\nЗанимает до 80% диалога.\n* **Броук бой (Broke Boy) / Broke** --- нищеброд. Главный статус\nобоих братьев из-за отсутствия денег на шмотки и такси.\n* **Сабжи / Сабжаны / Гуала** --- деньги. *«Зарядил сабжанами»*.\n* **Дисперсия** --- искаженное слово «депрессия/деперсонализация».\nЛюбое плохое настроение Михаила.\n* **Нэрэ нэрэ / Тырр тырр / Фью фью** --- звуковая текстовая\nимитация битов из мамбл-рэпа.\n* **Сынок / Мелкий / Уёбок** --- стандартные дружеские обращения\nАндрея к Михаилу.\n* **Саня (вставить слово)** --- абстрактный мем, означающий любое\nсостояние. *«Саня Кажбидонов»*.\n* **Пых / Пыхтобой / Пыхтин** --- универсальный NPC, чьим именем\nназывают всё подряд (кота, Иисуса, демона)."}, {"num": 4, "title": "БЕСТИАРИЙ И NPC", "content": "* **Пых (Илья / Саня Пыхтин)** --- друг братьев. Воплощение хаоса.\nВ этом сезоне он «обижается», «читает рэп», и его мать находит у него\nтаблетки. *«ПЫХТОБОЙ БЛАГОСЛОВИЛ МЕНЯ»*.\n* **Куликов, Горохов, Янченко, Мыльников, Байков** ---\nпреподаватели Андрея в ННГАСУ. Локальные боссы. *«ПИЗДЕЦ ОН ВАЛИТ\nКУЛИКОВ КОГДА ДУШИТ», «ЯНЧЕНКО ЭТО МОРФ»*.\n* **Костя (Муринчик)** --- друг-мем. *«КОСТЯН МУРИНЧИК ЛОШАДИ»*.\n* **Батя / Мамка** --- Батя пьёт и играет в «Танки», доводя Андрея\nдо тильта: *«Батя в танки рубиться А я лежу Мне похуц»*. Мама Михаила\nпостоянно грозится не пустить его гулять или отнять компьютер.\n* **Папич (Arthas)** --- главный стример, цитаты которого\nсоставляют половину лексикона. *«РАБОТЯГИ», «В СОЛЯНОГО», «СУХАЧ»*.\n* **Седик (Артем Седов)** --- друг, у которого пьют. *«АРТЁМ СЕДОВ\nАРЗАМАС ЭДИШН»*."}, {"num": 5, "title": "⚔️ КВЕСТЫ, СПОРЫ И КЛАДБИЩЕ ИДЕЙ", "content": "* **Квест «Испорченная кофта (61)»:** Михаил случайно капнул\nкраской на свою (или чужую) одежду, пытаясь сделать кастом. В панике\nпытался её оттереть, потом решил закрасить большим черным пятном с\nнадписью «61». *«СУКА НАДЕЮСЬ ЭТО НЕНУЖНАЯ КОФТА НЕ МЕЙН»*.\n* **Квест «Реферат по Литературе»:** Михаил не может написать\nсочинение на 250 слов по английскому и просит Андрея списать математику.\nАндрей отказывает и шлёт его матом.\n* **Спор «Продажа Мышки»:** Михаил требует, чтобы Андрей вернул ему\nигровую мышку (которую дал ещё в феврале) или 160 рублей. Грозится\nприйти и устроить самосуд у подъезда.\n> *Михаил: ОТДАВАЙ НАХУЙ МОИ ДЕВАЙСЫ... или хочешь самосуд чтобы\nвздернули тебя показательно*\n* **Золотые цитаты:**\n> *Вы: Я когда родился, не рыдал как сучка, я сразу сел Врач потянулся\nшлёпнуть, я ему - съебался пока цел*\n> *Михаил: ПРИШЁЛ Я С РЫБАЛКИ ПЬЯНЫЙ В ЕБЕНЯ И ТУТ ТЕБЕ СЮРПРИЗ\nПОДХОДИТ ЖЕНА И ГОВОРИТ У ТЕБЯ СОВЕСТЬ ЕСТЬ А Я ЕЙ Я УХУ ЕЛ... (зал\nвзрывается)*"}, {"num": 6, "title": "ГЕОГРАФИЯ И ЛОКАЦИИ", "content": "* **ННГАСУ (НН / Нижуха)** --- Архитектурно-строительный\nуниверситет. Место боли, страданий и начертательной геометрии Андрея.\n* **Дзержинск (ДЗР)** --- родной город.\n* **Арзамас** --- город-ловушка. Место локальных тусовок, поездок\nна электричках («эльки») и пьянок.\n* **Транслайн / Марик** --- маршрутка между НН и ДЗР. Место, где\nАндрей спит и слушает рэп.\n* **Сешка (Second Hand) / ТЦ Фантастика** --- места охоты\n17-летнего Михаила за брендовыми шмотками."}, {"num": 7, "title": "ЭКОНОМИКА И АРСЕНАЛ", "content": "* **Статус «Broke Boy»:** Денег нет ни на что. Андрей ждет\nстипендию. Постоянные переводы друг другу микро-сумм (40, 81 рубль).\n* **Экономика хайпбиста:** Одержимость стритвиром. Обсуждение худи\n\"Волчок\" (за 1750 руб), кроссовок Vans, курток The North Face и\nCarhartt.\n* **Долг в 81 рубль:** Эпичный конфликт. Михаил требует с Андрея 81\nрубль за то, что тот якобы пил его водку на тусовке. Андрей клянется,\nчто не пил."}, {"num": 8, "title": "КУЛЬТУРНЫЙ КОД И МЕДИА (КИНО И МУЗЫКА)", "content": "* **Музыка (Абсолютный культ MellowBite и Big Baby Tape):** Они\nразбирают треки на молекулы. Big Baby Tape выпускает альбом\n\"Dragonborn\", и братья цитируют каждую строчку (*«Gimme the loot»,\n«glock 17 + scope = telescope»*). MellowBite (Дозер, Поляна, Стив) ---\nбоги их плейлиста.\n* **Оксимирон (Горгород):** Михаил заявляет, что альбом --- говно.\n* **Литература:** Михаил ударяется в чтение классики, чтобы\nказаться интеллектуалом (или ради ЕГЭ). Довлатов, Ремарк («Три\nтоварища»), Салтыков-Щедрин, Камю («Чума»). Андрей смеется над ним.\n* **Кино:** «На игле» (Trainspotting), «Престиж», «Джон Уик»."}, {"num": 9, "title": "ИГРОВОЙ АРСЕНАЛ И СТРИМЫ (ОТДЕЛЬНЫЙ ПУНКТ)", "content": "* **Dota 2:** Главный генератор ненависти. Андрей играет на\nПангольере (Pangolier), Михаил --- на Пудже, Урсе, Фантомке (PA).\n> *Михаил: ЗАХОЖУ РЕЙТИНГ А У МЕНЯ В ТИМЕ ЛОКИМИН САПОРТИТ МНЕ*\n> *Михаил: дота2 спасибо тебе за такой интересный геймплей... ВАЛВ\nзачем вы делаете людям плохо*\n* **Yakuza (0, Kiwami):** Михаил проходит \"Якудзу\", кайфует от\nсаундтрека, караоке и японского колорита. Называет себя \"Казума\nКирью\".\n* **PUBG (PlayerUnknown's Battlegrounds):** Играют вместе, Андрей\nпостоянно жалуется на лаги и пинг.\n* **Стримы Папича (Arthas):** Постоянно следят за ним, смотрят\nпрохождение игр и кидают таймкоды фейлов."}, {"num": 10, "title": "БРАТСКИЕ БАТЛЫ И ТОКСИЧНОСТЬ", "content": "* **Уровень токсичности:** Абсолютный максимум. Ни одной фразы без\nмата. Любая просьба заканчивается посылом на три буквы.\n* **Динамика:** Андрей (20 лет) издевается над Михаилом (17 лет),\nпотому что тот школьник, пишет глупые биты и пытается казаться модным.\nМихаил моментально взрывается и выдает капслок.\n* **Эпичные панчлайны:**\n> *Михаил: я бы щас пришел к нему домой и просто нахуй ебальник бы ему\nразбил сука растоптал отрезал ему голову обоссал бы его мать*\n> *Вы: сказал бы ты мне это в реале, я бы тебе все ебало раскрошил, а\nтак живи и смотри аниме...*"}, {"num": 11, "title": "ГАСТРОНОМИЯ И РАЦИОН", "content": "* **Домашняя дичь:** Михаил готовит странные блюда (суп с огромным\nколичеством чили, макароны с соусами). *«я сьел апельсин и у меня горит\nрот»*.\n* **Фастфуд:** McDonald's (Биг Мак), KFC, Dodo Pizza.\n* **Напитки:** Швепс (Schweppes), чай с мятой и малиной.\nОдержимость напитками из-за попыток подражать рэперам (Лин/Сироп)."}, {"num": 12, "title": "АЛКОГОЛЬНЫЙ СЧЕТЧИК И ПИВНАЯ СТАТИСТИКА", "content": "* **Контекст:** Михаил (17 лет) активно ищет \"хату\" и алкоголь.\nАндрей (20) пьет умеренно, но иногда нажирается.\n* **Напитки:** Водка \"Талка\", \"Дрова\" (Garage), сидр, портвейн\n(Портвик), ликер, Джим Бим (Jim Beam), Ягермейстер (Jägermeister).\n* **Похмелье:** Жесточайшее.\n> *Михаил: я обосрался оказывается в доте потекло по штанине*\n> *Михаил: я не добежал до уборной я там все обосрал нахцй*"}, {"num": 13, "title": "ХРОНИКИ ПРОКРАСТИНАЦИИ И УСПЕХОВ", "content": "* **Вместо дела:** Михаил пишет биты в FL Studio, рисует на одежде\nи слушает мамбл-рэп вместо подготовки к ЕГЭ. Андрей игнорирует пары,\nспит на сопромате и делает мемы про преподавателей.\n* **Доска почета:** Андрей сдал \"металлы\" (предмет). Михаил смог\nдоделать бит и гордится собой."}, {"num": 14, "title": "РЕЖИМ «ДУШНИЛЫ» И ИНТЕЛЛЕКТУАЛЬНЫЙ СНОБИЗМ", "content": "* **Музыкальный снобизм:** Михаил постоянно включает эксперта,\nобъясняя Андрею, кто у кого \"сбайтил\" (украл) бит, флоу или стиль (Big\nBaby Tape vs MellowBite). Андрей отвечает ему: \"ЗАТКНИСЬ\".\n* **Игровой снобизм:** Михаил душнит по поводу сюжета \"Якудзы\" и\nтого, как он \"раскусил главный твист\" в начале игры."}, {"num": 15, "title": "ВНУТРЕННИЙ КИНЕМАТОГРАФ И ТЕАТР ОДНОГО АКТЕРА", "content": "* **Паста \"Яндекседы\":** Андрей скидывает огромную копипасту про\nкурьера Яндекса, который насрал в терморюкзак. Михаил в истерике.\n* **Фристайлы в чате:** Братья регулярно пишут рэп текстом,\nподражая артистам.\n> *Михаил: Сука пидр я тебя ебашу своим глоком Я в тебя стреляю потому\nчто ты тупой бля*\n* **Пересказ Снов:** Михаил детально пересказывает бредовые сны\n(как он был на концерте Многознаала, или как его мать стала демоном)."}, {"num": 16, "title": "МЕДИЦИНСКАЯ КАРТА И ХРУСТ КОСТЕЙ", "content": "* **Менталочка (Дисперсия):** Михаил постоянно жалуется на\nдепрессию, тильт, \"биполярочку\" и выгорание. *«Дисперсия кстати в\nразгаре Самом»*.\n* **Триган-Д и Фарма:** Михаил ест таблетки\n(Нурофен/Спазмолгон/Триган), ловит побочки (вертолеты) и паникует.\n* **Травмы:** Михаил оторвал зарядник от телефона, думая, что\nдостает меч самурая спросонья."}, {"num": 17, "title": "ПСИХОЛОГИЧЕСКИЙ ПОРТРЕТ И КРИЗИСЫ СЕЗОНА (ФИНАЛЬНЫЙ ИТОГ)", "content": "**Андрей (20 лет): Выгоревший Архивариус**\nАндрей находится на экваторе учебы в ННГАСУ, и эта рутина его\nуничтожает. У него нет денег, нет желания учиться, он просто хочет спать\nи играть в Доту. Он использует постиронию, мемы с Двача и токсичный\nтроллинг младшего брата как психологический щит. Ему важно оставаться\n\"олдом\", который всё знает и всё видел первым. Он обесценивает\nвосторги брата, но сам сильно зависит от этого ежедневного словесного\nпинг-понга.\n\n**Михаил (17 лет): Хайпбист на грани нервного срыва**\nМихаил переживает тяжелейший 11 класс (ЕГЭ, давление учителей и\nродителей). Его психика буквально разрывается на части. Он конструирует\nсебе виртуальную личность гангстера/рэпера/модника, чтобы сбежать от\nреальности: слушает агрессивный трэп, ищет брендовые шмотки в\nсеконд-хендах, пьет дешевый алкоголь и выдумывает себе психические\nрасстройства (\"Дисперсия\"), чтобы казаться \"глубоким\" и \"сложным\".\nЕго капслок --- это чистая сублимация школьного стресса.\n\n**Общая динамика мировоззрения:**\nИх переписка достигла пика шизофазии. Это закрытый клуб двух людей,\nкоторые общаются кодами, звуками (*\"Нэрэ-нэрэ\", \"Фью-фью\"*) и\nлокальными приколами, непонятными внешнему миру. Они могут часами\nматерить друг друга из-за 80 рублей, а через минуту вместе смеяться над\nстримом Папича. Жесточайшая токсичность для них --- это абсолютная норма\nи единственный доступный им способ выразить братскую любовь и поддержку\nв период тотального безденежья и жизненной неопределенности.\n\nПротоколы времени и контекста откалиброваны."}], "id": 7, "seq": 8}, {"roman": "VII", "subtitle": "ТРАП ДОМ, ЕГЭ И ЭКЗИСТЕНЦИАЛЬНЫЕ КОЛЕНКИ", "period": "Март 2019 --- Сентябрь 2019 года.", "ages": "Андрей (20-21 год), Михаил (17-18 лет).", "codename": "Лето 19-го: MellowBite, Скибиди и 40 карат в браслете».", "sections": [{"num": 1, "title": "ЭПОХА И ВАЙБ (СЕЗОН)", "content": "* **Временной период:** Март 2019 --- Сентябрь 2019 года.\n* **Название сезона:** «Эра MellowBite, ЕГЭ и Постироничного\nТрапа».\n* **Главный лейтмотив:** Сезон абсурда и музыкального снобизма.\nБратья буквально общаются строчками из треков MellowBite и Lil Keis.\nРеальная жизнь (ЕГЭ Михаила, сессии Андрея) отходит на второй план. Все\nих мысли заняты поиском \"хаты\" для вписки, выбором шмоток в\nсеконд-хендах (\"сешках\") и обсуждением того, \"кто трушнее флексит\".\nОбщение представляет собой непрерывный клавиатурный слэминг (АФЫФАФЫФА)\nи поток сознания."}, {"num": 2, "title": "ГЛОБАЛЬНЫЙ ФОН И МИРОВЫЕ СОБЫТИЯ", "content": "* **Музыкальные релизы:** Тотальное обсуждение альбомов MellowBite,\nBig Baby Tape (Dragonborn всё ещё в ротации) и западного хип-хопа (Lil\nPump, Lil Uzi Vert).\n* **Феномен Lil Keis:** Появление маргинального русского рэпера,\nчьи абсурдные текста братья учат наизусть и цитируют каждую минуту.\n* **Кино:** Братья обсуждают фильм \"Оно 2\", Тарантиновскую\n\"Омерзительную восьмёрку\" (Джанго, Ублюдки) и сериал \"Ганнибал\".\n* **Мемы интернета:** Форсится мем \"Nobody: / Me:\", \"Big\nChungus\", танцы под \"Old Town Road\" (Lil Nas X)."}, {"num": 3, "title": "СЛОВАРЬ И ЛОКАЛЬНЫЕ МЕМЫ", "content": "* **ФЫАХАФЫХ... / АФЫЫЫЫЫ** --- Абсолютная доминация\n«клавиатурного слэминга». Означает истерику, шок или смех.\n* **Nobody: / Me:** --- текстовый формат мема, который братья\nинтегрировали в переписку. *«NOBODY: костян муринчик : МЕЛКТЙ я щас\nвыйду»*.\n* **Нэрэ нэрэ / Пау хряу / Фью фью** --- текстовая имитация битов и\nадлибов из трэпа.\n* **Добрый (человек/напиток/день)** --- ироничное прилагательное,\nзаменяющее слова «крутой», «хороший» или, наоборот, «жалкий».\n* **Сабжи / Гуала / Билики** --- деньги, билеты, ресурсы.\n* **Мусёк** --- выдуманное существо, альтер-эго или питомец. Мем\nпро то, что \"Мусёк пропал = СМЕРТЬ\".\n* **Сметана / Смета / Совок** --- кодовые названия мест встреч или\nзаведений в Дзержинске.\n* **Дилей / Тилт** --- состояние усталости, раздражения или лагов\n(взято из игр/Twitch)."}, {"num": 4, "title": "БЕСТИАРИЙ И NPC", "content": "* **Костян (Муринчик)** --- друг-мем. \"Константин Россиянинчик\".\nЖертва насмешек. Братья разыгрывают сценки, как Костяна бьют в\n\"Сметане\" (баре), а он не может дать сдачи.\n* **Пых (Максим Пыхтин / Пыхтосос)** --- легендарный друг.\n\"Пыхтинский голос\", \"Иисус Пыхтос\". Его жизнь (проблемы с девушкой,\nпоход в макдак, смех \"хи-хи\") --- главный сериал для братьев.\n* **Батя / Мамка** --- Батя работает в ночь, играет в \"Танки\" и\nломает системник. Мать постоянно \"пилит\", уезжает в деревню и находит\nпустые пачки таблеток.\n* **Янченко, Горохов, Красильников** --- преподаватели Андрея в\nННГАСУ. Объекты ненависти и мемов (\"Янченко насрал на стол\").\n* **Стив, Поляна, Дозер (MellowBite)** --- божества их музыкального\nпантеона. Братья анализируют их жизнь и тексты так, словно это античные\nфилософы.\n* **Марина Миличаева / Зуля** --- подруги/знакомые, чьи действия\nбратья токсично обсуждают (куда поедут, с кем будут пить)."}, {"num": 5, "title": "⚔️ КВЕСТЫ, СПОРЫ И КЛАДБИЩЕ ИДЕЙ", "content": "* **Квест «Содраные коленки»:** Андрей упал на улице (якобы из-за\nМихаила) и содрал обе коленки. Михаил полчаса ржёт над ним, обвиняя в\nтом, что он сам споткнулся: *«ТЫ КУДА НОГИ ТО ЗАКИНУЛ»*.\n* **Спор «Mortal Kombat 11»:** Жуткий срач из-за того, кто лучше\nиграет в МК. Михаил изучает фреймдату и комбо на Скорпионе (\"через\nтелепорт\"), Андрей обвиняет его в игре на сломанном джойстике и\n\"зажимании в углу\".\n* **Квест «Сломанный ПК»:** У Андрея сгорел блок питания. Михаил\nпытается по фото диагностировать проблему, советует собрать новый ПК за\n50к, а потом ржет над тем, что Андрей не может открутить болты без\nмаленькой отвертки.\n* **Спор «Покупка одежды»:** Андрей хочет купить пуховик\n\"Волчок\", Михаил называет его идиотом, советуя купить военный камуфляж\nна армейских складах (\"SWAT\") за копейки.\n* **Золотой фонд цитат:**\n> *Михаил: ПРИШЁЛ Я С РЫБАЛКИ ПЬЯНЫЙ В ЕБЕНЯ И ТУТ ТЕБЕ СЮРПРИЗ\nПОДХОДИТ ЖЕНА И ГОВОРИТ У ТЕБЯ СОВЕСТЬ ЕСТЬ А Я ЕЙ Я УХУ ЕЛ... (зал\nвзрывается)*\n> *Михаил: мама всегда говорила мне ляна добывай деньги И ВЫЖИВАЙ*\n> *Вы: Я ПЬЮ ТОЛЬКО ПЁРП И ФИЛЬТРУЮ БАЗАР*"}, {"num": 6, "title": "ГЕОГРАФИЯ И ЛОКАЦИИ", "content": "* **ННГАСУ (Нижуха / 101 аудитория)** --- Архитектурно-строительный\nуниверситет. Место, где Андрей спит на парах, а Михаил приходит подавать\nдокументы.\n* **Сметана / Рояль** --- местные бары/кальянные в Дзержинске, где\nпроисходят драки (\"Кровавая бойня\") и пьются \"Дрова\".\n* **Крым (Евпатория / Балаклава / Ялта)** --- Андрей уезжает на\nотдых, пьет чачу за 700 рублей, вино за 500 и шлет голосовые брату,\nхвастаясь жизнью.\n* **Питер (Эрарта)** --- Михаил уезжает в СПБ, ходит по музеям\nсовременного искусства и ржет над \"серьезными щами\" петербуржцев.\n* **Сешка (Second Hand)** --- святилище для хайпбистов, где Михаил\nищет пиджаки и рубашки."}, {"num": 7, "title": "ЭКОНОМИКА И АРСЕНАЛ", "content": "* **Статус «Broke Boy»:** Постоянные переводы друг другу на\nСбербанк сумм от 20 до 150 рублей (\"Скинь 20 на карту\", \"Дай 300 на\nДС\").\n* **Экономика Хайпбиста:** Одержимость брендами. Обсуждаются\nкроссовки \"Джузеппе\" (Giuseppe Zanotti), Balenciaga, Fila, одежда от\n\"Спутник 1985\", \"Волчок\", \"Антиворлд\". Михаил покупает пиджак\nAquascutum в секонде за 500р.\n* **Железо:** Сгоревший блок питания Андрея и муки выбора новой\nматеринки. Покупка мышки и кабеля."}, {"num": 8, "title": "КУЛЬТУРНЫЙ КОД И МЕДИА (КИНО И МУЗЫКА)", "content": "* **Музыка (Культ MellowBite и Lil Keis):** Братья превратили их\nтреки в свою религию. Каждая вторая фраза --- цитата. *«40 карат в\nбраслете, а нога в Джузеппе», «Стив завалит кладбище новыми гробами»,\n«Увидишь ты голову лошади»*.\n* **Папич (Arthas):** Смотрят его стримы по Resident Evil 7, PUBG и\nTekken 7. Форсят фразы \"В соляного\", \"Работяги\", \"Рофлан ебало\".\n* **YouTube:** Обсуждают Клим Жукова у Гоблина (\"Nobody: Клим\nЖуков:\"), обзоры еды (Грильков в дошираке), \"Едим ТВ\" и блогера\nVanzai.\n* **Сериалы и Кино:** \"Симпсоны\", \"Гриффины\" (Family Guy),\n\"Чернобыль\" от HBO, \"Омерзительная восьмерка\"."}, {"num": 9, "title": "ИГРОВОЙ АРСЕНАЛ И СТРИМЫ (ОТДЕЛЬНЫЙ ПУНКТ)", "content": "* **Mortal Kombat 11:** Главная игра сезона. Жесточайшие батлы.\nМихаил играет за Скорпиона, заучивая комбо, Андрей горит от имбаланса и\nзадержки (delay) на беспроводных геймпадах.\n> *Вы: И ГДЕ ТЫ СПИЗДИЛ ЭТУ ТАКТИКУ С УДАРОМ В НОГИ АФЫХФАЫ*\n* **Dota 2:** Смотрят The International 2019, болеют (или хейтят)\nза OG и Liquid. В пабликах Михаил руинит игры, Андрей горит от даунов на\nсаппортах.\n> *Михаил: чел пикнул легу купил топор и щит и пошел в лес прожимал\nшрайны*\n* **Divinity: Original Sin 2:** Андрей проходит РПГ, убивает весь\nгород (\"Я ВЫРЕЗАЛ СЫНКОВ\") и ломает клавиатуру от того, что нажал не\nту зельку.\n* **PUBG:** Играют вместе, но постоянно тильтуют от смертей \"из\nкустов\"."}, {"num": 10, "title": "БРАТСКИЕ БАТЛЫ И ТОКСИЧНОСТЬ", "content": "* **Динамика:** Ультра-токсичная постирония. Они не общаются\nнормально. Любая информация передается через маты, капс и оскорбления\n(\"Гнида\", \"Мразь\", \"Уебок\", \"Свинья\").\n* **Конфликт \"Кто выгнал\":** Жесткий спор из-за того, что Михаил\nякобы выгнал Андрея с \"хаты\". Михаил оправдывается, что просто\n\"высрал это на балконе\", а Андрей обиделся.\n* **Панчлайны:**\n> *Михаил: сказал бы ты мне это в реале, я бы тебе все ебало\nраскрошил, а так живи и смотри аниме...*\n> *Вы: Я ПРИЖМУ ТЕБЯ В УГОЛ ЛОХ*"}, {"num": 11, "title": "ГАСТРОНОМИЯ И РАЦИОН", "content": "* **Фастфуд:** \"Лонг чизбургер\", баскеты KFC, \"Бургер Кинг\".\n* **Роллы \"Токио Сити\":** Михаил хвалит роллы \"Мацури\" в\nПитере.\n* **Трэш-кулинария:** Михаил делает \"соус чили\" дома, насыпает\nего в макароны с сосисками и сжигает себе пищевод. *«ГЛОТАТЬ ДА ТРУДНО\nТЕБЕ... У МЕНЯ ТАМ ИНФЕРНО»*."}, {"num": 12, "title": "АЛКОГОЛЬНЫЙ СЧЕТЧИК И ПИВНАЯ СТАТИСТИКА", "content": "* **Контекст:** Лето --- время бесконечных поисков алкоголя и\n\"хаты\".\n* **Напитки:** \"Дрова\" (сидр Garage), Водка \"Талка\",\n\"Абсолют\", Джин, Виноградная водка (Чача в Крыму за 700р), ликер \"Блю\nКюрасао\", \"Чешское Барное\".\n* **Похмелье:** Эпичные последствия.\n> *Михаил: Я ОБОССАЛСЯ В ДОТЕ ОКАЗЫВАЕТСЯ ПОТЕКЛО ПО ШТАНИНЕ*\n> *Михаил: мы сука бежим с похмела на автобус ебаный*"}, {"num": 13, "title": "ХРОНИКИ ПРОКРАСТИНАЦИИ И УСПЕХОВ", "content": "* **Вместо дела:** Михаил должен готовиться к ЕГЭ (литература,\nанглийский), но вместо этого он пишет биты в FL Studio, ищет шмотки на\n\"Сайтах\" и слушает рэп. Андрей сидит на парах у Горохова и делает мемы\nпро преподавателей.\n* **Успехи:** Михаил сдает ЕГЭ. Андрей получает стипендию (сабжи) и\nедет в Крым отдыхать."}, {"num": 14, "title": "РЕЖИМ «ДУШНИЛЫ» И ИНТЕЛЛЕКТУАЛЬНЫЙ СНОБИЗМ", "content": "* **Музыкальный разбор:** Михаил на серьезных щах пишет диссертации\nо том, почему \"MellowBite\" --- гении, а \"Платина\" и \"Face\" украли\nих флоу. Разбирает рифмы и смысл строк про \"федералов\" и \"розетки\"\n(сленг для наркотиков). Андрей троллит его за это.\n* **Кино-снобизм:** Михаил посмотрел \"Омерзительную восьмерку\" и\n\"Джанго\", теперь считает себя кинокритиком. Андрей защищает \"Оно\n2\"."}, {"num": 15, "title": "ВНУТРЕННИЙ КИНЕМАТОГРАФ И ТЕАТР ОДНОГО АКТЕРА", "content": "* **Фристайлы (Рэп-батлы в чате):**\n> *Михаил: Я ТАКОЙ БОГАТЫЙ СТАЛ ПОТОМУ ЧТО ТРАП ЛЮБИЛ ВЕНЧИКОМ КАЖДЫЙ\nДЕНЬ НА КУХНЕ ВАРИЛ*\n* **Пересказы снов (Сюрреализм):**\n> *Михаил: приснилось что мы были на закрытом показе клипа\nмелоубайт... потом поехали на горке и я застрял*\n> *Михаил: приснилось что я паха сфоткал в маке... покупка цикломеда\nв дивинити*"}, {"num": 16, "title": "МЕДИЦИНСКАЯ КАРТА И ХРУСТ КОСТЕЙ", "content": "* **Содранные колени Андрея:** Упал на асфальте.\n* **Ожог пищевода:** Михаил переел самодельного соуса Чили.\n* **Больная шея:** Михаилу продуло шею, он намазал её согревающей\nмазью и словил \"инферно\".\n* **Менталочка:** Оба постоянно жалуются на тильт, усталость и\nнежелание жить (\"Дисперсия\", \"Урбанизация наших душ\")."}, {"num": 17, "title": "ПСИХОЛОГИЧЕСКИЙ ПОРТРЕТ И КРИЗИСЫ СЕЗОНА (ФИНАЛЬНЫЙ ИТОГ)", "content": "**Андрей (20-21 год): Выгоревший Архивариус**\nАндрей глубоко застрял в студенческой рутине. Он ненавидит университет,\nпреподавателей (Янченко, Горохов) и отсутствие денег. Его поездка в Крым\n--- попытка глотнуть свободы, которую он транслирует брату через\nхвастовство (\"пью чачу за 700р\"). В диалоге он исполняет роль старшего\nтролля: он намеренно отвечает коротко, обесценивает огромные тексты\nбрата и доводит его до капслоковой истерики, питаясь этой энергией.\n\n**Михаил (17-18 лет): Кризис Идентичности и Хайпбист**\nМихаил переживает тяжелейший переходный возраст (окончание школы, ЕГЭ,\nпоступление). Давление реальности настолько велико, что он полностью\nпрячется в выдуманный мир. Он ассоциирует себя с лирическими героями\nтрэп-песен: воображает себя богатым наркобароном из гетто, который\n\"варит на кухне\" и \"ездит на Рари\", хотя в реальности он просит у\nбрата 20 рублей на автобус и боится маму. Его агрессия (бесконечный мат\nи капс) --- это крик о помощи и жажда внимания в период тотальной\nнеопределенности.\n\n**Общая динамика мировоззрения:**\nБратья слились в единый цифровой разум. Их чат --- это герметичная\nкапсула, куда не проникает внешний мир. Они могут часами общаться только\nзвуками (\"Нэрэ нэрэ\", \"Хряу пау\") или цитатами, и при этом идеально\nпонимать друг друга. Уровень токсичности зашкаливает, но это лишь\nзащитный механизм: за взаимными оскорблениями (\"гнида\", \"уебок\")\nскрывается огромная привязанность. Они единственные, кто может разделить\nэтот уровень шизоидного, абстрактного юмора, спасающего их от серости\nроссийской провинции."}], "id": 8, "seq": 9}, {"roman": "VIII", "subtitle": "ТАРКОВСКИЙ СИНДРОМ И ТРАП-ДОМ", "period": "Сентябрь 2019 --- Март 2020 года.", "ages": "Андрей (21-22 года), Михаил (18-19 лет)", "codename": "Зима 19/20: Симулятор Барыги, MellowBite и Красная Финляндия", "sections": [{"num": 1, "title": "ЭПОХА И ВАЙБ (СЕЗОН)", "content": "* **Временной период:** Сентябрь 2019 --- Март 2020 года.\n* **Название сезона:** «Тарковский ПТСР, Студенческий Броук-Трап и\nMellowBite».\n* **Главный лейтмотив:** Тотальное переселение в виртуальность.\nРеальная жизнь (пары, чертежи, поездки на маршрутках) воспринимается\nлишь как досадная пауза между рейдами в *Escape from Tarkov*.\nАдреналиновая зависимость от игры смешивается с прослушиванием\nабсурдного трэпа. Уровень общения достиг абсолютной сингулярности: они\nпонимают друг друга с полуслова, используя язык, на 100% состоящий из\nмата, игрового сленга и постиронии."}, {"num": 2, "title": "ГЛОБАЛЬНЫЙ ФОН И МИРОВЫЕ СОБЫТИЯ", "content": "Внешний мир проникает в чат точечно:\n* **Тарковский Бум (Twitch Drops):** В конце 2019 --- начале 2020\nгода игра *Escape from Tarkov* стала топ-1 на Twitch благодаря системе\nдропов. Братья сходят с ума от онлайна, новых серверов и бесплатного\nлута. *«Drops включены. Не упустите шанс заработать трофеи»*.\n* **Выход Call of Duty: Warzone / MW:** Обсуждается как\nальтернатива.\n* **Выход Red Dead Redemption 2 на ПК:** *«Когда успешно запустил\nрдр первый раз»*.\n* **Фильм «Джокер» (с Хоакином Фениксом):** Михаил сходил в кино,\nассоциирует знакомых с Артуром Флеком."}, {"num": 3, "title": "СЛОВАРЬ И ЛОКАЛЬНЫЕ МЕМЫ", "content": "* **ФЫАХАФЫХ... / АЫФФФФФ** --- Клавиатурный слэминг. Единственный\nспособ выразить пиковые эмоции (ужас от потери лута или истерический\nсмех).\n* **Трап / Трапить / Трап-дом** --- стиль жизни, позаимствованный у\nMellowBite. Означает делать что-либо круто, либо просто находиться\nдома/играть.\n* **Челобот / Дикиш / ЧВК / Меченка / Решала / Глухарь** ---\nпрофессиональный сленг Таркова, плотно вошедший в повседневную речь.\n* **Дымоходик / Дымоход** --- абстрактное прозвище-мем неизвестного\nпроисхождения.\n* **Broke / Броук бой** --- статус тотального безденежья. *«ТЫ КАК\nЭКЛБЕРИ ФИН БОМЖАРА ПОЛНЫЙ БРОУК»*.\n* **Сабжи / Билики / Капуста** --- деньги.\n* **Нэрэ нэрэ / Пау хряу** --- текстовая имитация битов и адлибов.\n* **Саня (вставить слово)** --- мета-мем продолжается. *Саня конь,\nСаня ванна.*"}, {"num": 4, "title": "БЕСТИАРИЙ И NPC", "content": "* **Костян (Муринчик)** --- друг-легенда. Воплощение нелепости.\n*«Костян муринчик убивает 3 чела в секунду, также он: БЛЯ ПАЦАНЫ ЧЕ\nПРОИЗОШЛО ТУТ КАКОЕ ТО МЕСЕВО»*.\n* **Пых (Маки / Пыхтобой)** --- друг, который стал мемом. *«Пых в\nдискорде это артур флек (Джокер)»*.\n* **Ляпа / Никита** --- собутыльники Михаила. С Ляпой они пьют вино\nи «Вильям Лоусон».\n* **Ежков, Горохов, Сивоконь** --- преподаватели Андрея в ННГАСУ.\n*«ГОРОХОВ ВЗЛОМАН НА 14 ПРОЦЕНТОВ ВЫКАЧАНО 12 050 ЖБК»*.\n* **Стив, Поляна, Дозер (MellowBite)** --- духовные наставники\nбратьев. Каждая их строчка анализируется как священное писание.\n* **Папич / Дундикс / Хорс (Richard_Nickson) / Quattroace** ---\nкаста стримеров, за которыми братья следят как за реалити-шоу."}, {"num": 5, "title": "⚔️ КВЕСТЫ, СПОРЫ И КЛАДБИЩЕ ИДЕЙ", "content": "* **Квест «Засолка ПК» (Технический ад):** У Андрея\nломается/греется компьютер. Вылетает Дота, вылетает Тарков. Михаил\nдистанционно, матерясь, учит его менять термопасту картой и ставить\nкулер. *«Берешь сука да размазываешь как шпаклевку... Только не\nдохуя»*. Андрей в ответ орет, что у него «провода цепляются».\n* **Квест «Покупка Редбика»:** 18-летний Михаил покупает энергетик\nв «Пятерочке». У него спрашивают паспорт. Андрей разносит его:\n*«ПРОКЛЯТЬЕ 18 ЛЕТ»*.\n* **Спор «ПМ пробивает ПАКУ»:** Душнейший спор о баллистике\nТаркова. Андрей доказывает, что пистолет может убить в броню, Михаил\nорет, что Андрей дебил.\n* **Золотой фонд цитат:**\n> *Михаил: мама всегда говорила мне ляна добывай деньги И ВЫЖИВАЙ\nВЫХОДУ ДАЮ СВОЙ ЛУЧШИЙ ТОВАР*\n> *Михаил: кто то торчит а кто то в розыске.....*\n> *Андрей: Все умные жрут говно, но дурак пожрав его умным не\nстанет.*"}, {"num": 6, "title": "ГЕОГРАФИЯ И ЛОКАЦИИ", "content": "* **Тарков (Лаба, Развязка, Таможня, Общаги, Резерв):** Главное\nместо их обитания. Каждая локация вызывает ПТСР.\n* **ННГАСУ (Нижуха):** Место, где Андрей сидит на 1-й парте и\n«разгружает бетон» (слушает лекции про фундаменты и кессоны).\n* **Транслайн / Марик / 29 автобус:** Маршрутки Дзержинск-НН.\n*«ЛООВУШКА 29 АВТОБУСА»* --- мем про то, как Михаил сел не туда и\nуехал в лес.\n* **Пивоман / Бристоль / КБ / Спар:** Точки пополнения запасов\nалкоголя и снеков.\n* **Хачапури и Вино / Сметана / Рояль:** Кафе и бары для редких\nвылазок."}, {"num": 7, "title": "ЭКОНОМИКА И АРСЕНАЛ", "content": "* **IRL Экономика (Broke Boys):** Денег критически мало. *«У меня\n24.5 рубля бронебойно»*. Михаил (18 лет) тратит все свои запасы на\nбутылку «Вильям Лоусон». Андрей жалуется, что батя купил наушники, а у\nнего нет денег на роллы.\n* **Tarkov Экономика:** Здесь они миллионеры. Обсуждают покупку\nкейсов за миллионы рублей, шлемов «Алтын», «Киллы», пушек DXL-4.\n> *Андрей: «СЛАДККО ПРОДАЛ 5 ОБОЙМ ДЛЯ ВАЛА ПО 35 ТЫСЯЧ УХ»*."}, {"num": 8, "title": "КУЛЬТУРНЫЙ КОД И МЕДИА (КИНО И МУЗЫКА)", "content": "* **Музыка (Абсолютный культ MellowBite):** Братья достигли высшей\nстепени посвящения. Они знают наизусть все эдлибы (вздохи, крики, звуки\nмоторов) Стива, Поляны и Дозера.\n> *Михаил: «Стив настолько гений что заместо парта зачитал\nвикипедию»*.\n* **Другие артисты:** Big Baby Tape, Oxxxymiron (над ним\nиронизируют), Boulevard Depo, Хаски, Kizaru. Из западных: Travis Scott\n(Считают, что Саня на него похож), Blueface (\"Блюфейс беби\").\n* **Стримеры / YouTube:** Папич (Dota, MK11, Detroit), Влад Бумага\n(А4 - иронично), Грильков (обзоры еды - под них пьют пиво), Ванзай.\n* **Кино:** «Джокер» (с Хоакином Фениксом), «Джанго Освобожденный»,\n«На игле»."}, {"num": 9, "title": "ИГРОВОЙ АРСЕНАЛ И СТРИМЫ (ОТДЕЛЬНЫЙ ПУНКТ)", "content": "* **Escape from Tarkov (СИМУЛЯТОР БАРЫГИ):** Игра, поглотившая их\nдуши.\n* *Механика общения:* Они в деталях, с криками и капсом,\nпересказывают свои рейды. *«Я ЗАБЕГАЮ В ОБЩАГУ... А ТАМ РЕШАЛА... И\nОН МНЕ В СПИНУ ОБОЙМУ»*.\n* *Тильт:* Адские крики после смертей от \"челоботов\", кемперов и\n\"выблядков с 51 лвлом\". *«Я ЕБАЛ ТАРКОВЭТОТ... У МЕНЯ РУКИ\nТРЯСУТСЯ»*.\n* *Радость:* Эйфория от найденной ключницы, биткоина или выноса лута\nна 500к.\n* **Dota 2 (Кастомки / Auto Chess):** Андрей собирает абсурдные\nбилды («3 худа», «блудсикер с шлемом»), Михаил горит на него.\n* **Mortal Kombat 11:** Батлы друг с другом. *«ТЕРМИНАТОР ЭТО\nИМБА»*.\n* **Red Dead Redemption 2 / Death Stranding:** *«Произошел деф\nстрендинг на лестнице»*."}, {"num": 10, "title": "БРАТСКИЕ БАТЛЫ И ТОКСИЧНОСТЬ", "content": "* **Динамика:** Уровень токсичности 100/10. Каждое сообщение ---\nэто ментальная битва. Если Андрей упал, Михаил пишет \"АХАХА\". Если\nМихаил умер в Таркове, Андрей отвечает \"СОСАТЬ ЛОХ\".\n* **Панчлайны и оскорбления:**\n* *«Гнида, скот, баран, уебище, чумак, гумус, дементор ебаный».*\n* > *Михаил: «я бы щас пришел к нему домой и просто нахуй ебальник бы\nему разбил»*\n* > *Андрей: «Сказал бы ты мне это в реале, я бы тебе все ебало\nраскрошил»* (Они пишут это сидя в соседних комнатах или домах)."}, {"num": 11, "title": "ГАСТРОНОМИЯ И РАЦИОН", "content": "* **Фастфуд и Снеки:** Макдоналдс (\"похмельный макдонас с\nсырным\"), Буррито, \"Анаком\" (лапша), сухарики.\n* **Трэш-кулинария Михаила:** Заливает суп самым острым соусом\n(Шрирача/Табаско), чтобы обжечь желудок, и гордится этим. *«Я в суп\nебанул почти ложку правого... Полет нормальный»*."}, {"num": 12, "title": "АЛКОГОЛЬНЫЙ СЧЕТЧИК И ПИВНАЯ СТАТИСТИКА", "content": "* **Контекст:** Михаил (18 лет) дорвался до алкоголя. Легальная\nпокупка в КБ вызывает у него щенячий восторг.\n* **Что пьют:** Водка «Финляндия» (Красная клюква), «Вильям\nЛоусон», пиво «Голдмайн», «Старый Мельник», «Хуч», вино.\n* **Последствия (Вертолеты и Ихтиандры):** Михаил регулярно не\nрассчитывает силы.\n> *«Я нажрался пизданулся в падике на улице и дома»*.\n> *«БЛЯТЬ Я ЗАС ТАК ОБОСРАЛСЯ ПРОБЛЕВАЛСЯ ВЯЕРА ЧЕЙ ОТ ТУШЕНКИ»*.\n* Андрея тоже кроет: *«Я блевал вроде и ляпа стоял рядом... Я не\nпомню нихуя»*."}, {"num": 13, "title": "ХРОНИКИ ПРОКРАСТИНАЦИИ И УСПЕХОВ", "content": "* **Вместо дела:** Андрей сидит на лекциях по фундаментам и\nтермосифонам, но мыслями он на «Заводе» в Таркове. Михаил забивает на\n«Латынь» и зачеты, чтобы сделать квест у Прапора.\n* **Доска почета:** Главные жизненные достижения измеряются убитыми\n«ЧВК», найденными «Красными лаб-картами» и апнутым «Калашом» в CS:GO."}, {"num": 14, "title": "РЕЖИМ «ДУШНИЛЫ» И ИНТЕЛЛЕКТУАЛЬНЫЙ СНОБИЗМ", "content": "* **Музыкальный снобизм:** Михаил расписывает трактаты о том,\nпочему MellowBite --- гении звука, как они ломают ритм и вставляют\nгениальные эдлибы. Андрей соглашается, добавляя, что «Оксимирон и Би-2\n--- это кринж для нормисов» (слушая их при этом постиронично).\n* **Игровой снобизм:** Обсуждение сборок оружия в Таркове (цевье\nVLTOR, глушители, отдача 47). Михаил искренне считает себя военным\nэкспертом."}, {"num": 15, "title": "ВНУТРЕННИЙ КИНЕМАТОГРАФ И ТЕАТР ОДНОГО АКТЕРА", "content": "* **Текстовые рэп-фристайлы:** Михаил выдает шедевры: *«Я ВЧЕРА\nЗАШЁЛ В СВОЙ ГЕТО РАЙОН И СПРОСИЛ БРАТКОВ ЧЕ КАК АЛЕ ВЫ ВЧЕРА ХОДИЛИ НА\nСТРЕЛУ БРАТВА НУ И ТУПА МЕМФИС И В КОЛЕНЕ СТРЕЛА МЫ НА КОДЕИНЕ...»*\n* **Пересказ снов (Шиза):** Михаилу снится, что он зашел в Тарков,\nа там космические ящики, новая валюта (франки и гривны) и\nвендор-украинец. *«ЧТО ВАМ ЛЮДЯМ И НЕ СНИЛОСМь»*."}, {"num": 16, "title": "МЕДИЦИНСКАЯ КАРТА И ХРУСТ КОСТЕЙ", "content": "* **Алкогольные отравления:** Главная болезнь сезона. Желудки\nсожжены острыми соусами и дешевым виски.\n* **Сбитые режимы:** Бессонница («Insomnia») из-за ночных рейдов.\n* **Травмы:** *«Я нажрался пизданулся в падике»* (Михаил).\n*«Обоссал запястье»* (Андрей)."}, {"num": 17, "title": "ПСИХОЛОГИЧЕСКИЙ ПОРТРЕТ И КРИЗИСЫ СЕЗОНА (ФИНАЛЬНЫЙ ИТОГ)", "content": "**Андрей (21-22 года): Студент-Снайпер с ПТСР**\nАндрей физически находится в аудиториях строительного университета, но\nего разум на 100% живет в Таркове. Игра стала для него идеальным\nмеханизмом сублимации: там, где в реальности нет денег («броук бой») и\nдавят преподаватели, в игре он --- хладнокровный убийца с глушителем и\nсотнями тысяч рублей в схроне. Его отношение к брату --- это смесь\nжесткого покровительства и садистского троллинга. Он обожает смотреть,\nкак Михаил горит и страдает, но при этом они делятся друг с другом\nпоследним лутом.\n\n**Михаил (18-19 лет): Совершеннолетний Хайпбист-Маргинал**\nМихаил дорвался до «взрослой» жизни (покупка алкоголя, сигарет). Он\nпытается отыгрывать роль маргинального рэпера из гетто: пьет до рвоты,\nест невыносимо острую еду, слушает мамбл-рэп и презрительно относится к\n«обычным» людям. При этом внутри он всё ещё подросток, который боится,\nчто мама унюхает перегар, и паникует перед зачетом по латыни. Его\nистеричный капслок --- это выплеск колоссальной внутренней энергии и\nтревоги, которую некуда девать в провинциальном городе.\n\n**Общая динамика мировоззрения:**\nИх диалог --- это безупречный, замкнутый шизо-цифровой симбиоз. Они\nсоздали свою собственную вселенную, где законы *Escape from Tarkov*,\nцитаты Папича и треки MellowBite слились в единую религию. Для внешнего\nмира их переписка выглядит как бред сумасшедших, но для них --- это\nабсолютная зона комфорта, спасающая от серости российской зимы,\nбезденежья и страха перед будущим. Токсичность, оскорбления и капс ---\nэто их искренняя, суровая братская любовь.\n\nПротоколы времени и контекста откалиброваны."}], "id": 9, "seq": 10}, {"roman": "VIII", "subtitle": "КОВИДНЫЙ ТАРКОВ, ЗАЩИТА ДИПЛОМА И MELLOWBITE", "period": "Март 2020 --- Сентябрь 2020 года.", "ages": "Андрей (21-22 года), Михаил (18-19 лет)", "codename": "Весна-Лето 2020: Twitch Drops, Талка и Искусство Трапа", "sections": [{"num": 1, "title": "ЭПОХА И ВАЙБ (СЕЗОН)", "content": "* **Временной период:** Март 2020 --- Сентябрь 2020 года.\n* **Название сезона:** «Карантинный Трап-Дом: Эра Твича и Белой\nТалки».\n* **Главный лейтмотив:** Пандемия заперла братьев по домам, сведя\nсоциальные контакты к нулю. Андрей защищает диплом по видеосвязи,\nпараллельно лутая \"Таможню\" в Таркове. Михаил упивается легально\nкупленным алкоголем и воображает себя гангстером из Атланты, слушая\nMellowBite. Их диалог --- это чистейшая шизофазия, где реальность и\nвидеоигры слились в один бесконечный марафон."}, {"num": 2, "title": "ГЛОБАЛЬНЫЙ ФОН И МИРОВЫЕ СОБЫТИЯ", "content": "Внешний мир проникает в чат точечно, сквозь призму интернета:\n* **Пандемия COVID-19 (Локдаун):** Упоминается начало карантина.\n*«Нерабочая неделя», «я не собираюсь заражаться... ищи мне\nпротивогаз/маску»*.\n* **Tarkov Twitch Drops:** Крупнейшее событие весны 2020 года,\nобрушившее серверы игры. Братья сутками держат открытыми стримы ради\nвнутриигрового лута. *«Drops включены! Не упустите шанс заработать\nтрофеи»*.\n* **Отравление Навального (Август 2020):** *«НАВАЛЬНЫЙ ПИДОРАС...\nЗА ЧТО СУКА НАКРЫЛИ ДВИЖУХУ»* (ироничная реакция на новости).\n* **Выход Fall Guys:** *«Хочу в фол гайс... смотрю и думаю что\nэто я играю облачный гейминг»*."}, {"num": 3, "title": "СЛОВАРЬ И ЛОКАЛЬНЫЕ МЕМЫ", "content": "* **ФЫАХАФЫХ... / АЫФФФФФ** --- Клавиатурный слэминг. Основной\nспособ коммуникации. Чем больше капса, тем сильнее тильт от игры или\nсмех от мема.\n* **Голова, глаза (Head, Eyes)** --- главный мем сезона. Экран\nсмерти в Таркове, ставший универсальным описанием любой неудачи.\n* **Broke / Броук бой / Нищий** --- статус тотального безденежья.\n*«Малыш без денег»*.\n* **Челобот / Дикиш / ЧВК / Фулка / Меченка / Решала** --- сленг\nТаркова, используемый для описания людей и ИРЛ ситуаций.\n* **Сабжи / Капуста / Билики** --- деньги.\n* **Саня (вставить слово)** --- мета-мем продолжается. *«Саня\nПушкин», «Саня Сход-развал», «Саня Иманбек»*.\n* **Вайб чек (Vibe Check)** --- бросок гранаты под ноги или выстрел\nв упор. *«Вайб чек это граната реальная»*.\n* **Дрова / Талка / Вильям** --- кодовые названия алкоголя."}, {"num": 4, "title": "БЕСТИАРИЙ И NPC", "content": "* **Никита Буянов** --- создатель Escape from Tarkov. Для братьев\nон --- божество, которое может как одарить лутом, так и покарать лагами.\n*«Буянов отдай схп», «Подкрутка Буянова»*.\n* **Пых (Максим Пыхтин)** --- легендарный друг. Его смех, фристайлы\nи пьяные выходки (поход за вином) --- главный сериал для братьев. *«Пых\nв дискорде это артур флек (Джокер)»*.\n* **Костян (Муринчик)** --- друг-мем. Жертва насмешек, у которого\n\"закрыли пиво у Звезды\". *«Костян муринчик убивает 3 чела в\nсекунду»*.\n* **Саня (Магнус / Ворм)** --- друг, который стал локальным мафиози\nв их лоре. *«Ворм убьет тебя за 300к... Саню все уважают»*.\n* **Ляпа / Жел / Турут Егоров** --- ИРЛ-знакомые для походов на\n\"бульку\" (озеро) и пьянок.\n* **Батя / Мамка** --- главные ограничители. Батя играет в World of\nTanks (\"батя в танки рубится, врубил прем аккаунт\"), смотрит телевизор\nи слушает марши вермахта. Мать ругается на пьянки."}, {"num": 5, "title": "⚔️ КВЕСТЫ, СПОРЫ И КЛАДБИЩЕ ИДЕЙ", "content": "* **Квест «Защита Диплома» (Андрей):** Андрей защищает диплом\nонлайн. *«Защита диплома... щас никита пойдет, а мы с пыхом комментить\nбудем... СТРИМ УЖЕ ДВА ЧАСА ИДЕТ»*.\n* **Квест «Фарм Дропсов»:** Братья сутками держат вкладки Twitch на\n160p (чтобы интернет не лагал) и молятся на выпадение ледоруба (Red\nRebel). *«У МЕНЯ 10 ОБЫЧЕК И 1 РАРКА И ВСЕ»*.\n* **Спор «Палёная Клавиатура»:** Михаил залил клавиатуру\nводкой/колой (\"две капли попало\"), снял кнопки и заклеил их изолентой,\nчтобы пальцы не скользили.\n* **Квест «Ремонт ПК»:** Андрей в очередной раз ломает ПК. *«БЛЯ\nЖАРЕНЫМ ЗАВОНЯЛО... ГОРЕЛЫМ ПИЗДА»*. Михаил дистанционно учит его\nсобирать комплектующие обратно.\n* **Золотой фонд цитат:**\n> *Вы: Я когда родился, не рыдал как сучка, я сразу сел Врач потянулся\nшлёпнуть, я ему - съебался пока цел*\n> *Михаил: мама всегда говорила мне ляна добывай деньги И ВЫЖИВАЙ*\n> *Михаил: каждое поражение закаляет.... после каждого поражения нас\nвсе труднее и труднее убить*"}, {"num": 6, "title": "ГЕОГРАФИЯ И ЛОКАЦИИ", "content": "* **Тарков (Резерв, Лаба, Таможня, Лес, Берег, Общаги):** Здесь\nбратья проводят 95% своего бодрствования. Это их реальный дом.\n* **Краснокирпичный лицей (Дзержинск):** Новое учебное заведение\nМихаила. Андрей предрекает ему смерть: *«там вообще маргиналы одни\nучатся... тебе ведро на голову наденут»*.\n* **Сметана / Кара / Рояль:** Местные бары/кафе для редких\nвылазок.\n* **Спар / КБ / Бристоль / Пивоман / Пятерочка:** Точки респауна\nалкоголя и закусок.\n* **Дача / Деревня:** Место ИРЛ-ссылки, где нет интернета и нужно\nкосить траву. *«Интернет блядский только в одном месте И ТО СТОЯТЬ\nНАДО»*."}, {"num": 7, "title": "ЭКОНОМИКА И АРСЕНАЛ", "content": "* **IRL Экономика (Broke Boys):** Тотальная нищета. Спорят из-за\nперевода 100 рублей за такси. *«У меня 180 рублей впритык»*. Михаил\nвозмущается, что пиво Carlsberg в \"Пятерочке\" стоит 39р только по\nакции за 3 штуки, и отказывается заводить скидочную карту.\n* **Tarkov Экономика:** Здесь они Илоны Маски. *«В схроне 10\nмиллионов»*. Обсуждают покупку Т.И.К. кейсов за 15кк, сборки М4А1,\n\"Гжелей\", \"Сликов\" и торговлю ОРСИСами на барахолке. Жалуются на\nкомиссию Буянова."}, {"num": 8, "title": "КУЛЬТУРНЫЙ КОД И МЕДИА (КИНО И МУЗЫКА)", "content": "* **Музыка (Абсолютный культ MellowBite):** Стив, Поляна и Дозер\n--- пророки их поколения. Братья разбирают их фристайлы, эдлибы и\n\"панчи\" на молекулы. *«ПАРТ ДОЗЕРА ЭТО ГНИЛЬЕ НА ВЕКА... СТИВ\nНАСТОЛЬКО ГЕНИЙ ЧТО ЗАЧИТАЛ ВИКИПЕДИЮ»*.\n* **Другие артисты:** Big Baby Tape, Kizaru, Oxxxymiron (как объект\nнасмешек), GONE.Fludd, Lil Pump.\n* **Стримеры / YouTube:** Папич (Arthas) --- спонсор 50% их сленга\n(\"Работяги\", \"Рофлан ебало\", \"В соляного\"). Cake, Voodoosh\n(стримеры по Таркову). Обзоры еды от Грилькова.\n* **Кино/ТВ:** \"На игле\" (Trainspotting), \"Гриффины\" (Family\nGuy), \"Крестный отец\", \"Большой куш\" (в переводе Гоблина)."}, {"num": 9, "title": "ИГРОВОЙ АРСЕНАЛ И СТРИМЫ (ОТДЕЛЬНЫЙ ПУНКТ)", "content": "* **Escape from Tarkov:** Игра, ради которой они живут.\n* *Формат общения:* Непрерывные капслок-репорты о смертях. *«Я\nЗАБЕГАЮ В ОБЩАГУ... А ТАМ РЕШАЛА... И ОН МНЕ В СПИНУ ОБОЙМУ»*.\n* *Тильт:* Ненависть к игре зашкаливает. *«ГОЛОВА ГЛАЗА ОФОРМИЛИ...\nЯ ЕБАЛ ТАРКОВ ЭТОТ... У МЕНЯ РУКИ ТРЯСУТСЯ»*.\n* **Dota 2 (Кастомки):** Способ \"расслабиться\", который приводит\nк еще большим ссорам. Играют в кастомки (Ability Draft, Castle Fight).\nСобирают дикие билды (*«Фура с трентами, ультрой и станом лиона»*).\n* **Call of Duty: Warzone:** Запасной аэродром, когда серверы\nТаркова лежат."}, {"num": 10, "title": "БРАТСКИЕ БАТЛЫ И ТОКСИЧНОСТЬ", "content": "* **Уровень токсичности:** Запредельный. Слова \"гнида\",\n\"уебище\", \"баран\", \"пидорас\" выполняют роль запятых и знаков\nвнимания.\n* **Динамика:** Это их язык любви. Если один умирает в рейде,\nвторой смеется до слез (*«ХАХАХАХА СОСАТЬ ЛОХ»*). Угрозы физической\nрасправы звучат каждые 5 минут (*«сказал бы ты мне это в реале, я бы\nтебе все ебало раскрошил»*).\n* **Эпичный конфликт:** Ссора из-за того, кто пойдет в магазин, а\nкто останется играть. Заканчивается перечислением всех матерных слов\nрусского языка."}, {"num": 11, "title": "ГАСТРОНОМИЯ И РАЦИОН", "content": "* **Трэш-кулинария:** Михаил готовит \"Похлебку западного края\"\n(доширак с вермишелью). Пытается убить свой желудок острыми соусами (Чим\nЧим, Шрирача). *«Я в суп ебанул почти ложку правого... Полет\nнормальный»*.\n* **Снеки:** Чипсы (Доритос красный), сухарики \"Хрустим\",\n\"Булочки орех\".\n* **Фастфуд:** \"Похмельный Макдоналдс с сырным\", KFC, Додо Пицца\n(\"Культура Филадельфия\")."}, {"num": 12, "title": "АЛКОГОЛЬНЫЙ СЧЕТЧИК И ПИВНАЯ СТАТИСТИКА", "content": "* **Контекст:** Эпоха регулярных пьянок. Михаил (18-19 лет)\nвырвался на свободу и активно изучает ассортимент КБ.\n* **Напитки:** Водка «Талка», Виски «Вильям Лоусонс» (\"Вилли\"),\n«Рэд Стаг» (Jim Beam), вино \"Фанагория\", \"Бакардос\", Пиво\n\"Карлсберг\", \"Балтика 7 мягкое\".\n* **Похмелье:** Жесточайшее. *«БЛЯДЬ Я БЫ СДОХ ЕСЛИ БЫ НЕ ЛЕГ», «я\nобоссался в доте оказывается потекло по штанине», «я так нажрался что\nтелевизор в максе смотрел»*.\n* **Синее вино:** Рофл над дешевым сладким вином. *«Жидкость\nамнезии... я сделал два глотка и меня ебнуло»*."}, {"num": 13, "title": "ХРОНИКИ ПРОКРАСТИНАЦИИ И УСПЕХОВ", "content": "* **Вместо дела:** Андрей (21-22) должен писать и защищать диплом,\nно сутками сидит на \"Заводе\" в Таркове. Михаил (18-19) должен учиться\nв лицее/колледже, но пишет рэп-тексты и выслеживает \"Челоботов\".\n* **Доска почета:**\n* Андрей УСПЕШНО защитил диплом! (*«Защита диплома... Щас никита\nпойдет, а мы комментим»*).\n* Михаил вынес \"Ледикс\" и \"Гжель\" с Резерва."}, {"num": 14, "title": "РЕЖИМ «ДУШНИЛЫ» И ИНТЕЛЛЕКТУАЛЬНЫЙ СНОБИЗМ", "content": "* **Музыкальный снобизм:** Михаил доказывает, что MellowBite ломают\nритмику и создают новые смыслы в русском хип-хопе, а Pharaoh и\nOxxxymiron --- это \"халтура для нормисов\". Андрей поддерживает эту\nшизу.\n* **Игровой снобизм:** Бесконечные споры о том, какой патрон лучше\nпробивает 4-й класс брони (БТ или 855a1). Михаил считает себя\nтактическим гением Таркова."}, {"num": 15, "title": "ВНУТРЕННИЙ КИНЕМАТОГРАФ И ТЕАТР ОДНОГО АКТЕРА", "content": "* **Фристайлы (Рэп-батлы в чате):**\n> *«мама всегда говорила мне ляна добывай деньги И ВЫЖИВАЙ ВЫХОДУ ДАЮ\nСВОЙ ЛУЧШИЙ ТОВАР»*\n* **Режиссура стримов:** Когда один играет, второй смотрит\nтрансляцию в Discord и комментирует это как киберспортивный матч или\nкомедийное шоу.\n* **Пересказ Снов (Сюрреализм):** *«мне снилось что я на диком\nиграл на резревре и челики крылись в вагоне... я фликаю носкопом и\nдвоих одной пулей»*."}, {"num": 16, "title": "МЕДИЦИНСКАЯ КАРТА И ХРУСТ КОСТЕЙ", "content": "* **Алкогольные отравления:** Желудки сожжены острыми соусами и\nдешевым виски. Регулярные жалобы на изжогу и тошноту.\n* **Травмы:** Андрей сшибает костяшки пальцев (*«У меня такие\nсиняки на пальцах... Мне их блять сшибать больно»*). Михаил заливает\nклавиатуру вонючей жижей.\n* **Ментальное здоровье:** Ироничные жалобы на \"Дисперсию\"\n(депрессию), бессонницу из-за игр и тотальную апатию."}, {"num": 17, "title": "ПСИХОЛОГИЧЕСКИЙ ПОРТРЕТ И КРИЗИСЫ СЕЗОНА (ФИНАЛЬНЫЙ ИТОГ)", "content": "**Андрей (21-22 года): Дипломированный Тарковчанин**\nАндрей пересек черту, отделяющую студента от взрослого безработного\nчеловека. Защита диплома ННГАСУ (проходившая удаленно из-за ковида) для\nнего стала лишь фоновым событием. Настоящая жизнь, эмоции и экономика\nпроисходят в *Escape from Tarkov*. Он страдает от безденежья в\nреальности, поэтому компенсирует это миллионами рублей в схроне игры. В\nдиалоге он исполняет роль циничного тролля: он упивается неудачами\nбрата, но сам мгновенно сгорает от любого лага.\n\n**Михаил (18-19 лет): Хайпбист-ЧВКшник в пубертате**\nМихаил дорвался до легального алкоголя и статуса совершеннолетнего. Он\nотчаянно пытается отыгрывать роль маргинального \"трап-кида\" из гетто:\nпьет до рвоты, ест острую пищу, слушает абсурдный хип-хоп и презирает\n\"нормисов\". При этом в реальности он живет с родителями, боится, что\nбатя спалит его за игрой ночью, и поступает в местный лицей. Его\nагрессия (сообщения капслоком на весь экран) --- это выход колоссальной\nвнутренней энергии, запертой карантином в стенах квартиры.\n\n**Общая динамика мировоззрения:**\nИх переписка 2020 года --- это памятник ковидному эскапизму. Реального\nмира для них больше не существует. Они слились в единый цифровой разум,\nобщаясь на языке, состоящем из игровых терминов, английских вставок,\nцитат стримеров и русского мата. Эта герметичная, ультра-токсичная\nкапсула --- их способ сказать друг другу \"мы вместе\" в условиях\nглобальной пандемии, безденежья и пугающего взросления. Угрозы \"разбить\nебало\" здесь звучат теплее, чем любые слова поддержки."}], "id": 10, "seq": 11}, {"roman": "IX", "subtitle": "АРМЕЙСКИЙ ДРИЛЛ, ДИСТАНТ И ТРАП-ДОМ", "period": "Сентябрь 2020 --- Декабрь 2021", "ages": "Андрей (22--23 года), Михаил (19--20 лет)", "codename": "Год 21-й: Служба, Дистант и Секретные Биты Поляны", "sections": [{"num": 1, "title": "ЭПОХА И ВАЙБ (СЕЗОН)", "content": "* **Временной период:** Сентябрь 2020 --- Декабрь 2021 года.\n* **Название сезона:** «Армейские Байки, Ковидный Дистант и Культ\nMellowBite».\n* **Главный лейтмотив:** Разделение миров. Андрей выживает в\nказарме/на работе, где царит абсурд, наряды и усталость. Михаил сидит\nдома на дистанционном обучении, воюет с Тарковым, пьет водку и изучает\nтворчество андеграунд-рэперов. Они встречаются только в онлайне, общаясь\nисключительно капслоком, цитатами Папича и строчками из треков."}, {"num": 2, "title": "ГЛОБАЛЬНЫЙ ФОН И МИРОВЫЕ СОБЫТИЯ", "content": "* **Пандемия COVID-19:** Михаил болеет коронавирусом (*«я\nковидный... вся курятина воняет трупаками»*), учеба проходит в режиме\n«дистанта».\n* **Бум майнинга и дефицит (2020-2021):** Братья обсуждают дикие\nцены на видеокарты и консоли. *«все пс у перекупов... все компы у\nмайнеров»*.\n* **Новые консоли (PS5 / Xbox Series X):** Обсуждение некстгена.\nАндрей задумывается о покупке Xbox (*«Я иксбу возьму мне пох и подписку\nна 10 лет»*).\n* **Оксимирон:** В 2021 году Оксимирон выпускает новый материал\n(вероятно «Красота и Уродство» или микстейп). Михаил: *«почему у слвы\nмаров прическа как будто он лысеющий... ОКСИМИРОН?»*."}, {"num": 3, "title": "СЛОВАРЬ И ЛОКАЛЬНЫЕ МЕМЫ", "content": "* **ФЫАХАФЫХ... / АЫФФФФФ** --- Фундамент общения. 80% реакций\nвыражаются ударами по клавиатуре.\n* **Трап / Трапить / Трап-дом** --- делать что-то круто (отсылки к\nрэп-культуре).\n* **Broke / Броук бой** --- нищеброд.\n* **Нига / Шавка / Баба / Еблан / Гнида** --- стандартные дружеские\nобращения.\n* **Сабжи / Капуста / Гуала** --- деньги.\n* **Добрый (человек / трек / день)** --- крутой, отличный.\n* **Голова, глаза (Head, Eyes)** --- смерть в Таркове, метафора\nтотального провала в жизни.\n* **Хд (с большой буквы)** --- высшая форма иронии и пассивной\nагрессии. *«Хд»*.\n* **Сынок** --- уничижительное обращение Андрея к Михаилу с позиции\nстаршего/отслужившего."}, {"num": 4, "title": "БЕСТИАРИЙ И NPC", "content": "* **Батя / Мамка** --- Верховные правители. Батя играет в танки\n(*«батя в танки погнал сразу... пати собирает на синего ТАНКАА»*),\nзабирает водку и работает в смены. Мама ругается за пьянки.\n* **Прапор / Старшина / Лейтенанты Рауф и Фаик** --- армейские NPC\nАндрея. Прапор в ярости разбивает радио о подчиненного, а пацаны стоят в\nупоре лежа.\n* **Пых (Маки / Сберпых)** --- легендарный друг. *«АУРА ПЫХА...\nшкола пыхов»*.\n* **Костян Муринчик** --- друг-мем. *«Костян муринчик убивает 3\nчела в секунду, также он: БЛЯ ПАЦАНЫ ЧЕ ПРОИЗОШЛО»*. Покупает зеленый\nгеймпад.\n* **Саня (Магнус / Ворм)** --- друг-водитель. *«ВОРМ УБЬЁТ ТЕБЯ ЗА\n300К»*.\n* **Евсеев, Горохов, Янченко** --- преподаватели в универе.\n*«EVSEEV... ЯНЧЕНКО ЕСТЬ ДАЖЕ В Т9»*.\n* **Стив, Поляна, Дозер (MellowBite)** --- боги их музыкального\nОлимпа."}, {"num": 5, "title": "⚔️ КВЕСТЫ, СПОРЫ И КЛАДБИЩЕ ИДЕЙ", "content": "* **Квест «Матеша на Дистанте»:** Эпик. Михаил сидит на зачете по\nматематике, ему дают найти производную (`y=e\\^7x+2`). Он в панике\nпишет Андрею, тот просит знакомую решить, она скидывает ответ, а Михаил\nне понимает, почему там `7e`. Андрей: *«Я вообще ниче не знаю мне\nпросто так платят»*.\n* **Квест «Армейский телефон»:** Андрей купил кнопочный телефон для\nармии, но не может его открыть, чтобы вставить симку/карту памяти.\n*«НОГТЯ НЕТ... НИКАК БЛЯТЬ»*.\n* **Спор «MellowBite vs Melon Music»:** Величайшее идеологическое\nпротивостояние года. Михаил ненавидит OG Buda, 163ONMYNECK и Mayot,\nсчитая, что они украли стиль у MellowBite. Андрей защищает их (или\nпросто троллит брата). *«ОГ БУДА СКАМ... ОНИ С ОДНОГО ОГОРОДА»*.\n* **Золотой фонд цитат:**\n> *Михаил: мама всегда говорила мне ляна добывай деньги И ВЫЖИВАЙ*\n> *Андрей: Я когда родился, не рыдал как сучка, я сразу сел. Врач\nпотянулся шлёпнуть, я ему - съебался пока цел*\n> *Андрей: Есть три типа людей в армии: Камень, Жидкарь и воздухан.*"}, {"num": 6, "title": "ГЕОГРАФИЯ И ЛОКАЦИИ", "content": "* **Тарков (Развязка, Резерв, Таможня, Лаба):** Основная среда\nобитания.\n* **Армия (Казарма / Плац / Каптерка):** Локации боли Андрея. Песни\nна вечерней прогулке («На заре»), наряды, чистка картошки.\n* **Нижуха / Шарага (ННГАСУ):** Место, где Михаил страдает на парах\n(или откуда Андрей уже выпустился).\n* **Сметана / Рояль:** Бары Дзержинска, где братья пытаются\nвстретиться с друзьями (и обычно всё заканчивается провалом).\n* **КБ (Красное&Белое) / Спар / Пятерочка:** Точки респауна\nалкоголя."}, {"num": 7, "title": "ЭКОНОМИКА И АРСЕНАЛ", "content": "* **IRL Экономика (Broke Boys):** Денег нет. Михаил просит скинуть\n100 рублей на пиво. Андрей работает и чувствует себя магнатом, но всё\nравно жалуется на цены. *«За 100 рублей наешься читоса острого И В\nБОЛЬНИЧКУ»*.\n* **Tarkov Экономика:** Михаил построил биткоин-ферму. *«я просто\nна эти битки буду видюхи докупать... АФК РОКФЕЛЛЕР»*. Обсуждение цен\nна видеокарты (в игре они стоят миллионы, как и в реале из-за\nмайнинга)."}, {"num": 8, "title": "КУЛЬТУРНЫЙ КОД И МЕДИА (КИНО И МУЗЫКА)", "content": "* **Абсолютный культ MellowBite:** Это религия. Они обсуждают их\nбиты («Токио тайп бит киберпанк»), флоу, адлибы и клипы. *«ПАРТ ДОЗЕРА\nЭТО ГНИЛЬЕ НА ВЕКА... СТИВ НАСТОЛЬКО ГЕНИЙ ЧТО ЗАЧИТАЛ ВИКИПЕДИЮ»*.\n* **Melon Music (OG Buda, 163ONMYNECK, Mayot):** Объект ненависти\nМихаила и прослушивания Андрея.\n* **Стримеры:** Папич (Arthas) --- бесконечное цитирование. Данкар\n(Утопия Шоу), Даня Кашин.\n* **Кино/Аниме/Игры:** «Гриффины» (Family Guy), «Токийский гуль»,\n«Берсерк» (Михаил: *«БЛЯТЬ РУКУ РУБАНУЛИ... Я РЕАЛЬНЫЙ ГАТС»*)."}, {"num": 9, "title": "ИГРОВОЙ АРСЕНАЛ И СТРИМЫ (ОТДЕЛЬНЫЙ ПУНКТ)", "content": "* **Escape from Tarkov:** Играют постоянно. Михаил крысит на\n«Развязке», Андрей горит на «Таможне». *«ГОЛОВА ГЛАЗА... ЕБАНАЯ\nКАРТЕЧЬ... Я ЗАБЕГАЮ В ОБЩАГУ А ТАМ РЕШАЛА»*.\n* **Forza Horizon 4:** Андрей подсел на гонки. *«Я НА АУКЦИОНЕ\nКУПИЛ СКАЙЛАЙН МНЕ ПОХУЙ ТУТ ДЕНЬГИ ДЕВАТЬ НЕКУДА»*.\n* **Call of Duty: Warzone / Cold War:** *«Кал дюти... Симулятор\nкрыс... Мини варзона только в сквадах»*.\n* **Hades:** Андрей проходит игру, горит с боссов, спрашивает\nМихаила про билды. *«Я гидру с 1 удара... Билд на щит»*.\n* **Dota 2:** Играют в кастомки (Hero Chaos, Overthrow). Андрей\nиграет на Пангольере (*«Дота на пангиче»*)."}, {"num": 10, "title": "БРАТСКИЕ БАТЛЫ И ТОКСИЧНОСТЬ", "content": "* **Динамика:** У
